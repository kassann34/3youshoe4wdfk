<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなの池</title>
<meta name="description" content="同じ池にみんなで糸をたらして、魚を釣り合うゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列。ゲーム中は池を画面いっぱいに */
:root{
  --bg:#eef4ee; --surface:#fbfdf8; --ink:#1d2f2a; --muted:#5f7369; --rule:#d3e0d6;
  --p:#1f7a6a; --p-soft:#d9efe8; --accent:#1d2f2a; --accent-ink:#fbfdf8; --ok:#2f8f4e; --warn:#c0412c; --float:#e0402a;
  --shadow:0 2px 0 rgba(29,47,42,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16241f; --ink:#e8f2ec; --muted:#9db3a9; --rule:#26392f;
  --p:#5fd0b4; --p-soft:#17352d; --accent:#e8f2ec; --accent-ink:#0f1a17; --ok:#5ccf80; --warn:#ff8a73; --float:#ff6a4f; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16241f; --ink:#e8f2ec; --muted:#9db3a9; --rule:#26392f;
  --p:#5fd0b4; --p-soft:#17352d; --accent:#e8f2ec; --accent-ink:#0f1a17; --ok:#5ccf80; --warn:#ff8a73; --float:#ff6a4f; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo svg{width:40px;height:40px;flex:none}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em;line-height:1.1}
.logo h1 .pa{color:var(--p)}
.logo small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;background:var(--bg)}
.plist li .dot{width:12px;height:12px;border-radius:50%}
.plist li.off{opacity:.55}
.plist li.me{border-color:var(--ink)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.rk{font-weight:800;width:3em}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.win{font-size:22px;font-weight:800;text-align:center}
.award{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--p-soft);margin-top:10px}
.award canvas{width:120px;height:72px;flex:none}
.award b{display:block;font-size:17px}
/* モードの選び方 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:2px solid var(--rule);border-radius:14px;padding:10px 12px;text-align:left;background:var(--bg);cursor:pointer;min-height:44px}
.mode b{display:block;font-size:16px}.mode span{font-size:12px;color:var(--muted);line-height:1.5;display:block}
.mode[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.mode:disabled{cursor:default}
/* 図鑑 */
.zk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.zk div{border:1px solid var(--rule);border-radius:12px;padding:6px 8px 8px;background:var(--bg);text-align:center;line-height:1.35}
.zk canvas{width:100%;aspect-ratio:5/3}
.zk b{display:block;font-size:14px}
.zk span{font-size:12px;color:var(--muted)}
.zk .no b{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#4c7a3e;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;color:#fff;font-family:var(--font);text-shadow:0 1px 3px rgba(0,0,0,.55)}
.hud .tm{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hud .tm.low{color:#ffcf6a}
.hud .mine{font-size:14px;font-weight:800}
.hud .tod{font-size:12px;font-weight:700;opacity:.9}
.board{background:rgba(16,32,28,.72);border-radius:12px;padding:6px 10px;font-size:13px;min-width:130px;text-shadow:none}
.board div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.board div b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:10px}
.board div.me{font-weight:800}
.hud .lv{pointer-events:auto;background:rgba(16,32,28,.72);color:#fff;border:0;border-radius:10px;padding:5px 12px;font-size:12px;cursor:pointer;margin-top:6px;font-weight:700}
.feed{position:absolute;left:10px;bottom:44px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(320px,70vw)}
.feed div{background:rgba(16,32,28,.72);color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;font-family:var(--font);animation:fin .3s ease-out}
.feed div b{color:#ffd77a}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff;font-size:96px;font-weight:800;font-family:var(--font);text-shadow:0 3px 12px rgba(0,0,0,.5)}
.cd[hidden],.hint[hidden]{display:none}
.cd small{display:block;font-size:16px;font-weight:700;text-align:center}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:14px;font-weight:700;pointer-events:none;font-family:var(--font);text-shadow:0 1px 4px rgba(0,0,0,.7)}
.catch{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#fbfdf8;color:#1d2f2a;border-radius:20px;padding:12px 18px 14px;text-align:center;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:var(--font);min-width:220px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.catch[hidden]{display:none}
.catch canvas{width:240px;height:144px;display:block;margin:0 auto}
.catch b{display:block;font-size:22px;line-height:1.2}
.catch span{font-size:15px;font-weight:700;color:#5f7369}
.catch em{display:block;font-style:normal;font-size:13px;font-weight:800;color:#1f7a6a;margin-top:2px}
.catch.big{border:4px solid #f5c84a}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.biku{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;display:flex;align-items:center;gap:5px;background:rgba(16,32,28,.78);border-radius:16px;padding:6px 10px;font-family:var(--font);color:#fff;max-width:calc(100vw - 20px)}
.biku[hidden]{display:none}
.biku .bl{font-size:11px;font-weight:800;opacity:.85;margin-right:2px;white-space:nowrap}
.biku .be{font-size:12px;opacity:.75;white-space:nowrap}
.biku .bt{width:40px;height:44px;border-radius:9px;border:0;background:#fbf6e6;color:#1d2a26;font-size:24px;font-weight:800;cursor:pointer;font-family:var(--font);box-shadow:0 2px 0 #c8b68a;padding:0}
.biku .bt:active{transform:translateY(2px)}
body.kanji .feed{bottom:100px}
.catch.kj b{font-size:40px;letter-spacing:.06em}
.award .kw{width:120px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:var(--surface);border-radius:10px}
.banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:linear-gradient(90deg,#f5c84a,#ffe9a8,#f5c84a);color:#3a2604;border-radius:999px;padding:6px 18px;font-weight:800;font-size:15px;font-family:var(--font);pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:pop2 .4s ease-out}
.banner[hidden]{display:none}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.catch,.banner,.feed div{animation:none}}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
body.playing.endless .chat{display:flex;bottom:44px;right:10px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="24" rx="18" ry="11" fill="#3f9a8a"/><ellipse cx="20" cy="24" rx="12" ry="6.5" fill="#2f7f72"/><line x1="29" y1="3" x2="22" y2="20" stroke="#6b4a2a" stroke-width="1.6"/><circle cx="22" cy="21" r="3.2" fill="#fff"/><path d="M18.8 21a3.2 3.2 0 0 1 6.4 0z" fill="#e0402a"/></svg>
      <div><h1><span class="pa">みんなの</span>池</h1><small>同じ池で釣り合う ・ v2</small></div></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div class="hud"><div><div class="tm" id="tm">3:00</div><div class="mine" id="mine"></div><div class="tod" id="tod"></div></div><div style="text-align:right"><div class="board" id="board"></div><button class="lv" data-act="endgame" id="endbtn" hidden>おわる</button> <button class="lv" data-act="leave">退出</button></div></div>
  <div class="feed" id="feed"></div>
  <div class="biku" id="biku" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="catch" id="catch" hidden><canvas id="catchcv" width="480" height="288"></canvas><b id="catchn"></b><span id="catchs"></span><em id="catche"></em></div>
  <div class="cd" id="cd" hidden></div>
  <div class="hint" id="hint"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* みんなの池：部屋主が魚と浮きを計算して配る。各自は「投げる」「あわせる」を送るだけ */
'use strict';
const PREFIX='tsuri-room-';
const VER=2;
const MAXP=10,MAXPL=12;
const COLORS=['#e0402a','#2f7fd8','#e3a21a','#8a55c9','#2f9a52','#e0628f','#1fa3a3','#c96a2a','#4a5bd6','#7a7a7a','#b0413e','#5fb0e8'];
const CPUN=['ゲンさん','タケ','おばあちゃん','ハル','つり太','ミナト','コウ','サキ','ヨシオ','ナギ'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('tsuri-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('tsuri-tok',TOK);}catch(e){}}
let NAME=store.get('tsuri-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- 釣れるもの ---------- */
// min〜max cm、p 点、w 出やすさ、sp 泳ぐ速さ、tm 朝・昼・夕方・夜の出やすさ、rain 雨の日の出やすさ
const KINDS=[
  {k:'medaka',n:'メダカ',min:2,max:4,p:3,w:8,sp:45,c:['#c9b98a','#8a7a50'],pat:'plain'},
  {k:'otama',n:'オタマジャクシ',min:2,max:5,p:2,w:6,sp:30,c:['#4a4a40','#2a2a24'],pat:'tad',tm:[1.2,1.2,1,.4]},
  {k:'zari',n:'アメリカザリガニ',min:8,max:13,p:6,w:6,sp:20,c:['#c8402c','#7a2014'],pat:'crab',tm:[1,1,1.2,1.3]},
  {k:'dojo',n:'ドジョウ',min:8,max:16,p:6,w:5,sp:25,c:['#9a8a5a','#5a4a2a'],pat:'eel',rain:1.6},
  {k:'gill',n:'ブルーギル',min:10,max:22,p:8,w:7,sp:35,c:['#7a9a7a','#2a4a5a'],pat:'bars'},
  {k:'oikawa',n:'オイカワ',min:10,max:16,p:9,w:5,sp:55,c:['#b8c8d8','#e07a6a'],pat:'stripe',tm:[1.3,1.3,1,.3]},
  {k:'funa',n:'フナ',min:10,max:28,p:10,w:9,sp:30,c:['#8a8a5a','#5a5a3a'],pat:'plain'},
  {k:'hera',n:'ヘラブナ',min:25,max:45,p:16,w:4,sp:28,c:['#a8a888','#6a6a4a'],pat:'plain',tm:[1.3,1,1,.6]},
  {k:'kingyo',n:'キンギョ',min:6,max:15,p:18,w:2,sp:30,c:['#f05a28','#ffd0a0'],pat:'gold'},
  {k:'bass',n:'ブラックバス',min:25,max:55,p:20,w:4,sp:50,c:['#7a8a4a','#2a3a1a'],pat:'bass',tm:[1.4,.8,1.4,.6]},
  {k:'koi',n:'コイ',min:30,max:75,p:22,w:5,sp:25,c:['#6a6a52','#3a3a2a'],pat:'plain'},
  {k:'nishiki',n:'ニシキゴイ',min:40,max:75,p:40,w:1.2,sp:25,c:['#f4f0e8','#e0402a'],pat:'koi'},
  {k:'namazu',n:'ナマズ',min:30,max:65,p:28,w:2.5,sp:22,c:['#5a5a46','#2a2a1e'],pat:'cat',tm:[.4,.3,1,2.5],rain:1.8},
  {k:'ebi',n:'テナガエビ',min:5,max:10,p:7,w:4,sp:20,c:['#9aaa9a','#4a5a4a'],pat:'shrimp',tm:[.5,.3,1,2.2]},
  {k:'kame',n:'ミドリガメ',min:12,max:25,p:15,w:2,sp:18,c:['#4a7a3a','#e8d04a'],pat:'turtle',tm:[1,1.5,1,.3]},
  {k:'unagi',n:'ウナギ',min:40,max:90,p:45,w:.8,sp:30,c:['#3a3a2e','#7a7a4a'],pat:'eel',tm:[.2,.1,.8,3],rain:1.5},
  {k:'raigyo',n:'ライギョ',min:50,max:85,p:50,w:.7,sp:40,c:['#6a6a42','#2a2a1a'],pat:'snake',tm:[1,1.3,1,.5]},
  {k:'nushi',n:'池のヌシ',min:110,max:170,p:200,w:0,sp:16,c:['#4a4636','#c8a050'],pat:'nushi',nushi:1},
  {k:'boot',n:'長ぐつ',min:25,max:30,p:1,w:3,c:['#3a3a3a','#1a1a1a'],pat:'boot',junk:1},

const fishTarget=()=>9+2*H.pl.length;

  H.fish.push({id:H.nid++,k:KI[K.k],s,len:Math.max(9,Math.min(150,s*1.05)),x,y,a:rnd(0,7),v:K.sp*rnd(.7,1.1),st:'w',tgt:-1,t:0,nb:0,wary:0});}

function hostTick(dt){

        if(j>=0){H.ev.push(['tan',i,j,Math.round(f.x),Math.round(f.y)]);reel(i);reel(j);H.pl[i].cd=1.5;H.pl[j].cd=1.5;}}}

      if(x.tgt<0){if(x.t>0){x.t-=dt;continue;}const i=H.pl.findIndex(p=>p.fl.st===2&&p.fl.app==null&&p.fl.bite<=0&&Math.hypot(p.fl.x-x.x,p.fl.y-x.y)<48);if(i>=0){x.tgt=i;H.pl[i].fl.app=x.id;x.t=rnd(1.2,2.6);}}
      else{const f=H.pl[x.tgt].fl;if(f.st!==2||f.app!==x.id){x.tgt=-1;continue;}if(f.bite>0)continue;x.t-=dt;if(x.t<=0){f.bite=winOf(K);f.fish=x.id;H.ev.push(['bite',x.tgt]);}}

      else{const dx=f.x-x.x,dy=f.y-x.y,d=Math.hypot(dx,dy),ta=Math.atan2(dy,dx);let da=ta-x.a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;x.a+=Math.max(-3*dt,Math.min(3*dt,da));

    else if(x.st==='n'){const f=H.pl[x.tgt]&&H.pl[x.tgt].fl;if(!f||f.st!==2||f.app!==x.id){x.st='w';x.tgt=-1;continue;}
      x.t-=dt;if(x.t<=0){if(x.nb>0){x.nb--;f.tw=.3;x.t=rnd(.5,1.1);H.ev.push(['tw',x.tgt]);}else{x.st='b';f.bite=winOf(K);f.fish=x.id;H.ev.push(['bite',x.tgt]);}}

}

function act(pid,m){
  if(!H||!m)return;
  const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end';

    case 'mode':if(isHost&&setup&&['battle','endless'].includes(m.v))H.mode=m.v;break;
    case 'pond':if(isHost&&setup&&['fish','kanji'].includes(m.v))H.pond=m.v;break;
    case 'rel':{const i=H.pl.findIndex(x=>x.id===pid);if(i>=0&&H.phase==='play'&&Number.isInteger(m.k))relChar(i,m.k);return;}
    case 'timeSel':if(isHost&&setup&&['120','180','300'].includes(m.v))H.timeSel=m.v;break;
    case 'cpuSel':if(isHost&&setup&&['auto','0','1','2','3','4'].includes(m.v))H.cpuSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;

    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);H.pl=[];H.fish=[];}break;

  });

const KJ=(()=>{const J=new Map();KJD.j.split(',').forEach(s=>{const w=[...s];J.set(w[0]+w[1],w.slice(2).join(''));});
  const G=KJD.g.split(',').map(s=>{const a=[...s];return {t:a[0],p:a.slice(2)};});
  const pool=[...KJD.k],parts=[...new Set(G.flatMap(g=>g.p))],partner=new Map();
  const add=(a,b)=>{if(!partner.has(a))partner.set(a,[]);partner.get(a).push(b);};
  J.forEach((r,w)=>{add(w[0],w[1]);add(w[1],w[0]);});
  G.forEach(g=>g.p.forEach((a,i)=>g.p.forEach((b,j)=>{if(i!==j)add(a,b);})));
  // よく熟語になる字だけを、ふだん池に出す
  const easy=pool.filter(c=>(partner.get(c)||[]).length>=16);
  return {J,G,pool,parts,partner,easy};})();

  const qs=new URLSearchParams(location.search);if(!D.code&&qs.get('room'))D.code=qs.get('room').toUpperCase();
  return `<div class="card stack">
    <div><label class="f" for="name">あなたの名前</label><input type="text" id="name" maxlength="12" placeholder="例：たろう" value="${esc(NAME)}" autocomplete="nickname"></div>
    <button class="btn primary wide" data-act="create">部屋を作る</button>
    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    <button class="btn wide" data-act="solo">ひとりで遊ぶ</button>
    <button class="btn wide" data-act="zukan">図鑑（${zCount()} / ${KINDS.length}）</button>
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>${rulesHTML(true)}${CREDIT}`;}
function vZukan(){const n=zCount();
  return `<div class="row" style="margin-bottom:10px"><button class="btn" data-act="zclose">もどる</button></div>
  <div class="card stack"><h2>図鑑</h2><div class="row"><b>${n} / ${KINDS.length}</b><div class="bar" style="flex:1"><i style="width:${n/KINDS.length*100}%"></i></div></div>
  <div class="zk">${KINDS.map((K,i)=>{const z=ZUKAN[K.k];return `<div class="${z?'':'no'}"><canvas class="zc" data-i="${i}" data-s="${z?1:0}" width="200" height="120" aria-hidden="true"></canvas><b>${z?esc(K.n):'？？？'}</b><span>${z?`${z.n}回 ・ 最大 ${z.max}cm`:K.nushi?'池のどこかに…':K.junk?'なにかが落ちている':'まだ釣っていない'}</span></div>`;}).join('')}</div>
  <div class="sub">この端末に保存されます</div></div>`;}
const CREDIT='<div class="sub" style="margin:0 4px 14px">漢字の池の熟語は、EDRDG の EDICT（CC BY-SA 4.0）をもとにしています。</div>';
function settingsHTML(host){
  const dis=host?'':'disabled';const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="modes">${[['battle','対戦','時間内に釣った点数で勝負'],['endless','エンドレス','時間制限なし。とちゅう参加もOK']].map(([v,b,s])=>`<button class="mode" data-act="mode" data-v="${v}" aria-pressed="${V.mode===v}" ${dis}><b>${b}</b><span>${s}</span></button>`).join('')}</div>
    <div class="modes">${[['fish','魚の池','いろいろな魚を釣る。図鑑つき'],['kanji','漢字の池','釣った字で熟語を作ったり、部品を合体させたり']].map(([v,b,s])=>`<button class="mode" data-act="pond" data-v="${v}" aria-pressed="${V.pond===v}" ${dis}><b>${b}</b><span>${s}</span></button>`).join('')}</div>
    <div class="grid2">
    ${V.mode==='battle'?`<div><label class="f" for="timeSel">制限時間</label><select id="timeSel" ${dis}>${opt([['120','2分'],['180','3分'],['300','5分']],V.timeSel)}</select></div>`:''}
    <div><label class="f" for="cpuSel">CPUの釣り人</label><select id="cpuSel" ${dis}>${opt([['auto','おまかせ'],['0','なし'],['1','1人'],['2','2人'],['3','3人'],['4','4人']],V.cpuSel)}</select></div></div>`;}
function vLobby(){
  const host=amHost(),n=V.players.length;
  return `${NET.solo?'':`<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code)}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>`}
  <div class="card stack"><h2>${NET.solo?'ひとりで遊ぶ':`参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}`}</h2>
    ${!isPlayer()&&!NET.solo?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${NET.solo?'':`<ul class="plist">${V.players.map((p,i)=>`<li class="${p.id===MYID?'me':''} ${p.online?'':'off'}"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}${p.id===V.hostId?'<span class="sub">部屋主</span>':''}${V.wins[p.id]?`<span class="sub">${V.wins[p.id]}勝</span>`:''}</li>`).join('')}</ul>`}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">${NET.solo?'池へ行く':'ゲームを始める'}</button>${!NET.solo?'<div class="note">部屋主の画面で計算しています。部屋主はゲーム中、このタブを開いたままにしてください。</div>':''}`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>
  <button class="btn wide" data-act="zukan" style="margin-bottom:14px">図鑑（${zCount()} / ${KINDS.length}）</button>`;}
function vEnd(){
  const R=V.result||{rows:[]},r=R.rows,me=V.myIdx,top=r.filter(x=>x.rank===1);
  const kj=R.pond==='kanji';let big=null;r.forEach(x=>{if(x.best&&(!big||(kj?x.best.pts>big.best.pts:x.best.s>big.best.s)))big=x;});
  const bk=!kj&&big&&KINDS[big.best.k];
  return `<div class="card"><div class="win">${R.mode==='endless'?'おつかれさま！':top.length&&top[0].pts>0?`${top.map(x=>`<span class="sw" style="background:${COLORS[x.col%COLORS.length]}"></span>${esc(x.name)}`).join('・')} の勝ち！`:'だれも釣れなかった…'}</div>
    ${bk?`<div class="award"><canvas class="kc" data-i="${big.best.k}" width="240" height="144" aria-hidden="true"></canvas><div><span class="sub">いちばんの大物</span><b>${esc(big.name)}：${esc(bk.n)} ${big.best.s}cm</b></div></div>`:''}${kj&&big?`<div class="award"><div class="kw">${esc(big.best.w)}</div><div><span class="sub">いちばんの一手</span><b>${esc(big.name)}：${esc(big.best.w)}${big.best.rd?`（${esc(big.best.rd)}）`:''} +${big.best.pts}</b></div></div>`:''}</div>
  <div class="card"><h2>結果</h2><table class="t"><tbody>${r.map(x=>`<tr class="${x.i===me?'me':''}"><td class="rk">${x.rank}位</td><td><span class="sw" style="background:${COLORS[x.col%COLORS.length]}"></span>${esc(x.name)}<div class="sub">${kj?`${x.log.length}個 作った`:`${x.n}匹${x.best?` ・ 最大 ${esc(KINDS[x.best.k].n)} ${x.best.s}cm`:''}`}</div></td><td class="num">${x.pts}点</td></tr>`).join('')}</tbody></table>
    ${r.map(x=>x.log.length?`<details class="rules" style="margin-top:8px"><summary>${esc(x.name)} の${kj?'作ったもの':'釣ったもの'}（${x.log.length}）</summary><div class="sub">${kj?x.log.map(([t,w,p,rd])=>`${esc(w)}${rd?`（${esc(rd)}）`:''} +${p}`).join('、'):x.log.map(([k,s,p])=>`${esc(KINDS[k].n)} ${s}cm（+${p}）`).join('、')}</div></details>`:'').join('')}</div>
  ${NET.solo||R.mode==='endless'?'':`<div class="card"><h2>通算の勝ち数（${V.games}ゲーム）</h2><table class="t"><tbody>${V.players.filter(p=>V.wins[p.id]).sort((a,b)=>V.wins[b.id]-V.wins[a.id]).map(p=>`<tr class="${p.id===MYID?'me':''}"><td>${esc(p.name)}</td><td class="num">${V.wins[p.id]}勝</td></tr>`).join('')||'<tr><td class="sub">まだありません</td></tr>'}</tbody></table></div>`}
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次のゲームを始めるのを待っています</span></div>'}</div>
  <button class="btn wide" data-act="zukan" style="margin-bottom:14px">図鑑（${zCount()} / ${KINDS.length}）</button>`;}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  const playing=!!(V&&(V.phase==='count'||V.phase==='play'));
  $('#game').hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);document.body.classList.toggle('kanji',!!(V&&V.pond==='kanji'));document.body.classList.toggle('endless',!!(V&&V.mode==='endless'&&!NET.solo));
  if(V&&V.phase==='count'){VIEWAT=performance.now();HUDK='';}
  if(playing){LASTKEY='';ZOPEN=false;return;}
  let html,key;
  if(ZOPEN){html=vZukan();key='z'+zCount();}
  else if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'')+zCount();}
  else{key=JSON.stringify([V.phase,V.players,V.mode,V.pond,V.timeSel,V.cpuSel,V.specs,V.games,MYID,NET.status,zCount()]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vEnd());}
  if(key===LASTKEY)return;
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;
  document.querySelectorAll('canvas.zc').forEach(c=>drawKind(c,KINDS[+c.dataset.i],0,c.dataset.s!=='1'));
  document.querySelectorAll('canvas.kc').forEach(c=>drawKind(c,KINDS[+c.dataset.i],0,false));
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('tsuri-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='start')send({t:'start'});
  else if(a==='lobby')send({t:'lobby'});
  else if(a==='endgame'){if(confirm('ここで終わって、結果を見ますか？'))send({t:'endgame'});}
  else if(a==='mode')send({t:'mode',v:b.dataset.v});
  else if(a==='pond')send({t:'pond',v:b.dataset.v});
  else if(a==='rel'){send({t:'rel',k:+b.dataset.k});}
  else if(a==='zukan'){saveName();ZOPEN=true;render();scrollTo(0,0);}
  else if(a==='zclose'){ZOPEN=false;render();scrollTo(0,0);}
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}
  if(!amHost())return;if(['timeSel','cpuSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
});
(function(){let j=null;try{j=sessionStorage.getItem('tsuri-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
