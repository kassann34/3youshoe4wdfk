<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>9まい麻雀</title>
<meta name="description" content="入門用の麻雀。9枚（3面子）か11枚（3面子＋雀頭）、鳴きのありなしを選べる。牌は赤・緑・青と春夏秋冬">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 卓：深い緑のフェルトに、クリーム色の牌。数字牌は赤・緑・青の大きな数字（色の見分けがつきにくい人のために、●▲■の印も） */
:root{
  --felt:#1e5b4e; --felt2:#174a40; --felt-line:#2f7565; --ink:#f4f1e6; --muted:#a9cbbf; --panel:#123d34; --rule:#2b6b5c;
  --tile:#fbf6e7; --tile-edge:#d9cfae; --tile-side:#b9ad86; --tile-ink:#2a2a2a;
  --c0:#d33a2c; --c1:#1f8a4c; --c2:#2a62c9; --gold:#f2c14e; --warn:#ff9b8a; --ok:#9be3b5;
  --s0:#d9487f; --s1:#d98b00; --s2:#b4531d; --s3:#2f8fc4;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --tf:"Zen Maru Gothic","M PLUS Rounded 1c",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#236a5b 0%,var(--felt) 45%,#123f36 100%) fixed,var(--felt)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-family:var(--tf);font-weight:900;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.logo h1 .tl{font-size:14px}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:rgba(10,40,34,.72);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:#0e3029;border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:#14463c;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#2b2205;border-color:var(--gold)}
.btn.red{background:#d9493b;border-color:#d9493b;color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.code{font-size:30px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:#0e3029}
.plist li.off{opacity:.5}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ul,details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:5px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{color:var(--gold)}

/* 牌 */
.tl{--w:34px;position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:var(--w);height:calc(var(--w)*1.36);
  background:linear-gradient(180deg,#fffdf4,var(--tile) 70%);border-radius:calc(var(--w)*.16);border:1px solid var(--tile-edge);
  box-shadow:0 calc(var(--w)*.09) 0 var(--tile-side),0 calc(var(--w)*.12) calc(var(--w)*.18) rgba(0,0,0,.35);
  font-family:var(--tf);font-weight:900;font-size:calc(var(--w)*.72);line-height:1;color:var(--tile-ink);vertical-align:bottom;user-select:none;flex:none}
.tl.c0{color:var(--c0)}.tl.c1{color:var(--c1)}.tl.c2{color:var(--c2)}
.tl.c0::after,.tl.c1::after,.tl.c2::after{position:absolute;bottom:calc(var(--w)*.06);font-size:calc(var(--w)*.2);line-height:1;opacity:.85}
.tl.c0::after{content:"●"}.tl.c1::after{content:"▲"}.tl.c2::after{content:"■"}
.tl.ss{font-size:calc(var(--w)*.6)}
.tl.s0{color:var(--s0)}.tl.s1{color:var(--s1)}.tl.s2{color:var(--s2)}.tl.s3{color:var(--s3)}
.tl.ss::after{position:absolute;bottom:calc(var(--w)*.04);font-size:calc(var(--w)*.24);line-height:1}
.tl.s0::after{content:"🌸"}.tl.s1::after{content:"☀"}.tl.s2::after{content:"🍁"}.tl.s3::after{content:"❄"}
.tl.ss{padding-bottom:calc(var(--w)*.2)}
.tl.bk{background:linear-gradient(160deg,#f4b04a,#d98a1e);border-color:#b8701a;box-shadow:0 calc(var(--w)*.09) 0 #8f5612,0 calc(var(--w)*.12) calc(var(--w)*.18) rgba(0,0,0,.35)}
.tl.xs{--w:var(--xs,20px)}.tl.sm{--w:24px}.tl.md{--w:30px}.tl.lg{--w:40px}
.tl.rot{transform:rotate(90deg);margin:0 calc(var(--w)*.18)}
.tl.tg{filter:brightness(.88)}
.tl.last{outline:2px dashed #fff;outline-offset:2px}
.tl.dora{box-shadow:0 0 0 2px var(--gold),0 calc(var(--w)*.09) 0 var(--tile-side)}
.tl.hl{box-shadow:0 0 0 3px #ffe066,0 0 14px 4px rgba(255,224,102,.75),0 calc(var(--w)*.09) 0 var(--tile-side);z-index:1}
.tl.isdora::before{content:"ドラ";position:absolute;top:0;left:50%;transform:translate(-50%,-62%);background:#d9493b;color:#fff;font-family:var(--font);font-weight:800;
  font-size:max(8px,calc(var(--w)*.3));line-height:1.15;padding:0 .25em;border-radius:.3em;white-space:nowrap;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.tl.rot.isdora::before{transform:translate(-50%,-62%) rotate(-90deg)}
.tl.xs.isdora::before{font-size:8px;padding:0 2px}
.tl.win{outline:3px solid var(--gold);outline-offset:2px}

/* 卓 */
/* 卓の大きさは固定：捨て牌がふえても、リーチしても、名前が長くても動かない */
.table{--xs:20px;--rh:calc(var(--xs)*1.36 + 5px);--side:calc(var(--xs)*6 + 25px);display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--side);grid-template-areas:"top top top" "left mid right" "me me me";gap:8px;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.05),transparent 70%),var(--felt2);border:2px solid #0e3a31;border-radius:18px;padding:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.seat{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;padding:4px;border-radius:10px}
.seat.turn{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(242,193,78,.45);background:rgba(242,193,78,.1);animation:turnp 1.6s ease-in-out infinite}
.seat.turn::before{content:"手番";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2b2205;font-size:11px;font-weight:800;border-radius:999px;padding:0 10px;line-height:18px;z-index:2;white-space:nowrap}
@keyframes turnp{50%{box-shadow:0 0 0 3px var(--gold),0 0 4px rgba(242,193,78,.2)}}
.mid .whose{font-weight:800;color:var(--gold);font-size:13px;line-height:1.3}
.mid .whose.me{background:var(--gold);color:#2b2205;border-radius:999px;padding:2px 12px}
@media (prefers-reduced-motion:reduce){.seat.turn{animation:none}}
.seat.top{grid-area:top;align-items:center}.seat.left{grid-area:left;align-items:flex-start}.seat.right{grid-area:right;align-items:flex-end}.seat.me{grid-area:me;align-items:center}
.nm{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;max-width:100%;height:22px;flex:none}
.seat.left .nm,.seat.right .nm{flex-wrap:wrap;align-content:flex-start;height:48px;row-gap:4px}
.seat.right .nm{justify-content:flex-end}
.nm .w{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--tile);font-family:var(--tf);font-weight:900;font-size:13px}
.nm .w.s0{color:var(--s0)}.nm .w.s1{color:var(--s1)}.nm .w.s2{color:var(--s2)}.nm .w.s3{color:var(--s3)}
.nm .pt{font-variant-numeric:tabular-nums;color:var(--gold)}
.nm .rc{background:#d9493b;color:#fff;border-radius:999px;padding:0 6px;font-size:10px}
.nm .oya{background:var(--gold);color:#2b2205;border-radius:999px;padding:0 6px;font-size:10px}

.backs{display:flex;gap:1px;height:calc(var(--xs)*1.36 + 4px);flex:none}
.seat.left .backs,.seat.right .backs{display:grid;grid-template-columns:repeat(6,auto);justify-content:start;gap:2px 1px;height:calc(var(--xs)*2.72 + 8px)}
.river{display:grid;grid-template-columns:repeat(6,var(--xs));gap:3px;justify-content:start;align-content:start;height:calc(var(--rh)*4);flex:none}
.seat.left .river,.seat.right .river{height:calc(var(--rh)*4)}
.river .tl.rot{transform:rotate(90deg) scale(.82);margin:0}
.seat.top .river,.seat.me .river{width:calc(var(--xs)*6 + 15px)}
.seat.rcs:not(.turn){background:rgba(217,73,59,.16);box-shadow:0 0 0 2px rgba(255,120,100,.75)}
.seat.rcs .nm>span:first-child{color:#ffb3a8}
.stick.off{visibility:hidden}
.stick{display:block;width:64px;height:9px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);position:relative;flex:none}
.stick::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#d9493b}
.ann{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;text-align:center;white-space:nowrap;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 70%);padding:24px 40px;animation:ann 1.9s ease-out both}
.ann b{display:block;white-space:nowrap;font-family:var(--tf);font-weight:900;font-size:56px;line-height:1.1;color:#fff;text-shadow:0 0 0 #d9493b,3px 3px 0 #d9493b,0 6px 24px rgba(0,0,0,.6);letter-spacing:.06em}
.ann span{display:inline-block;margin-top:6px;background:#d9493b;color:#fff;font-weight:800;border-radius:999px;padding:2px 14px;font-size:16px}
@keyframes ann{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.ann{animation:ann2 1.9s steps(1) both}@keyframes ann2{0%{opacity:1}100%{opacity:0}}}
.tbar{display:flex;align-items:center;justify-content:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
.tbar .rd{font-family:var(--tf);font-weight:900;font-size:18px;color:var(--ink)}
.tbar .rd .s0{color:#ff8fb7}.tbar .rd .s1{color:#ffc04d}
.tbar .dr{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tbar .btn{min-height:32px;padding:2px 12px;font-size:13px}
.mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.18);border-radius:14px;padding:8px;min-height:110px;text-align:center}
.mid .rd{font-family:var(--tf);font-weight:900;font-size:20px}
.mid .rd .s0{color:#ff8fb7}.mid .rd .s1{color:#ffc04d}
.mid .small{font-size:12px;color:var(--muted)}
.mid .dr{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
/* 自分の手牌 */
.hand{display:flex;justify-content:center;align-items:flex-end;gap:3px;margin-top:12px;flex-wrap:nowrap}
.hand .gap{width:10px}
.hand button.tb{all:unset;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.hand button.tb:hover .tl,.hand button.tb:focus-visible .tl{transform:translateY(-6px)}
.hand button.tb:focus-visible{outline:2px solid var(--gold);border-radius:6px}
.hand button.tb.no{cursor:default;opacity:.45}
.hand button.tb.no .tl{transform:none}
.hand button.tb.sel .tl{transform:translateY(-12px);box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(242,193,78,.7),0 calc(var(--w)*.09) 0 var(--tile-side)}
.hand .mk{font-size:10px;font-weight:800;color:var(--gold);height:12px;line-height:12px}
.hand .tl{--w:min(10vw,48px)}
.hand.h11 .tl{--w:min(7.6vw,44px)}
.hand .ml{display:inline-flex;gap:1px;align-self:flex-end;margin-left:2px}
.hand .ml .tl{--w:min(5.4vw,28px)}
.backs .ml{display:contents}
.tl.taken{opacity:.3}
.acts{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;min-height:44px}
.acts .btn{min-width:110px;font-size:17px}
.info{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted);min-height:26px}
.info .fu{color:var(--warn);font-weight:800}
.msgline{text-align:center;font-weight:800;margin-top:6px;min-height:24px}
/* 結果 */
.res{position:fixed;inset:0;z-index:20;background:rgba(5,20,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.res .box{background:#123d34;border:2px solid var(--gold);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.res h2{margin:0 0 6px;font-family:var(--tf);font-weight:900;font-size:26px;text-align:center;color:var(--gold)}
.res .hd{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin:10px 0}
.yh{font-size:14px;margin:14px 0 4px;color:var(--gold)}
.yl{list-style:none;margin:0;padding:0}
.yl li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px dashed var(--rule);padding:5px 2px}
.yl li b{margin-right:8px}
.ytag{display:inline-block;font-size:10px;font-weight:800;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:0 6px;margin-right:6px;vertical-align:2px}
.yl .ex{display:flex;gap:2px}
.ymodal .box{max-width:560px}
.yk{list-style:none;margin:8px 0;padding:0}
.yk li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--rule);padding:4px 2px}
.yk li b{color:var(--gold)}
.big{font-family:var(--tf);font-weight:900;font-size:30px;text-align:center;color:var(--gold)}
.dl{font-variant-numeric:tabular-nums}
.dl.p{color:var(--ok)}.dl.m{color:var(--warn)}
/* チャット */
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--gold);background:#14463c;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cbadge{background:#d9493b;color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:#123d34;border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:#0e3029;border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:#1d5a4c}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:800}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
.chat[hidden],.chat-body[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--gold);color:#2b2205;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:800;z-index:40}
.toast[hidden]{display:none}
@media (max-width:480px){.wrap{padding:10px 8px 90px}.table{padding:5px;gap:4px;--xs:15px}.chat{right:10px;bottom:10px}.chat-body{width:calc(100vw - 20px)}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.hand button.tb .tl{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="tl c0 sm" aria-hidden="true">9</span>9まい麻雀</h1><small>入門用の麻雀 ・ <span id="ver">試作 v11</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="resv"></div><div id="annv" aria-live="assertive"></div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 9まい麻雀（入門用）
   ・牌は赤・緑・青の1〜9と、春夏秋冬。各4枚で124枚
   ・手牌8枚。ツモって9枚になったら1枚捨てる。アガりは9枚で「3面子」（雀頭なし）か、七対子もどき（2・2・2・3）か、国士無双もどき
   ・ロンとリーチだけ（ポン・チー・カン、裏ドラ、赤ドラなし）。ドラは表ドラだけ
   ・点数は翻だけで決まり、どれも3の倍数（ツモは3人で等分）
   部屋主が山・手牌・CPU を持つ。各自には自分の手牌と、みんなの捨て牌だけを見せる */
const PREFIX='mj9-room-';
const VER=11;
const NK=31; // 牌の種類：0〜26 が数牌（色×9＋数−1）、27〜30 が春夏秋冬
const COLN=['赤','緑','青'],SEAS=['春','夏','秋','冬'];
const isS=k=>k>=27,numOf=k=>k%9+1,colOf=k=>Math.floor(k/9);
const isTerm=k=>k<27&&(k%9===0||k%9===8);
const isYao=k=>isS(k)||isTerm(k);
const tname=k=>isS(k)?SEAS[k-27]:COLN[colOf(k)]+numOf(k);

/* ---------- 役と点数 ---------- */
// x：{c:手の内（アガり牌こみ）, open:[['k'|'s',牌],...] 鳴いた面子, win, tsumo, bakaze, jikaze, riichi, dbl, ipp, haitei, houtei, tenhou, chiihou, dora}
// 鳴くと：リーチ・一発・ツモ・平和・一盃口・七対子もどき・国士無双もどきはつかない。三色同順・一気通貫・チャンタ・混一色・清一色は1翻下がる

/* ---------- CPU：向聴数と受け入れ ---------- */
// M：作る面子の数、P：雀頭がいるか。テンパイが0、アガりが−1

/* ---------- 部屋主の進行 ---------- */
// phase: lobby → play（R：いまの局）→ end

const later=(ms,fn)=>{H.timer={at:Date.now()+ms,fn};};
const nOpen=s=>H.R.melds[s].length;

function riichiOK(s){const R=H.R;if(R.riichi[s]||nOpen(s)||H.seats[s].pts<1000||R.wall.length<4)return [];const out=[];

  return `<div class="card"><div class="big">${esc(R.rows[0].name)} の勝ち！</div>
    <table class="t" style="margin-top:10px"><tr><th>順位</th><th>名前</th><th style="text-align:right">点数</th></tr>${R.rows.map((r,i)=>`<tr class="${r.pid&&r.pid===MYID?'me':''}"><td>${i+1}位</td><td>${esc(r.name)}</td><td class="num">${r.pts}</td></tr>`).join('')}</table></div>
  <div class="card stack">${amHost()?`${NET.solo?'':settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次を始めるのを待っています</span></div>'}</div>`;}
let LASTKEY='';
function render(){
  DORAK=V&&V.phase==='play'&&V.g?doraOf(V.g.doraInd):null;
  topinfo();renderChat();let html;
  if(!V)html=vHome();
  else{const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+({lobby:vLobby,play:vPlay,end:vEnd}[V.phase]||vEnd)();}
  const key=html+'|'+(V?JSON.stringify(V.players):'');
  if(key!==LASTKEY){const ae=document.activeElement,aid=ae&&ae.id;$('#app').innerHTML=html;LASTKEY=key;
    if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}applyHL();}
  const rv=V&&V.phase==='play'?(resHTML()||(LOC.yaku?`<div class="res ymodal" role="dialog" aria-label="役の一覧" data-act="yakuclose"><div class="box" data-stop="1"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:22px">役の一覧</h2><button class="btn small" data-act="yakuclose">閉じる</button></div>${yakuListHTML()}</div></div>`:'')):'';const rb=$('#resv');if(rb.dataset.k!==rv){rb.innerHTML=rv;rb.dataset.k=rv;}
  if(V&&V.g&&V.g.phase==='res'){const an=$('#annv');if(an&&an.innerHTML){an.innerHTML='';clearTimeout(ANNT);}}
}
let HL=null;
function applyHL(){document.querySelectorAll('.tl.hl').forEach(e=>e.classList.remove('hl'));if(HL==null)return;document.querySelectorAll(`#app .tl[data-k="${HL}"]`).forEach(e=>e.classList.add('hl'));}
function setHL(k){if(k===HL)return;HL=k;applyHL();}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('#app .tl[data-k]');setHL(t?+t.dataset.k:null);});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('#app .tl[data-k]');setHL(t?+t.dataset.k:null);});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('mj9-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='solo'){saveName();soloRoom();}
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(!V||V.phase!=='play'||confirm('ゲームをやめますか？'+(amHost()&&!NET.solo?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='disc'){if(b.classList.contains('no'))return;const id=b.dataset.i;
    if(DBL&&LOC.sel!==id){LOC.sel=id;render();return;}
    LOC.sel=null;send({t:'discard',k:+b.dataset.k,tg:b.dataset.tg==='1',riichi:LOC.riichi});LOC.riichi=false;}
  else if(a==='dbl'){DBL=!DBL;store.set('mj9-dbl',DBL?'1':'0');LOC.sel=null;render();toast(DBL?'2回押すと捨てます':'1回押すと捨てます');}
  else if(a==='watchs'){const w=+b.dataset.s;if(NET.conn&&NET.conn.open)sendTo(NET.conn,{t:'watchseat',s:w});}
  else if(a==='riichi'){LOC.riichi=true;render();}
  else if(a==='callp')send({t:'call',v:'pon'});
  else if(a==='callc')send({t:'call',v:'chi',ab:[+b.dataset.a,+b.dataset.b]});
  else if(a==='calls')send({t:'call',v:'skip'});
  else if(a==='yaku'){LOC.yaku=true;render();}
  else if(a==='yakuclose'){if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;LOC.yaku=false;render();}
  else if(a==='cancelr'){LOC.riichi=false;render();}
  else if(['tsumo','ron','skip','next','start','lobby'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(['lenSel','modeSel','nakiSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&LOC.yaku){LOC.yaku=false;render();return;}if(e.key!=='Enter'||e.isComposing)return;if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}});
(function(){let j=null;try{j=sessionStorage.getItem('mj9-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&V&&V.phase==='play'&&!NET.solo){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
