<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>でこぼこ麻雀</title>
<meta name="description" content="ふつうの麻雀。ただし牌の枚数が半荘ごとに、こっそり0〜8枚に変わる（全部で136枚のまま）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 卓：深い緑のフェルトに、クリーム色の牌。数字牌は赤・緑・青の大きな数字（色の見分けがつきにくい人のために、●▲■の印も） */
:root{
  --felt:#1e5b4e; --felt2:#174a40; --felt-line:#2f7565; --ink:#f4f1e6; --muted:#a9cbbf; --panel:#123d34; --rule:#2b6b5c;
  --tile:#fbf6e7; --tile-edge:#d9cfae; --tile-side:#b9ad86; --tile-ink:#2a2a2a;
  --c0:#c8322a; --c1:#2659c4; --c2:#1d8248; --gold:#f2c14e; --warn:#ff9b8a; --ok:#9be3b5;
  --s0:#d9487f; --s1:#d98b00; --s2:#b4531d; --s3:#2f8fc4;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --tf:"Zen Maru Gothic","M PLUS Rounded 1c",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#236a5b 0%,var(--felt) 45%,#123f36 100%) fixed,var(--felt)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-family:var(--tf);font-weight:900;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.logo h1 .tl{font-size:14px}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:rgba(10,40,34,.72);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:#0e3029;border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:#14463c;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#2b2205;border-color:var(--gold)}
.btn.red{background:#d9493b;border-color:#d9493b;color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.code{font-size:30px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:#0e3029}
.plist li.off{opacity:.5}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ul,details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:5px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{color:var(--gold)}

/* 牌 */
.tl{--w:34px;position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:var(--w);height:calc(var(--w)*1.36);
  background:linear-gradient(180deg,#fffdf4,var(--tile) 70%);border-radius:calc(var(--w)*.16);border:1px solid var(--tile-edge);
  box-shadow:0 calc(var(--w)*.09) 0 var(--tile-side),0 calc(var(--w)*.12) calc(var(--w)*.18) rgba(0,0,0,.35);
  font-family:var(--tf);font-weight:900;font-size:calc(var(--w)*.72);line-height:1;color:var(--tile-ink);vertical-align:bottom;user-select:none;flex:none}
.tl.c0{color:var(--c0)}.tl.c1{color:var(--c1)}.tl.c2{color:var(--c2)}
.tl.c0,.tl.c1,.tl.c2{font-size:calc(var(--w)*.6);padding-bottom:calc(var(--w)*.3)}
.tl.c0::after,.tl.c1::after,.tl.c2::after{position:absolute;bottom:calc(var(--w)*.07);font-size:calc(var(--w)*.3);line-height:1;font-weight:900}
.tl.c0::after{content:"萬"}.tl.c1::after{content:"筒"}.tl.c2::after{content:"索"}
.tl.ss{font-size:calc(var(--w)*.66);color:#2a2a2a}
.tl.z4{color:#7fa6d9}.tl.z5{color:#1d8248}.tl.z6{color:#c8322a}
.tl.bk{background:linear-gradient(160deg,#f4b04a,#d98a1e);border-color:#b8701a;box-shadow:0 calc(var(--w)*.09) 0 #8f5612,0 calc(var(--w)*.12) calc(var(--w)*.18) rgba(0,0,0,.35)}
.tl.xs{--w:var(--xs,20px)}.tl.sm{--w:24px}.tl.md{--w:30px}.tl.lg{--w:40px}
.tl.rot{transform:rotate(90deg);margin:0 calc(var(--w)*.18)}
.tl.tg{filter:brightness(.88)}
.tl.last{outline:2px dashed #fff;outline-offset:2px}
.tl.dora{box-shadow:0 0 0 2px var(--gold),0 calc(var(--w)*.09) 0 var(--tile-side)}
.tl.hl{box-shadow:0 0 0 3px #ffe066,0 0 14px 4px rgba(255,224,102,.75),0 calc(var(--w)*.09) 0 var(--tile-side);z-index:1}
.tl.isdora::before{content:"ドラ";position:absolute;top:0;left:50%;transform:translate(-50%,-62%);background:#d9493b;color:#fff;font-family:var(--font);font-weight:800;
  font-size:max(8px,calc(var(--w)*.3));line-height:1.15;padding:0 .25em;border-radius:.3em;white-space:nowrap;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.tl.rot.isdora::before{transform:translate(-50%,-62%) rotate(-90deg)}
.tl.xs.isdora::before{font-size:8px;padding:0 2px}
.tl.win{outline:3px solid var(--gold);outline-offset:2px}

/* 卓 */
/* 卓の大きさは固定：捨て牌がふえても、リーチしても、名前が長くても動かない */
/* 捨て牌の大きさは画面の幅に合わせて大きく。真ん中は細くして、山の残りだけ */
.table{--xs:clamp(14px,calc((min(100vw,760px) - 128px)/12),30px);--rh:calc(var(--xs)*1.36 + 5px);--side:calc(var(--xs)*6 + 34px);display:grid;grid-template-columns:var(--side) minmax(34px,1fr) var(--side);grid-template-areas:"top top top" "left mid right" "me me me";gap:8px;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.05),transparent 70%),var(--felt2);border:2px solid #0e3a31;border-radius:18px;padding:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.seat{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;padding:4px;border-radius:10px}
.seat.turn{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(242,193,78,.45);background:rgba(242,193,78,.1);animation:turnp 1.6s ease-in-out infinite}
.seat.turn::before{content:"手番";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2b2205;font-size:11px;font-weight:800;border-radius:999px;padding:0 10px;line-height:18px;z-index:2;white-space:nowrap}
@keyframes turnp{50%{box-shadow:0 0 0 3px var(--gold),0 0 4px rgba(242,193,78,.2)}}
.mid .whose{font-weight:800;color:var(--gold);font-size:13px;line-height:1.3}
.mid .whose.me{background:var(--gold);color:#2b2205;border-radius:999px;padding:2px 12px}
@media (prefers-reduced-motion:reduce){.seat.turn{animation:none}}
.seat.top{grid-area:top;align-items:center}.seat.left{grid-area:left;align-items:flex-start}.seat.right{grid-area:right;align-items:flex-end}.seat.me{grid-area:me;align-items:center}
.nm{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;max-width:100%;height:22px;flex:none}
.seat.left .nm,.seat.right .nm{font-size:11px;gap:3px}
.seat.left .nm>span:first-child,.seat.right .nm>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.seat.right .nm{justify-content:flex-end}
.nm .w{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:var(--tile);font-family:var(--tf);font-weight:900;font-size:13px}
.nm .w.s0{color:var(--s0)}.nm .w.s1{color:var(--s1)}.nm .w.s2{color:var(--s2)}.nm .w.s3{color:var(--s3)}
.nm .pt{font-variant-numeric:tabular-nums;color:var(--gold)}
.nm .rc{background:#d9493b;color:#fff;border-radius:999px;padding:0 6px;font-size:10px}
.nm .oya{background:var(--gold);color:#2b2205;border-radius:999px;padding:0 6px;font-size:10px}

.backs{--bw:calc(var(--xs)*.7);display:flex;gap:1px;height:calc(var(--bw)*1.36 + 4px);flex:none}
.backs .tl{--w:var(--bw)}
.seat .lr{display:flex;gap:4px;align-items:center}
/* 向かいの人：手牌の右（こちらから見て左）に鳴いた牌、表の牌は逆さ */
.seat.top .backs{flex-direction:row-reverse}
.seat.top .backs .ml .tl{transform:rotate(180deg)}
/* 左右の人：手牌は縦に1列。裏は横長、鳴いた牌は横向き（左の人は下に、右の人は上に鳴いた牌） */
.seat.left .backs,.seat.right .backs{--bw:calc(var(--xs)*.5);flex-direction:column;align-items:center;height:auto;gap:1px}
.seat.right .backs{flex-direction:column-reverse}
.seat.left .backs .tl.bk,.seat.right .backs .tl.bk{width:calc(var(--bw)*1.36);height:var(--bw)}
.seat.left .backs .ml .tl{transform:rotate(90deg);margin:calc(var(--w)*-.18) 0}
.seat.right .backs .ml .tl{transform:rotate(-90deg);margin:calc(var(--w)*-.18) 0}
.river{display:grid;grid-template-columns:repeat(6,var(--xs));gap:3px;justify-content:start;align-content:start;height:calc(var(--rh)*4);flex:none}
.seat.left .river,.seat.right .river{height:calc(var(--rh)*4)}
/* 捨て牌は、捨てた人のほうを向く（向かいは逆さ、左右は横向き） */
.rwrap{position:relative;flex:none;width:calc(var(--xs)*6 + 15px);height:calc(var(--rh)*4)}
.seat.left .rwrap,.seat.right .rwrap{width:calc(var(--rh)*4);height:calc(var(--xs)*6 + 15px)}
.rwrap .river{position:absolute;left:50%;top:50%;width:calc(var(--xs)*6 + 15px);transform:translate(-50%,-50%)}
.seat.top .rwrap .river{transform:translate(-50%,-50%) rotate(180deg)}
.seat.left .rwrap .river{transform:translate(-50%,-50%) rotate(90deg)}
.seat.right .rwrap .river{transform:translate(-50%,-50%) rotate(-90deg)}
.river .tl.rot{transform:rotate(90deg) scale(.82);margin:0}
.seat.top .river,.seat.me .river{width:calc(var(--xs)*6 + 15px)}
.seat.rcs:not(.turn){background:rgba(217,73,59,.16);box-shadow:0 0 0 2px rgba(255,120,100,.75)}
.seat.rcs .nm>span:first-child{color:#ffb3a8}
.stick.off{visibility:hidden}
.stick{display:block;width:64px;height:9px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);position:relative;flex:none}
.stick::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#d9493b}
.ann{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;text-align:center;white-space:nowrap;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),transparent 70%);padding:24px 40px;animation:ann 1.9s ease-out both}
.ann b{display:block;white-space:nowrap;font-family:var(--tf);font-weight:900;font-size:56px;line-height:1.1;color:#fff;text-shadow:0 0 0 #d9493b,3px 3px 0 #d9493b,0 6px 24px rgba(0,0,0,.6);letter-spacing:.06em}
.ann span{display:inline-block;margin-top:6px;background:#d9493b;color:#fff;font-weight:800;border-radius:999px;padding:2px 14px;font-size:16px}
@keyframes ann{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.ann{animation:ann2 1.9s steps(1) both}@keyframes ann2{0%{opacity:1}100%{opacity:0}}}
.mybar{position:relative;z-index:6;padding:4px 0 8px}
.mybar .hand{margin-top:4px}.mybar .acts{margin-top:6px;min-height:0}.mybar .msgline{margin-top:2px;min-height:20px;font-size:14px}.mybar .info{margin-top:2px;min-height:0}
body.playing header.top{margin-bottom:6px}body.playing .logo h1{font-size:20px}body.playing .logo small{display:none}
.tbar{display:flex;align-items:center;justify-content:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
.tbar .rd{font-family:var(--tf);font-weight:900;font-size:18px;color:var(--ink)}
.tbar .rd .s0{color:#ff8fb7}.tbar .rd .s1{color:#ffc04d}
.tbar .dr{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tbar .btn{min-height:30px;padding:2px 10px;font-size:12px}.tbar .chip{font-size:12px;padding:2px 10px}
.mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 2px;text-align:center}
.mid{container-type:inline-size}
.mid .full{display:none;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mid .full b{color:var(--ink)}
@container (min-width:130px){.mid .vt{display:none}.mid .full{display:flex}}
.mid .vt{writing-mode:vertical-rl;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.mid .vt b{color:var(--ink);text-combine-upright:all}
.mid .rd{font-family:var(--tf);font-weight:900;font-size:20px}
.mid .rd .s0{color:#ff8fb7}.mid .rd .s1{color:#ffc04d}
.mid .small{font-size:12px;color:var(--muted)}
.mid .dr{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
/* 自分の手牌 */
.hand{display:flex;justify-content:center;align-items:flex-end;gap:3px;margin-top:12px;flex-wrap:nowrap}
.hand .gap{width:10px}
.hand button.tb{all:unset;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.hand button.tb:hover .tl,.hand button.tb:focus-visible .tl{transform:translateY(-6px)}
.hand button.tb:focus-visible{outline:2px solid var(--gold);border-radius:6px}
.hand button.tb.no{cursor:default;opacity:.45}
.hand button.tb.no .tl{transform:none}
.hand button.tb.sel .tl{transform:translateY(-12px);box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(242,193,78,.7),0 calc(var(--w)*.09) 0 var(--tile-side)}
.hand .mk{font-size:10px;font-weight:800;color:var(--gold);height:12px;line-height:12px}
.hand .tl{--w:min(10vw,48px)}
.hand.h14 .tl{--w:min(6.3vw,42px)}
.hand.h14 .ml .tl{--w:min(4.6vw,26px)}
.hand .ml{display:inline-flex;gap:1px;align-self:flex-end;margin-left:2px}
.hand .ml .tl{--w:min(5.4vw,28px)}
.backs .ml{display:contents}
.tl.taken{opacity:.3}
.acts{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;min-height:44px}
.acts .btn{min-width:110px;font-size:17px}
.info{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted);min-height:26px}
.info .fu{color:var(--warn);font-weight:800}
.msgline{text-align:center;font-weight:800;margin-top:6px;min-height:24px}
/* 結果 */
.res{position:fixed;inset:0;z-index:20;background:rgba(5,20,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.res .box{background:#123d34;border:2px solid var(--gold);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.res h2{margin:0 0 6px;font-family:var(--tf);font-weight:900;font-size:26px;text-align:center;color:var(--gold)}
.res .hd{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin:10px 0}
.yh{font-size:14px;margin:14px 0 4px;color:var(--gold)}
.yl{list-style:none;margin:0;padding:0}
.yl li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px dashed var(--rule);padding:5px 2px}
.yl li b{margin-right:8px}
.ytag{display:inline-block;font-size:10px;font-weight:800;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:0 6px;margin-right:6px;vertical-align:2px}
.yl .ex{display:flex;gap:2px}
.ymodal .box{max-width:560px}
.yl~table.t,details.rules table.t{font-size:13px}.yl~table.t td,details.rules table.t td{white-space:nowrap}
.yk{list-style:none;margin:8px 0;padding:0}
.yk li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--rule);padding:4px 2px}
.yk li b{color:var(--gold)}
.big{font-family:var(--tf);font-weight:900;font-size:30px;text-align:center;color:var(--gold)}
.dl{font-variant-numeric:tabular-nums}
.dl.p{color:var(--ok)}.dl.m{color:var(--warn)}
.cnts{display:grid;gap:8px}
.cnts .cr{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.cnts .cc{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:3px 2px;border-radius:8px;background:rgba(0,0,0,.16)}
.cnts .cc b{font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.cnts .cc small{font-size:10px;color:var(--muted);line-height:1.1;white-space:nowrap}
.cnts .cc.z0{opacity:.4}.cnts .cc.hi b{color:var(--gold)}.cnts .cc.lo b{color:var(--warn)}
.cnts .cc .tl{--w:min(24px,6.4vw)}
@media (max-width:480px){.cnts .cc b{font-size:12px}.cnts .cc small{font-size:9px}}
/* チャット */
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--gold);background:#14463c;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cbadge{background:#d9493b;color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:#123d34;border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:#0e3029;border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:#1d5a4c}

<body>
<div class="wrap" id="wrap">

</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* でこぼこ麻雀
   ・ふつうの麻雀（手牌13枚、4面子＋雀頭）。ただし半荘ごとに、牌の種類ごとの枚数が0〜8枚にランダムで変わる（全部で136枚のまま）
   ・ロン・ツモ・リーチ・ポン・チー（カン、裏ドラ、赤ドラなし）。ドラは表ドラだけ
   ・点数はふつうの計算（符と翻、満貫から上は決まった点）。本場あり
   ・牌の枚数はだれにも見えない（CPU も知らない）。各自の画面で「自分から見えた枚数」を記録する。半荘の終わりに答え合わせ
   部屋主が山・手牌・CPU を持つ。各自には自分の手牌と、みんなの捨て牌を見せる */
const PREFIX='dkb-room-';
const VER=4;
const NK=34; // 牌の種類：0〜8 萬子、9〜17 筒子、18〜26 索子、27〜30 東南西北、31〜33 白發中
const SUITN=['萬','筒','索'],HON=['東','南','西','北','白','發','中'],WIND=['東','南','西','北'],KANSU=['一','二','三','四','五','六','七','八','九'];
const isS=k=>k>=27,numOf=k=>k%9+1,colOf=k=>Math.floor(k/9); // isS：字牌
const isTerm=k=>k<27&&(k%9===0||k%9===8);
const isYao=k=>isS(k)||isTerm(k);
const isDrag=k=>k>=31,isWind=k=>k>=27&&k<=30;
const tname=k=>isS(k)?HON[k-27]:numOf(k)+SUITN[colOf(k)];
const doraOf=ind=>ind>=31?31+((ind-31+1)%3):ind>=27?27+((ind-27+1)%4):colOf(ind)*9+(ind%9+1)%9;
const cntOf=ks=>{const c=new Array(NK).fill(0);ks.forEach(k=>c[k]++);return c;};
// 点数：基本点 = 符 × 2^(翻+2)（2000で満貫）。子のロンは4倍、親は6倍。100点未満は切り上げ
const START=25000,STICK=1000,NOTEN=3000,HONBA=300;
const up100=x=>Math.ceil(x/100)*100;
function basePts(han,fu,ym){if(ym)return [8000*ym,ym>1?ym+'倍役満':'役満'];if(han>=13)return [8000,'数え役満'];if(han>=11)return [6000,'三倍満'];if(han>=8)return [4000,'倍満'];if(han>=6)return [3000,'跳満'];
  const b=fu*Math.pow(2,han+2);if(han>=5||b>=2000)return [2000,'満貫'];return [b,''];}

/* ---------- ルールの設定（部屋主が決めて、局のはじめに全員へ） ---------- */
const RULE={naki:true};
const HSZ=()=>13;
// この半荘の牌の枚数（種類ごと）。部屋主だけが持ち、山を作るのにだけ使う（待ち・テンパイ・CPU には使わない＝枚数がばれない）
let CNT=new Array(NK).fill(4);
// 0〜8枚で、合計136枚：4枚ずつから始めて、ランダムに1枚ずつ移す
function genCounts(){const c=new Array(NK).fill(4);for(let i=0;i<900;i++){const a=Math.floor(Math.random()*NK),b=Math.floor(Math.random()*NK);if(a!==b&&c[a]<8&&c[b]>0){c[a]++;c[b]--;}}return c;}

/* ---------- アガりの形 ---------- */
// 手の内の牌を need 個の面子（＋pair なら雀頭）に分ける：全部の分け方 {m:[['k'|'s', 先頭の牌], ...], p:雀頭の牌|null}
function decomps(c,need,pair){const out=[],cur=[];
  const melds=p=>(function rec(i){while(i<NK&&!c[i])i++;if(i===NK){if(cur.length===need)out.push({m:cur.slice(),p});return;}
    if(cur.length>=need)return;
    if(c[i]>=3){c[i]-=3;cur.push(['k',i]);rec(i);cur.pop();c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;cur.push(['s',i]);rec(i);cur.pop();c[i]++;c[i+1]++;c[i+2]++;}
  })(0);
  if(pair){for(let k=0;k<NK;k++)if(c[k]>=2){c[k]-=2;melds(k);c[k]+=2;}}else melds(null);
  return out;}
// 七対子：ちがう7種の2枚ずつ
function isChii(c){let n=0;for(let k=0;k<NK;k++){if(!c[k])continue;if(c[k]!==2)return false;n++;}return n===7;}
// 国士無双：1・9・字牌の13種ぜんぶ＋どれか1枚
function isKoku(c){let n=0,d=0;for(let k=0;k<NK;k++){if(!c[k])continue;if(!isYao(k)||c[k]>2)return false;n++;if(c[k]===2)d++;}return n===13&&d===1;}
// nOpen：鳴いた面子の数。特別な形は鳴いていないときだけ
function forms(c,nOpen){nOpen=nOpen||0;const f=[],need=4-nOpen,tot=c.reduce((a,b)=>a+b,0);if(tot!==3*need+2)return f;
  decomps(c.slice(),need,true).forEach(d=>f.push({t:'std',m:d.m,p:d.p}));
  if(!nOpen){if(isChii(c))f.push({t:'chii'});if(isKoku(c))f.push({t:'koku'});}return f;}
// 手の内の牌（あと1枚の状態）で、何を引けばアガりの形になるか（形だけで決める。山に残っているかは見ない）
function waitsOf(ks,nOpen){const c=cntOf(ks),w=[];for(let k=0;k<NK;k++){if(c[k]>=8)continue;c[k]++;if(forms(c,nOpen).length)w.push(k);c[k]--;}return w;}

/* ---------- 役と点数 ---------- */
// x：{c:手の内（アガり牌こみ）, open:[['k'|'s',牌],...] 鳴いた面子, win, tsumo, bakaze, jikaze, riichi, dbl, ipp, haitei, houtei, tenhou, chiihou, dora}
const GREEN=[19,20,21,23,25,32]; // 緑一色：2・3・4・6・8索と發
function scoreHand(x){const open=x.open||[],menzen=!open.length,fs=forms(x.c,open.length);if(!fs.length)return null;let best=null;
  const tiles=[];x.c.forEach((n,k)=>{for(let i=0;i<n;i++)tiles.push(k);});open.forEach(([t,k])=>{if(t==='k')tiles.push(k,k,k);else tiles.push(k,k+1,k+2);});
  const allYao=tiles.every(isYao),noYao=tiles.every(k=>!isYao(k)),hasS=tiles.some(isS),suits=new Set(tiles.filter(k=>!isS(k)).map(colOf)),allS=tiles.every(isS);
  const ks=(a,b)=>menzen?a:b; // 鳴くと下がる
  const yak=k=>isDrag(k)||k===x.bakaze||k===x.jikaze;
  const take=r=>{if(!best||r.base>best.base||(r.base===best.base&&(r.han>best.han||(r.han===best.han&&r.fu>best.fu))))best=r;};
  fs.forEach(f=>{
    // アガり牌がどこに入ったか（待ちの形）：符・平和・暗刻が変わるので、全部ためして一番高いもの
    let pls=[{w:''}];
    if(f.t==='std'){pls=[];if(f.p===x.win)pls.push({w:'tanki'});
      f.m.forEach((a,i)=>{if(a[0]==='k'&&a[1]===x.win)pls.push({w:'shanpon',i});
        if(a[0]==='s'&&x.win>=a[1]&&x.win<=a[1]+2){const v=a[1]%9;let w='ryanmen';if(x.win===a[1]+1)w='kanchan';else if((x.win===a[1]&&v===6)||(x.win===a[1]+2&&v===0))w='penchan';pls.push({w,i});}});
      if(!pls.length)pls=[{w:'tanki'}];}
    pls.forEach(pl=>{
    const ym=[];
    if(f.t==='koku')ym.push('国士無双');
    if(allS)ym.push('字一色');
    if(tiles.every(k=>GREEN.includes(k)))ym.push('緑一色');
    if(tiles.every(isTerm))ym.push('清老頭');
    let cm=[],m=[],S=[],K=[],conc=0;
    if(f.t==='std'){
      // 手の内の面子。ロンで刻子が完成したとき（シャンポン待ち）は、その刻子は明刻あつかい
      cm=f.m.map((a,i)=>a.concat(pl.w==='shanpon'&&pl.i===i&&!x.tsumo?1:0));m=cm.concat(open.map(a=>[a[0],a[1],1]));S=m.filter(a=>a[0]==='s');K=m.filter(a=>a[0]==='k');
      conc=K.filter(a=>!a[2]).length;
      const dK=K.filter(a=>isDrag(a[1])).length,wK=K.filter(a=>isWind(a[1])).length;
      if(dK===3)ym.push('大三元');
      if(wK===4)ym.push('大四喜');else if(wK===3&&isWind(f.p))ym.push('小四喜');
      if(conc===4)ym.push('四暗刻');
      if(menzen&&suits.size===1&&!hasS){const su=[...suits][0],base=[3,1,1,1,1,1,1,1,3];let ok=true,ex=0;for(let i=0;i<9;i++){const d=x.c[su*9+i]-base[i];if(d<0)ok=false;ex+=Math.max(0,d);}if(ok&&ex===1)ym.push('九蓮宝燈');}}
    if(x.tenhou)ym.push('天和');if(x.chiihou)ym.push('地和');
    if(ym.length){const [b,lim]=basePts(0,0,ym.length);take({yakuman:ym.length,yaku:ym.map(n=>[n,'役満']),han:0,fu:0,base:b,lim});return;}
    const y=[];const add=(n,h)=>{if(h>0)y.push([n,h]);};
    if(menzen){if(x.dbl)add('ダブルリーチ',2);else if(x.riichi)add('リーチ',1);if(x.ipp)add('一発',1);if(x.tsumo)add('ツモ',1);}
    if(x.haitei)add('海底',1);if(x.houtei)add('河底',1);
    if(noYao)add('断么九',1);
    if(suits.size===1&&!hasS)add('清一色',ks(6,5));else if(suits.size===1&&hasS)add('混一色',ks(3,2));
    if(allYao&&hasS&&f.t!=='koku')add('混老頭',2);
    if(f.t==='chii')add('七対子',2);
    let pinfu=false;
    if(f.t==='std'){const p=f.p;
      // 平和：鳴かず、順子だけ、雀頭が役牌でない、両面待ち
      if(menzen&&S.length===4&&!yak(p)&&pl.w==='ryanmen'){pinfu=true;add('平和',1);}
      if(menzen){const ss=cm.filter(a=>a[0]==='s').map(a=>a[1]).sort((a,b)=>a-b);let dup=0;for(let i=0;i+1<ss.length;){if(ss[i]===ss[i+1]){dup++;i+=2;}else i++;}
        if(dup>=2)add('二盃口',3);else if(dup===1)add('一盃口',1);}
      for(let v=0;v<7;v++)if([0,1,2].every(su=>S.some(a=>a[1]===su*9+v))){add('三色同順',ks(2,1));break;}
      for(let su=0;su<3;su++)if([0,3,6].every(v=>S.some(a=>a[1]===su*9+v))){add('一気通貫',ks(2,1));break;}
      for(let v=0;v<9;v++)if([0,1,2].every(su=>K.some(a=>a[1]===su*9+v))){add('三色同刻',2);break;}
      if(K.length===4)add('対々和',2);
      if(conc===3)add('三暗刻',2);
      if(K.filter(a=>isDrag(a[1])).length===2&&isDrag(p))add('小三元',2);
      if(S.length&&!allYao){const has=a=>a[0]==='k'?isYao(a[1]):(isTerm(a[1])||isTerm(a[1]+2));
        if(m.every(has)&&isYao(p)){if(hasS)add('混全帯么九',ks(2,1));else add('純全帯么九',ks(3,2));}}
      K.forEach(a=>{if(isDrag(a[1]))add('役牌 '+HON[a[1]-27],1);if(a[1]===x.bakaze)add('場風 '+HON[a[1]-27],1);if(a[1]===x.jikaze)add('自風 '+HON[a[1]-27],1);});}
    let han=y.reduce((s,a)=>s+a[1],0);if(!han)return;
    const d=tiles.filter(k=>k===x.dora).length;if(d){add('ドラ',d);han+=d;}
    // 符
    let fu;
    if(f.t==='chii')fu=25;
    else if(pinfu)fu=x.tsumo?20:30;
    else{fu=20;if(menzen&&!x.tsumo)fu+=10;if(x.tsumo)fu+=2;
      K.forEach(a=>{const yo=isYao(a[1]);fu+=a[2]?(yo?4:2):(yo?8:4);});
      if(isDrag(f.p))fu+=2;if(f.p===x.bakaze)fu+=2;if(f.p===x.jikaze)fu+=2;
      if(['kanchan','penchan','tanki'].includes(pl.w))fu+=2;
      fu=Math.ceil(fu/10)*10;if(fu<30)fu=30;}
    const [b,lim]=basePts(han,fu,0);
    take({yakuman:0,yaku:y,han,fu,base:b,lim});});});
  return best;}

/* ---------- CPU：向聴数と受け入れ ---------- */
// M：作る面子の数、P：雀頭がいるか。テンパイが0、アガりが−1
function shStd(c,M,P){let best=99;
  const rec=(i,m,t,p)=>{if(best<=-1)return;while(i<NK&&!c[i])i++;if(i===NK){const tt=Math.min(t,M-m);best=Math.min(best,P?2*M-2*m-tt-p:2*M-1-2*m-tt);return;}
    if(m<M){if(c[i]>=3){c[i]-=3;rec(i,m+1,t,p);c[i]+=3;}if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;rec(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;}}
    if(P&&!p&&c[i]>=2){c[i]-=2;rec(i,m,t,1);c[i]+=2;}
    if(m+t<M){if(c[i]>=2){c[i]-=2;rec(i,m,t+1,p);c[i]+=2;}
      if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;rec(i,m,t+1,p);c[i]++;c[i+1]++;}
      if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;rec(i,m,t+1,p);c[i]++;c[i+2]++;}}
    c[i]--;rec(i,m,t,p);c[i]++;};
  rec(0,0,0,0);return best;}
function shChii(c){let pr=0,kd=0;for(let k=0;k<NK;k++){if(c[k])kd++;if(c[k]>=2)pr++;}return 6-Math.min(7,pr)+Math.max(0,7-kd);}
function shKoku(c){let d=0,pr=0;for(let k=0;k<NK;k++)if(c[k]&&isYao(k)){d++;if(c[k]>=2)pr=1;}return 13-d-pr;}
const shanten=(c,nOpen)=>nOpen?shStd(c,4-nOpen,true):Math.min(shStd(c,4,true),shChii(c),shKoku(c));

/* ---------- 部屋主の進行 ---------- */
// phase: lobby → play（R：いまの局）→ end
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('dkb-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('dkb-tok',TOK);}catch(e){}}
let NAME=store.get('dkb-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const CPUN=['CPU いちご','CPU ゆず','CPU すだち'];
const CPU_T=650,AUTO_T=700,RON_T=20000,CALL_T=15000;
function hostInit(){H={phase:'lobby',players:[],hostId:null,lenSel:'2',nakiSel:'1',cnt:null,honba:0,seats:[],R:null,games:0,result:null,timer:null,sticks:0,kyoku:0,dealer:0,hist:[]};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true});return id;}
const seatOf=pid=>pid?H.seats.findIndex(s=>s.pid===pid):-1; // 観戦者（pid なし）は席なし
const bot=s=>{const S=H.seats[s];if(S.cpu)return true;const P=H.players.find(p=>p.id===S.pid);return !(P&&P.online);}; // CPU か、抜けた人（CPUが代わりに打つ）
const jikaze=s=>27+((s-H.dealer+4)%4);
const bakaze=()=>27+Math.floor(H.kyoku/4);
const setRule=()=>{RULE.naki=H.nakiSel==='1';};
function startGame(){absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;setRule();
  const hum=shuffle(H.players.slice(0,4));let ci=0;
  H.seats=shuffle([0,1,2,3].map(i=>hum[i]?{pid:hum[i].id,cpu:false}:{pid:null,cpu:true,name:CPUN[ci++]}));
  H.cnt=genCounts();CNT=H.cnt;
  H.seats.forEach(s=>{s.pts=START;});H.kyoku=0;H.dealer=0;H.sticks=0;H.honba=0;H.result=null;H.hist=[];H.phase='play';startHand();}
function startHand(){CNT=H.cnt;const all=[];for(let k=0;k<NK;k++)for(let i=0;i<H.cnt[k];i++)all.push(k);const wall=shuffle(all);
  const dead=wall.splice(0,14);
  H.R={wall,doraInd:dead[0],hands:[[],[],[],[]],melds:[[],[],[],[]],disc:[[],[],[],[]],riichi:[null,null,null,null],ipp:[0,0,0,0],first:[1,1,1,1],furiT:[0,0,0,0],furiR:[0,0,0,0],
    drawn:null,turn:H.dealer,phase:'turn',ron:null,call:null,ann:{id:H.kyoku*1000+(H.annBase=(H.annBase||0)+1),s:-1,t:''},res:null,pending:null,last:null};
  for(let r=0;r<HSZ();r++)for(let s=0;s<4;s++)H.R.hands[(H.dealer+s)%4].push(wall.pop());
  draw(H.dealer);}
const later=(ms,fn)=>{H.timer={at:Date.now()+ms,fn};};
const nOpen=s=>H.R.melds[s].length;
const openOf=s=>H.R.melds[s].map(m=>[m.t,m.k]);
function draw(s){const R=H.R;if(!R.wall.length){ryukyoku();return;}
  const k=R.wall.pop();R.hands[s].push(k);R.drawn=k;R.turn=s;R.phase='turn';
  if(bot(s))later(CPU_T,()=>cpuTurn(s));
  else if(R.riichi[s]&&!canTsumo(s))later(AUTO_T,()=>doDiscard(s,R.drawn,false,true));}

function resetNet(){
  CHAT.list=[];CHAT.unread=0;
  try{if(NET.conn)NET.conn.close();}catch(e){}
  NET.conns.forEach(c=>{try{c.close();}catch(e){}});

  Object.assign(NET,{role:null,peer:null,conn:null,conns:[],code:null,status:'',solo:false});H=null;V=null;MYID=null;LOC.riichi=false;
}
function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください';render();return true;}return false;}
function soloRoom(){resetNet();NET.role='host';NET.solo=true;hostInit();H.hostId=addPlayer(TOK,NAME);push();}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });
  push();
}
function joinRoom(code,want){
  code=clean(code,8).toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';render();return;}
  if(noPeer())return;
  resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m.t==='chathist'&&Array.isArray(m.list)){CHAT.list=m.list.map(cleanMsg).filter(Boolean).slice(-100);renderChat();return;}
      if(m.t==='view'&&m.v&&m.v.ver!==VER){V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('dkb-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}

    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    <div class="sub">4人で遊びます。足りない人数はCPUが入ります。</div>
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>${rulesHTML(true)}`;}
function settingsHTML(host){const dis=host?'':'disabled',o=(v,cur,l)=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  return `<div class="grid2"><div><label class="f" for="lenSel">長さ</label><select id="lenSel" ${dis}>${o('2',V.lenSel,'半荘（東場と南場、8局〜）')}${o('1',V.lenSel,'東風（東場だけ、4局〜）')}</select></div>
    <div><label class="f" for="nakiSel">鳴き</label><select id="nakiSel" ${dis}>${o('1',V.nakiSel,'あり（ポン・チー）')}${o('0',V.nakiSel,'なし（ロンとリーチだけ）')}</select></div></div>
    <div class="sub">牌の枚数は、はじめるときにこっそり決まります（種類ごとに0〜8枚）。</div>`;}
function vLobby(){const host=amHost(),n=V.players.length;
  if(NET.solo)return `<div class="card stack"><h2>ひとりで遊ぶ（CPU 3人と）</h2>${settingsHTML(true)}<button class="btn primary wide" data-act="start">はじめる</button></div>${rulesHTML(false)}`;
  return `<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code||'')}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>
  <div class="card stack"><h2>参加者 ${n}/4人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}</h2>
    <ul class="plist">${V.players.map(p=>`<li class="${p.online?'':'off'}">${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}</li>`).join('')}${Array.from({length:4-n},()=>'<li class="off">CPU</li>').join('')}</ul>
    ${!isPlayer()?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=4?'満員（4人）のため観戦しています。':'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">はじめる${n<4?`（CPU ${4-n}人）`:''}</button>`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>${rulesHTML(false)}`;}
// 局の名前：春1局 など
const roundName=g=>`<span class="s${Math.floor(g.kyoku/4)}">${WIND[Math.floor(g.kyoku/4)]}</span>${g.kyoku%4+1}局${g.honba?`<small style="font-size:.7em;margin-left:4px">${g.honba}本場</small>`:''}`;
function seatHTML(g,s,pos){const S=g.seats[s],me=s===g.me;
  const disc=S.disc.map((d,i)=>tileHTML(d[0],'xs',(d[1]?'rot ':'')+(d[2]?'tg ':'')+(d[3]?'taken ':'')+(g.last&&g.last.s===s&&g.last.i===i&&g.phase!=='res'?'last':''))).join('');
  // 手牌（裏）と鳴いた牌も、その人のほうを向く。左右の人は、手牌が外側・捨て牌が内側に縦にならぶ
  const backs=me?'':`<div class="backs" aria-label="手牌${S.n}枚${S.melds.length?'・鳴き'+S.melds.length:''}">${Array.from({length:Math.min(S.n,14)},()=>tileHTML(null,'xs')).join('')}${S.melds.map(m=>`<span class="ml">${tilesHTML(m,'xs')}</span>`).join('')}</div>`;
  const river=`<div class="rwrap"><div class="river" aria-label="${esc(S.name)}の捨て牌">${disc}</div></div>`,stick=`<span class="stick${S.riichi?'':' off'}" aria-hidden="true"></span>`;
  const body=pos==='left'?`${stick}<div class="lr">${backs}${river}</div>`:pos==='right'?`${stick}<div class="lr">${river}${backs}</div>`:`${backs}${stick}${river}`;
  return `<div class="seat ${pos}${g.turn===s&&g.phase!=='res'?' turn':''}${S.riichi?' rcs':''}"><div class="nm"><span>${esc(S.name)}${me?'（あなた）':''}</span><span class="w s${S.w}">${WIND[S.w]}</span>${S.w===0?'<span class="oya">親</span>':''}${S.riichi?'<span class="rc">リーチ</span>':''}<span class="pt">${S.pts}</span>${S.online?'':'<span class="sub">（CPUが代打ち）</span>'}</div>
    ${body}</div>`;}
function vPlay(){const g=V.g;if(!g)return '';const spec=g.me<0,me=g.me>=0?g.me:(g.wv?g.wv.s:0);
  const rel=d=>(me+d)%4;
  const bar=`<div class="tbar"><span class="rd">${roundName(g)}</span>${g.sticks?`<span>リーチ棒 ${g.sticks*STICK}点</span>`:''}
    <span class="dr" title="ドラ表示牌の次の牌がドラ">ドラ ${tileHTML(doraOf(g.doraInd),'sm','dora')}<span class="small">（表示牌 ${tileHTML(g.doraInd,'xs')}）</span></span><button class="btn" data-act="dbl" aria-pressed="${DBL}" title="捨てるときの押し方">${DBL?'2回押し':'1回押し'}</button><button class="btn" data-act="cnt">見えた牌</button><button class="btn" data-act="yaku">役を見る</button></div>`;
  const mid=`<div class="mid" aria-label="山の残り${g.wallN}枚"><span class="vt">山の残り<b>${g.wallN}</b></span><div class="full"><div class="rd">${roundName(g)}</div><div>山の残り <b>${g.wallN}</b>枚</div>${g.sticks?`<div>リーチ棒 ${g.sticks*STICK}点</div>`:''}<div class="dr">ドラ ${tileHTML(doraOf(g.doraInd),'md')}</div><div class="small">鳴き${g.naki?'あり':'なし'}</div></div></div>`;
  let mine='';
  if(!spec){const a=g.act||{},myTurn=g.turn===me&&g.phase==='turn',lock=a.locked;
    const can=k=>myTurn&&(!lock||k===g.drawn)&&(!LOC.riichi||a.riichi.includes(k));
    const tb=(k,dr,i)=>`<button type="button" class="tb${can(k)?'':' no'}${LOC.sel===String(i)?' sel':''}" data-i="${i}" data-act="disc" data-k="${k}" data-tg="${dr?1:0}" ${can(k)?'':'tabindex="-1" aria-disabled="true"'} aria-label="${tname(k)}を捨てる"><span class="mk">${myTurn&&!lock&&g.tenpaiBy.includes(k)?'★':''}</span>${tileHTML(k,'',dr?'':'')}</button>`;
    const myM=g.seats[me].melds;
    mine=`<div class="hand h14">${g.hand.map((k,i)=>tb(k,false,i)).join('')}${g.drawn!=null?`<span class="gap"></span>${tb(g.drawn,true,'d')}`:''}${myM.length?`<span class="gap"></span>${myM.map(m=>`<span class="ml">${tilesHTML(m,'sm')}</span>`).join('')}`:''}</div>`;
    const btns=[];
    if(a.ron)btns.push(`<button class="btn red" data-act="ron">ロン（${tname(a.ron.k)}）</button><button class="btn" data-act="skip">見送る</button>`);
    else if(a.call){if(a.call.pon)btns.push(`<button class="btn primary" data-act="callp">ポン ${tilesHTML([a.call.k,a.call.k,a.call.k],'xs')}</button>`);
      a.call.chi.forEach(ab=>btns.push(`<button class="btn primary" data-act="callc" data-a="${ab[0]}" data-b="${ab[1]}">チー ${tilesHTML([a.call.k].concat(ab).sort((x,y)=>x-y),'xs')}</button>`));
      btns.push('<button class="btn" data-act="calls">見送る</button>');}
    else if(myTurn){if(a.tsumo)btns.push('<button class="btn red" data-act="tsumo">ツモ</button>');
      if(a.riichi.length&&!LOC.riichi)btns.push('<button class="btn primary" data-act="riichi">リーチ</button>');
      if(LOC.riichi)btns.push('<button class="btn" data-act="cancelr">リーチをやめる</button>');}
    const selMsg=myTurn&&DBL&&LOC.sel?'もう一度押すと、その牌を捨てます':'';
    const msg=selMsg||a.ron?selMsg||`${esc(g.seats[a.ron.from].name)}の${tname(a.ron.k)}でロンできます`:a.call?`${esc(g.seats[a.call.from].name)}の${tname(a.call.k)}を鳴けます`:myTurn&&g.drawn==null&&!lock?'鳴いたので、1枚捨ててください':myTurn?(lock?(a.tsumo?'ツモれます。見送るときは捨てる牌を押してください':'リーチ中：引いた牌を自動で捨てます'):LOC.riichi?'リーチ：★の牌から捨てる牌を選んでください':'あなたの番：捨てる牌を押してください'):''; // ほかの人がロン・鳴きを考えていることは見せない（手がばれるので）
    const info=g.waits.length?`<span>待ち</span>${tilesHTML(g.waits,'xs')}${g.furi?'<span class="fu">フリテン（ロンできません）</span>':''}`:myTurn&&!lock&&g.tenpaiBy.length?'<span>★を捨てるとテンパイ</span>':'';
    mine+=`<div class="msgline">${msg}</div><div class="acts">${btns.join('')}</div><div class="info">${info}</div>`;}
  else{const w=g.wv;
    mine=`<div class="center sub" style="margin-top:10px">観戦中：手牌を見る人を選べます</div><div class="acts">${g.seats.map((S,i)=>`<button class="btn small${w&&w.s===i?' primary':''}" data-act="watchs" data-s="${i}">${esc(S.name)}</button>`).join('')}${w?'<button class="btn small" data-act="watchs" data-s="-1">見ない</button>':''}</div>`+
      (w?`<div class="hand h14">${w.hand.map(k=>tileHTML(k)).join('')}${w.drawn!=null?`<span class="gap"></span>${tileHTML(w.drawn)}`:''}${g.seats[w.s].melds.length?`<span class="gap"></span>${g.seats[w.s].melds.map(m=>`<span class="ml">${tilesHTML(m,'sm')}</span>`).join('')}`:''}</div>
        <div class="info">${w.waits.length?`<span>待ち</span>${tilesHTML(w.waits,'xs')}`:''}</div>`:'');}
  return `${bar}<div class="table">${seatHTML(g,rel(2),'top')}${seatHTML(g,rel(3),'left')}${mid}${seatHTML(g,rel(1),'right')}${seatHTML(g,me,'me')}</div><div class="mybar">${mine}</div>`;}
function resHTML(){const g=V&&V.g;if(!g||g.phase!=='res'||!g.res)return '';const r=g.res,nm=s=>esc(g.seats[s].name);
  const deltas=`<table class="t" style="margin-top:10px">${[0,1,2,3].map(s=>`<tr class="${s===g.me?'me':''}"><td>${nm(s)}</td><td class="num dl ${r.delta[s]>0?'p':r.delta[s]<0?'m':''}">${r.delta[s]>0?'+':''}${r.delta[s]}</td><td class="num">${g.seats[s].pts}</td></tr>`).join('')}</table>`;
  const next=amHost()?`<button class="btn primary wide" data-act="next" style="margin-top:12px">次へ</button>`:'<div class="wait" style="margin-top:12px;justify-content:center"><span class="dots">部屋主が進めるのを待っています</span></div>';
  if(r.type==='draw')return `<div class="res" role="dialog" aria-label="流局"><div class="box"><h2>流局</h2><div class="center sub">山がなくなりました。ノーテンの人がテンパイの人に払います</div>
    ${[0,1,2,3].map(s=>`<div style="margin-top:8px"><b>${nm(s)}</b> ${r.ten.includes(s)?'<span style="color:var(--ok)">テンパイ</span>':'<span class="sub">ノーテン</span>'}${r.hands[s]?`<div class="hd" style="justify-content:flex-start">${tilesHTML(r.hands[s],'sm')}${((r.melds||[])[s]||[]).map(m=>`<span style="display:inline-flex;gap:2px;margin-left:8px">${tilesHTML(m,'xs')}</span>`).join('')}</div>`:''}</div>`).join('')}
    ${deltas}${next}</div></div>`;
  return `<div class="res" role="dialog" aria-label="アガり"><div class="box"><h2>${nm(r.w)} の${r.tsumo?'ツモ':'ロン'}！</h2>${r.tsumo?'':`<div class="center sub">${nm(r.from)}の捨て牌で</div>`}
    <div class="hd">${(()=>{let done=false;return r.hand.map(k=>{const w=!done&&k===r.win;if(w)done=true;return tileHTML(k,'md',w?'win':'');}).join('');})()}${(r.melds||[]).map(m=>`<span style="display:inline-flex;gap:2px;margin-left:8px">${tilesHTML(m,'sm')}</span>`).join('')}</div>
    <div class="center sub" style="display:flex;justify-content:center;align-items:center;gap:6px">ドラ ${tileHTML(doraOf(r.doraInd),'xs')}</div>
    <ul class="yk">${r.yaku.map(([n,h])=>`<li><span>${esc(n)}</span><b>${typeof h==='number'?h+'翻':h}</b></li>`).join('')}</ul>
    <div class="big">${r.yakuman?r.lim:`${r.lim?'':r.fu+'符'}${r.han}翻${r.lim?' '+r.lim:''}`} ${r.pts}点</div>
    ${r.oya?'<div class="center sub">親のアガり</div>':''}
    ${r.tsumo?`<div class="center sub">${r.oya?`ツモ：子の3人が ${r.payK}点ずつ`:`ツモ：親が ${r.payO}点、子が ${r.payK}点ずつ`}</div>`:''}${r.honba?`<div class="center sub">${r.honba}本場（${r.tsumo?`1人${r.honba*100}点`:`${r.honba*HONBA}点`}こみ）</div>`:''}${r.sticks?`<div class="center sub">場に出ていたリーチ棒 ${r.sticks*STICK}点ももらえます</div>`:''}
    ${deltas}${next}</div></div>`;}
function vEnd(){const R=V.result;if(!R)return '';
  return `<div class="card"><div class="big">${esc(R.rows[0].name)} の勝ち！</div>
    <table class="t" style="margin-top:10px"><tr><th>順位</th><th>名前</th><th style="text-align:right">点数</th></tr>${R.rows.map((r,i)=>`<tr class="${r.pid&&r.pid===MYID?'me':''}"><td>${i+1}位</td><td>${esc(r.name)}</td><td class="num">${r.pts}</td></tr>`).join('')}</table></div>
  ${R.cnt?`<div class="card"><h2>答え合わせ：この半荘の牌の枚数</h2><p class="sub" style="margin-top:0"><b style="color:var(--gold)">金色</b>は6枚以上、<b style="color:var(--warn)">赤</b>は2枚以下、うすいのは0枚。${SEEN.key?'「記録」は、あなたから見えた一番多い枚数です。':''}</p>${cntAnsHTML(R.cnt)}</div>`:''}
  <div class="card stack">${amHost()?`${NET.solo?'':settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次を始めるのを待っています</span></div>'}</div>`;}
let LASTKEY='';
function render(){
  document.body.classList.toggle('playing',!!(V&&V.phase==='play'));
  DORAK=V&&V.phase==='play'&&V.g?doraOf(V.g.doraInd):null;
  topinfo();renderChat();let html;
  if(!V)html=vHome();
  else{const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+({lobby:vLobby,play:vPlay,end:vEnd}[V.phase]||vEnd)();}
  const key=html+'|'+(V?JSON.stringify(V.players):'');
  if(key!==LASTKEY){const ae=document.activeElement,aid=ae&&ae.id;$('#app').innerHTML=html;LASTKEY=key;
    if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}applyHL();}
  const rv=V&&V.phase==='play'?(resHTML()||(LOC.yaku?`<div class="res ymodal" role="dialog" aria-label="役の一覧" data-act="yakuclose"><div class="box" data-stop="1"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:22px">役の一覧<span class="sub" style="font-size:13px;margin-left:8px">${V.g?'鳴き'+(V.g.naki?'あり':'なし'):''}</span></h2><button class="btn small" data-act="yakuclose">閉じる</button></div>${yakuListHTML()}</div></div>`:
    LOC.cnt?`<div class="res ymodal" role="dialog" aria-label="見えた牌の記録" data-act="cntclose"><div class="box" data-stop="1"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:22px">見えた牌の記録</h2><button class="btn small" data-act="cntclose">閉じる</button></div>${cntHTML()}</div></div>`:'')):'';const rb=$('#resv');if(rb.dataset.k!==rv){rb.innerHTML=rv;rb.dataset.k=rv;}
  if(V&&V.g&&V.g.phase==='res'){const an=$('#annv');if(an&&an.innerHTML){an.innerHTML='';clearTimeout(ANNT);}}
}
let HL=null;
function applyHL(){document.querySelectorAll('.tl.hl').forEach(e=>e.classList.remove('hl'));if(HL==null)return;document.querySelectorAll(`#app .tl[data-k="${HL}"]`).forEach(e=>e.classList.add('hl'));}
function setHL(k){if(k===HL)return;HL=k;applyHL();}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('#app .tl[data-k]');setHL(t?+t.dataset.k:null);});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('#app .tl[data-k]');setHL(t?+t.dataset.k:null);});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('dkb-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='solo'){saveName();soloRoom();}
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(!V||V.phase!=='play'||confirm('ゲームをやめますか？'+(amHost()&&!NET.solo?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='disc'){if(b.classList.contains('no'))return;const id=b.dataset.i;
    if(DBL&&LOC.sel!==id){LOC.sel=id;render();return;}
    LOC.sel=null;send({t:'discard',k:+b.dataset.k,tg:b.dataset.tg==='1',riichi:LOC.riichi});LOC.riichi=false;}
  else if(a==='dbl'){DBL=!DBL;store.set('dkb-dbl',DBL?'1':'0');LOC.sel=null;render();toast(DBL?'2回押すと捨てます':'1回押すと捨てます');}
  else if(a==='watchs'){const w=+b.dataset.s;if(NET.conn&&NET.conn.open)sendTo(NET.conn,{t:'watchseat',s:w});}
  else if(a==='riichi'){LOC.riichi=true;render();}
  else if(a==='callp')send({t:'call',v:'pon'});
  else if(a==='callc')send({t:'call',v:'chi',ab:[+b.dataset.a,+b.dataset.b]});
  else if(a==='calls')send({t:'call',v:'skip'});
  else if(a==='yaku'){LOC.yaku=true;render();}
  else if(a==='cnt'){LOC.cnt=true;render();}
  else if(a==='cntclose'){if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;LOC.cnt=false;render();}
  else if(a==='yakuclose'){if(e.target.closest('[data-stop]')&&!e.target.closest('button'))return;LOC.yaku=false;render();}
  else if(a==='cancelr'){LOC.riichi=false;render();}
  else if(['tsumo','ron','skip','next','start','lobby'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(['lenSel','nakiSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(LOC.yaku||LOC.cnt)){LOC.yaku=false;LOC.cnt=false;render();return;}if(e.key!=='Enter'||e.isComposing)return;if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}});
(function(){let j=null;try{j=sessionStorage.getItem('dkb-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&V&&V.phase==='play'&&!NET.solo){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
