<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つぎはぎすごろく</title>
<meta name="description" content="みんなのbetでルーレットを作り、ピースがつながっていく道を進むすごろく">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 机の上のボードゲーム：コルクの机に、色のついたピースをはめていく */
:root{
  --bg:#efe4d0; --surface:#fffaf0; --ink:#2b2420; --muted:#76695c; --rule:#e2d4bc;
  --p:#d2543a; --p-soft:#fbe3da; --accent:#2b2420; --accent-ink:#fffaf0; --ok:#2f8f4e; --warn:#c0412c;
  --cork:#c9a47a; --shadow:0 2px 0 rgba(80,50,20,.08);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1814; --surface:#26211b; --ink:#f1e8da; --muted:#b3a593; --rule:#3a3128; --p:#ff8a6a; --p-soft:#43271e; --accent:#f1e8da; --accent-ink:#1c1814; --cork:#5a4632; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{--bg:#1c1814; --surface:#26211b; --ink:#f1e8da; --muted:#b3a593; --rule:#3a3128; --p:#ff8a6a; --p-soft:#43271e; --accent:#f1e8da; --accent-ink:#1c1814; --cork:#5a4632; --shadow:0 2px 0 rgba(0,0,0,.3);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
body.playing .wrap{max-width:1240px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo svg{width:42px;height:42px;flex:none}
.logo h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1.15}
.logo h1 span{color:var(--p)}
.logo small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.hot{background:var(--p);color:#fff;border-color:var(--p)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;background:var(--bg)}
.plist li .dot,.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.plist li.off{opacity:.55}.plist li.me{border-color:var(--ink)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.win{font-size:22px;font-weight:800;text-align:center}
/* ゲーム画面：左に盤、右にルーレットと操作 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}}
/* スマホの bet 中は、盤を上に貼りつけて、数字を押すと行き先が見えるように */
@media (max-width:900px){body.betting .game>div:first-child{position:sticky;top:0;z-index:5;padding-top:4px;background:var(--bg)}body.betting .game .legend{display:none}}
.boardbox{position:relative;background:var(--cork);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),var(--shadow)}
#bd{display:block;width:100%;touch-action:manipulation}
.bhint{position:absolute;left:10px;top:10px;background:rgba(43,36,32,.85);color:#fffaf0;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;pointer-events:none}
.bhint[hidden]{display:none}
.bzoom{position:absolute;right:10px;bottom:10px;min-height:32px;padding:4px 12px;font-size:13px;background:rgba(255,250,240,.92)}
.side>.card{margin-bottom:10px}
.phase{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.phase .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:22px}
.tbar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px}.tbar i{display:block;height:100%;background:var(--p);transition:width .2s linear}
#wheel{display:block;width:100%;max-width:300px;aspect-ratio:1;margin:4px auto 0}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.nums button{min-height:42px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-weight:800;font-size:17px;cursor:pointer;padding:0}
.nums button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mypts{display:flex;align-items:baseline;gap:6px;font-weight:800;font-size:15px;padding:8px 12px;border-radius:12px;background:var(--bg)}
.mypts b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mypts span{margin-left:auto;font-size:13px;color:var(--muted,#7a7066);font-weight:700}
.tip{position:fixed;z-index:60;max-width:240px;background:rgba(43,36,32,.94);color:#fffaf0;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.5;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip[hidden]{display:none}
.tip b{font-size:14px}
.tip .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.betrow{display:flex;align-items:center;gap:8px}
.betrow .v{font-size:24px;font-weight:800;min-width:2.4em;text-align:center;font-variant-numeric:tabular-nums}
.betrow input[type=range]{flex:1;accent-color:var(--p)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.item{display:flex;flex-direction:column;align-items:flex-start;border:1.5px solid var(--rule);background:var(--bg);border-radius:12px;padding:6px 10px;text-align:left;cursor:pointer;min-width:0;max-width:100%}
.item b{font-size:14px}.item span{font-size:11px;color:var(--muted);line-height:1.4}
.item .k{font-size:10px;font-weight:800;border-radius:6px;padding:0 6px;color:#fff;margin-bottom:2px}
.k.r{background:#2f7fd8}.k.p{background:#2f9a52}.k.s{background:#8a55c9}
.item:disabled{opacity:.5;cursor:default}
.pls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pls li{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:8px}
.pls li.turn{background:var(--p-soft);font-weight:800}
.pls li .pt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800}
.pls li .lp{font-size:12px;color:var(--muted)}
.pls li .fx{font-size:11px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;max-height:180px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
.log li{color:var(--muted)}.log li b{color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:440px;width:100%;max-height:90vh;overflow-y:auto;margin:0}
.opt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt button{border:1.5px solid var(--rule);background:var(--bg);border-radius:12px;padding:8px;cursor:pointer;text-align:center;min-height:44px;line-height:1.35}
.opt button b{display:block;font-size:14px}.opt button span{font-size:11px;color:var(--muted)}
.opt button[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.shopl{display:flex;flex-direction:column;gap:6px}
.shopl .it{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:12px;padding:8px 10px;background:var(--bg)}
.shopl .it.sold{opacity:.5}
.shopl .it div{flex:1;min-width:0;line-height:1.4}.shopl .it b{font-size:14px}.shopl .it span{display:block;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:3px}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:50}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M4 12h10a4 4 0 1 1 6 0h8v10a4 4 0 1 0 0 6v8H4z" fill="#d2543a"/><path d="M28 12h10v24H28v-8a4 4 0 1 0 0-6z" fill="#2f7fd8"/><circle cx="16" cy="25" r="3" fill="#fffaf0"/></svg>
      <div><h1>つぎはぎ<span>すごろく</span></h1><small>みんなのbetでルーレットを作る ・ v11</small></div></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalc"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* つぎはぎすごろく：部屋主が盤とルーレットを計算して配る */
'use strict';
const PREFIX='sugoroku-room-';
const VER=11;
const MAXP=6;
const COLORS=['#d2543a','#2f7fd8','#e3a21a','#8a55c9','#2f9a52','#e0628f'];
const CPUN=['ころすけ','たまえ','ゲン','ミナ','すごろく丸','ハル'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('sugo-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('sugo-tok',TOK);}catch(e){}}
let NAME=store.get('sugo-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const SN={length:0}; // 使わない（ほかのゲームと同じ通信の部品のため）

/* ---------- マスとアイテム ---------- */
// マス：[名前, 色, 説明]
const SQ={start:['スタート','#2b2420','通るたびに +5P'],goal:['ゴール','#2b2420','着いたら勝ち'],'':['ふつう','#f6ecd8','+2〜4P もらえる'],minus:['とられる','#c0412c','ポイントをとられる'],
  shop:['お店','#e3a21a','アイテムを買える'],fwd:['すすむ','#2f7fd8','2マスすすむ'],back:['もどる','#8a55c9','3マスもどる'],rest:['ひとやすみ','#7a7066','次の番は休み'],
  bonus:['大当たり','#d9a520','+10P（めったに出ない）'],chance:['チャンス','#e0628f','アイテムを1つもらえる'],toll:['通行料','#5a4a3a','止まった人が、作った人に 3P はらう'],gain:['おすそわけ','#4aa08a','通るだけで、通った人に +1P・作った人に +2P']};
const RAND=[['',7],['minus',2.2],['shop',1.2],['fwd',1],['back',1],['rest',.7],['bonus',.1],['chance',.9]];
const ROUTE={normal:['ふつうの道','いろいろなマス'],thorn:['いばらの近道','大きく近道するほど、悪いマスが多い'],bonus:['ボーナスの遠回り','遠回りするほど、良いマスが多い']};
const BADW=[['minus',3],['back',1.4],['rest',1.2]],GOODW=[['',3],['chance',1.6],['shop',.8],['fwd',.6],['bonus',.25]];
const PEFF={toll:['通行料','止まった人が、あなたに 3P はらう（相手から取る）'],gain:['おすそわけ','止まらなくても、通るたびに通った人 +1P・あなた +2P（人を呼ぶ道に）'],shop:['お店','止まった人が買い物できる（お店が増える）']};
// アイテム：[名前, 種類(r ルーレット / p ピース / s コマ), 値段, 説明, 相手を選ぶか]
const ITEMS={
  dbl:['倍がけ札','r',4,'このラウンド、自分の区切りが2倍の広さになる',0],
  erase:['消しゴム','r',5,'このラウンド、だれかの区切りをルーレットから消す',1],
  steal:['乗っ取り','r',6,'このラウンド、だれかの区切りを自分の数字に変える',1],
  piece:['白紙のピース','p',6,'道のとなりの空きマスにはめると、そこから分かれ道が勝手にのびる',0],
  swap:['付け替えピース','p',4,'分かれ道ひとつのマスを、ぜんぶ作り直す',0],
  charm:['お守り','s',3,'次に悪いマス（とられる・もどる・休み・通行料）に止まっても平気',0],
  boost:['ブースト','s',4,'次に進むとき +3マス',0],
  pin:['ピタリ札','s',8,'次の番、ルーレットを回さず自分のbetした数字だけ進む',0],
  push:['おしもどし','s',4,'だれか1人を2マスもどす',1]};
const MAXN=8,INV=3,START_P=10,SALARY=5,INCOME=1;
const wpick=L=>{const t=L.reduce((a,x)=>a+x[1],0);let r=Math.random()*t;for(const [k,w] of L){r-=w;if(r<=0)return k;}return L[0][0];};

/* ---------- 盤：六角形のタイル。1枚1マス ---------- */
// 盤の形：loop（輪を周回）／map（スタートからゴールへ、道がのびていく）
const HR=34,SQ3=Math.sqrt(3),VIS=6;
const HD=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hid=(q,r)=>q+','+r;
const hxy=(q,r)=>[HR*SQ3*(q+r/2),HR*1.5*r];
const hdist=(q1,r1,q2,r2)=>(Math.abs(q1-q2)+Math.abs(r1-r2)+Math.abs(q1+r1-q2-r2))/2;
const RING=6;
function inRegion(mode,q,r){return hdist(0,0,q,r)<=(mode==='loop'?RING+3:MAPR);}
function regionCells(mode){const out=[];for(let r=-12;r<=12;r++)for(let q=-20;q<=20;q++)if(inRegion(mode,q,r))out.push([q,r]);return out;}
// 輪の六角形：いちばん下のタイルから時計回り
function ringCells(){let q=HD[4][0]*RING,r=HD[4][1]*RING;const L=[];for(let i=0;i<6;i++)for(let j=0;j<RING;j++){L.push([q,r]);q+=HD[i][0];r+=HD[i][1];}
  let k=0;L.forEach(([q,r],i)=>{const y=hxy(q,r)[1],x=hxy(q,r)[0];const b=hxy(...L[k]);if(y>b[1]+.1||Math.abs(y-b[1])<.1&&Math.abs(x)<Math.abs(b[0]))k=i;});
  const R=L.slice(k).concat(L.slice(0,k));
  // 画面で時計回り（下から左へ）になるよう向きをそろえる
  if(hxy(...R[1])[0]>hxy(...R[0])[0])R.reverse(),R.unshift(R.pop());return R;}
const MAPR=8,MAP_S=[-MAPR,MAPR],MAP_G=[MAPR,-MAPR];
function mkNode(q,r,t,extra){const [x,y]=hxy(q,r),id=hid(q,r);H.bver=(H.bver||0)+1;H.nodes[id]=Object.assign({id,q,r,x:Math.round(x),y:Math.round(y),t,next:[],own:-1,mi:-1},extra||{});return H.nodes[id];}
function boardInit(){H.nodes={};H.main=[];H.branches=[];H.vis=-1;

    H.main.forEach((id,i)=>{H.nodes[id].next=[H.main[(i+1)%H.main.length]];});H.MAIN=H.main.length;}
  else{mkNode(MAP_S[0],MAP_S[1],'start',{mi:0});H.main.push(hid(...MAP_S));mkNode(MAP_G[0],MAP_G[1],'goal');H.MAIN=0;}

const nbTiles=(q,r,virt)=>HD.map(([a,b])=>hid(q+a,r+b)).filter(k=>H.nodes[k]||virt&&virt.has(k));

// 地図：道を1枚のばす（ゴールの方へ、少しくねくね）

function progOf(p){let n=H.nodes[p.at],i=n.mi;if(i<0){const b=H.branches.find(x=>x.nodes.includes(p.at));i=b?H.nodes[b.from].mi:0;}return (H.board==='loop'?p.lap*H.MAIN:0)+i;}

// 1マス進む。地図で道の先がまだなければ、ここでのばす
function stepOne(i){const p=H.pl[i];let n=H.nodes[p.at];if(!n.next.length&&H.board==='map')genMainNext();n=H.nodes[p.at];if(!n.next.length)return null;

/* 白紙のピース：道のとなりの空きマスにはめると、そこから分かれ道が勝手にのびて、道の少し先に戻る。

// 近道（saved>0）ほど悪いマス、遠回り（saved<0）ほど良いマス

function hostInit(){H={phase:'lobby',players:[],hostId:null,board:'loop',laps:'2',betT:'15',cpuSel:'auto',inGame:[],pl:[],nodes:{},branches:[],vis:-1,round:0,bets:{},fx:{},log:[],turn:0,order:[],sub:null,endsAt:null,wheel:null,spin:null,choice:null,result:null,wins:{},games:0,seq:0};}

// 白紙のピースを置ける空きマス（持っている人にだけ）
// 形ごとに、本当に道がつなげられるマスだけ（盤が変わったときだけ計算しなおす）
let CANDC={v:-1,c:null};

function candFor(pid){const p=H.pl.find(x=>x.id===pid);if(!p||!p.inv.includes('piece')||!H.main.length)return null;return candAll();}

function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}

const logp=(t)=>{H.log.push(t);if(H.log.length>60)H.log.shift();};

const say=(i,tx,c)=>{if(!H.pl[i])return;H.bub=H.bub||[];H.bub.push({i,tx,c:c||'',id:++H.seq});if(H.bub.length>16)H.bub.shift();};

// ラウンド：ピースを置く → bet（みんな同時）→ ルーレット（みんな同時）→ 移動 → 止まったマス
const TM=s=>H.betT==='inf'?null:Date.now()+s*1000;
function newRound(){H.round++;H.fx={dbl:[],erase:{},steal:{}};H.hold={};H.busy=[];H.ready={};H.choices={};H.shops={};H.mv=null;H.spin=null;H.bets={};

function startBet(){H.phase='bet';H.sub=null;H.bets={};H.ready={};H.pl.forEach(p=>{if(!p.fin)H.bets[p.id]={n:p.num,b:0,ok:false};});

function startMove(){const sp=H.spin;H.mv={};
  H.pl.forEach((p,i)=>{const r=sp.res[i];if(!r){if(!p.fin)H.mv[i]={left:0,chain:0,landed:true};return;}H.mv[i]={left:r.n+r.add,chain:0,landed:false,moved:true};

function finish(i){const p=H.pl[i];p.fin=1;logp(`🏁 <b>${esc(p.name)}</b> がゴール！ このラウンドでゴールした人は同着`);say(i,'ゴール！','g');}

function moveTick(){const M=H.mv;if(!M)return;let moving=false;

    const n=H.nodes[p.at];if(n.next.length>1&&!p.route){if(p.cpu)p.route=pick(n.next);else{H.choices[i]=forkOpts(i);if(!H.choiceEnds&&H.betT!=='inf')H.choiceEnds=Date.now()+12000;return;}}

  resolveClash();

// 同じマスに止まったら：もともといた人 → bet が多い人 の順でそのマスに残り、ほかの人は空いているマスまで1マスずつもどる

      L.slice(1).forEach(j=>{const p=H.pl[j];if(p.trail.length<2)return;back(j,1);if(M[j])M[j].bumped=true;logp(`<b>${esc(p.name)}</b> はぶつかって1マスもどった`);say(j,'ぶつかって1マスもどる','m');});});}}
function back(i,k){const p=H.pl[i];for(let s=0;s<k&&p.trail.length>1;s++){p.trail.pop();p.at=p.trail[p.trail.length-1];}}
// 止まったマスの効果。「すすむ」は 'fwd' を返して、もう一度動く
function land(i,chain){const p=H.pl[i];
  const n=H.nodes[p.at],t=n.t,own=n.own;
  const bad=['minus','back','rest','toll'].includes(t)&&!(t==='toll'&&own===i);

  if(t===''){const g=Math.floor(rnd(2,5));p.pts+=g;logp(`<b>${esc(p.name)}</b> +${g}P`);say(i,`+${g}P`,'p');}

  else if(t==='rest'){p.rest=true;logp(`<b>${esc(p.name)}</b> は次のラウンドお休み`);say(i,'次はお休み','m');}

  else if(t==='toll'&&own>=0&&own!==i){const g=Math.min(3,p.pts);p.pts-=g;H.pl[own].pts+=g;logp(`<b>${esc(p.name)}</b> → ${esc(H.pl[own].name)} に通行料 ${g}P`);say(i,`通行料 −${g}P`,'m');say(own,`通行料 +${g}P`,'p');}

function endMove(){H.shops={};H.choices={};H.sub='after';H.endsAt=Date.now()+1200;push();}
function buy(i,k){const p=H.pl[i],it=ITEMS[k],o=H.shops[i];if(!it||!o||!o.includes(k)||p.pts<it[2]||p.inv.length>=INV)return;p.pts-=it[2];p.inv.push(k);H.shops[i]=o.map(x=>x===k?null:x);logp(`<b>${esc(p.name)}</b> は「${it[0]}」を買った`);say(i,`「${it[0]}」を買った`);}

/* アイテムを使う */
function useItem(i,slot,o){const p=H.pl[i],k=p.inv[slot];if(!k)return false;const it=ITEMS[k];o=o||{};

    if(k==='dbl'){if(H.fx.dbl.includes(p.id))return false;H.fx.dbl.push(p.id);}

function cpuBet(i){const p=H.pl[i],b=H.bets[p.id];

  if(p.inv.length&&Math.random()<.5){const k=p.inv.findIndex(x=>['dbl','charm','boost'].includes(x));if(k>=0)useItem(i,k);}

function cpuShop(i){const p=H.pl[i];const L=(H.shops[i]||[]).filter(k=>k&&k!=='piece'&&k!=='swap'&&ITEMS[k][2]<=p.pts-2);if(L.length&&Math.random()<.7)buy(i,pick(L));}
/* 進行のタイマー */
function hostTick(){if(!H||H.phase==='lobby'||H.phase==='end')return;const now=Date.now();

  if(H.endsAt==null||now<H.endsAt)return;H.endsAt=null;
  if(H.phase==='build'){startBet();return;}
  if(H.phase==='bet'){lockBets();return;}
  if(H.sub==='spin'){startMove();return;}
  if(H.sub==='move'){moveTick();return;}
  if(H.sub==='shop'){endMove();return;}

function endGame(){H.phase='end';H.endsAt=null;H.games++;H.mv=null;H.choices={};H.shops={};
  const rows=H.pl.map((p,i)=>({i,id:p.id,name:p.name,col:p.col,cpu:p.cpu,pts:p.pts,lap:p.lap,fin:p.fin,prog:progOf(p)})).sort((a,b)=>(a.fin||99)-(b.fin||99)||b.prog-a.prog||b.pts-a.pts);
  rows.forEach((r,j)=>r.rank=r.fin?1:j+1);rows.filter(r=>r.rank===1&&!r.cpu).forEach(w=>{H.wins[w.id]=(H.wins[w.id]||0)+1;});H.result={rows};absorb();push();}
function act(pid,m){if(!H||!m)return;const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end',i=H.pl.findIndex(p=>p.id===pid),p=H.pl[i];
  switch(m.t){
    case 'board':if(isHost&&setup&&['loop','map'].includes(m.v))H.board=m.v;break;
    case 'laps':if(isHost&&setup&&['1','2','3'].includes(m.v))H.laps=m.v;break;
    case 'betT':if(isHost&&setup&&['10','15','25','inf'].includes(m.v))H.betT=m.v;break;
    case 'cpuSel':if(isHost&&setup&&['auto','0','1','2','3'].includes(m.v))H.cpuSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();return;
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);H.pl=[];}break;
    case 'bet':{if(H.phase!=='bet'||!p||!H.bets[pid])return;const b=H.bets[pid];const n=+m.n,bb=+m.b;if(Number.isInteger(n)&&n>=1&&n<=MAXN)b.n=n;if(Number.isInteger(bb)&&bb>=0)b.b=Math.min(bb,p.pts);b.ok=!!m.ok;buildWheel();
      if(H.pl.every(q=>q.fin||!H.bets[q.id]||H.bets[q.id].ok||q.cpu))H.endsAt=Math.min(H.endsAt==null?Infinity:H.endsAt,Date.now()+400);break;}
    case 'ready':{if(H.phase!=='build'||!p)return;H.ready[pid]=true;if(H.pl.every(q=>q.fin||q.cpu||H.ready[q.id]))H.endsAt=Math.min(H.endsAt==null?Infinity:H.endsAt,Date.now()+300);break;}

    case 'use':{H.busy=(H.busy||[]).filter(x=>x!==pid);if(!p||p.fin)return;const okPhase=H.phase==='bet'||H.phase==='build';if(!okPhase)return;if(!useItem(i,+m.k,m.o))return;break;}

function hostWire(c){

      if(P){NET.conns.forEach(o=>{if(o!==c&&o._pid===P.id)o._pid=null;});c._pid=P.id;P.online=true;if(c._name)P.name=c._name;}
      else if(c._want==='play'&&(H.phase==='lobby'||H.phase==='end')&&H.players.length<MAXP)c._pid=addPlayer(c._tok,c._name);

function resetNet(){

function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');

  hostInit();H.hostId=addPlayer(TOK,NAME);

function joinRoom(code,want){

  });
  render();
}

  <li>盤の形は2つ。<b>輪</b>：輪を決めた周回数まわってスタートに戻った人の勝ち（通るたびに +${SALARY}P）。<b>地図</b>：道はスタートからのびていき、先にゴールに着いた人の勝ち。ラウンドごとに全員 +${INCOME}P。</li>
  <li>bet 中は、選んだ数字で行けるマスが盤に光ります。マスにカーソルをのせる（スマホはタップ）と説明が出ます。<b>同じラウンドでゴールした人は同着</b>です。<b>同じマスには止まれません</b>（スタート・ゴールはのぞく）。もともといた人、次に bet が多かった人がそのマスに残り、ほかの人は空いているマスまでもどります。</li>
  <li>betの時間を「無制限」にすると、全員が決定を押したところで進みます（ルーレットや買い物も時間切れなし）。</li>
  <li><b>お店</b>には、ルーレットに干渉（倍がけ・消しゴム・乗っ取り）、ピースに干渉（白紙のピース・付け替え）、コマに効果（お守り・ブースト・ピタリ・おしもどし）から、1つずつランダムに並びます。</li>
  <li><b>白紙のピース</b>は、道のとなりの空きマスにはめると、そこから分かれ道が勝手にのびて、道の少し先に戻ってきます。<b>大きく近道するほど悪いマスが多く、遠回りになるほど良いマスが多く</b>なります。選べるのはピースの効果（通行料：止まった人から3P／おすそわけ：通るたびに通った人+1P・作った人+2P／お店）だけ。作り始めると残り時間が30秒までのびます（1ラウンド2回まで）。</li>
</ol></details></div>`;}
