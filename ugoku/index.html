<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うごくうちのコ</title>
<meta name="description" content="レイヤーに分けた絵を読み込むと、呼吸したり、まばたきしたり、こっちを見たりして動く">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--surface:#fffdf8;--ink:#23201c;--muted:#6f6a61;--rule:#e2dccf;--p:#23201c;--p-ink:#fffdf8;--hi:#e9b949;--font:"M PLUS Rounded 1c",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--surface:#262421;--ink:#f1ede4;--muted:#a59f94;--rule:#3a3732;--p:#f1ede4;--p-ink:#1b1a18}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.02em}
header small{color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--rule);background:#fff}
.stagebox.trans{background:repeating-conic-gradient(#e9e6e0 0 25%,#fff 0 50%) 0 0/24px 24px}
#stage{display:block;width:100%;aspect-ratio:1/1;touch-action:manipulation;cursor:pointer}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#8a847a;pointer-events:none}
.rec{position:absolute;right:12px;top:12px;background:#d63b2f;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800}
.rec[hidden]{display:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;font-weight:800}
.sl{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.4em;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.sl output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
input[type=range]{width:100%;accent-color:var(--ink)}
.btn{font:inherit;font-weight:800;font-size:14px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--p);color:var(--p-ink)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;gap:6px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.layers{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.layers li{display:grid;grid-template-columns:44px minmax(0,1fr) 9.5em;gap:8px;align-items:center;font-size:13px}
.layers img{width:44px;height:44px;object-fit:contain;background:repeating-conic-gradient(#ece9e3 0 25%,#fff 0 50%) 0 0/10px 10px;border-radius:8px;border:1px solid var(--rule)}
.layers .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{font:inherit;font-size:13px;padding:5px 6px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);width:100%}
.sub{color:var(--muted);font-size:13px}
details summary{cursor:pointer;font-weight:800;font-size:15px}
a{color:inherit}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>うごくうちのコ</h1><small>レイヤーに分けた絵が、呼吸して、まばたきして、こっちを見る ・ 試作 v1</small></header>
<div class="main">
  <div>
    <div class="stagebox" id="stagebox"><canvas id="stage" width="1024" height="1024" aria-label="動くキャラクター。押すとぴょんと跳ねる"></canvas><span class="hint" id="hint">押すと、ぴょん</span><span class="rec" id="rec" hidden>録画中</span></div>
    <div class="acts">
      <button class="btn" data-act="hop">ぴょん</button>
      <button class="btn" data-act="tilt">首をかしげる</button>
      <button class="btn" data-act="blink">まばたき</button>
      <button class="btn" data-act="shake">ぶるぶる</button>
      <button class="btn pri" data-act="rec" id="recbtn">動画で保存（6秒）</button>
    </div>
  </div>
  <div>
    <div class="card"><h2>動き</h2>
      <div id="sliders"></div>
      <div class="row" style="margin-top:6px"><label class="sub"><input type="checkbox" id="follow" checked> マウス・指のほうを見る</label></div>
    </div>
    <div class="card"><h2>背景</h2>
      <div class="sw" id="bgs"></div>
    </div>
    <div class="card"><details id="ldet"><summary>パーツ（レイヤー）</summary>
      <p class="sub" style="margin:6px 0 8px">PSD を読み込むと、あなたの絵で動かせます。レイヤーごとに役割を選んでください（名前に「頭」「目」「閉」「首」「体」「脚」などが入っていると自動で選びます）。</p>
      <div class="row" style="margin-bottom:10px"><label class="btn" for="file" style="display:inline-flex;align-items:center">PSD を読み込む</label><input type="file" id="file" accept=".psd" hidden><button class="btn" data-act="crow">やたやたがらすに戻す</button></div>
      <ul class="layers" id="layers"></ul>
    </details></div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@34.1.0/dist/bundle.js" defer></script>

/* ---------- 部品の準備 ---------- */
let CH=null; // {w,h,parts:[{img,x,y,w,h,role,name,alpha:{w,h,a,sc}}], rig}
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});
// 透明度を小さく取って、付け根さがしに使う
function alphaOf(img){const sc=Math.min(1,160/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);const d=g.getImageData(0,0,w,h).data,a=new Uint8Array(w*h);for(let i=0;i<w*h;i++)a[i]=d[i*4+3]>60?1:0;return {w,h,a,sc};}
// 部品の中で、点 (px,py) にいちばん近い不透明なところ（全体の座標で）
function nearest(p,px,py){const A=p.alpha;let best=null,bd=1e18;for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){if(!A.a[y*A.w+x])continue;const X=p.x+(x+.5)*p.w/A.w,Y=p.y+(y+.5)*p.h/A.h;const d=(X-px)**2+(Y-py)**2;if(d<bd){bd=d;best=[X,Y];}}return best||[p.x+p.w/2,p.y+p.h/2];}
function farthest(p,px,py){const A=p.alpha;let best=null,bd=-1;for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++){if(!A.a[y*A.w+x])continue;const X=p.x+(x+.5)*p.w/A.w,Y=p.y+(y+.5)*p.h/A.h;const d=(X-px)**2+(Y-py)**2;if(d>bd){bd=d;best=[X,Y];}}return best||[p.x+p.w/2,p.y+p.h/2];}
function comOf(p){const A=p.alpha;let sx=0,sy=0,n=0;for(let y=0;y<A.h;y++)for(let x=0;x<A.w;x++)if(A.a[y*A.w+x]){sx+=p.x+(x+.5)*p.w/A.w;sy+=p.y+(y+.5)*p.h/A.h;n++;}return n?[sx/n,sy/n]:[p.x+p.w/2,p.y+p.h/2];}
const center=ps=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ps.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h);});return {x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2};};
// 骨組み：付け根の位置を決める
function rig(){const ps=CH.parts.filter(p=>p.role!=='hide');if(!ps.length){CH.rig=null;return;}
  const by=r=>ps.filter(p=>p.role===r),all=center(ps);
  const body=by('body'),head=by('head'),neck=by('neck');
  const bc=body.length?(b=>[b.cx,b.cy])(center(body)):[all.cx,all.y0+(all.y1-all.y0)*.7];
  const hc=head.length?(b=>[b.cx,b.cy])(center(head)):[all.cx,all.y0+(all.y1-all.y0)*.3];
  let nb=null,nt=null;if(neck.length){const n=neck[0];nb=nearest(n,bc[0],bc[1]);nt=farthest(n,nb[0],nb[1]);}
  const hb=head.length?center(head):null;
  const hp=nt||(hb?[hb.cx,hb.y1]:hc); // 頭の回る点
  ps.forEach(p=>{if(p.role==='swing'){p.piv=nearest(p,bc[0],bc[1]);const c=comOf(p);p.com=[c[0]-p.piv[0],c[1]-p.piv[1]];p.th=0;p.om=0;}});
  CH.rig={bc,hc,nb,nt,hp,hw:hb?hb.x1-hb.x0:200,hh:hb?hb.y1-hb.y0:200,bb:all};}
async function useCrow(){const ps=[];for(const q of CROW.parts){const img=await loadImg(q.src);const p={img,x:q.x,y:q.y,w:img.width,h:img.height,role:CROWROLE[q.role]||q.role,name:q.name,src:q.src};p.alpha=alphaOf(img);ps.push(p);}
  CH={w:CROW.w,h:CROW.h,parts:ps};rig();layersUI();}
// 名前から役割を推測
function guessRole(n){n=String(n||'').toLowerCase();if(/背景|back|bg/.test(n))return 'hide';if(/(目|eye).*(閉|close|とじ)|(閉|close|とじ).*(目|eye)/.test(n))return 'eyeC';if(/目|eye|ひとみ|瞳/.test(n))return 'eyeO';
  if(/首|neck/.test(n))return 'neck';if(/頭|顔|head|face|かお|あたま/.test(n))return /顔|face|かお/.test(n)&&!/頭|head|あたま/.test(n)?'face':'head';if(/口|くち|鼻|はな|眉|まゆ|くちばし|beak|mouth|nose|耳|みみ|ear/.test(n))return 'face';
  if(/脚|足|leg|しっぽ|尾|tail|腕|手|arm|hand|羽|wing|髪|hair/.test(n))return 'swing';if(/体|胴|body|からだ/.test(n))return 'body';return 'fixed';}
async function usePsd(buf){const psd=agPsd.readPsd(buf,{skipThumbnail:true});const W=psd.width,Hh=psd.height,sc=Math.min(1,2048/Math.max(W,Hh));const ps=[];
  const walk=(arr,hidden)=>{(arr||[]).forEach(l=>{const hid=hidden||l.hidden;if(l.children){walk(l.children,hid);return;}if(!l.canvas||!l.canvas.width||!l.canvas.height)return;
    const full=(l.left|0)<=0&&(l.top|0)<=0&&l.canvas.width>=W&&l.canvas.height>=Hh;
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(l.canvas.width*sc));c.height=Math.max(1,Math.round(l.canvas.height*sc));c.getContext('2d').drawImage(l.canvas,0,0,c.width,c.height);
    let role=guessRole(l.name);if(hid||(full&&/背景|back|bg/i.test(l.name||'')))role='hide';
    ps.push({cv:c,x:(l.left|0)*sc,y:(l.top|0)*sc,name:l.name||'レイヤー',role});});};
  walk(psd.children,false);
  const out=[];for(const p of ps){const src=p.cv.toDataURL('image/png');const img=await loadImg(src);const q={img,x:p.x,y:p.y,w:img.width,h:img.height,role:p.role,name:p.name,src};
    // 余白を切りつめた透明度
    q.alpha=alphaOf(img);out.push(q);}
  // 頭がなければ、いちばん上にある大きな部品を頭に
  if(!out.some(p=>p.role==='head')){const c=out.filter(p=>p.role==='fixed');if(c.length){c.sort((a,b)=>a.y-b.y);c[0].role='head';}}
  CH={w:Math.round(W*sc),h:Math.round(Hh*sc),parts:out};rig();layersUI();$('#ldet').open=true;}
function layersUI(){$('#layers').innerHTML=CH.parts.map((p,i)=>`<li><img src="${p.src}" alt=""><span class="nm" title="${esc(p.name)}">${esc(p.name)}</span><select data-li="${i}" aria-label="${esc(p.name)}の役割">${ROLES.map(([k,n])=>`<option value="${k}" ${p.role===k?'selected':''}>${n}</option>`).join('')}</select></li>`).join('');}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.li!=null){CH.parts[+t.dataset.li].role=t.value;rig();}
  if(t.id==='file'&&t.files[0]){const f=t.files[0];f.arrayBuffer().then(b=>{if(!window.agPsd){alert('PSD を読むための部品がまだ読み込めていません。少し待ってからもう一度どうぞ');return;}try{usePsd(b);}catch(err){alert('この PSD は読めませんでした：'+err.message);}});t.value='';}});

/* ---------- 動き ---------- */
const ST={t:0,look:[0,0],lookT:[0,0],lookAt:0,ptr:null,ptrAt:-9,blinkAt:1.5,blinkEnd:0,dbl:false,by:0,bv:0,tilt:0,tiltT:0,tiltEnd:0,shake:0,prevP:null,prevV:null,stretch:0};
const cv=$('#stage'),g=cv.getContext('2d');
function act(a){const now=ST.t;
  if(a==='hop'){ST.bv=-520-Math.random()*120;ST.stretch=.35;blink(now);}
  else if(a==='tilt'){ST.tiltT=(Math.random()<.5?-1:1)*16;ST.tiltEnd=now+1.3;}
  else if(a==='blink')blink(now);
  else if(a==='shake'){ST.shake=1;}}
function blink(now){ST.blinkEnd=now+.12;ST.dbl=Math.random()<.25;ST.blinkAt=now+1.6+Math.random()*3.5*(1.6-P.blink/100);}
// 1コマすすめる
function step(dt){const t=ST.t+=dt,R=CH&&CH.rig;if(!R)return;
  // 見る先：最近さわったらそっち、ほうっておくと、ときどき別のほうを見る
  const follow=$('#follow').checked;
  if(follow&&ST.ptr&&t-ST.ptrAt<2.5){const nz=Math.max(R.hw,R.hh)*1.3;ST.lookT=[Math.max(-1,Math.min(1,(ST.ptr[0]-R.hc[0])/nz)),Math.max(-1,Math.min(1,(ST.ptr[1]-R.hc[1])/nz))];}
  else if(t>ST.lookAt){ST.lookAt=t+1.2+Math.random()*3;ST.lookT=Math.random()<.3?[0,0]:[Math.random()*2-1,(Math.random()*2-1)*.5];}
  const lk=1-Math.exp(-dt*7);ST.look[0]+=(ST.lookT[0]-ST.look[0])*lk;ST.look[1]+=(ST.lookT[1]-ST.look[1])*lk;
  // まばたき
  if(t>ST.blinkAt&&P.blink>0){blink(t);}
  if(ST.dbl&&t>ST.blinkEnd+.1&&t<ST.blinkEnd+.12){ST.blinkEnd=t+.11;ST.dbl=false;}
  // ぴょん：ばねで地面にもどる
  const K=180,C=14;ST.bv+=(-K*ST.by-C*ST.bv)*dt;ST.by+=ST.bv*dt;ST.stretch*=Math.exp(-dt*4);
  if(t>ST.tiltEnd)ST.tiltT=0;ST.tilt+=(ST.tiltT-ST.tilt)*(1-Math.exp(-dt*8));
  ST.shake*=Math.exp(-dt*2.2);}
// 行列（a,b,c,d,e,f）
const M={mul:(m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]],
  T:(x,y)=>[1,0,0,1,x,y],R:a=>[Math.cos(a),Math.sin(a),-Math.sin(a),Math.cos(a),0,0],S:(x,y)=>[x,0,0,y,0,0],ap:(m,p)=>[m[0]*p[0]+m[2]*p[1]+m[4],m[1]*p[0]+m[3]*p[1]+m[5]]};
const about=(p,m)=>M.mul(M.T(p[0],p[1]),M.mul(m,M.T(-p[0],-p[1])));
const deg=Math.PI/180;
let VIEW=null;
function frame(dt){const R=CH&&CH.rig;g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.clearRect(0,0,1024,1024);
  if(BG!=='trans'){g.fillStyle=BG;g.fillRect(0,0,1024,1024);}
  if(!R)return;step(dt);
  const t=ST.t,b=R.bb,bw=b.x1-b.x0,bh=b.y1-b.y0,sc=Math.min(1024*.78/bw,1024*.78/(bh+80));
  VIEW=M.mul(M.T(512,512+30*sc/ (sc||1)),M.mul(M.S(sc,sc),M.T(-b.cx,-b.cy)));
  // 体：呼吸・ゆらゆら・ぴょん・ぶるぶる
  const br=Math.sin(t*2*Math.PI/3.2)*.018*P.breath/50,sw=Math.sin(t*2*Math.PI/4.1)*2.2*deg*P.sway/50+Math.sin(t*37)*ST.shake*5*deg;
  const sq=Math.max(-.12,Math.min(.12,-ST.bv*.00018)); // 跳ぶときに縦にのびる
  let B=M.mul(M.T(Math.sin(t*41)*ST.shake*bh*.012,ST.by*bh/700),about([R.bc[0],R.bc[1]+bh*.25],M.mul(M.R(sw),M.S(1+br-sq*.5,1-br+sq))));
  B=M.mul(VIEW,B);
  // 首：のびちぢみ（頭は首の先についていく）
  let N=M.S(1,1),d=[0,0];const look=ST.look;
  if(R.nb){const st=1+(Math.sin(t*2*Math.PI/5.3)*.5+.5)*.12*P.neck/50+ST.stretch*.6+Math.max(0,look[1])*-.06;N=about(R.nb,M.mul(M.R(-look[0]*3*deg),M.S(1,st)));const p=M.ap(N,R.nt);d=[p[0]-R.nt[0],p[1]-R.nt[1]];}
  const L=P.look/60;
  const H=M.mul(B,M.mul(M.T(d[0],d[1]),about(R.hp,M.R((look[0]*7*L+ST.tilt+Math.sin(t*1.3)*1.2)*deg))));
  const F=M.mul(H,M.T(look[0]*R.hw*.07*L,look[1]*R.hh*.05*L));
  const closed=ST.t<ST.blinkEnd;
  // ゆれもの：付け根が動いた加速度で、ばねのように遅れて揺れる
  const sp=P.spring/100;
  CH.parts.forEach(p=>{if(p.role!=='swing'||!p.piv)return;const w=M.ap(B,p.piv);if(!p.pv){p.pv=w;p.vv=[0,0];}
    const v=[(w[0]-p.pv[0])/Math.max(dt,1e-3),(w[1]-p.pv[1])/Math.max(dt,1e-3)],a=[(v[0]-p.vv[0])/Math.max(dt,1e-3),(v[1]-p.vv[1])/Math.max(dt,1e-3)];p.pv=w;p.vv=v;
    const len=Math.hypot(p.com[0],p.com[1])||1,tau=-(p.com[0]*a[1]-p.com[1]*a[0])/(len*len)*.9*sp;
    const k=60,c=4+6*(1-sp);p.om+=(tau-k*p.th-c*p.om)*dt;p.th+=p.om*dt;p.th=Math.max(-.6,Math.min(.6,p.th));});
  // かく（PSD の重なり順のまま）
  CH.parts.forEach(p=>{if(p.role==='hide')return;if(p.role==='eyeO'&&closed)return;if(p.role==='eyeC'&&!closed)return;
    let m;switch(p.role){case 'head':m=H;break;case 'face':case 'eyeO':case 'eyeC':m=F;break;case 'neck':m=M.mul(B,N);break;case 'swing':m=M.mul(B,about(p.piv,M.R(p.th)));break;default:m=B;}
    g.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);g.drawImage(p.img,p.x,p.y,p.w,p.h);});
  g.setTransform(1,0,0,1,0,0);}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frame(dt);requestAnimationFrame(loop);}
// さわる
function ptrPos(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1024,y=(e.clientY-r.top)/r.height*1024;if(!VIEW)return null;
  const m=VIEW,det=m[0]*m[3]-m[1]*m[2];const X=x-m[4],Y=y-m[5];return [(m[3]*X-m[2]*Y)/det,(-m[1]*X+m[0]*Y)/det];}
document.addEventListener('pointermove',e=>{const p=ptrPos(e);if(!p)return;ST.ptr=p;ST.ptrAt=ST.t;});
cv.addEventListener('pointerdown',e=>{const p=ptrPos(e);if(p){ST.ptr=p;ST.ptrAt=ST.t;}act('hop');$('#hint').hidden=true;});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-bg]');if(!b)return;
  if(b.dataset.bg){BG=b.dataset.bg;store.set('ugoku-bg',BG);drawBgs();return;}
  const a=b.dataset.act;if(a==='rec')record();else if(a==='crow')useCrow();else act(a);});
// 動画で保存
function record(){if(!cv.captureStream||!window.MediaRecorder){alert('このブラウザでは動画の保存ができません');return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(cv.captureStream(30),type?{mimeType:type,videoBitsPerSecond:4e6}:{}),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{const blob=new Blob(chunks,{type:type||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uchinoko.'+(type.includes('mp4')?'mp4':'webm');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);$('#rec').hidden=true;$('#recbtn').disabled=false;};
  $('#rec').hidden=false;$('#recbtn').disabled=true;rec.start();setTimeout(()=>rec.stop(),6000);}
useCrow().then(()=>requestAnimationFrame(loop));
</script>
