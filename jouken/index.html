<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>条件漢字</title>
<meta name="description" content="読み・画数・部首の条件をぜんぶ満たす漢字を、いちばん早く書いた人の勝ち">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 国語の小テスト：生成りの答案用紙に、教科書体の字と赤ペン。答えは原稿用紙のマスに書く */
:root{
  --desk:#e7dfcd; --paper:#fdfaf2; --ink:#27231e; --muted:#7a7164; --rule:#ddd3c0; --line:#c9d7e6;
  --red:#d2382a; --red-soft:#fbe3df; --blue:#2c5a94; --ok:#2e8b57;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --kf:"Klee One","UD デジタル 教科書体 N","UD Digi Kyokasho N-R","Hiragino Mincho ProN",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.7;min-height:100vh;background:var(--desk)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-family:var(--kf);font-weight:600;font-size:30px;letter-spacing:.08em}
.logo h1 em{font-style:normal;color:var(--red)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:900;letter-spacing:.12em}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(80,60,30,.08)}
.card h2{margin:0 0 10px;font-size:17px;font-weight:900}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:#fff;border-radius:6px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;padding:10px 16px;font-weight:900;cursor:pointer;min-height:44px}
.btn:hover{background:#f3eee2}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#3a342c}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.code{font-size:30px;font-weight:900;letter-spacing:.2em;color:var(--blue)}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:#fff}
.plist li.off{opacity:.5}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
details.rules summary{cursor:pointer;font-weight:900}
details.rules ul{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:900;white-space:nowrap}
table.t tr.me td{color:var(--red)}
/* 問題用紙 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.qhead .qn{font-family:var(--kf);font-weight:600;font-size:20px}
.qhead .qn b{color:var(--red);font-size:26px}
.timer{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--red);transform-origin:left center}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.conds li{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;background:#fff}
.conds .tag{flex:none;writing-mode:horizontal-tb;font-size:12px;font-weight:900;color:var(--paper);background:var(--blue);border-radius:3px;padding:2px 8px;letter-spacing:.15em}
.conds .tx{font-family:var(--kf);font-weight:600;font-size:clamp(17px,4.6vw,23px);line-height:1.4}
.conds .tx .big{white-space:nowrap}
.conds .tx .big{font-size:1.3em;color:var(--red)}
.conds .tx .rf{font-size:.8em;color:var(--muted);font-weight:400}
.ansn{margin-top:10px;font-size:13px;color:var(--muted)}
/* 原稿用紙のマス */
.masu{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.cell{position:relative;width:120px;height:120px;border:2px solid var(--line);background:#fff}
.cell::before,.cell::after{content:"";position:absolute;pointer-events:none}
.cell::before{left:50%;top:6px;bottom:6px;border-left:1.5px dashed var(--line)}
.cell::after{top:50%;left:6px;right:6px;border-top:1.5px dashed var(--line)}
.cell input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--kf);font-weight:600;font-size:82px;line-height:1;padding:0;z-index:1}
.cell input:focus{outline:3px solid var(--blue);outline-offset:-3px}
.cell.cool input{color:var(--muted)}
.miss{margin-top:12px;border-left:3px solid var(--red);background:var(--red-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px}
.miss b{font-family:var(--kf);font-size:20px;color:var(--red)}
.miss ul{margin:4px 0 0;padding-left:18px}
/* 正解の発表 */
.hit{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.maru{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-family:var(--kf);font-weight:600;font-size:80px;line-height:1}
.maru svg{position:absolute;inset:-8px;width:136px;height:136px;overflow:visible}
.maru svg path{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:pen .7s ease-out .1s forwards}
@keyframes pen{to{stroke-dashoffset:0}}
.hit .who{font-size:20px;font-weight:900}
.hit .who small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.alist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.alist .k{display:flex;flex-direction:column;align-items:center;min-width:64px;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:6px 6px 4px}
.alist .k b{font-family:var(--kf);font-weight:600;font-size:30px;line-height:1.1}
.alist .k span{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;max-width:80px}
.alist .k.won{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.scores{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.scores span{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;background:#fff}
.scores span b{color:var(--red)}
.scores span.me{border-color:var(--red)}
.win{font-family:var(--kf);font-size:28px;font-weight:600;text-align:center;color:var(--red)}
.credit{font-size:11px;color:var(--muted);margin-top:16px;text-align:center}
.credit a{color:inherit}
/* チャット */
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:900;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.cbadge{background:var(--red);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:#eef3fa}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;border:0;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
.chat[hidden],.chat-body[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
.toast[hidden]{display:none}
@media (max-width:480px){.wrap{padding:12px 12px 90px}.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}.cell{width:104px;height:104px}.cell input{font-size:72px}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}.maru svg path{animation:none;stroke-dashoffset:0}}
</style>
</head>

<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><em>条件</em>漢字</h1><small>ぜんぶ満たす字を、いちばん早く ・ <span id="ver">試作 v1</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
  <div class="credit">漢字のデータ：<a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project" target="_blank" rel="noopener">KANJIDIC</a>（© Electronic Dictionary Research and Development Group, CC BY-SA）</div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>

function fits(k,c){return c.t==='yomi'?k.y.some(y=>y.startsWith(c.v)):c.t==='kaku'?k.s===c.v:c.t==='bu'?k.r===c.v:false;}
const fitsAll=(k,cs)=>cs.every(c=>fits(k,c));

function whyNot(k,c){if(c.t==='yomi')return `「${c.v}」から始まる読みがありません（${k.y.slice(0,6).join('・')||'読みなし'}）`;

const LV={1:{n:2,min:4,max:60,kana:1},2:{n:3,min:2,max:40,kana:1},3:{n:3,min:1,max:12,kana:2}};
function makeQ(lv,used){const L=LV[lv]||LV[2];let best=null;
  for(let tries=0;tries<400;tries++){const k=JOYO[Math.floor(Math.random()*JOYO.length)];if(used.has(k.ch)||!k.y.length)continue;
    const y=k.y[Math.floor(Math.random()*k.y.length)];if(y.length<L.kana)continue;
    const all=[{t:'yomi',v:y.slice(0,L.kana)},{t:'kaku',v:k.s},{t:'bu',v:k.r}].filter(c=>c.t!=='bu'||radOK(c.v));
    if(all.length<L.n)continue;
    const cs=shuffle(all.slice()).slice(0,L.n).sort((a,b)=>'yomi kaku bu'.indexOf(a.t)-'yomi kaku bu'.indexOf(b.t));
    const ans=JOYO.filter(x=>fitsAll(x,cs));
    if(ans.length>=L.min&&ans.length<=L.max)return {cs,seed:k.ch};
    if(!best&&ans.length>=1&&ans.length<=L.max)best={cs,seed:k.ch};}
  return best;}

function hostInit(){H={phase:'lobby',players:[],hostId:null,nSel:'10',lvSel:'2',tSel:'60',inGame:[],qi:0,q:null,scores:{},used:new Set(),games:0,result:null,nextAt:null,hist:[]};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true});return id;}
function startGame(){absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);H.scores={};H.inGame.forEach(id=>H.scores[id]=0);H.qi=0;H.used=new Set();H.result=null;H.hist=[];nextQ();}
function nextQ(){if(H.qi>=+H.nSel){endGame();return;}
  const q=makeQ(+H.lvSel,H.used);if(!q){endGame();return;}H.used.add(q.seed);
  H.q={cs:q.cs,start:Date.now(),endAt:Date.now()+(+H.tSel)*1000,win:null,cool:{},tries:{}};H.phase='q';H.nextAt=null;}
function reveal(win){const q=H.q;q.win=win;H.phase='a';H.nextAt=Date.now()+NEXT_T;
  if(win)H.scores[win.id]=(H.scores[win.id]||0)+1;
  H.hist.push({cs:q.cs,win});H.qi++;}
function endGame(){H.phase='end';H.games++;H.nextAt=null;
  const rows=H.inGame.map(id=>{const P=H.players.find(p=>p.id===id),ws=H.hist.filter(h=>h.win&&h.win.id===id);return {id,name:P?P.name:'?',pts:H.scores[id]||0,fast:ws.length?Math.min(...ws.map(h=>h.win.ms)):null};});
  rows.sort((a,b)=>b.pts-a.pts||(a.fast??1e9)-(b.fast??1e9));H.result={rows};}
// 答えの判定。まちがいは本人にだけ理由を返す
function guess(pid,raw){const q=H.q;if(H.phase!=='q'||!q||!H.inGame.includes(pid))return null;const now=Date.now();
  if(q.cool[pid]&&now<q.cool[pid])return {ok:false,why:['少し待ってからもう一度']};
  const ch=[...String(raw||'')].find(c=>/[㐀-鿿豈-﫿]/.test(c));
  if(!ch)return {ok:false,why:['漢字を1字書いてください']};
  q.tries[pid]=(q.tries[pid]||0)+1;
  const k=KD.get(ch);if(!k){q.cool[pid]=now+COOL;return {ok:false,ch,why:['この字は辞書にありません']};}
  const bad=q.cs.filter(c=>!fits(k,c));
  if(bad.length){q.cool[pid]=now+COOL;return {ok:false,ch,why:bad.map(c=>whyNot(k,c))};}
  reveal({id:pid,ch,ms:now-q.start});push();return {ok:true,ch};}
function pubFor(pid){const q=H.q,now=Date.now();

  if(q&&(H.phase==='q'||H.phase==='a')){base.q={cs:q.cs,n:JOYO.filter(x=>fitsAll(x,q.cs)).length,remain:Math.max(0,q.endAt-now),total:(+H.tSel)*1000,win:q.win,next:H.nextAt?Math.max(0,H.nextAt-now):null,cool:q.cool[pid]?Math.max(0,q.cool[pid]-now):0};}

function push(){NET.conns.forEach(c=>sendTo(c,{t:'view',v:pubFor(c._pid),you:c._pid||null}));setView(pubFor(H.hostId),H.hostId);}
function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function act(pid,m,reply){
  if(!H||!m)return;const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end';
  switch(m.t){
    case 'guess':{const r=guess(pid,m.v);if(r&&!r.ok&&reply)reply({t:'miss',ch:r.ch||'',why:r.why});return;}
    case 'next':{if(!isHost||H.phase!=='a')return;nextQ();break;}
    case 'nSel':if(isHost&&setup&&['5','10','15','20'].includes(m.v))H.nSel=m.v;break;
    case 'lvSel':if(isHost&&setup&&['1','2','3'].includes(m.v))H.lvSel=m.v;break;
    case 'tSel':if(isHost&&setup&&['30','60','90','120'].includes(m.v))H.tSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);}break;

function hostWire(c){

function resetNet(){

function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください';render();return true;}return false;}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });
  push();
}

  if(noPeer())return;
  resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='miss'){showMiss(m);return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m.t==='chathist'&&Array.isArray(m.list)){CHAT.list=m.list.map(cleanMsg).filter(Boolean).slice(-100);renderChat();return;}
      if(m.t==='view'&&m.v&&m.v.ver!==VER){V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('jouken-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}
function soloRoom(){resetNet();NET.role='host';NET.solo=true;hostInit();H.hostId=addPlayer(TOK,NAME);push();}
function send(m){if(NET.role==='host')act(H.hostId,m,r=>showMiss(r));else if(NET.conn&&NET.conn.open)sendTo(NET.conn,m);}
function leave(){resetNet();setRoomURL(null);try{sessionStorage.removeItem('jouken-joined');}catch(e){}render();}
function setRoomURL(code){try{const u=new URL(location.href);if(code)u.searchParams.set('room',code);else u.searchParams.delete('room');u.searchParams.delete('v');history.replaceState(null,'',u);}catch(e){}}
const roomLink=()=>{try{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',NET.code);return u.toString();}catch(e){return '';}};

/* ---------- 受け取り ---------- */
// miss：自分のまちがいの理由（その問題のあいだだけ出す）
const LOC={miss:null,missN:0,qkey:null};
let VIEWAT=performance.now();
function setView(v,you){V=v;MYID=you;VIEWAT=performance.now();
  const k=v.phase==='q'?v.games+':'+v.qi:null;if(k!==LOC.qkey){LOC.qkey=k;LOC.miss=null;}
  render();}
function showMiss(r){LOC.miss={ch:r.ch,why:r.why||[]};LOC.missN++;render();const i=$('#ans');if(i){i.value='';i.focus();}}

/* ---------- 画面 ---------- */
const isPlayer=()=>!!(V&&MYID&&V.inGame&&(V.phase==='lobby'||V.inGame.includes(MYID))&&V.players.some(p=>p.id===MYID));
const amHost=()=>NET.role==='host';
const pname=id=>{const p=V.players.find(x=>x.id===id);return p?p.name:'?';};
const fmtS=ms=>(ms/1000).toFixed(1);
function topinfo(){const el=$('#topinfo');if(!V){el.innerHTML='';return;}
  el.innerHTML=`${NET.code?`<span class="chip">部屋 <b>${esc(NET.code)}</b></span>`:'<span class="chip">ひとりで</span>'}<button class="btn small" data-act="leave">${NET.solo?'やめる':'退出'}</button>`;}
function rulesHTML(open){return `<div class="card"><details class="rules" ${open?'open':''}><summary>あそびかた</summary><ul>
  <li>「読みが<b>か</b>から始まる」「<b>12</b>画」「部首が<b>さんずい</b>」のような条件が出ます。</li>
  <li>条件を<b>ぜんぶ満たす漢字</b>を1字、マスに書いて送ります。いちばん早く正解した人が1点。</li>
  <li>まちがえても、どこがちがったか教えてもらえます。少し待てば何度でも書き直せます。</li>
  <li>答えは常用漢字でなくてもOK（辞書にある字なら）。読みは音読み・訓読みのどちらでもかまいません。</li>
  <li>部首は漢和辞典（康熙字典）の分け方です。たとえば「問」は口、「聞」は門の部です。</li>
</ul></details></div>`;}
function vHome(){
  const qs=new URLSearchParams(location.search);if(!D.code&&qs.get('room'))D.code=qs.get('room').toUpperCase();
  return `<div class="card stack">
    <div><label class="f" for="name">あなたの名前</label><input type="text" id="name" maxlength="12" placeholder="例：たろう" value="${esc(NAME)}" autocomplete="nickname"></div>
    <button class="btn primary wide" data-act="solo">ひとりで練習する</button>
    <button class="btn wide" data-act="create">部屋を作って、みんなで遊ぶ</button>
    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>${rulesHTML(true)}`;}
function settingsHTML(host){const dis=host?'':'disabled',o=(v,cur,l)=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  return `<div class="grid2"><div><label class="f" for="lvSel">むずかしさ</label><select id="lvSel" ${dis}>${o('1',V.lvSel,'かんたん（条件2つ）')}${o('2',V.lvSel,'ふつう（条件3つ）')}${o('3',V.lvSel,'むずかしい（読みが2文字）')}</select></div>
    <div><label class="f" for="nSel">問題の数</label><select id="nSel" ${dis}>${['5','10','15','20'].map(n=>o(n,V.nSel,n+'問')).join('')}</select></div>
    <div><label class="f" for="tSel">1問の時間</label><select id="tSel" ${dis}>${[['30','30秒'],['60','1分'],['90','1分30秒'],['120','2分']].map(([v,l])=>o(v,V.tSel,l)).join('')}</select></div></div>`;}
function vLobby(){const host=amHost(),n=V.players.length;
  if(NET.solo)return `<div class="card stack"><h2>ひとりで練習する</h2>${settingsHTML(true)}<button class="btn primary wide" data-act="start">はじめる</button></div>${rulesHTML(false)}`;
  return `<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code||'')}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>
  <div class="card stack"><h2>参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}</h2>
    <ul class="plist">${V.players.map(p=>`<li class="${p.online?'':'off'}">${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}</li>`).join('')}</ul>
    ${!isPlayer()?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">はじめる</button>`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>${rulesHTML(false)}`;}
const scoresHTML=()=>V.inGame.length>1?`<div class="scores">${V.inGame.slice().sort((a,b)=>(V.scores[b]||0)-(V.scores[a]||0)).map(id=>`<span class="${id===MYID?'me':''}">${esc(pname(id))} <b>${V.scores[id]||0}</b></span>`).join('')}</div>`:'';
const condsHTML=cs=>`<ul class="conds">${cs.map(c=>`<li><span class="tag">${TAG[c.t]}</span><span class="tx">${condHTML(c)}</span></li>`).join('')}</ul>`;
function vQ(){const q=V.q;if(!q)return '';const me=isPlayer()&&V.inGame.includes(MYID);
  return `<div class="card"><div class="qhead"><span class="qn">第<b>${V.qi+1}</b>問 <span class="sub">／${V.nSel}問</span></span><span class="sub" id="clock"></span></div>
    <div class="timer" aria-hidden="true"><i id="tbar"></i></div>
    ${condsHTML(q.cs)}
    <div class="ansn">常用漢字なら答えは <b>${q.n}</b>字（常用外の字でもOK）</div>
    ${me?`<div class="masu"><div class="cell" id="cell"><input type="text" id="ans" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="答えの漢字" maxlength="6"></div><button class="btn primary" data-act="guess">答える</button></div>
      ${LOC.miss?`<div class="miss" role="status"><b>${esc(LOC.miss.ch||'')}</b> ×　${LOC.miss.why.length>1?`<ul>${LOC.miss.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:esc(LOC.miss.why[0]||'')}</div>`:''}`
      :'<div class="note center">観戦中です</div>'}
    ${scoresHTML()}</div>`;}
// 答えの一覧（常用漢字）
function answersHTML(cs,winCh){const a=JOYO.filter(k=>fitsAll(k,cs)).sort((x,y)=>(x.g||9)-(y.g||9)||x.s-y.s);
  const extra=winCh&&!a.some(k=>k.ch===winCh)&&KD.get(winCh)?[KD.get(winCh)]:[];
  return `<div class="alist">${extra.concat(a).map(k=>`<div class="k${k.ch===winCh?' won':''}"><b>${esc(k.ch)}</b><span>${esc(k.y.slice(0,3).join('・'))}</span><span>${GRADE(k.g)}</span></div>`).join('')}</div>`;}
function vA(){const q=V.q;if(!q)return '';const w=q.win;
  return `<div class="card"><div class="qhead"><span class="qn">第<b>${V.qi}</b>問 <span class="sub">／${V.nSel}問</span></span><span class="sub" id="nextc"></span></div>
    ${w?`<div class="hit"><div class="maru" aria-label="正解 ${esc(w.ch)}"><svg viewBox="0 0 136 136" aria-hidden="true"><path d="M70 14 C 30 12, 10 44, 14 74 C 18 108, 52 126, 84 120 C 118 112, 128 78, 120 50 C 112 24, 88 12, 60 18"/></svg>${esc(w.ch)}</div>
      <div class="who">${esc(pname(w.id))}${w.id===MYID?'（あなた）':''} の正解！<small>${fmtS(w.ms)}秒</small></div></div>`
      :'<div class="win" style="color:var(--muted)">時間切れ</div>'}
    <div style="margin-top:14px">${condsHTML(q.cs)}</div>
    <h2 style="margin-top:16px">答えになる漢字 <span class="sub">（常用漢字）</span></h2>${answersHTML(q.cs,w&&w.ch)}
    ${scoresHTML()}
    <div style="margin-top:14px">${amHost()?`<button class="btn primary wide" data-act="next">${V.qi>=+V.nSel?'結果へ':'次の問題へ'}</button>`:''}</div></div>`;}
function vEnd(){const R=V.result;if(!R)return '';const solo=R.rows.length===1;
  const top=R.rows[0];
  return `<div class="card">${solo?`<div class="win">${top.pts}問 正解</div><div class="center sub">${V.nSel}問中${top.fast!=null?`・いちばん速かったのは ${fmtS(top.fast)}秒`:''}</div>`
    :`<div class="win">${esc(top.name)} の勝ち！</div>`}
    ${solo?'':`<table class="t" style="margin-top:10px"><tr><th>順位</th><th>名前</th><th style="text-align:right">正解</th><th style="text-align:right">最速</th></tr>${R.rows.map((r,i)=>`<tr class="${r.id===MYID?'me':''}"><td>${i+1}位</td><td>${esc(r.name)}</td><td class="num">${r.pts}</td><td class="num">${r.fast!=null?fmtS(r.fast)+'秒':'—'}</td></tr>`).join('')}</table>`}</div>
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次を始めるのを待っています</span></div>'}</div>`;}
// 画面を作り直さずに書きかえる部分（時計・残り時間のバー・次の問題まで）
function patch(){if(!V||!V.q)return;const el=performance.now()-VIEWAT,q=V.q;
  const ck=$('#clock'),tb=$('#tbar');if(V.phase==='q'){const r=Math.max(0,q.remain-el);if(ck)ck.textContent=`のこり ${Math.ceil(r/1000)}秒`;if(tb)tb.style.transform=`scaleX(${r/q.total})`;}
  const nc=$('#nextc');if(nc&&V.phase==='a'&&q.next!=null)nc.textContent=`${Math.ceil(Math.max(0,q.next-el)/1000)}秒後に${V.qi>=+V.nSel?'結果':'次の問題'}`;
  const cell=$('#cell');if(cell)cell.classList.toggle('cool',q.cool-el>0);}
setInterval(patch,200);
let LASTKEY='';
function render(){
  topinfo();renderChat();let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else{key=JSON.stringify([V.phase,V.players,V.nSel,V.lvSel,V.tSel,V.specs,V.qi,V.games,V.scores,V.q&&V.q.win,V.q&&V.q.cs,LOC.missN,NET.status,MYID]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+({lobby:vLobby,q:vQ,a:vA,end:vEnd}[V.phase]||vEnd)();}
  if(key!==LASTKEY){const ae=document.activeElement,aid=ae&&ae.id,val=aid==='ans'?ae.value:null,first=V&&V.phase==='q'&&!(LASTKEY.startsWith('["q"'));
    $('#app').innerHTML=html;LASTKEY=key;
    const i=$('#ans');if(i){if(val!=null)i.value=val;if(aid==='ans'||first)i.focus({preventScroll:true});}
    else if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}}
  patch();
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('jouken-name',NAME);}}
function sendGuess(){const i=$('#ans');if(!i)return;const v=i.value.trim();if(!v){i.focus();return;}send({t:'guess',v});}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='solo'){saveName();soloRoom();}
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(!V||V.phase==='lobby'||confirm('ゲームをやめますか？'+(amHost()&&!NET.solo?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='guess')sendGuess();
  else if(['start','lobby','next'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(['nSel','lvSel','tSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
  else if(e.target.id==='ans'){e.preventDefault();sendGuess();}});
(function(){let j=null;try{j=sessionStorage.getItem('jouken-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&V&&V.phase!=='lobby'&&!NET.solo){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
