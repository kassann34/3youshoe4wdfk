<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>机上の海戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 海図の紙の色。待合室と編成はふつうの一列、作戦中は海図を画面いっぱいに */
:root{
  --bg:#efe9dc; --surface:#faf7f0; --ink:#2b2a26; --muted:#76705f; --rule:#ddd4c0;
  --me:#2f5d9e; --me-soft:#dbe5f3; --en:#b23a3a; --en-soft:#f4dcd8; --accent:#2b2a26; --accent-ink:#faf7f0; --ok:#3d7a4e; --warn:#b23a3a;
  --shadow:0 2px 0 rgba(43,42,38,.07);
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.08em;font-family:var(--serif)}
.logo h1 .pa{color:var(--me)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--me);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.btn.on{background:var(--me);border-color:var(--me);color:#fff}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:var(--bg)}
.plist li.me{border-color:var(--ink)}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol,details.rules ul{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--rule);text-align:center}
table.t th{color:var(--muted);font-weight:700}
table.t td:first-child,table.t th:first-child{text-align:left}
/* 編成 */
.fl{display:flex;flex-direction:column;gap:8px}
.fl .it{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:12px;padding:8px 10px;background:var(--bg)}
.fl .it svg{flex:none;width:44px;height:30px}
.fl .it .nm{flex:1;min-width:0}
.fl .it .nm b{font-size:16px}
.fl .it .cnt{display:flex;align-items:center;gap:6px}
.fl .it .cnt button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rule);background:var(--surface);font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.fl .it .cnt b{min-width:1.5em;text-align:center;font-size:18px}
.budget{font-size:18px;font-weight:800}
.budget.over{color:var(--warn)}
/* 作戦画面 */
#game{position:fixed;inset:0;background:#2f2620;z-index:10;display:flex;flex-direction:column}
#game[hidden]{display:none}
.gbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#23303c;color:#efe6cf;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.gbar .btn{background:rgba(239,230,207,.08);color:#efe6cf;border-color:rgba(239,230,207,.3)}
.gbar .tn{font-family:var(--serif);letter-spacing:.06em}
.gbar .tn{font-weight:800}
.gbar .tm{font-weight:800;font-variant-numeric:tabular-nums;font-size:20px;min-width:3.2em}
.gbar .tm.low{color:#ff9c8a}
.gbar .cap{font-size:12px;color:#c9bfa6}
.gbar .opp{font-size:12px;margin-left:auto}
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{min-width:38px;height:38px;padding:0 6px;white-space:nowrap;border-radius:10px;border:1px solid var(--rule);background:rgba(250,247,240,.92);font-size:20px;font-weight:800;cursor:pointer}
.capb{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);pointer-events:none;z-index:3;padding:6px 16px;border-radius:14px;font-weight:800;font-size:13px;text-align:center;line-height:1.35;max-width:calc(100% - 20px);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3);font-family:var(--serif);letter-spacing:.04em}
.capb[hidden]{display:none}
.capb.en{background:#b23a3a;color:#fff;animation:capb 1.2s ease-in-out infinite}
.capb.me{background:#2f5d9e;color:#fff}
@keyframes capb{50%{transform:translateX(-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.capb.en{animation:none}}
.msg{position:absolute;left:8px;right:56px;top:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.msg div{background:rgba(250,247,240,.94);border:1px solid var(--rule);border-radius:8px;padding:3px 10px;font-size:13px}
.msg div.bad{border-color:var(--en);color:var(--en);font-weight:800}
.msg div.good{border-color:var(--me);color:var(--me);font-weight:800}
.gmain{flex:1;min-height:0;display:flex}
.side{flex:none;width:136px;overflow-y:auto;background:#f3ecdc;border-right:1px solid #cdbf9f;padding:6px;display:flex;flex-direction:column;gap:6px;box-shadow:inset -6px 0 10px -8px rgba(0,0,0,.25)}
.side .ttl{font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.1em;color:#5b4a2e;text-align:center;border-bottom:1px solid #cdbf9f;padding-bottom:2px}
@media (max-width:560px){.side{width:96px;padding:4px}}
.eside{flex:none;width:122px;overflow-y:auto;background:#f1e6e0;border-left:1px solid #d5b9ad;padding:6px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 6px 0 10px -8px rgba(0,0,0,.2)}
.eside .ttl{font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.1em;color:#7a3328;text-align:center;border-bottom:1px solid #d5b9ad;padding-bottom:2px;cursor:default}
.eside .none{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}
.ec{width:100%;border:1.5px solid #e0c8bd;border-radius:8px;padding:3px 6px;background:#fbf4f1;cursor:pointer;text-align:left}
.ec .h{display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px;font-family:var(--serif)}
.ec .h svg{width:22px;height:15px;flex:none}
.ec .h small{margin-left:auto;font-family:var(--font);font-size:10px;color:var(--muted);font-weight:700}
.ec .hp{height:4px;border-radius:2px;background:#ead8d0;margin-top:3px;overflow:hidden}.ec .hp i{display:block;height:100%;background:var(--en)}
.ec .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ec.old{opacity:.7;border-style:dashed}.ec.dead{opacity:.45}
.ec.fired{border-color:var(--en)}
.etab{display:none}
@media (max-width:560px){
  .eside{width:30px;padding:4px 2px;align-items:center}
  .eside .ttl,.eside .ec,.eside .none{display:none}
  .etab{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-family:var(--serif);font-weight:800;color:#7a3328;font-size:12px;writing-mode:vertical-rl;letter-spacing:.2em;padding:4px 0}
  .etab b{writing-mode:horizontal-tb;background:var(--en);color:#fff;border-radius:999px;font-size:11px;min-width:18px;text-align:center;letter-spacing:0;padding:0 4px}
  .eside.open{position:absolute;right:0;top:0;bottom:0;width:128px;z-index:5;align-items:stretch;padding:6px;box-shadow:-6px 0 14px rgba(0,0,0,.25)}
  .eside.open .ec,.eside.open .none{display:block}.eside.open .ttl{display:none}.eside.open .ec .h{display:flex}
  .eside.open .etab{writing-mode:horizontal-tb;flex-direction:row;justify-content:center}
}
.gmain{position:relative}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcol{border:1px solid var(--rule);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tcol .th{font-family:var(--serif);font-weight:800;letter-spacing:.1em}
.tcol.t0 .th{color:var(--me)}.tcol.t1 .th{color:var(--en)}
.tcol .plist{flex-direction:column;width:100%}
.tcol .plist li{flex-wrap:wrap;white-space:nowrap;width:100%;border-radius:10px;row-gap:0}
.tcol .plist li .sub{font-size:11px}
.tcol .plist li .tsw:first-of-type{margin-left:auto}
.tsw{border:1px solid var(--rule);background:var(--surface);border-radius:6px;font-size:12px;cursor:pointer;padding:0 6px;margin-left:2px}
.panel{background:var(--surface);border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.cards{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sc{flex:none;width:100%;border:1.5px solid #d6c9aa;border-radius:8px;padding:4px 6px;background:#fbf7ee;cursor:pointer;text-align:left}
.sc.sel{border-color:var(--me);background:var(--me-soft)}
.sc.dead{opacity:.4;cursor:default}
.sc .h{display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px;font-family:var(--serif)}
.sc .h svg{width:24px;height:16px;flex:none}
.sc .h .sp{margin-left:auto;font-size:15px;line-height:1}
.sc .ic{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.sc .ic span{font-size:10px;font-weight:800;border:1px solid #d6c9aa;border-radius:4px;padding:0 3px;color:#a89a7c;line-height:1.5}
.sc .ic span.on{background:var(--me);border-color:var(--me);color:#fff}
.sc .ic span.wait{color:#a89a7c;border-style:dashed}
.sc .hpn{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.sc .h{font-size:12px}.sc .h svg{width:18px}}
.sc.mate{background:#eef3fa;border-color:#c9d6ea}.sc.mate.sel{border-color:#6f95cc}
.sc .own{font-size:10px;color:#4b6390;font-weight:700;line-height:1.2}
.sc .ns{display:none}@media (max-width:560px){.sc .nf{display:none}.sc .ns{display:inline}}
.sc .h span{white-space:nowrap}
.sc .hp{height:5px;border-radius:3px;background:var(--rule);margin:3px 0;overflow:hidden}
.sc .hp i{display:block;height:100%;background:var(--me)}
.sc .st{font-size:11px;color:var(--muted);line-height:1.35}
.sc .st b{color:var(--ink)}
.sc .sp{color:var(--en);font-weight:800}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.acts .hint{font-size:12px;color:var(--muted);flex:1;min-width:140px}
.rsw{position:fixed;inset:0;background:rgba(43,42,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.rsw[hidden]{display:none}
.rs{background:var(--surface);width:100%;max-width:640px;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 16px 24px;font-size:14px}
.rs header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.rs h2{margin:0;font-size:17px}.rs ol{padding-left:20px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px}
.cbadge{background:var(--me);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:320px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(40vh,300px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:10px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--me-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">机上</span>の海戦</h1><small>同時ターンの海戦 ・ <span id="ver">v16</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <div class="gbar"><span class="tn" id="tn"></span><span class="tm" id="tm"></span><span class="cap" id="cap"></span><span class="opp" id="opp"></span><button class="btn small" data-act="snd" id="sndbtn" aria-label="音">音あり</button><button class="btn small" data-act="rules">説明</button><button class="btn small" data-act="leave">退出</button></div>
  <div class="gmain"><div class="side" id="side" aria-label="自分の艦隊"></div>
  <div class="mapbox" id="mapbox"><canvas id="cv"></canvas><div class="capb" id="capb" hidden></div><div class="msg" id="msg"></div><div class="zoom"><button data-act="zin" aria-label="拡大">＋</button><button data-act="zout" aria-label="縮小">－</button><button data-act="zfit" aria-label="全体" style="font-size:13px">全体</button></div></div>
  <div class="eside" id="eside" aria-label="見つけた敵艦"></div></div>
  <div class="panel"><div class="acts" id="acts"></div></div>
</div>
<div class="rsw" id="rsheet" hidden><div class="rs" role="dialog" aria-label="説明"><header><h2>あそびかた</h2><button class="btn small" data-act="rclose">閉じる</button></header><div id="rbody"></div></div></div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 机上の海戦：部屋主が全部を計算し、それぞれのプレイヤーには「見えているもの」だけを送る。
   ターンは同時：両者が全艦の指示を出したら（または時間切れで）一斉に処理する */
const PREFIX='kaisen-room-';
const VER=16;
const W=800;               // 海図の広さ
// 陣地：side0（青）は下、side1（赤）は上。相手の陣地を占領すると勝ち
const BASE=[{x:W/2,y:W-95,r:75},{x:W/2,y:95,r:75}];
const DEPLOY=220; // 初期配置できる帯の深さ（自分の側の端から）
// 配置してよい場所か：自分の帯の中・島の上でない・味方の艦と重ならない
function deployOK(sd,x,y,id,ships,type){const z=T[type].size;if(x<z+6||x>W-z-6)return false;if(sd===0?(y<W-DEPLOY||y>W-z-6):(y>DEPLOY||y<z+6))return false;
  for(const [dx,dy] of [[0,0],[z,0],[-z,0],[0,z],[0,-z]])if(onIsland(x+dx,y+dy))return false;
  return !ships.some(s=>s.id!==id&&s.side===sd&&hyp(s.x-x,s.y-y)<T[s.type].size+z+6);}
const CAP_WIN=3,TURN_MAX=30,PER_MAX=10,BUDGETS=['10','15','20','25','30'],MAXP=8;
const BUDGET_NOW=()=>+(V&&(V.myBudget||V.budget)||H&&H.budget||15); // 自分が使える持ち点
const CORE=14;             // 直撃の円の半径
const BLOOM=2;             // 撃ったあと、見つかりやすい状態が続くターン数（撃ったターンを含む）
const RAM=0.15;            // 衝突：相手の最大体力の15%を受ける（重い艦にぶつかるほど痛い）
const spread=d=>15+0.09*d; // 着弾範囲の半径（遠いほど広い）
// 艦の性能（数字は仮）。turn＝いちばん小さい旋回半径
const T={
  bb:{name:'戦艦',cost:4,fwd:60,back:30,turn:120,range:420,dmg:40,spl:12,reload:2,conceal:300,hp:100,size:14},
  ca:{name:'巡洋艦',cost:3,fwd:90,back:35,turn:85,range:320,dmg:22,spl:7,reload:1,conceal:220,hp:60,size:11},
  dd:{name:'駆逐艦',cost:2,fwd:130,back:45,turn:55,range:200,dmg:10,spl:3,reload:1,conceal:140,hp:35,size:8,torp:{range:400,speed:100,dmg:35,reload:4,detect:150}}
};
const TYPES=['bb','ca','dd'];
let ISL=[]; // 島。戦闘ごとに部屋主が作って配る
// 島をランダムに作る：上半分に置いて、点対称に写す。陣地と開始位置のまわりには置かない
function genIslands(){
  for(let tries=0;tries<80;tries++){
    const n=4+Math.floor(Math.random()*3),cs=[];let ok=true;
    for(let i=0;i<n&&ok;i++){let placed=false;
      for(let k=0;k<200&&!placed;k++){const r=22+Math.random()*34,x=40+r+Math.random()*(W-80-2*r),y=40+r+Math.random()*(W/2-48-2*r);
        if(hyp(x-BASE[1].x,y-BASE[1].y)<BASE[1].r+r+40)continue;
        if(y-r<175&&x+r>215&&x-r<585)continue; // 開始位置
        const all=cs.concat(cs.map(c=>({x:W-c.x,y:W-c.y,r:c.r})));if(all.some(c=>hyp(c.x-x,c.y-y)<c.r+r+55))continue;
        if(hyp(W-x-x,W-y-y)<2*r+55)continue; // 写した自分とも離す
        cs.push({x,y,r});placed=true;}

/* ---------- 海図の操作：1本指で動かす／押すと指示、2本指・ホイールで拡大 ---------- */
const PT=new Map();let DRAG=null,PINCH=null;
// 指示の印（移動先・撃つ点・魚雷の向き）をつかむ。艦そのものをつかんでも移動先を動かせる
const headHandle=s=>{const c=w2s(s.x,s.y),a=hd(s.h);return [c[0]+Math.cos(a)*34,c[1]+Math.sin(a)*34];};
function grab(px,py){
  if(V&&V.phase==='deploy'){if(mySide()<0||(V.dready||{})[MYID])return null;const sel=D.sel&&shipById(D.sel);
    if(sel){const q=headHandle(sel);if(hyp(q[0]-px,q[1]-py)<16)return {id:sel.id,kind:'dhead'};}
    const hit=myShips().map(s=>{const q=w2s(s.x,s.y);return [s,hyp(q[0]-px,q[1]-py)];}).filter(a=>a[1]<20).sort((a,b)=>a[1]-b[1])[0];
    return hit?{id:hit[0].id,kind:'dpos'}:null;}
  if(!V||V.phase!=='plan'||D.ready||mySide()<0)return null;let best=null,bd=22;
  const cand=(id,kind,x,y)=>{const q=w2s(x,y),d=hyp(q[0]-px,q[1]-py);if(d<bd){bd=d;best={id,kind};}};
  myShips().forEach(s=>{if(!s.alive)return;const o=D.ord[s.id]||{},[bx,by]=endOf(s,o);
    if(o.fx!=null)cand(s.id,'fire',o.fx,o.fy);
    if(o.ta!=null)cand(s.id,'torp',bx+Math.cos(o.ta)*TORP_H,by+Math.sin(o.ta)*TORP_H);
    if(o.mx!=null)cand(s.id,'move',bx,by);});

  const sel=D.sel&&shipById(D.sel);if(!best&&sel&&sel.alive){const q=w2s(sel.x,sel.y);if(hyp(q[0]-px,q[1]-py)<18)best={id:sel.id,kind:'move'};}

}
const TORP_H=110; // 魚雷の向きをつかむ印の位置（艦からの距離）
// 範囲の外へ引っぱったときは、届くところまでに縮める
function dragTo(g,px,py){
  if(g.kind==='dpos'||g.kind==='dhead'){const s=shipById(g.id);if(!s)return;const [x,y]=s2w(px,py);
    if(g.kind==='dhead')s.h=Math.atan2(y-s.y,x-s.x);else if(deployOK(s.side,x,y,s.id,V.ships,s.type)){s.x=x;s.y=y;}return;}
  const s=shipById(g.id);if(!s)return;const [x,y]=s2w(px,py),t=T[s.type],o=D.ord[s.id]||(D.ord[s.id]={});
  if(g.kind==='move'){const p=fitMove(s,x,y);if(p){o.mx=p[0];o.my=p[1];}
}
  const [bx,by]=endOf(s,o);
  if(g.kind==='fire'){const d=hyp(x-s.x,y-s.y),k=d>t.range?t.range/d:1;o.fx=s.x+(x-s.x)*k;o.fy=s.y+(y-s.y)*k;}
  if(g.kind==='torp'&&hyp(x-bx,y-by)>4)o.ta=Math.atan2(y-by,x-bx);

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);PT.set(e.pointerId,[e.offsetX,e.offsetY]);

// 押したときの意味は、いまの指示の段階による
function tapMap(px,py){
  if(V&&V.phase==='deploy'){if(mySide()<0||(V.dready||{})[MYID])return;const [x,y]=s2w(px,py);
    const hit=myShips().map(s=>{const q=w2s(s.x,s.y);return [s,hyp(q[0]-px,q[1]-py)];}).filter(a=>a[1]<20).sort((a,b)=>a[1]-b[1])[0];
    if(hit){D.sel=hit[0].id;renderPanel();return;}
    const sel=D.sel&&shipById(D.sel);if(sel){if(deployOK(sel.side,x,y,sel.id,V.ships,sel.type)){sel.x=x;sel.y=y;send({t:'place',id:sel.id,x,y,h:sel.h});}else toast('帯の中で、島や味方と重ならない場所に置いてください');}
    return;}
  if(!V||V.phase!=='plan'||D.ready)return;const [x,y]=s2w(px,py);const me=mySide();
  // 自分の艦を押したら選ぶ
  const hit=myShips().filter(s=>s.alive).map(s=>{const p=w2s(s.x,s.y);return [s,hyp(p[0]-px,p[1]-py)];}).filter(a=>a[1]<20).sort((a,b)=>a[1]-b[1])[0];
  const sel=D.sel&&shipById(D.sel);

  if(!sel){return;}
  const o=D.ord[sel.id]||(D.ord[sel.id]={}),t=T[sel.type];
  if(D.mode==='move'){
    if(hit&&hit[0].id===sel.id){delete o.mx;delete o.my;afterMove(sel);return;}
    // 届かない点は、届く中でいちばん近い点にする（大きく離れていたら知らせる）
    const p=fitMove(sel,x,y);if(!p||hyp(p[0]-x,p[1]-y)>Math.max(60,30/CAM.s)){toast(onIsland(x,y)?'島は通れません':'そこまでは曲がれない・届きません');return;}
    o.mx=p[0];o.my=p[1];

function mateCard(s){const t=T[s.type],o=(V.teamOrders||{})[s.id]||{};

  Object.entries(V.lastSeen||{}).forEach(([id,q])=>{if(!rows.some(r=>r.id===id))rows.push({id,type:q.type,hp:q.hp,state:'old',age:V.turn-q.turn});});

let MSGK='';
function gameBar(){
  if(!V||!['plan','end','deploy'].includes(V.phase))return;const me=mySide();
  if(V.phase==='deploy'){$('#tn').textContent='初期配置';const rem=V.remain!=null?V.remain-(performance.now()-VIEWAT):null;$('#tm').textContent=rem!=null?fmtT(rem):'';$('#cap').textContent='';
    const dr=V.dready||{},ps=(V.players||[]).filter(p=>(V.inGame||[]).includes(p.id));$('#opp').textContent=`配置完了 ${ps.filter(p=>dr[p.id]).length}/${ps.length}`;$('#capb').hidden=true;$('#msg').innerHTML='';MSGK='';return;}
  $('#tn').textContent=`ターン ${V.turn} / ${TURN_MAX}`;
  const rem=V.remain!=null?V.remain-(performance.now()-VIEWAT):null;const tm=$('#tm');
  tm.textContent=V.phase==='plan'&&rem!=null?fmtT(rem):'';tm.classList.toggle('low',rem!=null&&rem<15000);
  const cap=V.cap||[0,0],o=me<0?1:1-me,mm=me<0?0:me;
  $('#cap').textContent=`占領 自分${cap[mm]}/${CAP_WIN}・相手${cap[o]}/${CAP_WIN}`;
  // 中央海域の確保：どちらかのカウントが進んだら、大きく知らせる
  const cb=$('#capb');let ct='',cc='';
  if(V.phase==='plan'&&me>=0){if(cap[o]>0){ct=`敵が自陣を占領中<br><span style="font-size:18px">あと${CAP_WIN-cap[o]}ターンで敗北</span>`;cc='en';}else if(cap[mm]>0){ct=`敵陣を占領中<br><span style="font-size:17px">あと${CAP_WIN-cap[mm]}ターンで勝利</span>`;cc='me';}}
  cb.hidden=!ct;if(ct&&cb.dataset.k!==ct){cb.dataset.k=ct;cb.innerHTML=ct;cb.className='capb '+cc;}
  {const pr=V.pready||{},ig=V.inGame||[],ps=(V.players||[]).filter(p=>ig.includes(p.id)&&p.online!==false),mates=ps.filter(p=>p.team===me),opp=ps.filter(p=>p.team!==me);
    $('#opp').textContent=V.phase==='plan'&&me>=0?`${mates.length>1?`味方 ${mates.filter(p=>pr[p.id]).length}/${mates.length}・`:''}相手：${opp.every(p=>pr[p.id])?'準備完了':'考え中'}`:'';}
  // 知らせ
  const ev=V.ev,msgs=[];
  if(ev&&V.phase==='plan'&&V.turn>1||ev&&V.phase==='end'){
    const myHit=ev.impacts.filter(i=>i.mine).reduce((a,i)=>a+i.hits.length,0),got=ev.impacts.filter(i=>!i.mine).reduce((a,i)=>a+i.hits.length,0);
    if(myHit)msgs.push(['good',`砲撃が${myHit}隻に命中`]);
    if(got)msgs.push(['bad',`敵の砲撃を${got}回受けた`]);
    ev.torpHits.forEach(th=>msgs.push([th.victim?'bad':'good',th.victim?'魚雷を受けた！':'魚雷が命中！']));
    (ev.colls||[]).forEach(cl=>msgs.push(['bad',cl.hits.every(h=>h.victim)?'味方どうしで衝突した':'敵艦と衝突した']));
    ev.sunk.forEach(sk=>msgs.push([sk.mine?'bad':'good',sk.mine?`${T[shipById(sk.id)?.type||'ca'].name}が撃沈された`:'敵艦を撃沈！']));
    if(ev.fires.length){const k=ev.fires.filter(f=>f.id).length,u=ev.fires.length-k;msgs.push(['bad',`敵の発砲 ${ev.fires.length}回${u?`（うち${u}回は見えない敵から）`:''}`]);}
    ev.notes.forEach(n=>msgs.push(['',n]));}
  if(V.phase==='plan'&&me>=0){const sp=myShips().filter(s=>s.alive&&s.spotted).length;if(sp)msgs.push(['bad',`！ 味方${sp}隻が発見されている`]);}
  const k=JSON.stringify(msgs);if(k!==MSGK){MSGK=k;$('#msg').innerHTML=msgs.slice(0,6).map(([c,t])=>`<div class="${c}">${esc(t)}</div>`).join('');}
}

  return `<div class="card stack"><h2>艦隊を編成</h2><div class="row"><span class="budget ${cost>BUDGET_NOW()?'over':''}">${cost} / ${BUDGET_NOW()}</span><span class="sub">持ち点の中で、自分が動かす艦を決めてください${V.myBudget!==V.budget?`（人数が少ないので${V.myBudget}点）`:''}</span></div>
    <div class="fl">${TYPES.map(k=>{const t=T[k];return `<div class="it">${markSVG(k,ME_C)}<div class="nm"><b>${t.name}</b> <span class="sub">コスト${t.cost}</span><div class="sub">${k==='bb'?'鈍重・長射程・高火力・見つかりやすい':k==='ca'?'中くらいの性能':'軽快・短射程・魚雷・見つかりにくい'}</div></div>
      <div class="cnt"><button data-act="fl" data-k="${k}" data-d="-1" ${rd||!f[k]?'disabled':''} aria-label="${t.name}を減らす">−</button><b>${f[k]}</b><button data-act="fl" data-k="${k}" data-d="1" ${rd||cost+t.cost>BUDGET_NOW()?'disabled':''} aria-label="${t.name}を増やす">＋</button></div></div>`;}).join('')}</div>
    <button class="btn ${rd?'':'primary'} wide" data-act="fready" ${ok?'':'disabled'}>${rd?'編成をやり直す':'この編成で出撃'}</button>
    <div class="sub center">${(V.players||[]).filter(p=>(V.inFleet||[]).includes(p.id)&&p.id!==MYID).map(p=>`${esc(p.name)}（${p.team===me?'味方':'敵'}）：${(V.freadyP||{})[p.id]?'出撃準備OK':'編成中'}`).join('<br>')}</div></div>
  <div class="card"><details class="rules"><summary>艦の性能</summary>${rulesHTML()}</details></div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  const playing=!!(V&&['plan','end','deploy'].includes(V.phase));
  const g=$('#game');const was=!g.hidden;g.hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);
  if(playing){if(!was){resize();homeView();}LASTKEY='';renderPanel();gameBar();return;}
  let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else{key=JSON.stringify([V.phase,V.players,V.timeSel,V.budget,V.freadyP,V.myBudget,V.wins,MYID,NET.status,D.fleet]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vFleet());}
  if(key===LASTKEY)return;
  $('#app').innerHTML=html;LASTKEY=key;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('kaisen-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code;NET.lost=false;joinRoom(c,'play');}
  else if(a==='leave'){if(NET.solo&&V&&V.phase!=='plan'||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='start')send({t:'start'});
  else if(a==='lobby')send({t:'lobby'});
  else if(a==='fl'){const k=b.dataset.k,d=+b.dataset.d;const f={...D.fleet};f[k]=Math.max(0,Math.min(PER_MAX,f[k]+d));if(fleetCost(f)<=BUDGET_NOW()){D.fleet=f;store.set('kaisen-fleet',JSON.stringify(f));render();}}
  else if(a==='fready'){const rd=!!(V.freadyP||{})[MYID];send({t:'fleet',f:D.fleet,ready:!rd});}
  else if(a==='pick'){if(V.phase==='plan'&&!D.ready)selectShip(b.dataset.id);else if(V.phase==='deploy'){D.sel=b.dataset.id;renderPanel();}}
  else if(a==='rotl'||a==='rotr'){const s=D.sel&&shipById(D.sel);if(s){s.h+=(a==='rotl'?-1:1)*Math.PI/8*(flip()?1:1);send({t:'place',id:s.id,x:s.x,y:s.y,h:s.h});}}
  else if(a==='dready'){send({t:'dready',v:!(V.dready||{})[MYID]});D.sel=null;}
  else if(a==='mmove'){D.mode='move';renderPanel();}
  else if(a==='mfire'){D.mode='fire';renderPanel();}
  else if(a==='nofire'){const o=D.ord[D.sel];if(o){delete o.fx;delete o.fy;}D.mode=null;sendOrders();renderPanel();}
  else if(a==='mtorp'){D.mode='torp';renderPanel();}
  else if(a==='notorp'){const o=D.ord[D.sel];if(o)delete o.ta;D.mode=null;sendOrders();renderPanel();}
  else if(a==='ready'){D.ready=!D.ready;if(D.ready){D.sel=null;D.mode=null;}clearTimeout(OT);send({t:'ord',o:D.ord,ready:D.ready});renderPanel();}
  else if(a==='snd'){SND.on=!SND.on;store.set('kaisen-snd',SND.on?'1':'0');if(SND.on){audio();sfx('gun',0,.3,0);}sndBtn();}
  else if(a==='etab')$('#eside').classList.toggle('open');
  else if(a==='focus'){const s=shipById(b.dataset.id)||(V.lastSeen||{})[b.dataset.id];if(s){let x=s.x,y=s.y;if(flip()){x=W-x;y=W-y;}CAM.x=x;CAM.y=y;clampCam();}$('#eside').classList.remove('open');}
  else if(a==='team')send({t:'team',pid:b.dataset.pid});
  else if(a==='addcpu')send({t:'addcpu',team:+b.dataset.team});
  else if(a==='rmcpu')send({t:'rmcpu',pid:b.dataset.pid});
  else if(a==='mate'){D.hl=D.hl===b.dataset.id?null:b.dataset.id;const s=shipById(b.dataset.id);if(s&&D.hl){let x=s.x,y=s.y;if(flip()){x=W-x;y=W-y;}CAM.x=x;CAM.y=y;clampCam();}renderPanel();}
  else if(a==='zin')zoomAt(1.3,CAM.w/2,CAM.h/2);
  else if(a==='zout')zoomAt(1/1.3,CAM.w/2,CAM.h/2);
  else if(a==='zfit')fitView();
  else if(a==='rules'){$('#rbody').innerHTML=rulesHTML();$('#rsheet').hidden=false;}
  else if(a==='rclose')$('#rsheet').hidden=true;
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(t.id==='timeSel')send({t:'timeSel',v:t.value});if(t.id==='budget')send({t:'budget',v:t.value});});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}});
(function(){let j=null;try{j=sessionStorage.getItem('kaisen-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j===room.toUpperCase())setTimeout(()=>joinRoom(room,'play'),0);})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
