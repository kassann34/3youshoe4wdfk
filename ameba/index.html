<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>アメーバホッケー</title>
<meta name="description" content="チームの全員で1匹のアメーバの手を動かして、パックを打ち合うホッケー">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列レイアウト。ゲーム中は画面いっぱい（いつも暗い色） */
:root{
  --bg:#f3f1ee; --surface:#fffdfb; --ink:#25222a; --muted:#6f6a75; --rule:#e2ddd8;
  --p:#e0702e; --p-soft:#fbe4d6; --accent:#25222a; --accent-ink:#fffdfb; --ok:#2f8f4e; --warn:#b3412f;
  --t0:#e0702e; --t1:#2f8ad8; --t0s:#fbe4d6; --t1s:#dbeafa;
  --shadow:0 2px 0 rgba(37,34,42,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--t0)}.logo h1 .pb{color:var(--t1)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.team{border:2px solid var(--c);background:var(--cs);border-radius:14px;padding:10px}
.team h3{margin:0 0 6px;font-size:15px;color:var(--c)}
.team ul{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.team li{padding:2px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.team li.off{opacity:.5}
.team li.me{font-weight:800}
.t0{--c:var(--t0);--cs:var(--t0s)}.t1{--c:var(--t1);--cs:var(--t1s)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
table.t th:first-child{text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--c)}
.win{font-size:24px;font-weight:800;text-align:center}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#08080b;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lv{position:absolute;left:10px;top:10px;background:rgba(20,20,26,.8);color:#eee;border:1px solid #36343e;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--font)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#f0edf3;font-size:96px;font-weight:800;font-family:var(--font);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.cd[hidden]{display:none}
.cd small{display:block;font-size:18px;font-weight:800;text-align:center}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
#game{background:#d9f0ee}
.cd{color:#24323a;text-shadow:0 2px 0 #fff}.cd>div{text-align:center}.cd small{color:#24323a;text-shadow:none}
.lv{background:rgba(255,255,255,.85);color:#24323a;border-color:#8cc7c0}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">アメーバ</span><span class="pb">ホッケー</span></h1><small>みんなで1匹の手を動かす ・ <span id="ver">試作 v2</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <button class="lv" data-act="leave">退出</button>
  <div class="cd" id="cd" hidden></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* アメーバホッケー：2チームのアメーバがパックを打ち合うホッケー。
   ・各チームのアメーバには、チームの人数ぶんの手（触手）がある。1人が1本を動かす
   ・手を伸ばした向きへ体が引っぱられて進む。みんなが同じ向きに伸ばすと速い
   ・手の先でパックを打つ。速く振るほど強く飛ぶ
   ・分裂：自分の分だけ小さなアメーバになって、ひとりで動ける（小さいけど速い）。合体を押して仲間にふれると、もとにもどる
   ・相手のゴールにパックを入れたら1点
   部屋主がすべての動きを計算して配る。各自は自分の手の向きと、分裂・合体だけを送る */
const PREFIX='ameba-room-';
const VER=2;
const MAXP=10;
const AW=1200,AH=700,GOAL=230;          // 場の広さ・ゴールの口の高さ
const ARM=150,PULL=950,DRAG=2.2;        // 手の長さ・引っぱる強さ・水のねばり
const PR=18,PDRAG=.5;                   // パックの大きさ・すべりやすさ
const TIPR=15;                          // 手の先の大きさ
const HOLD=.9,SPIT=620,SPITM=140;      // 合体した体はパックを飲みこめる：飲みこんでから吐き出すまで（秒）・吐き出す速さ（＋中の人数ごと）
const TNAME=['オレンジ','ブルー'],TD=['#e0702e','#2f8ad8'],TL=['#ffc09a','#a8d4ff'],TB=['rgba(224,112,46,.55)','rgba(47,138,216,.55)'];
const CPUN=['ミドリムシ','ゾウリムシ','ミジンコ','ボルボックス','ツリガネムシ','クマムシ','ケイソウ','ラッパムシ'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('ameba-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('ameba-tok',TOK);}catch(e){}}
let NAME=store.get('ameba-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const blobR=m=>26+20*Math.sqrt(m);       // 体の大きさ（中の人数で決まる）

/* ---------- 部屋主の進行 ---------- */
function hostInit(){H={phase:'lobby',players:[],hostId:null,toSel:'5',timeSel:'180',sizeSel:'auto',inGame:[],pl:[],blobs:[],puck:null,S:[0,0],endAt:null,cdEnd:null,pause:0,result:null,wins:{},games:0,lastSnap:0,ev:[],bid:0};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);const c=[0,0];H.players.forEach(p=>c[p.team]++);
  H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true,team:c[0]<=c[1]?0:1});return id;}
const gameP=()=>H.players.filter(p=>H.inGame.includes(p.id));
function pubFor(pid){
  return {phase:H.phase,ver:VER,code:NET.code,solo:NET.solo,players:H.players.map(p=>({id:p.id,name:p.name,online:p.online,team:p.team})),hostId:H.hostId,
    specs:NET.conns.filter(c=>c.open&&!c._pid).length,toSel:H.toSel,timeSel:H.timeSel,sizeSel:H.sizeSel,inGame:H.inGame,
    pl:H.pl.map(p=>({id:p.id,name:p.name,team:p.team,cpu:!!p.cpu})),myIdx:H.pl.findIndex(p=>p.id===pid),
    result:H.result,wins:H.wins,games:H.games,cdRemain:H.cdEnd?Math.max(0,H.cdEnd-Date.now()):null};
}
function push(){NET.conns.forEach(c=>sendTo(c,{t:'view',v:pubFor(c._pid),you:c._pid||null}));setView(pubFor(H.hostId),H.hostId);}
function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function startGame(){
  absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);
  const hum=gameP(),cnt=[0,0];hum.forEach(p=>cnt[p.team]++);
  const size=H.sizeSel==='auto'?Math.max(2,cnt[0],cnt[1]):Math.max(+H.sizeSel,cnt[0],cnt[1]);
  const cn=shuffle(CPUN.slice());let ci=0;
  H.pl=hum.map(p=>({id:p.id,name:p.name,team:p.team}));
  for(let t=0;t<2;t++)for(let k=cnt[t];k<size;k++){H.pl.push({id:'cpu'+ci,name:cn[ci%cn.length],team:t,cpu:true});ci++;}
  H.pl.forEach(p=>Object.assign(p,{ax:0,ay:0,tx:0,ty:0,tvx:0,tvy:0,apart:false,blob:-1,hits:0,goals:0}));
  H.S=[0,0];H.result=null;H.ev=[];kickoff();H.phase='count';H.cdEnd=Date.now()+3000;H.endAt=null;
}
// キックオフ：チームごとに1つのアメーバにまとめて、自陣に置く
function kickoff(){H.blobs=[];H.bid=0;
  for(let t=0;t<2;t++){const ms=H.pl.map((p,i)=>i).filter(i=>H.pl[i].team===t);const b={id:++H.bid,team:t,x:t?AW*.78:AW*.22,y:AH/2,vx:0,vy:0,m:ms};H.blobs.push(b);ms.forEach(i=>{H.pl[i].blob=b.id;H.pl[i].apart=false;});}
  H.pl.forEach(p=>{const b=blobOf(p);p.tx=b.x;p.ty=b.y;p.tvx=p.tvy=0;});
  H.puck={x:AW/2,y:AH/2,vx:0,vy:0};H.stuck=0;H.ghost=0;H.hold=null;}
const blobOf=p=>H.blobs.find(b=>b.id===p.blob);
// 自分の分だけ分かれる／仲間にふれたらもどる
function split(i){const p=H.pl[i],b=blobOf(p);if(!b||b.m.length<2)return;b.m=b.m.filter(k=>k!==i);
  const a=Math.atan2(p.ay,p.ax)||Math.random()*6.28,r=blobR(b.m.length)+blobR(1)+4;
  const nb={id:++H.bid,team:p.team,x:b.x+Math.cos(a)*r,y:b.y+Math.sin(a)*r,vx:b.vx+Math.cos(a)*200,vy:b.vy+Math.sin(a)*200,m:[i]};H.blobs.push(nb);p.blob=nb.id;
  H.ev.push(['split',Math.round(nb.x),Math.round(nb.y),p.team]);}
function tryMerge(){for(let a=0;a<H.blobs.length;a++)for(let c=a+1;c<H.blobs.length;c++){const A=H.blobs[a],B=H.blobs[c];if(A.team!==B.team)continue;
  // どちらかに「合体したい」人がいて、分裂中の人がいない方とくっつく
  const want=X=>X.m.every(i=>!H.pl[i].apart);if(!want(A)||!want(B))continue;
  if(Math.hypot(A.x-B.x,A.y-B.y)<blobR(A.m.length)+blobR(B.m.length)+6){const n=A.m.length+B.m.length;A.x=(A.x*A.m.length+B.x*B.m.length)/n;A.y=(A.y*A.m.length+B.y*B.m.length)/n;A.vx=(A.vx+B.vx)/2;A.vy=(A.vy+B.vy)/2;
    A.m=A.m.concat(B.m);B.m.forEach(i=>H.pl[i].blob=A.id);H.blobs.splice(c,1);H.ev.push(['merge',Math.round(A.x),Math.round(A.y),A.team]);return;}}}
// CPU の手：パックの向こう側（相手ゴールの反対）から回りこんで打つ。自陣が手うすなら戻る
function cpuArm(i){const p=H.pl[i],b=blobOf(p),P=H.puck,gx=p.team?0:AW,gy=AH/2;
  if(H.hold&&H.hold.b===b.id){const dx=gx-b.x,dy=gy-b.y,l=Math.hypot(dx,dy)||1;p.ax=dx/l;p.ay=dy/l;return;} // 飲みこんだら相手ゴールへ向ける
  const dx=P.x-gx,dy=P.y-gy,dl=Math.hypot(dx,dy)||1,bx=Math.max(PR*2,Math.min(AW-PR*2,P.x+dx/dl*40)),by=Math.max(PR*2,Math.min(AH-PR*2,P.y+dy/dl*40)); // パックのうしろ（場の中）
  const k=b.m.indexOf(i),spread=(k-(b.m.length-1)/2)*.35;
  let tx=bx-b.x,ty=by-b.y;const near=Math.hypot(P.x-b.x,P.y-b.y)<blobR(b.m.length)+ARM*.9;
  if(near){tx=P.x-b.x+(P.x-gx)*-.0;ty=P.y-b.y;}
  const own=p.team?AW:0;if(Math.abs(P.x-own)<AW*.3&&Math.abs(b.x-own)>Math.abs(P.x-own)+40){tx=(P.x+own)/2-b.x;ty=P.y-b.y;}
  const a=Math.atan2(ty,tx)+spread,l=Math.min(1,Math.hypot(tx,ty)/ARM);p.ax=Math.cos(a)*Math.max(.6,l);p.ay=Math.sin(a)*Math.max(.6,l);}
function hostTick(dt){
  if(!H)return;const now=Date.now();
  if(H.phase==='count'&&now>=H.cdEnd){H.phase='play';H.cdEnd=null;H.endAt=now+(+H.timeSel)*1000;push();}
  if(H.phase!=='play')return;
  if(H.pause>0){H.pause-=dt;if(H.pause<=0){H.puck={x:AW/2,y:AH/2,vx:0,vy:0};H.stuck=0;H.ghost=0;H.stk=null;}}
  H.pl.forEach((p,i)=>{const P=!p.cpu&&H.players.find(x=>x.id===p.id);if(p.cpu||(P&&!P.online&&p.id!==H.hostId))cpuArm(i);});
  // 体：手の向きに引っぱられて進む（大きいほど重い）
  H.blobs.forEach(b=>{let fx=0,fy=0;b.m.forEach(i=>{const p=H.pl[i];fx+=p.ax;fy+=p.ay;});const m=b.m.length,sp=Math.pow(m,.3)*(H.hold&&H.hold.b===b.id?.75:1); // 大きいほど、そろえれば速い（飲みこみ中は少しおそい）
    b.vx+=(fx/m*PULL*sp-b.vx*DRAG)*dt;b.vy+=(fy/m*PULL*sp-b.vy*DRAG)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;

function createRoom(tries){

function joinRoom(code,want){

    c.on('error',()=>{});
  });

/* ---------- 入力：自分の手の向き ---------- */

let MYPOS=null,SENT=0;

addEventListener('keydown',e=>{if(!V||V.phase!=='play'&&V.phase!=='count')return;if(e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;

/* ---------- 描く ---------- */
const FONTF='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif';
// 画面の向き：自分のゴールが手前（横長なら左、縦長なら下）に来るように回す
const CAM={s:1,cxs:0,cys:0,w:0,h:0,th:0};
const toScreen=(x,y)=>{const dx=x-AW/2,dy=y-AH/2,c=Math.cos(CAM.th),s=Math.sin(CAM.th);return [CAM.cxs+(dx*c-dy*s)*CAM.s,CAM.cys+(dx*s+dy*c)*CAM.s];};
const toWorldDir=(dx,dy)=>{const c=Math.cos(-CAM.th),s=Math.sin(-CAM.th);return [dx*c-dy*s,dx*s+dy*c];};
function resize(){const d=Math.min(2,devicePixelRatio||1);CAM.w=cv.clientWidth;CAM.h=cv.clientHeight;cv.width=CAM.w*d;cv.height=CAM.h*d;cx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);
(function frame(now){requestAnimationFrame(frame);if(!V||(V.phase!=='count'&&V.phase!=='play'))return;if(cv.clientWidth!==CAM.w||cv.clientHeight!==CAM.h)resize();
  const st=interp();if(!st)return;
  if(V.myIdx>=0&&NET.role!=='host'&&now-SENT>50){SENT=now;const a=myArm();send({t:'arm',x:+a[0].toFixed(2),y:+a[1].toFixed(2)});}
  draw(st,now);})();
// 体の形：まるに、手の向きへふくらみと、ゆらゆら
function blobPath(x,y,r,arms,t,seed){cx.beginPath();const N=40;for(let k=0;k<=N;k++){const a=k/N*Math.PI*2;let rr=r*(1+.05*Math.sin(a*3+t*2.1+seed)+.04*Math.sin(a*5-t*1.7+seed*2));
    arms.forEach(([ax,ay])=>{const aa=Math.atan2(ay-y,ax-x),d=Math.cos(a-aa);if(d>0)rr+=r*.18*Math.pow(d,6);});
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;k?cx.lineTo(px,py):cx.moveTo(px,py);}cx.closePath();}
function draw(st,now){

  CAM.th=port?(myT?Math.PI/2:-Math.PI/2):(myT?Math.PI:0);
  CAM.s=port?Math.min((w-24)/AH,(h-170)/AW):Math.min((w-24)/AW,(h-110)/AH);CAM.cxs=w/2;CAM.cys=port?h/2-10:h/2+14;
  cx.fillStyle='#d9f0ee';cx.fillRect(0,0,w,h);
  cx.save();cx.translate(CAM.cxs,CAM.cys);cx.rotate(CAM.th);cx.scale(CAM.s,CAM.s);cx.translate(-AW/2,-AH/2);
  // 場（水の中のシャーレ）
  cx.fillStyle='#f3fbfa';cx.strokeStyle='#8cc7c0';cx.lineWidth=6;cx.beginPath();cx.roundRect?cx.roundRect(0,0,AW,AH,40):cx.rect(0,0,AW,AH);cx.fill();cx.stroke();
  cx.strokeStyle='rgba(140,199,192,.6)';cx.lineWidth=3;cx.beginPath();cx.moveTo(AW/2,0);cx.lineTo(AW/2,AH);cx.stroke();cx.beginPath();cx.arc(AW/2,AH/2,90,0,Math.PI*2);cx.stroke();
  [0,1].forEach(s=>{const gx=s?AW:0;cx.fillStyle=TB[s?1:0];cx.fillRect(s?AW-10:-6,AH/2-GOAL/2,16,GOAL);cx.strokeStyle=TD[s?1:0];cx.lineWidth=5;cx.beginPath();cx.moveTo(gx,AH/2-GOAL/2);cx.lineTo(gx,AH/2+GOAL/2);cx.stroke();
    cx.beginPath();cx.arc(gx,AH/2,GOAL/2+30,s?Math.PI/2:-Math.PI/2,s?Math.PI*1.5:Math.PI/2);cx.strokeStyle='rgba(140,199,192,.6)';cx.lineWidth=3;cx.stroke();});
  // 手（触手）と体
  const me=V.myIdx;MYPOS=null;const NAMES=[];
  st.B.forEach(b=>{const [id,team,x,y,...ms]=b,r=blobR(ms.length),arms=ms.map(i=>st.A[i]).filter(Boolean);if(ms.includes(me))MYPOS=[x,y];
    // 触手：体から先へ、だんだん細く
    ms.forEach(i=>{const a=st.A[i];if(!a)return;const dx=a[0]-x,dy=a[1]-y,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,bx=x+dx/d*r*.6,by=y+dy/d*r*.6,mx=(bx+a[0])/2+nx*Math.sin(t*3+i)*8,my=(by+a[1])/2+ny*Math.sin(t*3+i)*8;

      cx.fillStyle=i===me?'#fff':TL[team];cx.strokeStyle=TD[team];cx.lineWidth=i===me?5:3;cx.beginPath();cx.arc(a[0],a[1],TIPR,0,Math.PI*2);cx.fill();cx.stroke();});
    cx.fillStyle=TB[team];blobPath(x,y,r,arms,t,id);cx.fill();cx.strokeStyle=TD[team];cx.lineWidth=4;cx.stroke();

    cx.strokeStyle='#ffd34d';cx.lineWidth=5;cx.beginPath();cx.arc(px,py,PR+8,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,st.h[1]));cx.stroke();}

  // 効果

    if(e[0]==='eat'||e[0]==='spit'||e[0]==='steal'){cx.globalAlpha=1-a;cx.strokeStyle=e[0]==='steal'?TD[e[3]]:'#ffd34d';cx.lineWidth=5;cx.beginPath();cx.arc(e[1],e[2],50+50*a,0,Math.PI*2);cx.stroke();cx.globalAlpha=1;}

}
function hud(st,now){

  const head=R.win<0?'引き分け':`<span style="color:${TD[R.win]}">${TNAME[R.win]}</span>の勝ち！`;
  return `<div class="card"><div class="win">${head}</div>${me&&R.win>=0?`<div class="center sub">${me.team===R.win?'あなたのチームの勝ちです':'あなたのチームの負けです'}</div>`:''}
    <div class="grid2" style="margin-top:10px">${[0,1].map(t=>`<div class="team t${t}"><h3>${TNAME[t]}</h3><div style="font-size:28px;font-weight:800">${R.S[t]}点</div><div class="sub">${R.rows.filter(r=>r.team===t&&r.goals).map(r=>`${esc(r.name)} ${r.goals}点`).join('・')||'&nbsp;'}</div></div>`).join('')}</div></div>
  <div class="card stack">${amHost()?`${teamsHTML()}${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次の試合を始めるのを待っています</span></div>'}</div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  const playing=!!(V&&(V.phase==='count'||V.phase==='play'));
  $('#game').hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);
  if(V&&V.phase==='play'&&!PLAYAT)PLAYAT=performance.now();if(!playing)PLAYAT=0;
  if(playing){LASTKEY='';return;}
  let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else{key=JSON.stringify([V.phase,V.players,V.toSel,V.timeSel,V.sizeSel,V.specs,V.games,MYID,NET.status]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vEnd());}
  if(key===LASTKEY)return;
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('ameba-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(['start','lobby','mix'].includes(a))send({t:a});
  else if(a==='team')send({t:'team',v:+b.dataset.v});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(['toSel','timeSel','sizeSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}});
(function(){let j=null;try{j=sessionStorage.getItem('ameba-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();

</script>
</body>
</html>
