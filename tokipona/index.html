<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トキポナ伝言</title>
<meta name="description" content="日本語とtoki ponaを交互に訳して回す、オンライン伝言ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: スマホ1台で遊ぶ前提の一列レイアウト。日本語＝墨、toki pona＝若草で全画面を通して区別する */
:root{
  --bg:#f3f4ec; --surface:#fdfdf8; --ink:#25271f; --muted:#6e7264; --rule:#dfe2d2;
  --tp:#3f7d3a; --tp-soft:#e1efd9; --ja:#4a3f6b; --ja-soft:#e7e2f2;
  --accent:#25271f; --accent-ink:#fdfdf8; --ok:#2f8f4e; --warn:#b3412f; --gold:#b98a14;
  --t0:#2a78d6; --t1:#eb6834; --t2:#1baf7a; --t3:#6250d6;
  --shadow:0 2px 0 rgba(37,39,31,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171914; --surface:#22251e; --ink:#eef0e6; --muted:#a3a896; --rule:#353a2e;
  --tp:#8fd384; --tp-soft:#24361f; --ja:#bcaef0; --ja-soft:#2d2840;
  --accent:#eef0e6; --accent-ink:#171914; --ok:#5ccf80; --warn:#ff8a73; --gold:#f0c14a;
  --t0:#3987e5; --t1:#d95926; --t2:#199e70; --t3:#9085e9;
  --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#171914; --surface:#22251e; --ink:#eef0e6; --muted:#a3a896; --rule:#353a2e;
  --tp:#8fd384; --tp-soft:#24361f; --ja:#bcaef0; --ja-soft:#2d2840;
  --accent:#eef0e6; --accent-ink:#171914; --ok:#5ccf80; --warn:#ff8a73; --gold:#f0c14a;
  --t0:#3987e5; --t1:#d95926; --t2:#199e70; --t3:#9085e9;
  --shadow:0 2px 0 rgba(0,0,0,.3);
}
/* シテレンポナのフォント：nasin nanpa（jan Itan作、MITライセンス。nasin-nanpa-LICENSE.txt） */
@font-face{font-family:"nasin-nanpa";src:url("nasin-nanpa.woff2") format("woff2");font-display:block}
.sp{font-family:"nasin-nanpa";font-weight:400;line-height:1}
.w .sp{font-size:30px;margin:2px 0}
.w .lat{font-size:11px;font-weight:700;color:var(--muted)}
.w.spw{padding:4px 6px}
.words button .spg{display:block;font-family:"nasin-nanpa";font-size:28px;line-height:1;color:var(--tp);margin-bottom:2px}
.w .yomi{font-size:10px;font-weight:700;color:var(--tp);line-height:1.1}
.words button .ym{display:block;font-size:10px;color:var(--tp);font-weight:700}
.guide{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.guide[hidden]{display:none}
.guide .sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px 28px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.guide .sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0}
.guide h2{margin:0;font-size:18px}
.guide h3{margin:14px 0 4px;font-size:15px;color:var(--tp)}
.guide p{margin:4px 0;font-size:14px}
.ex{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:14px}
.ex b{color:var(--tp);font-size:16px}
.ex .y{color:var(--muted);font-size:12px;margin-left:4px}
.ex .m{display:block;color:var(--ink)}
.kana{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:13px;text-align:center}
.kana div{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:2px}
.spline{font-family:"nasin-nanpa";font-size:28px;line-height:1.2;letter-spacing:2px;word-break:break-all}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.logo{flex-wrap:wrap}
.logo h1 .pa{color:var(--tp)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.chip.timer{border-color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.chip.timer.low{border-color:var(--warn);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--tp);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{border:2px solid var(--tc,var(--rule));border-radius:14px;padding:10px;background:var(--surface)}
.team h3{margin:0 0 6px;font-size:15px;color:var(--tc)}
.team ul{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.team li.me{font-weight:800}
.tbadge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-weight:800;color:#fff;background:var(--tc);font-size:13px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;background:var(--bg)}
.plist li .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.plist li.off{opacity:.55}.plist li.off .dot{background:var(--muted)}
.plist li.me{border-color:var(--ink)}
/* 文の表示：日本語とtoki pona */
.ja{border-left:4px solid var(--ja);background:var(--ja-soft);border-radius:10px;padding:10px 12px;font-size:19px;font-weight:700;word-break:break-word;white-space:pre-wrap}
.tpline{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-start;border-left:4px solid var(--tp);background:var(--tp-soft);border-radius:10px;padding:10px 12px;min-height:56px}
.w{display:inline-flex;flex-direction:column;align-items:center;border-radius:8px;padding:2px 6px;background:var(--surface);border:1px solid var(--rule);font-weight:800;font-size:17px;line-height:1.3;cursor:default}
.w small{font-size:10px;font-weight:500;color:var(--muted);max-width:7em;text-align:center;line-height:1.2}
.w.name{font-style:italic}
.w.p{background:none;border:0;padding:2px 0}
button.w{cursor:pointer}
button.w:hover{border-color:var(--warn)}
.tpline .empty{color:var(--muted);font-size:14px;align-self:center}
.lbl{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;color:#fff;margin-right:6px;vertical-align:middle}
.lbl.ja{background:var(--ja);border:0;padding:0 6px;font-size:11px;white-space:normal;display:inline-block}
.lbl.tp{background:var(--tp)}
/* 単語パレット */
.pal{border:1px solid var(--rule);border-radius:12px;padding:8px;background:var(--bg)}
.cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cats button{flex:none;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;min-height:30px}
.cats button.on{background:var(--tp);color:#fff;border-color:var(--tp)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:5px;max-height:300px;overflow-y:auto;margin-top:6px}
.words button{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:4px 6px;text-align:left;cursor:pointer;min-height:44px;line-height:1.2}
.words button b{display:block;font-size:15px;color:var(--tp)}
.words button span{display:block;font-size:10px;color:var(--muted)}
.words button:hover{border-color:var(--tp)}
/* 進み具合 */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chain>li{display:flex;gap:10px;align-items:flex-start}
.chain .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--rule);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.chain .num.done{background:var(--ok);color:#fff}
.chain .num.now{background:var(--gold);color:#fff}
.chain .body{flex:1;min-width:0}
.chain .who{font-size:13px;color:var(--muted)}
.prog{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.prog span{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--rule)}
.prog span.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.prog span.now{background:var(--gold);color:#fff;border-color:var(--gold)}
.prog span.me{outline:2px solid var(--ink)}
.vote{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:2px solid var(--rule);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;margin-bottom:6px}
.vote.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.vote:disabled{cursor:not-allowed;opacity:.5}
.vcount{margin-left:auto;font-weight:800;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:left}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.me td{font-weight:800}
.rank{font-weight:800;width:3em;white-space:nowrap}
.rank.r1{color:var(--gold)}
.winner{text-align:center}
.winner .crown{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.2em}
.winner .nm{font-size:26px;font-weight:800}
details summary{cursor:pointer;font-weight:700}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.97)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dots::after,.pop{animation:none}}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--tp);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--tp-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-to{font-size:11px;color:var(--muted);padding:6px 10px 0}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:20}
</style>
</head>

    case 'flip':if(H.phase==='reveal'&&inG){if(H.rev<maxSteps())H.rev++;}break;
    case 'flipall':if(H.phase==='reveal'&&inG)H.rev=maxSteps();break;
    case 'tovote':if(H.phase==='reveal'&&inG&&H.rev>=maxSteps()){H.phase='vote';H.votes={};}break;
    case 'vote':if(H.phase==='vote'&&inG&&canVote(pid,m.k)){H.votes[pid]=String(m.k);if(gameP().filter(p=>p.online).every(p=>H.votes[p.id]!=null||!hasVoteChoice(p.id)))finishVote();}break;
    case 'closevote':if(isHost&&H.phase==='vote')finishVote();break;
    case 'next':if(H.phase==='result'&&inG&&m.round===H.round){if(H.round>=H.rounds){H.phase='final';absorb();}else startRound();}break;
    case 'lobby':if(isHost&&H.phase==='final'){H.phase='lobby';H.hist=[];H.round=0;absorb();H.players=H.players.filter(p=>p.online);}break;
  }
  push();
}
function hasVoteChoice(pid){
  if(H.mode==='team')return H.chains.some(c=>c.team!==teamOfP(pid));
  return H.chains.some(c=>c.steps.some(s=>s.text!=null&&s.pid!==pid));
}
function hostWire(c){
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(m.ver!==VER){sendTo(c,{t:'reload',ver:VER});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
      if(!NET.conns.includes(c))NET.conns.push(c);
      c._tok=typeof m.tok==='string'?m.tok.slice(0,40):null;c._want=m.want==='watch'?'watch':'play';c._name=clean(m.name,12);
      let P=c._tok?H.players.find(p=>p.tok===c._tok&&p.id!==H.hostId):null;
      if(P){NET.conns.forEach(o=>{if(o!==c&&o._pid===P.id)o._pid=null;});c._pid=P.id;P.online=true;if(c._name)P.name=c._name;}
      else if(c._want==='play'&&(H.phase==='lobby'||H.phase==='final')&&H.players.length<MAXP)c._pid=addPlayer(c._tok,c._name);
      else c._pid=null;
      push();sendTo(c,{t:'chathist',list:CHAT.list});return;
    }
    if(m.t==='chat'){if(NET.conns.includes(c))hostChat(c._pid,c._name,m.tx);return;}
    if(c._pid)act(c._pid,m);
  });
  c.on('close',()=>{
    NET.conns=NET.conns.filter(o=>o!==c);
    if(c._pid&&!NET.conns.some(o=>o._pid===c._pid)){const P=H.players.find(p=>p.id===c._pid);if(P){P.online=false;if(H.phase==='lobby'){H.players=H.players.filter(p=>p!==P);delete H.teamOf[P.id];}}}
    push();
  });
  c.on('error',()=>{});
}

/* ---------- チャット：ネタばれを防ぐため、お題づくりと回しているあいだは閉じる ---------- */
const CHAT={list:[],open:false,unread:0};
function sendTo(c,m){if(c&&c.open){try{c.send(m);}catch(e){}}}
const chatOpen=ph=>!(ph==='setq'||ph==='chain');
function hostChat(pid,specName,tx){
  tx=String(tx==null?'':tx).trim().slice(0,200);if(!tx||!H||!chatOpen(H.phase))return;
  const P=pid&&H.players.find(p=>p.id===pid);
  const msg={n:P?P.name:clean(specName||'観戦者',12)+'（観戦）',pid:pid||null,tx,ts:Date.now()};
  CHAT.list.push(msg);if(CHAT.list.length>100)CHAT.list.shift();
  addChat(msg);NET.conns.forEach(c=>sendTo(c,{t:'chat',c:msg}));
}
function cleanMsg(m){if(!m||typeof m.tx!=='string')return null;const tx=m.tx.trim().slice(0,200);if(!tx)return null;return {n:clean(m.n,20),pid:typeof m.pid==='string'?m.pid:null,tx,ts:+m.ts||Date.now()};}
const MYCHAT=[];
function addChat(c){if(NET.role!=='host'||!MYCHAT.includes(c)){MYCHAT.push(c);if(MYCHAT.length>100)MYCHAT.shift();}if(!CHAT.open&&c.pid!==MYID)CHAT.unread++;renderChat();}
function renderChat(){
  const box=$('#chat');if(!box)return;box.hidden=!(NET.role&&V);if(box.hidden)return;
  const ol=$('#chatlog');
  ol.innerHTML=MYCHAT.length?MYCHAT.map(c=>`<li class="${c.pid&&c.pid===MYID?'mine':''}"><span class="who">${esc(c.n)}</span>${esc(c.tx)}</li>`).join(''):'<li class="empty">まだメッセージはありません</li>';
  ol.scrollTop=ol.scrollHeight;
  const b=$('#chatbadge');b.hidden=!CHAT.unread;b.textContent=CHAT.unread>9?'9+':String(CHAT.unread);
  const ok=chatOpen(V.phase);$('#chatto').textContent=ok?'':'お題を回しているあいだは、ネタばれしないようにチャットを閉じています';
  $('#chatinput').disabled=!ok;$('#chatsend').disabled=!ok;
}
function toggleChat(){CHAT.open=!CHAT.open;$('#chatbody').hidden=!CHAT.open;$('#chattab').setAttribute('aria-expanded',String(CHAT.open));$('#chattab').firstChild.textContent=CHAT.open?'チャットを閉じる':'チャット';if(CHAT.open)CHAT.unread=0;renderChat();}
function sendChat(tx){tx=String(tx||'').trim().slice(0,200);if(!tx)return false;if(NET.role==='host')hostChat(H.hostId,null,tx);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,{t:'chat',tx});else return false;return true;}

/* ---------- 通信 ---------- */
function resetNet(){
  CHAT.list=[];CHAT.unread=0;MYCHAT.length=0;
  try{if(NET.conn)NET.conn.close();}catch(e){}
  NET.conns.forEach(c=>{try{c.close();}catch(e){}});
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  if(H)clearTimers();
  Object.assign(NET,{role:null,peer:null,conn:null,conns:[],code:null,status:''});H=null;V=null;MYID=null;
}
function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください';render();return true;}return false;}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });
  push();
}
function joinRoom(code,want){
  code=clean(code,8).toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';render();return;}
  if(noPeer())return;resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(m&&m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m&&m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m&&m.t==='chathist'&&Array.isArray(m.list)){MYCHAT.length=0;m.list.map(cleanMsg).filter(Boolean).forEach(x=>MYCHAT.push(x));renderChat();return;}
      if(m&&m.t==='view'&&m.v&&m.v.ver!==VER){NET.needReload=false;V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m&&m.t==='view'&&m.v){V=m.v;MYID=m.you||null;NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('tokipona-joined',code+':'+want);}catch(e){}render();}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{if(NET.peer!==peer)return;NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';if(!V){NET.role=null;}render();});
  render();
}
function send(m){if(NET.role==='host')act(H.hostId,m);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,m);}
function leave(){resetNet();setRoomURL(null);try{sessionStorage.removeItem('tokipona-joined');}catch(e){}render();}
function setRoomURL(code){try{const u=new URL(location.href);if(code)u.searchParams.set('room',code);else u.searchParams.delete('room');u.searchParams.delete('v');history.replaceState(null,'',u);}catch(e){}}
const roomLink=()=>{try{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',NET.code);return u.toString();}catch(e){return '';}};

function updTP(){const m=$('#mytp');if(m){m.innerHTML=tpHTML(D.tp,{edit:true,gloss:true,empty:'下のパレットから単語を選んでください'});}rerender();draft(D.tp.slice());}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='jointeam')send({t:'join',v:+b.dataset.v});
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='start')send({t:'start'});
  else if(a==='lobby')send({t:'lobby'});
  else if(a==='shuffle')send({t:'shuffle'});
  else if(a==='qex'){D.q=EXAMPLES[Math.floor(Math.random()*EXAMPLES.length)];rerender();draft(D.q);}
  else if(a==='setq'){if(clean(D.q,QLEN))send({t:'setq',text:D.q});}
  else if(a==='cat'){D.cat=b.dataset.v;const w=$('#words');rerender();const w2=$('#words');if(w2)w2.scrollTop=0;}
  else if(a==='addw'){if(D.tp.length<TPMAX){D.tp.push(b.dataset.w);updTP();}}
  else if(a==='rmw'){D.tp.splice(+b.dataset.i,1);updTP();}
  else if(a==='undo'){D.tp.pop();updTP();}
  else if(a==='clearw'){D.tp=[];updTP();}
  else if(a==='addname'){let n=clean(D.nm,16).toLowerCase().replace(/[^aeioujklmnpstw]/g,'');n=n?n[0].toUpperCase()+n.slice(1):'';if(NAME_RE.test(n)&&D.tp.length<TPMAX){D.tp.push(n);D.nm='';updTP();}else toast('a e i o u j k l m n p s t w の文字で、2文字以上にしてください');}
  else if(a==='gloss'){D.gloss=!D.gloss;rerender();}
  else if(a==='yomi'){D.yomi=!D.yomi;store.set('tokipona-yomi',D.yomi?'1':'0');rerender();}
  else if(a==='guide')openGuide();
  else if(a==='guideclose')$('#guide').hidden=true;
  else if(a==='submit'){if(!V.task)return;const v=V.task.type==='tp'?D.tp.slice():D.ja;if(V.task.type==='tp'?!v.length:!clean(v,JLEN))return;D.auto=true;send({t:'step',ci:V.task.ci,si:V.task.si,v});}
  else if(a==='skip'){if(confirm('この番をとばしますか？'))send({t:'skip',ci:+b.dataset.ci});}
  else if(a==='flip')send({t:'flip'});
  else if(a==='flipall')send({t:'flipall'});
  else if(a==='tovote')send({t:'tovote'});
  else if(a==='vote')send({t:'vote',k:b.dataset.k});
  else if(a==='closevote'){if(confirm('投票を締め切りますか？'))send({t:'closevote'});}
  else if(a==='next')send({t:'next',round:V.round});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){D.q=t.value;const c=$('#qcnt');if(c)c.textContent=D.q.length+' / '+QLEN+'字';const b=$('#qbtn');if(b)b.disabled=!clean(D.q,QLEN);draft(D.q);}
  else if(t.id==='ja'){D.ja=t.value;const c=$('#jacnt');if(c)c.textContent=D.ja.length+' / '+JLEN+'字';const b=$('#jabtn');if(b)b.disabled=!clean(D.ja,JLEN);draft(D.ja);}
  else if(t.id==='search'){D.search=t.value;const ws=document.createElement('div');ws.innerHTML=paletteHTML();const nw=ws.querySelector('#words'),ow=$('#words');if(nw&&ow)ow.replaceWith(nw);}
  else if(t.id==='nm')D.nm=t.value;
  else if(t.id==='code')D.code=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='name'){saveName();return;}
  if(!amHost())return;
  if(t.id==='modeSel')send({t:'modeSel',v:t.value});
  if(t.id==='teamsN')send({t:'teamsN',v:+t.value});
  if(t.id==='limitSel')send({t:'limitSel',v:t.value});
  if(t.id==='scriptSel')send({t:'scriptSel',v:t.value});
  if(t.id==='roundsSel')send({t:'roundsSel',v:t.value});
});
document.addEventListener('click',e=>{if(e.target&&e.target.id==='guide')$('#guide').hidden=true;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const g=$('#guide');if(g&&!g.hidden){g.hidden=true;return;}}
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
  else if(e.target.id==='nm'){e.preventDefault();$('[data-act="addname"]').click();}
  else if(e.target.id==='search'){e.preventDefault();const f=$('#words button');if(f)f.click();}
});
(function(){let j=null;try{j=sessionStorage.getItem('tokipona-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
