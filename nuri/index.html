<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ぬりうち</title>
<meta name="description" content="撃った跡だけ歩ける、チームで拠点を取り合う陣取りシューティング">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列レイアウト。ゲーム中は画面いっぱい（いつも暗い色） */
:root{
  --bg:#f3f1ee; --surface:#fffdfb; --ink:#25222a; --muted:#6f6a75; --rule:#e2ddd8;
  --p:#e0702e; --p-soft:#fbe4d6; --accent:#25222a; --accent-ink:#fffdfb; --ok:#2f8f4e; --warn:#b3412f;
  --t0:#e0702e; --t1:#2f8ad8; --t0s:#fbe4d6; --t1s:#dbeafa;
  --shadow:0 2px 0 rgba(37,34,42,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--t0)}.logo h1 .pb{color:var(--t1)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.team{border:2px solid var(--c);background:var(--cs);border-radius:14px;padding:10px}
.team h3{margin:0 0 6px;font-size:15px;color:var(--c)}
.team ul{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.team li{padding:2px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.team li.off{opacity:.5}
.team li.me{font-weight:800}
.t0{--c:var(--t0);--cs:var(--t0s)}.t1{--c:var(--t1);--cs:var(--t1s)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
table.t th:first-child{text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--c)}
.win{font-size:24px;font-weight:800;text-align:center}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#08080b;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lv{position:absolute;left:10px;top:10px;background:rgba(20,20,26,.8);color:#eee;border:1px solid #36343e;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--font)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#f0edf3;font-size:96px;font-weight:800;font-family:var(--font);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.cd[hidden]{display:none}
.cd small{display:block;font-size:18px;font-weight:800;text-align:center}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">ぬり</span><span class="pb">うち</span></h1><small>撃った跡だけ歩ける陣取り ・ <span id="ver">試作 v1</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <button class="lv" data-act="leave">退出</button>
  <div class="cd" id="cd" hidden></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ぬりうち：2チームの陣取りシューティング。
   ・弾の通り道が自分のチームの色になり、自分のチームの色の上だけ歩ける
   ・相手の弾に当たるか、足元を相手の色に塗られると、少しのあいだ退場してスタート地点から出直し
   ・拠点（円）の中を多く塗ったチームが拠点を持ち、持っている拠点の数だけ毎秒点が入る
   ・マップは毎回ランダム（点対称）。壁の向こうは見えない（仲間が見ているところは見える）
   部屋主が弾・塗り・CPU・点数を計算して配る。自分の動きは各自の画面で動かして位置を送る */
const PREFIX='nuri-room-';
const VER=1;
const MAXP=10;
const CS=20;              // マス目の大きさ
const PR=11;              // 人の半径
const SPD=200;            // 歩く速さ
const BSPD=760,BRANGE=420,BPAINT=1.3,BSPLASH=2.1; // 弾の速さ・射程・塗る太さ（マス）・止まったところの塗り
const FIRE_CD=.14,AMMO_MAX=12,AMMO_REG=3;          // 連射の間隔・インクの量と回復
const RESP=3;             // 退場している秒数
const VIS=440;            // 見える距離
const PT_R=4;             // 拠点の半径（マス）
const WIN_PTS=100;        // 先にこの点数で勝ち
const TNAME=['オレンジ','ブルー'];
const TC=[[240,132,64],[66,156,236]];       // 塗りの色
const TD=['#c4561a','#1d6dc0'],TL=['#ffb98a','#9fd0ff']; // 人の色（濃い・明るい）
const CPUN=['ペンキ','ローラー','ハケ','スプレー','チョーク','クレヨン','インク','パレット','マーカー','ブラシ'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('nuri-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('nuri-tok',TOK);}catch(e){}}
let NAME=store.get('nuri-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- マップ：種の数から、全員の画面で同じマップを作る ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const WALL=9;
// 点対称：(x,y) に置いたものは (GW-1-x, GH-1-y) にも置く。拠点はまんなかと、それぞれの陣地寄りに1つずつ
function genMap(seed,GW,GH){
  for(let tr=0;tr<40;tr++){
    const R=mulberry(seed+tr*7919),N=GW*GH,g=new Uint8Array(N),I=(x,y)=>y*GW+x;
    const set=(x,y,v)=>{if(x<0||y<0||x>=GW||y>=GH)return;g[I(x,y)]=v;g[I(GW-1-x,GH-1-y)]=v;};
    for(let x=0;x<GW;x++)set(x,0,WALL);for(let y=0;y<GH;y++)set(0,y,WALL);
    const nOb=Math.round(N/130);
    for(let k=0;k<nOb;k++){const x0=Math.floor(R()*GW),y0=Math.floor(R()*GH),r=R();
      if(r<.4){const w=2+Math.floor(R()*4),h=2+Math.floor(R()*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++)set(x0+x,y0+y,WALL);}
      else if(r<.8){const L=5+Math.floor(R()*9),th=1+(R()<.4?1:0),hz=R()<.5;for(let a=0;a<L;a++)for(let b=0;b<th;b++)hz?set(x0+a,y0+b,WALL):set(x0+b,y0+a,WALL);}
      else{const rr=1.2+R()*1.8;for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(x*x+y*y<=rr*rr)set(x0+x,y0+y,WALL);}}
    const clear=(cx,cy,r)=>{for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){if(x<1||y<1||x>=GW-1||y>=GH-1)continue;if((x-cx)**2+(y-cy)**2<=r*r)set(x,y,0);}};
    const by=Math.floor(GH/2)+Math.floor((R()-.5)*GH*.3);
    const bases=[[4,by],[GW-5,GH-1-by]];
    const top=R()<.5,px=GW*(.3+R()*.1),py=top?GH*(.18+R()*.1):GH*(.72+R()*.1);
    const pts=[[px,py],[(GW-1)/2,(GH-1)/2],[GW-1-px,GH-1-py]];
    clear(bases[0][0],bases[0][1],6.5);pts.forEach(p=>clear(p[0],p[1],PT_R+2));
    // つながっているか：スタート地点から歩いて行けるところだけ残す
    const seen=new Uint8Array(N),q=[I(bases[0][0],bases[0][1])];seen[q[0]]=1;
    for(let h=0;h<q.length;h++){const c=q[h],x=c%GW,y=(c-x)/GW;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=I(x+dx,y+dy);if(x+dx<0||y+dy<0||x+dx>=GW||y+dy>=GH||seen[n]||g[n]===WALL)continue;seen[n]=1;q.push(n);}}
    if(!seen[I(bases[1][0],bases[1][1])]||pts.some(p=>!seen[I(Math.round(p[0]),Math.round(p[1]))]))continue;
    for(let c=0;c<N;c++)if(!seen[c])g[c]=WALL;
    // スタート地点のまわりは最初から自分の色。ここは相手に塗られない
    const prot=new Uint8Array(N);
    bases.forEach((b,t)=>{for(let y=b[1]-4;y<=b[1]+4;y++)for(let x=b[0]-4;x<=b[0]+4;x++){if(x<1||y<1||x>=GW-1||y>=GH-1)continue;if((x-b[0])**2+(y-b[1])**2<=3.6*3.6&&g[I(x,y)]!==WALL){g[I(x,y)]=t+1;prot[I(x,y)]=1;}}});
    // 拠点の中のマス、拠点・スタート地点までの道のり（CPUが使う）
    const ptCells=pts.map(p=>{const a=[];for(let y=Math.floor(p[1]-PT_R-1);y<=p[1]+PT_R+1;y++)for(let x=Math.floor(p[0]-PT_R-1);x<=p[0]+PT_R+1;x++){if(x<0||y<0||x>=GW||y>=GH)continue;if((x-p[0])**2+(y-p[1])**2<=PT_R*PT_R&&g[I(x,y)]!==WALL)a.push(I(x,y));}return a;});
    const bfs=(sx,sy)=>{const d=new Int16Array(N).fill(-1),s=I(Math.round(sx),Math.round(sy)),qq=[s];d[s]=0;
      for(let h=0;h<qq.length;h++){const c=qq[h],x=c%GW,y=(c-x)/GW;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const n=I(nx,ny);if(d[n]>=0||g[n]===WALL)continue;
        if(dx&&dy&&(g[I(x+dx,y)]===WALL||g[I(x,y+dy)]===WALL))continue;d[n]=d[c]+1;qq.push(n);}}return d;};
    return {GW,GH,g,prot,bases,pts,ptCells,fields:pts.map(p=>bfs(p[0],p[1])),by:new Int8Array(N).fill(-1)};
  }
  return null;
}
const cellAt=(M,x,y)=>{const cx=Math.floor(x/CS),cy=Math.floor(y/CS);return cx<0||cy<0||cx>=M.GW||cy>=M.GH?-1:cy*M.GW+cx;};
const canStand=(M,team,x,y)=>{const c=cellAt(M,x,y);return c>=0&&M.g[c]===team+1;};
// 歩く：自分の色のマスにしか入れない（横と縦を別々に試して、ふちに沿ってすべる）
function movePlayer(M,p,mx,my,dt){let l=Math.hypot(mx,my);if(l<.05)return;if(l>1){mx/=l;my/=l;}
  const nx=p.x+mx*SPD*dt,ny=p.y+my*SPD*dt;if(canStand(M,p.team,nx,p.y))p.x=nx;if(canStand(M,p.team,p.x,ny))p.y=ny;}
// 壁までの距離（マス目をたどる）
function castRay(M,x,y,dx,dy,maxD){
  let cx=Math.floor(x/CS),cy=Math.floor(y/CS);const sx=dx>0?1:-1,sy=dy>0?1:-1;
  const tdx=dx?Math.abs(CS/dx):1e9,tdy=dy?Math.abs(CS/dy):1e9;
  let tmx=dx>0?((cx+1)*CS-x)/dx:dx<0?(cx*CS-x)/dx:1e9,tmy=dy>0?((cy+1)*CS-y)/dy:dy<0?(cy*CS-y)/dy:1e9,t=0;
  while(t<maxD){if(tmx<tmy){t=tmx;tmx+=tdx;cx+=sx;}else{t=tmy;tmy+=tdy;cy+=sy;}
    if(cx<0||cy<0||cx>=M.GW||cy>=M.GH||M.g[cy*M.GW+cx]===WALL)return Math.min(t,maxD);}
  return maxD;}
const losClear=(M,x1,y1,x2,y2)=>{const d=Math.hypot(x2-x1,y2-y1);if(d<1)return true;return castRay(M,x1,y1,(x2-x1)/d,(y2-y1)/d,d)>=d-1;};
// 拠点の持ち主：円の中で多く塗っていて、4割以上を塗ったチーム
function ptState(M){return M.ptCells.map(cs=>{let a=0,b=0;for(const c of cs){if(M.g[c]===1)a++;else if(M.g[c]===2)b++;}const n=cs.length||1;
  return [a>b&&a>=n*.4?0:b>a&&b>=n*.4?1:-1,Math.round(a/n*100),Math.round(b/n*100)];});}

/* ---------- 部屋主の進行 ---------- */
function hostInit(){H={ev:[],phase:'lobby',players:[],hostId:null,timeSel:'180',sizeSel:'auto',inGame:[],pl:[],bul:[],bid:0,map:null,seed:0,GW:0,GH:0,
  endAt:null,cdEnd:null,result:null,wins:{},games:0,lastSnap:0,diff:[],S:[0,0],ptT:0,pst:[]};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);const c=[0,0];H.players.forEach(p=>c[p.team]++);
  H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true,team:c[0]<=c[1]?0:1});return id;}
const gameP=()=>H.players.filter(p=>H.inGame.includes(p.id));
function pubFor(pid){
  return {phase:H.phase,ver:VER,code:NET.code,solo:NET.solo,players:H.players.map(p=>({id:p.id,name:p.name,online:p.online,team:p.team})),hostId:H.hostId,
    specs:NET.conns.filter(c=>c.open&&!c._pid).length,timeSel:H.timeSel,sizeSel:H.sizeSel,inGame:H.inGame,seed:H.seed,GW:H.GW,GH:H.GH,
    pl:H.pl.map(p=>({id:p.id,name:p.name,team:p.team,cpu:!!p.cpu})),myIdx:H.pl.findIndex(p=>p.id===pid),
    result:H.result,wins:H.wins,games:H.games,
    cdRemain:H.cdEnd?Math.max(0,H.cdEnd-Date.now()):null,remain:H.endAt?Math.max(0,H.endAt-Date.now()):null};
}
function push(){NET.conns.forEach(c=>sendTo(c,{t:'view',v:pubFor(c._pid),you:c._pid||null}));setView(pubFor(H.hostId),H.hostId);}
function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function startGame(){
  absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);
  const hum=gameP(),cnt=[0,0];hum.forEach(p=>cnt[p.team]++);
  const size=H.sizeSel==='auto'?Math.max(2,cnt[0],cnt[1]):Math.max(+H.sizeSel,cnt[0],cnt[1]);
  const cn=shuffle(CPUN.slice());let ci=0;
  H.pl=hum.map(p=>({id:p.id,name:p.name,team:p.team}));
  for(let t=0;t<2;t++)for(let k=cnt[t];k<size;k++){H.pl.push({id:'cpu'+ci,name:cn[ci%cn.length]+'（CPU）',team:t,cpu:true});ci++;}
  const n=H.pl.length;H.GW=Math.round(Math.min(124,Math.max(76,60+7*n)));H.GH=Math.round(H.GW*.62);
  do{H.seed=Math.floor(Math.random()*1e9);H.map=genMap(H.seed,H.GW,H.GH);}while(!H.map);
  H.pl.forEach((p,i)=>{Object.assign(p,{k:0,dth:0,paint:0,ammo:AMMO_MAX,cd:0,dead:0,life:0,aiT:0,goal:-1,bias:[rnd(0,25),rnd(0,10),rnd(0,25)]});spawn(p);});
  H.bul=[];H.diff=[];H.ev=[];H.S=[0,0];H.ptT=0;H.pst=ptState(H.map);H.result=null;H.phase='count';H.cdEnd=Date.now()+3000;H.endAt=null;
}
function spawn(p){const b=H.map.bases[p.team];for(let t=0;t<30;t++){const x=(b[0]+.5+rnd(-2.5,2.5))*CS,y=(b[1]+.5+rnd(-2.5,2.5))*CS;if(canStand(H.map,p.team,x,y)){p.x=x;p.y=y;return;}}p.x=(b[0]+.5)*CS;p.y=(b[1]+.5)*CS;}
// 塗る：半径 r マスの円。スタート地点のまわりと壁は塗れない
function paintAt(x,y,r,team,o){
  const M=H.map,cx=x/CS,cy=y/CS,v=team+1;
  for(let j=Math.floor(cy-r);j<=cy+r;j++)for(let i=Math.floor(cx-r);i<=cx+r;i++){
    if(i<0||j<0||i>=M.GW||j>=M.GH)continue;if((i+.5-cx)**2+(j+.5-cy)**2>r*r)continue;
    const c=j*M.GW+i;if(M.g[c]===WALL||M.prot[c]||M.g[c]===v)continue;
    M.g[c]=v;M.by[c]=o;H.diff.push(c,v);if(H.pl[o])H.pl[o].paint++;}
}
function fire(i,a){const p=H.pl[i];if(!p||p.dead>0||p.cd>0||p.ammo<1||!isFinite(a))return;
  p.cd=p.cpu?FIRE_CD*1.6:FIRE_CD*.8;p.ammo-=1;const dx=Math.cos(a),dy=Math.sin(a);
  H.bul.push({id:++H.bid,x:p.x+dx*PR,y:p.y+dy*PR,vx:dx*BSPD,vy:dy*BSPD,team:p.team,o:i,d:0});}
function kill(p,by){if(p.dead>0)return;p.dead=RESP;p.dth++;const k=H.pl[by];if(k&&k.team!==p.team)k.k++;H.ev.push([Math.round(p.x),Math.round(p.y),p.team]);}
// CPU：近くに見える相手がいれば撃つ。いなければ、まだ持っていない拠点へ向かって道を塗りながら進む
function cpuThink(i,dt){
  const p=H.pl[i],M=H.map,GW=M.GW;if(p.dead>0)return;
  let tg=null,bd=1e9;H.pl.forEach(q=>{if(q.team===p.team||q.dead>0)return;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<BRANGE*.92&&d<bd&&losClear(M,p.x,p.y,q.x,q.y)){bd=d;tg=q;}});
  p.aiT-=dt;
  if(p.aiT<=0){p.aiT=rnd(.15,.3);const c=cellAt(M,p.x,p.y);
    let best=-1,bv=1e9;M.fields.forEach((f,k)=>{const d=f[c];if(d<0)return;const v=d+p.bias[k]+(H.pst[k]&&H.pst[k][0]===p.team?70:0);if(v<bv){bv=v;best=k;}});
    p.goal=best;p.next=null;p.look=null;
    if(best>=0){const f=M.fields[best];let cur=c;const path=[];
      for(let s=0;s<6;s++){const x=cur%GW,y=(cur-x)/GW;let nb=-1,nv=f[cur];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const n=(y+dy)*GW+x+dx;if(f[n]>=0&&f[n]<nv){nv=f[n];nb=n;}}if(nb<0)break;path.push(nb);cur=nb;}
      const ctr=n=>[(n%GW+.5)*CS,(Math.floor(n/GW)+.5)*CS];
      if(path.length){p.next=ctr(path[0]);p.look=ctr(path[path.length-1]);}
      // 拠点の中にいるときは、まだ塗れていないところを塗る
      if(f[c]<=PT_R){const cs=M.ptCells[best].filter(n=>M.g[n]!==p.team+1);if(cs.length){p.look=ctr(cs[Math.floor(Math.random()*cs.length)]);}}}}
  if(tg){const a=Math.atan2(tg.y-p.y,tg.x-p.x)+rnd(-.14,.14);fire(i,a);}
  else if(p.look){let need=false;const L=Math.hypot(p.look[0]-p.x,p.look[1]-p.y);for(let s=CS/2;s<L;s+=CS/2){const x=p.x+(p.look[0]-p.x)*s/L,y=p.y+(p.look[1]-p.y)*s/L;if(!canStand(M,p.team,x,y)){need=true;break;}}
    if(need&&p.ammo>=1)fire(i,Math.atan2(p.look[1]-p.y,p.look[0]-p.x)+rnd(-.05,.05));}
  if(p.next&&!(tg&&bd<160)){const dx=p.next[0]-p.x,dy=p.next[1]-p.y,d=Math.hypot(dx,dy);if(d>3)movePlayer(M,p,dx/d*.85,dy/d*.85,dt);}
}
function hostTick(dt){
  if(!H)return;const now=Date.now();
  if(H.phase==='count'&&now>=H.cdEnd){H.phase='play';H.cdEnd=null;H.endAt=now+(+H.timeSel)*1000;push();}
  if(H.phase!=='play')return;
  const M=H.map;
  H.pl.forEach((p,i)=>{
    p.ammo=Math.min(AMMO_MAX,p.ammo+AMMO_REG*dt);if(p.cd>0)p.cd-=dt;
    if(p.dead>0){p.dead-=dt;if(p.dead<=0){p.dead=0;p.life++;p.ammo=AMMO_MAX;spawn(p);}return;}
    const P=!p.cpu&&H.players.find(x=>x.id===p.id);const auto=p.cpu||(P&&!P.online&&p.id!==H.hostId);
    if(auto)cpuThink(i,dt);
    // 足元が相手の色になったら退場
    const c=cellAt(M,p.x,p.y);if(c>=0&&M.g[c]===2-p.team)kill(p,M.by[c]);
  });
  // 弾：少しずつ進めて、通ったところを塗る。壁で止まる。相手に当たったら退場させる
  const keep=[];
  for(const b of H.bul){let alive=true;const st=Math.max(1,Math.ceil(BSPD*dt/(CS*.5)));
    for(let s=0;s<st&&alive;s++){const nx=b.x+b.vx*dt/st,ny=b.y+b.vy*dt/st,c=cellAt(M,nx,ny);
      if(c<0||M.g[c]===WALL){paintAt(b.x,b.y,BSPLASH*.8,b.team,b.o);alive=false;break;}
      b.x=nx;b.y=ny;b.d+=BSPD*dt/st;paintAt(b.x,b.y,BPAINT,b.team,b.o);
      for(const q of H.pl){if(q.team===b.team||q.dead>0)continue;if(Math.hypot(q.x-b.x,q.y-b.y)<PR+5){kill(q,b.o);paintAt(b.x,b.y,BSPLASH,b.team,b.o);alive=false;break;}}
      if(alive&&b.d>=BRANGE){paintAt(b.x,b.y,BSPLASH,b.team,b.o);alive=false;}}
    if(alive)keep.push(b);}
  H.bul=keep;
  // 点数：1秒ごとに、持っている拠点の数だけ
  H.pst=ptState(M);H.ptT+=dt;
  while(H.ptT>=1){H.ptT-=1;H.pst.forEach(s=>{if(s[0]>=0)H.S[s[0]]++;});}
  if(H.S[0]>=WIN_PTS||H.S[1]>=WIN_PTS||now>=H.endAt)endGame();
}
function endGame(){
  const M=H.map;let a=0,b=0;for(let c=0;c<M.g.length;c++){if(M.g[c]===1)a++;else if(M.g[c]===2)b++;}const tot=M.g.filter(v=>v!==WALL).length||1;
  const S=H.S.slice(),paint=[Math.round(a/tot*100),Math.round(b/tot*100)];
  const win=S[0]!==S[1]?(S[0]>S[1]?0:1):a!==b?(a>b?0:1):-1;
  H.phase='end';H.endAt=null;H.games++;
  const rows=H.pl.map((p,i)=>({i,id:p.id,name:p.name,team:p.team,cpu:!!p.cpu,k:p.k,dth:p.dth,paint:p.paint})).sort((x,y)=>x.team-y.team||y.paint-x.paint);
  if(win>=0)rows.filter(r=>r.team===win&&!r.cpu).forEach(r=>{H.wins[r.id]=(H.wins[r.id]||0)+1;});
  H.result={win,S,paint,rows};absorb();push();snapAll();
}
// 配る：人 [x,y,退場の残り(0.1秒),出直した回数,インク,倒した,倒された]、弾 [番号,x,y,チーム]、塗り替わったマス [番号,色]、点数、拠点
function snap(){const C=H.diff;H.diff=[];const E=H.ev;H.ev=[];
  return {t:'s',E,C,r:H.endAt?Math.max(0,H.endAt-Date.now()):0,S:H.S,O:H.pst,
    P:H.pl.map(p=>[Math.round(p.x),Math.round(p.y),Math.ceil(p.dead*10),p.life,Math.floor(p.ammo),p.k,p.dth]),B:H.bul.flatMap(b=>[b.id,Math.round(b.x),Math.round(b.y),b.team])};}
function snapAll(){if(!H||!H.pl.length)return;const m=snap();NET.conns.forEach(c=>sendTo(c,m));onSnap(m);}
const gridStr=()=>String.fromCharCode(...H.map.g.map(v=>48+v));
function act(pid,m){
  if(!H||!m)return;
  const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end';
  switch(m.t){
    case 'timeSel':if(isHost&&setup&&['120','180','300'].includes(m.v))H.timeSel=m.v;break;
    case 'sizeSel':if(isHost&&setup&&['auto','1','2','3','4','5'].includes(m.v))H.sizeSel=m.v;break;
    case 'team':{if(!setup)break;const P=H.players.find(p=>p.id===pid);if(P&&(m.v===0||m.v===1))P.team=m.v;break;}
    case 'mix':if(isHost&&setup){shuffle(H.players).forEach((p,i)=>{p.team=i%2;});}break;
    case 'start':if(isHost&&setup)startGame();break;
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);H.pl=[];H.bul=[];}break;
    case 'f':{if(H.phase!=='play')return;const i=H.pl.findIndex(x=>x.id===pid);fire(i,+m.a);return;}
    case 'p':{if(H.phase!=='play')return;const p=H.pl.find(x=>x.id===pid);if(!p||p.dead>0||+m.l!==p.life)return;
      const x=+m.x,y=+m.y;if(!isFinite(x)||!isFinite(y))return;p.x=Math.max(0,Math.min(H.GW*CS,x));p.y=Math.max(0,Math.min(H.GH*CS,y));return;}
  }
  push();
}
function hostWire(c){
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(m.ver!==VER){sendTo(c,{t:'reload',ver:VER});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
      if(!NET.conns.includes(c))NET.conns.push(c);
      c._tok=typeof m.tok==='string'?m.tok.slice(0,40):null;c._want=m.want==='watch'?'watch':'play';c._name=clean(m.name,12);
      let P=c._tok?H.players.find(p=>p.tok===c._tok&&p.id!==H.hostId):null;
      if(P){NET.conns.forEach(o=>{if(o!==c&&o._pid===P.id)o._pid=null;});c._pid=P.id;P.online=true;if(c._name)P.name=c._name;}
      else if(c._want==='play'&&(H.phase==='lobby'||H.phase==='end')&&H.players.length<MAXP)c._pid=addPlayer(c._tok,c._name);
      else c._pid=null;
      push();sendTo(c,{t:'chathist',list:CHAT.list});
      if(H.map&&(H.phase==='play'||H.phase==='count'))sendTo(c,{t:'g',seed:H.seed,g:gridStr()}); // 途中から入った人には今の塗りを丸ごと送る
      return;
    }
    if(m.t==='chat'){if(NET.conns.includes(c))hostChat(c._pid,c._name,m.tx);return;}
    if(c._pid)act(c._pid,m);
  });
  c.on('close',()=>{
    NET.conns=NET.conns.filter(o=>o!==c);
    if(c._pid&&!NET.conns.some(o=>o._pid===c._pid)){const P=H.players.find(p=>p.id===c._pid);if(P){P.online=false;if(H.phase==='lobby')H.players=H.players.filter(p=>p!==P);}}
    push();
  });
  c.on('error',()=>{});
}
// 部屋主の計算は一定間隔で回す（このタブを裏に回すと遅くなるので注意）
let HT=Date.now();
setInterval(()=>{if(NET.role!=='host'||!H)return;const now=Date.now();const dt=Math.min(.1,(now-HT)/1000);HT=now;
  if(H.phase==='count'||H.phase==='play'){
    if(H.phase==='play'){const i=H.pl.findIndex(p=>p.id===H.hostId);if(i>=0)myControl(H.pl[i],i,dt);}
    hostTick(dt);
    if(H.phase!=='end'&&now-H.lastSnap>=50){H.lastSnap=now;snapAll();}
  }},16);

/* ---------- チャット ---------- */
const CHAT={list:[],open:false,unread:0};
function sendTo(c,m){if(c&&c.open){try{c.send(m);}catch(e){}}}
function hostChat(pid,specName,tx){
  tx=String(tx==null?'':tx).trim().slice(0,200);if(!tx||!H)return;
  const P=pid&&H.players.find(p=>p.id===pid);
  const msg={n:P?P.name:clean(specName||'観戦者',12)+'（観戦）',pid:pid||null,tx,ts:Date.now()};
  addChat(msg);NET.conns.forEach(c=>sendTo(c,{t:'chat',c:msg}));
}
function cleanMsg(m){if(!m||typeof m.tx!=='string')return null;const tx=m.tx.trim().slice(0,200);if(!tx)return null;return {n:clean(m.n,20),pid:typeof m.pid==='string'?m.pid:null,tx,ts:+m.ts||Date.now()};}
function addChat(c){CHAT.list.push(c);if(CHAT.list.length>100)CHAT.list.shift();if(!CHAT.open&&c.pid!==MYID)CHAT.unread++;renderChat();}
function renderChat(){
  const box=$('#chat');if(!box)return;box.hidden=!(NET.role&&V&&!NET.solo);if(box.hidden)return;
  const ol=$('#chatlog');
  ol.innerHTML=CHAT.list.length?CHAT.list.map(c=>`<li class="${c.pid&&c.pid===MYID?'mine':''}"><span class="who">${esc(c.n)}</span>${esc(c.tx)}</li>`).join(''):'<li class="empty">まだメッセージはありません</li>';
  ol.scrollTop=ol.scrollHeight;
  const b=$('#chatbadge');b.hidden=!CHAT.unread;b.textContent=CHAT.unread>9?'9+':String(CHAT.unread);
}
function toggleChat(){CHAT.open=!CHAT.open;$('#chatbody').hidden=!CHAT.open;$('#chattab').setAttribute('aria-expanded',String(CHAT.open));$('#chattab').firstChild.textContent=CHAT.open?'チャットを閉じる':'チャット';if(CHAT.open)CHAT.unread=0;renderChat();}
function sendChat(tx){tx=String(tx||'').trim().slice(0,200);if(!tx)return false;if(NET.role==='host')hostChat(H.hostId,null,tx);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,{t:'chat',tx});else return false;return true;}

/* ---------- 通信 ---------- */
function resetNet(){
  CHAT.list=[];CHAT.unread=0;
  try{if(NET.conn)NET.conn.close();}catch(e){}
  NET.conns.forEach(c=>{try{c.close();}catch(e){}});
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:null,peer:null,conn:null,conns:[],code:null,status:'',solo:false});H=null;V=null;MYID=null;SN.length=0;ME.p=null;MAP=null;
}
function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください（ひとりで遊ぶことはできます）';render();return true;}return false;}
function soloRoom(){resetNet();NET.role='host';NET.solo=true;NET.code=null;hostInit();H.hostId=addPlayer(TOK,NAME);push();}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });
  push();
}
function joinRoom(code,want){
  code=clean(code,8).toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';render();return;}
  if(noPeer())return;
  resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='s'){onSnap(m);return;}
      if(m.t==='g'){onGrid(m);return;}
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m.t==='chathist'&&Array.isArray(m.list)){CHAT.list=m.list.map(cleanMsg).filter(Boolean).slice(-100);renderChat();return;}
      if(m.t==='view'&&m.v&&m.v.ver!==VER){V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('nuri-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}
function send(m){if(NET.role==='host')act(H.hostId,m);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,m);}
function leave(){resetNet();setRoomURL(null);try{sessionStorage.removeItem('nuri-joined');}catch(e){}render();}
function setRoomURL(code){try{const u=new URL(location.href);if(code)u.searchParams.set('room',code);else u.searchParams.delete('room');u.searchParams.delete('v');history.replaceState(null,'',u);}catch(e){}}
const roomLink=()=>{try{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',NET.code);return u.toString();}catch(e){return '';}};

/* ---------- 受け取り：マップ・塗り・位置 ---------- */
let MAP=null; // 自分の画面のマップ（部屋主は計算中のマップをそのまま使う）
const SN=[],FX=[];
let REMAIN=0,REMAIN_AT=0,LAST={S:[0,0],O:[]};
const ME={p:null,life:-1,cd:0,ammo:AMMO_MAX};
const mapCv=document.createElement('canvas'),mcx=mapCv.getContext('2d');let MIMG=null;
function cellRGB(M,c){const v=M.g[c],x=c%M.GW,y=(c-x)/M.GW,ch=(x+y)&1;
  if(v===WALL)return [86,84,98];
  if(v===0)return ch?[38,37,46]:[42,41,51];
  const b=TC[v-1],k=M.prot[c]?18:ch?-8:0;return [b[0]+k,b[1]+k,b[2]+k];}
function setCell(c){const M=MAP,o=c*4,r=cellRGB(M,c);MIMG.data[o]=r[0];MIMG.data[o+1]=r[1];MIMG.data[o+2]=r[2];MIMG.data[o+3]=255;}
function buildMapImage(){mapCv.width=MAP.GW;mapCv.height=MAP.GH;MIMG=mcx.createImageData(MAP.GW,MAP.GH);for(let c=0;c<MAP.g.length;c++)setCell(c);mcx.putImageData(MIMG,0,0);MAP.dirty=false;}
function ensureMap(){if(!V||!V.seed)return;if(MAP&&MAP.seed===V.seed)return;
  if(NET.role==='host'&&H&&H.map){MAP=H.map;}else{MAP=genMap(V.seed,V.GW,V.GH);}
  if(!MAP)return;MAP.seed=V.seed;buildMapImage();}
function onGrid(m){if(!V||m.seed!==V.seed)return;ensureMap();if(!MAP||typeof m.g!=='string')return;for(let c=0;c<MAP.g.length&&c<m.g.length;c++){const v=m.g.charCodeAt(c)-48;if(v>=0&&v<=WALL){MAP.g[c]=v;setCell(c);}}MAP.dirty=true;}
function onSnap(m){
  if(!m||!Array.isArray(m.P))return;ensureMap();
  if(MAP&&Array.isArray(m.C)){for(let i=0;i+1<m.C.length;i+=2){const c=m.C[i];if(c>=0&&c<MAP.g.length){MAP.g[c]=m.C[i+1];setCell(c);}}if(m.C.length)MAP.dirty=true;}
  SN.push({t:performance.now(),P:m.P,B:m.B||[]});while(SN.length>8)SN.shift();
  if(Array.isArray(m.E))m.E.forEach(e=>FX.push({x:+e[0],y:+e[1],team:+e[2],t:performance.now()}));
  REMAIN=+m.r||0;REMAIN_AT=performance.now();LAST.S=m.S||LAST.S;LAST.O=m.O||LAST.O;
  if(V&&V.myIdx>=0&&m.P[V.myIdx]&&NET.role!=='host'){const q=m.P[V.myIdx];
    // 出直したとき（と最初）は、部屋主の位置に合わせる
    if(!ME.p||ME.life!==q[3]){ME.p={x:q[0],y:q[1],team:V.pl[V.myIdx].team};ME.life=q[3];}
    ME.dead=q[2];ME.ammoS=q[4];}
}
function setView(v,you){
  const prev=V;V=v;MYID=you;
  if(!prev||prev.phase!==v.phase){if(v.phase==='count'||v.phase==='lobby'){ME.p=null;ME.life=-1;SN.length=0;FX.length=0;LAST={S:[0,0],O:[]};}}
  if(v.seed)ensureMap();
  render();
}
// 補間した今の位置
function interp(){
  if(NET.role==='host'&&H)return {P:H.pl.map(p=>[p.x,p.y,Math.ceil(p.dead*10),p.life,Math.floor(p.ammo),p.k,p.dth]),B:H.bul.map(b=>[b.x,b.y,b.team])};
  if(!SN.length)return null;
  const rt=performance.now()-100;let a=SN[0],b=SN[SN.length-1];
  for(let i=0;i<SN.length-1;i++){if(SN[i].t<=rt&&SN[i+1].t>=rt){a=SN[i];b=SN[i+1];break;}}
  if(rt>=b.t)a=b;
  const f=b.t>a.t?Math.min(1,Math.max(0,(rt-a.t)/(b.t-a.t))):1,L=(u,v)=>u+(v-u)*f;
  const P=b.P.map((q,i)=>{const o=a.P[i]||q;return o[3]!==q[3]?q.slice():[L(o[0],q[0]),L(o[1],q[1]),q[2],q[3],q[4],q[5],q[6]];});
  const ab={};for(let i=0;i<a.B.length;i+=4)ab[a.B[i]]=[a.B[i+1],a.B[i+2]];
  const B=[];for(let i=0;i<b.B.length;i+=4){const o=ab[b.B[i]];B.push(o?[L(o[0],b.B[i+1]),L(o[1],b.B[i+2]),b.B[i+3]]:[b.B[i+1],b.B[i+2],b.B[i+3]]);}
  return {P,B};
}

/* ---------- 入力：スマホは左で移動・右で狙って撃つ（ふたつのスティック）。PCはWASDで移動・マウスで狙ってクリックで撃つ ---------- */
const IN={keys:{},mv:null,am:null,mouse:{on:false,x:0,y:0,down:false}};
const cv=$('#cv'),cx=cv.getContext('2d');
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(e.pointerType==='mouse'){IN.mouse.on=true;IN.mouse.x=e.clientX;IN.mouse.y=e.clientY;if(e.button===0)IN.mouse.down=true;return;}
  const s={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};
  if(e.clientX<CAM.w/2){if(!IN.mv)IN.mv=s;}else if(!IN.am)IN.am=s;
  try{cv.setPointerCapture(e.pointerId);}catch(x){}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){IN.mouse.on=true;IN.mouse.x=e.clientX;IN.mouse.y=e.clientY;return;}
  for(const s of [IN.mv,IN.am])if(s&&s.id===e.pointerId){s.x=e.clientX;s.y=e.clientY;}});
const up=e=>{if(e.pointerType==='mouse'){IN.mouse.down=false;return;}if(IN.mv&&IN.mv.id===e.pointerId)IN.mv=null;if(IN.am&&IN.am.id===e.pointerId)IN.am=null;};
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,up));
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(!(V&&V.phase==='play'))return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(k)){IN.keys[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;delete IN.keys[k];});
addEventListener('blur',()=>{IN.keys={};IN.mv=IN.am=null;IN.mouse.down=false;});
const STICK=46;
function myMove(){const k=IN.keys;const kx=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),ky=(k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);return [kx/l,ky/l];}
  if(IN.mv){const dx=IN.mv.x-IN.mv.ox,dy=IN.mv.y-IN.mv.oy,l=Math.hypot(dx,dy);if(l>6){const m=Math.min(1,l/STICK);return [dx/l*m,dy/l*m];}}
  return [0,0];}
let LASTA=0;
function myAim(p){
  if(IN.am){const dx=IN.am.x-IN.am.ox,dy=IN.am.y-IN.am.oy;if(Math.hypot(dx,dy)>12){LASTA=Math.atan2(dy,dx);return {a:LASTA,fire:true};}return {a:LASTA,fire:false};}
  if(IN.mouse.on){const s=toScreen(p.x,p.y);LASTA=Math.atan2(IN.mouse.y-s[1],IN.mouse.x-s[0]);return {a:LASTA,fire:IN.mouse.down||!!IN.keys[' ']};}
  const mv=myMove();if(mv[0]||mv[1])LASTA=Math.atan2(mv[1],mv[0]);return {a:LASTA,fire:!!IN.keys[' ']};}
// 自分の動きと発射（部屋主は計算ループの中から呼ぶ）
function myControl(p,i,dt){
  const M=NET.role==='host'?H.map:MAP;if(!M)return;
  const dead=NET.role==='host'?p.dead>0:ME.dead>0;if(dead)return;
  const mv=myMove();movePlayer(M,p,mv[0],mv[1],dt);
  const am=myAim(p);ME.aim=am.a;
  if(am.fire){if(NET.role==='host')fire(i,am.a);else{ME.cd-=dt;if(ME.cd<=0&&(ME.ammoS||0)>=1){ME.cd=FIRE_CD;send({t:'f',a:+am.a.toFixed(3)});}}}
  else if(NET.role!=='host')ME.cd=Math.min(ME.cd,0);
}

/* ---------- 描く ---------- */
const FONTF='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif';
const CAM={x:0,y:0,s:1,w:0,h:0};
const toScreen=(x,y)=>[(x-CAM.x)*CAM.s+CAM.w/2,(y-CAM.y)*CAM.s+CAM.h/2];
const fogCv=document.createElement('canvas'),fcx=fogCv.getContext('2d');let DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CAM.w=innerWidth;CAM.h=innerHeight;cv.width=fogCv.width=CAM.w*DPR;cv.height=fogCv.height=CAM.h*DPR;cx.setTransform(DPR,0,0,DPR,0,0);fcx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let LASTF=performance.now(),SENDT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-LASTF)/1000);LASTF=now;
  const playing=V&&(V.phase==='count'||V.phase==='play');
  if(!playing||!MAP)return;
  const st=interp();if(!st)return;
  const mi=V.myIdx;
  if(NET.role!=='host'&&mi>=0&&ME.p&&V.phase==='play'){
    myControl(ME.p,mi,dt);
    if(now-SENDT>50){SENDT=now;send({t:'p',x:Math.round(ME.p.x),y:Math.round(ME.p.y),l:ME.life});}}
  if(mi>=0&&ME.p&&NET.role!=='host'&&st.P[mi]&&!(ME.dead>0)){st.P[mi][0]=ME.p.x;st.P[mi][1]=ME.p.y;}
  if(MAP.dirty){mcx.putImageData(MIMG,0,0);MAP.dirty=false;}
  draw(st,mi,now);
}
requestAnimationFrame(frame);
function draw(st,mi,now){
  const w=CAM.w,h=CAM.h,M=MAP,WW=M.GW*CS,WH=M.GH*CS,me=mi>=0?V.pl[mi]:null,myT=me?me.team:-1;
  // カメラ：自分を追う。観戦中は全体
  if(me&&st.P[mi]){CAM.s=Math.min(w,h)/600;CAM.x=st.P[mi][0];CAM.y=st.P[mi][1];}
  else{CAM.s=Math.min(w/(WW+40),h/(WH+40));CAM.x=WW/2;CAM.y=WH/2;}
  cx.fillStyle='#08080b';cx.fillRect(0,0,w,h);
  cx.save();cx.translate(w/2,h/2);cx.scale(CAM.s,CAM.s);cx.translate(-CAM.x,-CAM.y);
  cx.imageSmoothingEnabled=false;cx.drawImage(mapCv,0,0,WW,WH);
  // 壁は少し浮かせて見せる
  // 拠点
  M.pts.forEach((p,k)=>{const o=LAST.O[k]||[-1,0,0],X=(p[0]+.5)*CS,Y=(p[1]+.5)*CS,R=PT_R*CS;
    cx.lineWidth=4;cx.strokeStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(X,Y,R,0,Math.PI*2);cx.stroke();
    // 塗った割合を円のふちに
    [[o[1],0],[o[2],1]].forEach(([f,t],j)=>{if(!f)return;cx.strokeStyle=TD[t];cx.lineWidth=6;cx.beginPath();const s=j?-Math.PI/2-f/100*Math.PI*2:-Math.PI/2;cx.arc(X,Y,R,s,s+f/100*Math.PI*2);cx.stroke();});
    cx.fillStyle=o[0]>=0?TD[o[0]]:'rgba(20,20,26,.85)';cx.beginPath();cx.arc(X,Y,15,0,Math.PI*2);cx.fill();
    cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();cx.fillStyle='#fff';cx.font=`800 15px ${FONTF}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('ABC'[k],X,Y+1);});
  // 見えている範囲（自分と仲間から）
  const viewers=[];if(me)st.P.forEach((q,i)=>{if(V.pl[i]&&V.pl[i].team===myT&&!(q[2]>0))viewers.push(q);});
  const seen=(x,y)=>!me||viewers.some(q=>Math.hypot(q[0]-x,q[1]-y)<VIS&&losClear(M,q[0],q[1],x,y));
  // 弾
  st.B.forEach(b=>{if(b[2]!==myT&&!seen(b[0],b[1]))return;cx.fillStyle=TD[b[2]];cx.beginPath();cx.arc(b[0],b[1],5,0,Math.PI*2);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(b[0],b[1],2,0,Math.PI*2);cx.fill();});
  // やられたところ
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],a=(now-f.t)/600;if(a>1){FX.splice(i,1);continue;}if(f.team!==myT&&!seen(f.x,f.y))continue;
    cx.strokeStyle=TL[f.team];cx.globalAlpha=1-a;cx.lineWidth=3;cx.beginPath();cx.arc(f.x,f.y,10+40*a,0,Math.PI*2);cx.stroke();cx.globalAlpha=1;}
  // 人
  st.P.forEach((q,i)=>{const P=V.pl[i];if(!P||q[2]>0)return;if(P.team!==myT&&!seen(q[0],q[1]))return;
    const mine=i===mi;
    if(mine){const a=ME.aim!=null?ME.aim:LASTA;cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=2;cx.setLineDash([6,6]);cx.beginPath();cx.moveTo(q[0]+Math.cos(a)*16,q[1]+Math.sin(a)*16);cx.lineTo(q[0]+Math.cos(a)*BRANGE,q[1]+Math.sin(a)*BRANGE);cx.stroke();cx.setLineDash([]);}
    cx.fillStyle=TD[P.team];cx.beginPath();cx.arc(q[0],q[1],PR,0,Math.PI*2);cx.fill();
    cx.strokeStyle=mine?'#fff':TL[P.team];cx.lineWidth=mine?3.5:2;cx.stroke();
    if(!mine){cx.fillStyle='rgba(255,255,255,.85)';cx.font=`700 11px ${FONTF}`;cx.textAlign='center';cx.textBaseline='bottom';cx.fillText(P.name.replace('（CPU）',''),q[0],q[1]-PR-3);}});
  cx.restore();
  // 霧：見えていないところを暗く（塗りはうっすら見える）

    const N=150;viewers.forEach(q=>{fcx.beginPath();for(let k=0;k<=N;k++){const a=k/N*Math.PI*2,dx=Math.cos(a),dy=Math.sin(a),d=castRay(M,q[0],q[1],dx,dy,VIS),s=toScreen(q[0]+dx*d,q[1]+dy*d);k?fcx.lineTo(s[0],s[1]):fcx.moveTo(s[0],s[1]);}fcx.closePath();fcx.fill();});

}
function hud(st,mi,now){
  const w=CAM.w,h=CAM.h,M=MAP,me=mi>=0?V.pl[mi]:null;
  // 点数（上のまんなか）
  const remain=V.phase==='play'?(NET.role==='host'&&H?Math.max(0,H.endAt-Date.now()):Math.max(0,REMAIN-(performance.now()-REMAIN_AT))):(+V.timeSel)*1000;
  const narrow=w<700,bw=Math.max(56,Math.min(150,w/2-42-72)),y0=14,S=LAST.S;
  [0,1].forEach(t=>{const x=t?w/2+42:w/2-42-bw;cx.fillStyle='rgba(20,20,26,.8)';rr(x,y0,bw,16,8);cx.fill();
    const f=Math.min(1,S[t]/WIN_PTS);cx.fillStyle=TD[t];if(t)rr(x,y0,bw*f,16,8);else rr(x+bw*(1-f),y0,bw*f,16,8);if(f>0)cx.fill();
    cx.fillStyle='#fff';cx.font=`800 12px ${FONTF}`;cx.textBaseline='middle';cx.textAlign=t?'right':'left';cx.fillText(String(S[t]),t?x+bw-7:x+7,y0+8.5);});
  cx.fillStyle=remain<20000&&V.phase==='play'?'#ff9a8a':'#fff';cx.font=`800 20px ${FONTF}`;cx.textAlign='center';cx.fillText(fmtT(remain),w/2,y0+8);
  // 拠点の持ち主
  (LAST.O||[]).forEach((o,k)=>{const x=w/2+(k-1)*26,y=y0+34;cx.fillStyle=o[0]>=0?TD[o[0]]:'rgba(20,20,26,.85)';cx.beginPath();cx.arc(x,y,10,0,Math.PI*2);cx.fill();cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=1.5;cx.stroke();
    cx.fillStyle='#fff';cx.font=`800 11px ${FONTF}`;cx.fillText('ABC'[k],x,y+1);});
  // 全体マップ（右上）
  const mw=Math.min(150,w*.3),mh=mw*M.GH/M.GW,mx=w-mw-10,my=narrow?62:10;
  cx.globalAlpha=.85;cx.imageSmoothingEnabled=false;cx.drawImage(mapCv,mx,my,mw,mh);cx.globalAlpha=1;cx.strokeStyle='rgba(255,255,255,.4)';cx.lineWidth=1;cx.strokeRect(mx,my,mw,mh);
  const ms=mw/(M.GW*CS);
  M.pts.forEach((p,k)=>{const o=(LAST.O||[])[k]||[-1];cx.fillStyle=o[0]>=0?TD[o[0]]:'#fff';cx.beginPath();cx.arc(mx+(p[0]+.5)*CS*ms,my+(p[1]+.5)*CS*ms,4,0,Math.PI*2);cx.fill();cx.strokeStyle='#fff';cx.stroke();});
  st.P.forEach((q,i)=>{const P=V.pl[i];if(!P||q[2]>0||(me&&P.team!==me.team))return;cx.fillStyle=i===mi?'#fff':TL[P.team];cx.beginPath();cx.arc(mx+q[0]*ms,my+q[1]*ms,i===mi?3.5:2.5,0,Math.PI*2);cx.fill();});
  // インク・退場中（下のまんなか）
  if(me&&st.P[mi]){const q=st.P[mi];
    if(q[2]>0){cx.fillStyle='rgba(10,10,14,.75)';rr(w/2-110,h/2-34,220,68,14);cx.fill();cx.fillStyle='#fff';cx.font=`800 18px ${FONTF}`;cx.textAlign='center';cx.fillText('やられた！',w/2,h/2-10);cx.font=`700 14px ${FONTF}`;cx.fillText(`${(q[2]/10).toFixed(1)}秒で出直し`,w/2,h/2+14);}
    else{const am=NET.role==='host'?H.pl[mi].ammo:Math.min(AMMO_MAX,q[4]);const iw=Math.min(220,w*.5),ix=w/2-iw/2,iy=h-26;
      cx.fillStyle='rgba(20,20,26,.8)';rr(ix,iy,iw,10,5);cx.fill();cx.fillStyle=TL[me.team];rr(ix,iy,iw*am/AMMO_MAX,10,5);cx.fill();}
    cx.fillStyle='rgba(255,255,255,.8)';cx.font=`700 12px ${FONTF}`;cx.textAlign='left';cx.textBaseline='middle';cx.fillText(`倒した ${q[5]} ・ やられた ${q[6]}`,10,52);}
  // スティック
  [IN.mv,IN.am].forEach((s,j)=>{if(!s)return;cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=2;cx.beginPath();cx.arc(s.ox,s.oy,STICK,0,Math.PI*2);cx.stroke();
    const dx=s.x-s.ox,dy=s.y-s.oy,l=Math.hypot(dx,dy),m=Math.min(l,STICK);cx.fillStyle=j?'rgba(255,140,90,.55)':'rgba(255,255,255,.4)';cx.beginPath();cx.arc(s.ox+(l?dx/l*m:0),s.oy+(l?dy/l*m:0),20,0,Math.PI*2);cx.fill();});
  if(V.phase==='play'&&me&&now-PLAYAT<6000&&!IN.mv&&!IN.am){cx.globalAlpha=Math.min(1,(6000-(now-PLAYAT))/1000);cx.fillStyle='rgba(255,255,255,.8)';cx.font=`700 13px ${FONTF}`;cx.textAlign='center';
    cx.fillText(matchMedia('(pointer:coarse)').matches?'左を押して移動 ・ 右を押してひっぱった向きに撃つ':'WASDで移動 ・ マウスで狙ってクリックで撃つ',w/2,h-50);cx.globalAlpha=1;}

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
let VIEWAT=performance.now(),PLAYAT=0;

/* ---------- 画面（待合室・結果） ---------- */
const isPlayer=()=>!!(V&&MYID&&V.players.some(p=>p.id===MYID));
const amHost=()=>NET.role==='host';

  el.innerHTML=`${NET.code?`<span class="chip">部屋 <b>${esc(NET.code)}</b></span>`:'<span class="chip">ひとりで</span>'}<button class="btn small" data-act="leave">${NET.solo?'もどる':'退出'}</button>`;}
function vHome(){
  const qs=new URLSearchParams(location.search);if(!D.code&&qs.get('room'))D.code=qs.get('room').toUpperCase();
  return `<div class="card stack">
    <div><label class="f" for="name">あなたの名前</label><input type="text" id="name" maxlength="12" placeholder="例：たろう" value="${esc(NAME)}" autocomplete="nickname"></div>
    <button class="btn primary wide" data-act="create">部屋を作る</button>
    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    <button class="btn wide" data-act="solo">ひとりで遊ぶ（CPUと対戦）</button>
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>
  <div class="card"><details class="rules" open><summary>あそびかた</summary><ol>
    <li><b>オレンジ</b>と<b>ブルー</b>の2チームで戦います（足りない人数はCPU）。</li>
    <li>弾を撃つと、<b>通り道が自分のチームの色</b>になります。<b>自分のチームの色の上しか歩けません</b>。撃って道を作りながら進みます。</li>
    <li>相手の弾に当たるか、<b>立っているところを相手の色に塗られる</b>と、やられて3秒後にスタート地点から出直しです。</li>
    <li>場には拠点が3つ（A・B・C）。円の中をたくさん塗ったチームがその拠点を持ち、<b>持っている拠点の数だけ毎秒1点</b>入ります。先に${WIN_PTS}点か、時間切れのとき点が多いチームの勝ち。</li>
    <li>マップは毎回ちがいます。<b>壁の向こうは見えません</b>（仲間が見ているところは見えます）。</li>
    <li>スマホ：画面の左を押してスティックのように動かすと移動、右を押してひっぱると、その向きに撃ちます。PC：WASDか矢印で移動、マウスで狙ってクリック（スペースでも）で撃ちます。</li>
    <li>弾（インク）は撃つと減り、少しずつたまります。</li>
  </ol></details></div>`;
}
function settingsHTML(host){
  const dis=host?'':'disabled';const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="grid2">
    <div><label class="f" for="timeSel">制限時間</label><select id="timeSel" ${dis}>${opt([['120','2分'],['180','3分'],['300','5分']],V.timeSel)}</select></div>
    <div><label class="f" for="sizeSel">1チームの人数（CPUで足す）</label><select id="sizeSel" ${dis}>${opt([['auto','おまかせ'],['1','1人'],['2','2人'],['3','3人'],['4','4人'],['5','5人']],V.sizeSel)}</select></div></div>`;
}
function teamsHTML(){
  const me=V.players.find(p=>p.id===MYID);
  return `<div class="teams">${[0,1].map(t=>`<div class="team t${t}"><h3>${TNAME[t]}チーム</h3><ul>${V.players.filter(p=>p.team===t).map(p=>`<li class="${p.id===MYID?'me':''} ${p.online?'':'off'}">${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}${p.id===V.hostId?'<span class="sub">部屋主</span>':''}${V.wins[p.id]?`<span class="sub">${V.wins[p.id]}勝</span>`:''}</li>`).join('')||'<li class="sub">（CPU）</li>'}</ul>
    ${me&&me.team!==t?`<button class="btn small" data-act="team" data-v="${t}">ここに入る</button>`:''}</div>`).join('')}</div>
    ${amHost()&&!NET.solo?'<button class="btn small" data-act="mix" style="margin-top:8px">チームをまぜる</button>':''}`;
}
function vLobby(){
  const host=amHost(),n=V.players.length;
  return `${NET.solo?'':`<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code)}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>`}
  <div class="card stack"><h2>${NET.solo?'ひとりで遊ぶ':`参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}`}</h2>
    ${!isPlayer()&&!NET.solo?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${teamsHTML()}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">${NET.solo?'はじめる':'ゲームを始める'}</button>${!NET.solo?'<div class="note">部屋主の画面で計算しています。部屋主はゲーム中、このタブを開いたままにしてください。</div>':''}`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>`;
}
function vEnd(){
  const R=V.result;if(!R)return '';const me=V.myIdx>=0?V.pl[V.myIdx]:null;
  const head=R.win<0?'引き分け':`<span style="color:var(--t${R.win})">${TNAME[R.win]}チーム</span>の勝ち！`;
  return `<div class="card"><div class="win">${head}</div>${me&&R.win>=0?`<div class="center sub">${me.team===R.win?'あなたのチームの勝ちです':'あなたのチームの負けです'}</div>`:''}
    <div class="grid2" style="margin-top:10px">${[0,1].map(t=>`<div class="team t${t}"><h3>${TNAME[t]}</h3><div style="font-size:26px;font-weight:800">${R.S[t]}点</div><div class="sub">塗った広さ ${R.paint[t]}%</div></div>`).join('')}</div></div>
  <div class="card"><h2>ひとりずつ</h2><table class="t"><thead><tr><th>名前</th><th>塗ったマス</th><th>倒した</th><th>やられた</th></tr></thead><tbody>${R.rows.map(x=>`<tr class="${x.i===V.myIdx?'me':''} t${x.team}"><td><span class="sw"></span>${esc(x.name)}</td><td class="num">${x.paint}</td><td class="num">${x.k}</td><td class="num">${x.dth}</td></tr>`).join('')}</tbody></table></div>
  <div class="card stack">${amHost()?`${teamsHTML()}${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次のゲームを始めるのを待っています</span></div>'}</div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  const playing=!!(V&&(V.phase==='count'||V.phase==='play'));
  $('#game').hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);
  if(V&&V.phase==='count')VIEWAT=performance.now();
  if(V&&V.phase==='play'&&!PLAYAT)PLAYAT=performance.now();
  if(!playing)PLAYAT=0;
  if(playing){LASTKEY='';return;}
  let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else{key=JSON.stringify([V.phase,V.players,V.timeSel,V.sizeSel,V.specs,V.games,MYID,NET.status]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vEnd());}
  if(key===LASTKEY)return;
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('nuri-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='start')send({t:'start'});
  else if(a==='lobby')send({t:'lobby'});
  else if(a==='team')send({t:'team',v:+b.dataset.v});
  else if(a==='mix')send({t:'mix'});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}
  if(!amHost())return;if(t.id==='timeSel')send({t:'timeSel',v:t.value});if(t.id==='sizeSel')send({t:'sizeSel',v:t.value});});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
});
(function(){let j=null;try{j=sessionStorage.getItem('nuri-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
