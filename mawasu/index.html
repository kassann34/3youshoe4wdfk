<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>六角形パズル</title>
<meta name="description" content="ハンドルを回して、まわり6枚の色をそろえるパズル（試作）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 盤面は暗めの紺で固定。タイルは色に加えて中の印でも見分けられるようにする */
:root{--bg:#10131c;--panel:#1a1f2e;--ink:#eef1fa;--muted:#9aa3c0;--rule:#2c3550;--accent:#ffd166;--warn:#ff7b6b;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ttl{font-weight:800;letter-spacing:.06em;margin-right:auto;white-space:nowrap}
.ttl small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-size:18px;margin-left:3px;font-variant-numeric:tabular-nums}
.stat b.low{color:var(--warn)}
.btn{border:1.5px solid var(--rule);background:#232a3f;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:36px;font-size:13px}
@media (max-width:480px){.lbl,.mvs{display:none}.ttl small{display:none}.ttl{font-size:15px}.bar{gap:8px;padding:8px 10px}.stat{font-size:11px}.stat b{font-size:16px}.btn{padding:4px 8px}}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas.sw{display:block}
.ctrl{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--rule);justify-content:center}
.big{flex:1;max-width:320px;min-height:56px;border-radius:14px;border:2px solid var(--rule);background:#232a3f;font-size:16px;font-weight:800;cursor:pointer;touch-action:none}
.big.on{border-color:var(--accent);background:#3a3420;color:var(--accent)}
.big small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(6,8,14,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.box h1{margin:0 0 4px;font-size:24px;letter-spacing:.06em}
.box h2{margin:0 0 10px}
.box p,.box li{font-size:14px;line-height:1.7;color:#cfd5ea}
.box ol{padding-left:20px}
.sub{color:var(--muted);font-size:12px;margin:10px 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:#232a3f;font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);background:#3a3420}
.go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#2a2005;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.score{font-size:44px;font-weight:800;text-align:center;color:var(--accent)}

.vs{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.vs b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.vs b.low{color:var(--warn)}
.vs[hidden],.stat[hidden],.btn[hidden]{display:none}
.box input[type=text]{width:100%;border:1.5px solid var(--rule);background:#10131c;color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
.box .row{display:flex;gap:8px;margin-top:8px}
.box .code{font-size:34px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--accent)}
.box .err{color:var(--warn);font-size:13px;margin-top:6px}
.mode{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mode button{text-align:left;border:1.5px solid var(--rule);background:#232a3f;border-radius:14px;padding:12px;cursor:pointer}
.mode button b{display:block;font-size:16px}
.mode button span{font-size:12px;color:var(--muted)}
.ghost{width:100%;min-height:42px;margin-top:8px;border-radius:12px;border:1.5px solid var(--rule);background:transparent;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><div class="ttl">六角形パズル<small>試作 v5</small></div>
    <span class="stat" id="st1">そろえた<b id="sc">0</b></span><span class="stat mvs" id="st2">手数<b id="mv">0</b></span><span class="stat" id="tmw">残り<b id="tm">2:00</b></span>
    <span class="vs" id="vsinfo" hidden>自分<b id="mym">0</b>/10　相手<b id="opm">0</b>/10</span>
    <button class="btn" data-act="pause" id="bp" aria-label="一時停止">一時停止</button><button class="btn" data-act="look"><span aria-hidden="true">🎨</span><span class="lbl"> 見た目</span></button><button class="btn" data-act="help">？</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="ctrl"><button class="big" id="brev">↺ 左回り<small>押している間（PCはShiftか右クリック）</small></button></div>
</div>
<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 六角形パズル
   ・とがった角が上下に来る六角形の格子。外形も六角形で、盤面は動かない
   ・3マスに1つがハンドル。押すとまわりの6枚が60°ずつ回る。1枚のタイルは3つのハンドルに囲まれている
   ・ハンドルのまわり6枚が同じ色になったときだけ消え、その場に新しい6枚が現れる
   ・対戦：そろえるたびに相手の盤面へ「マーク」を送る。マークは3秒かけて飛んでいき、その間に自分もそろえると打ち消せる。
     マークのついたタイルが10枚になったら負け。マークつきのタイルを含む輪をそろえるとマークも消える */
const RAD=3,MARK_LOSE=10,FLY=3;
const DEF_COLORS=['#ff8a80','#ffd166','#6fd08c','#5fa8ff','#c08cff'];
let COLORS=(()=>{try{const a=JSON.parse(localStorage.getItem('mawasu-colors')||'null');if(Array.isArray(a)&&a.length===5&&a.every(c=>/^#[0-9a-f]{6}$/i.test(c)))return a;}catch(e){}return DEF_COLORS.slice();})();
let LOOK=(()=>{try{return localStorage.getItem('mawasu-look')||'mark';}catch(e){return 'mark';}})();
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const ring=(q,r)=>DIRS.map(([a,b])=>[q+a,r+b]);
const dist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(-q-r));
const isH=(q,r)=>(((q-r)%3)+3)%3===0;
const key=(q,r)=>q+','+r;
const HANDLES=[],TILES=[];
(function(){const seen=new Set();for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++){if(dist(q,r)>RAD||!isH(q,r))continue;HANDLES.push([q,r]);
  ring(q,r).forEach(([a,b])=>{const k=key(a,b);if(!seen.has(k)){seen.add(k);TILES.push([a,b]);}});}})();

/* ---------- 盤面：G は「いま操作している盤面」。COM の盤面を動かすときは一時的に差し替える ---------- */
let G=null,MB=null,CB=null; // MB=自分の盤面 CB=COMの盤面
let VS=null; // 対戦のとき {mode:'com'|'net', lv, opp:{cols,mk,marks,score,name}, over, result}
let OPT={n:+store.get('mawasu-n')||4,time:store.get('mawasu-time')||'120',lv:store.get('mawasu-lv')||'mid'};
let TID=0;
function makeBoard(n){const B={cells:{},n,t:0,score:0,moves:0,over:false,paused:false,pops:[],inc:[],sent:0,cancel:0};
  TILES.forEach(([q,r])=>B.cells[key(q,r)]={id:++TID,col:0,rot:null,clr:0,born:-1,mk:false});
  for(let k=0;k<50;k++){TILES.forEach(([q,r])=>B.cells[key(q,r)].col=Math.floor(Math.random()*n));if(!onBoard(B,()=>HANDLES.some(([q,r])=>full(q,r))))break;}
  return B;}
function onBoard(B,f){const s=G;G=B;try{return f();}finally{G=s;}}
function newGame(){VS=null;MB=G=makeBoard(OPT.n);G.limit=OPT.time==='0'?0:+OPT.time;CB=null;layout();}
const cell=(q,r)=>G.cells[key(q,r)];
function full(q,r){const cs=ring(q,r).map(([a,b])=>cell(a,b));return cs.every(c=>c&&!c.clr&&c.col===cs[0].col);}
function rotate(q,r,dir){
  if(!G||G.over||G.paused||(VS&&VS.over))return false;const rg=ring(q,r),cs=rg.map(([a,b])=>cell(a,b));if(cs.some(c=>!c||c.clr))return false;
  rg.forEach(([a,b],i)=>{const c=cs[(i-dir+6)%6];G.cells[key(a,b)]=c;c.rot={q,r,dir,k:0};});
  G.moves++;checkRings();return true;
}
function checkRings(){const res=[];
  HANDLES.forEach(([q,r])=>{if(!full(q,r))return;const cs=ring(q,r).map(([a,b])=>cell(a,b));res.push(cs.filter(c=>c.mk).length);
    const col=cs[0].col;cs.forEach(c=>c.clr=.5);G.score++;G.pops.push({q,r,t:0,col});G.glow={col,t:0};});
  if(res.length&&VS)attack(G,res);
}
function refill(c){c.col=Math.floor(Math.random()*G.n);c.clr=0;c.born=G.t;c.id=++TID;c.mk=false;}
const markCount=B=>Object.values(B.cells).filter(c=>c.mk).length;
/* ---------- マーク：1つそろえると1枚（マークを2枚以上含む輪なら2枚）。飛んでくる途中のものと打ち消し合う ---------- */
function attack(B,res){
  let n=res.reduce((s,m)=>s+(m>=2?2:1),0);
  while(n>0&&B.inc.length){const x=B.inc[0],k=Math.min(x.n,n);x.n-=k;n-=k;B.cancel+=k;if(!x.n)B.inc.shift();}
  if(n<=0)return;B.sent+=n;
  if(VS.mode==='com'){const T=B===MB?CB:MB;T.inc.push({n,at:T.t+FLY});}
  else if(VS.mode==='net'&&B===MB)netSend({t:'atk',n});
}
function landMarks(B,n){const free=Object.values(B.cells).filter(c=>!c.mk&&!c.clr);for(let i=0;i<n&&free.length;i++){const c=free.splice(Math.floor(Math.random()*free.length),1)[0];c.mk=true;c.mkT=B.t;}}
// 盤面1つ分の時間を進める（アニメーション・消えたあとの補充・届いたマーク）
function tick(B,dt){
  B.t+=dt;
  onBoard(B,()=>{let born=false;
    for(const k in G.cells){const c=G.cells[k];if(c.rot){c.rot.k+=dt/.15;if(c.rot.k>=1)c.rot=null;}if(c.clr){c.clr-=dt;if(c.clr<=0){refill(c);born=true;}}}
    if(born)checkRings();});
  B.pops.forEach(p=>p.t+=dt);B.pops=B.pops.filter(p=>p.t<1);if(B.glow)B.glow.t+=dt;
  if(VS){while(B.inc.length&&B.inc[0].at<=B.t){landMarks(B,B.inc.shift().n);}
    if(!VS.over&&markCount(B)>=MARK_LOSE)endVs(B===MB?'lose':'win');}
}
function step(dt){
  if(!G||G.over)return;
  if(!VS){if(G.paused||!$('#ov').hidden)return;tick(G,dt);if(G.limit&&G.t>=G.limit)finish();return;}
  if(VS.over||!VS.started)return;
  tick(MB,dt);
  if(VS.mode==='com'){tick(CB,dt);cpuThink(dt);}
  if(VS.mode==='net'){NET.stT=(NET.stT||0)-dt;if(NET.stT<=0){NET.stT=.4;netSend({t:'st',c:boardCols(MB),m:boardMk(MB),s:MB.score});}}
}
function finish(){G.over=true;const k=`mawasu-best-${G.n}-${G.limit}`,b=Math.max(+store.get(k)||0,G.score);store.set(k,b);
  showOv(`<h2>時間です</h2><div class="score">${G.score}</div><p style="text-align:center">輪をそろえました（${G.n}色・${G.moves}手）<br>この設定の最高：${b}</p>${optsHTML()}<button class="go" data-act="new">もう一度</button><button class="ghost" data-act="menu">はじめの画面へ</button>`);}
const boardCols=B=>TILES.map(([q,r])=>B.cells[key(q,r)].col),boardMk=B=>TILES.map(([q,r])=>B.cells[key(q,r)].mk?1:0);

/* ---------- COM：2手先まで読んで、輪がそろいそうな形へ寄せる。強さは考える間隔と迷う割合 ---------- */
const LV={easy:{name:'弱め',gap:2.2,miss:.3},mid:{name:'ふつう',gap:1.3,miss:.12},hard:{name:'つよめ',gap:.8,miss:.03}};
const RI=HANDLES.map(([q,r])=>ring(q,r).map(([a,b])=>TILES.findIndex(([x,y])=>x===a&&y===b)));
const WT=[0,0,1,4,16,64,1e5];
function aiScore(b){let s=0;for(const R of RI){const c=[0,0,0,0,0];R.forEach(i=>c[b[i]]++);s+=WT[Math.max(...c)];}return s;}
const aiRot=(b,h,d)=>{const R=RI[h],v=R.map(i=>b[i]);R.forEach((i,j)=>b[i]=v[(j-d+6)%6]);};
const aiFull=b=>RI.some(R=>R.every(i=>b[i]===b[R[0]]));
function aiMove(B){const b=boardCols(B);let best=null,bs=-1;
  for(let h=0;h<RI.length;h++)for(const d of [1,-1]){aiRot(b,h,d);let sc;
    if(aiFull(b))sc=1e12;else{sc=aiScore(b);for(let h2=0;h2<RI.length;h2++)for(const d2 of [1,-1]){if(h2===h&&d2===-d)continue;aiRot(b,h2,d2);const s2=aiFull(b)?1e9:aiScore(b);if(s2>sc)sc=s2*.999;aiRot(b,h2,-d2);}}
    sc+=Math.random();if(sc>bs){bs=sc;best=[h,d];}aiRot(b,h,-d);}
  return best;}
function cpuThink(dt){CB.think=(CB.think||LV[VS.lv].gap)-dt;if(CB.think>0)return;CB.think=LV[VS.lv].gap*(.75+Math.random()*.5);
  let mv;if(Math.random()<LV[VS.lv].miss)mv=[Math.floor(Math.random()*RI.length),Math.random()<.5?1:-1];else mv=aiMove(CB);
  if(mv)onBoard(CB,()=>rotate(HANDLES[mv[0]][0],HANDLES[mv[0]][1],mv[1]));}
function startCom(lv){VS={mode:'com',lv,over:false,started:true};MB=G=makeBoard(OPT.n);CB=makeBoard(OPT.n);G.limit=0;layout();$('#ov').hidden=true;ui();}
function endVs(res){VS.over=true;VS.result=res;if(VS.mode==='net'&&res==='lose')netSend({t:'lose'});
  const me=MB,msg=res==='win'?'勝ち！':'負け…';
  showOv(`<h2>${msg}</h2><p style="text-align:center">そろえた ${me.score} ・ 送ったマーク ${me.sent} ・ 打ち消し ${me.cancel}</p>
    ${VS.mode==='com'?`<button class="go" data-act="com" data-lv="${VS.lv}">もう一度（${LV[VS.lv].name}）</button>`:NET.role==='host'?'<button class="go" data-act="netstart">もう一度</button>':'<p style="text-align:center;color:var(--muted)">部屋主がもう一度を押すのを待っています</p>'}
    <button class="ghost" data-act="menu">はじめの画面へ</button>`);}

/* ---------- 通信：2人対戦。各自の盤面は自分の端末で動かし、送るのはマークと盤面の様子だけ ---------- */
const PREFIX='mawasu-room-',VER=4;
const NET={role:null,peer:null,conn:null,code:null,status:'',oppName:''};
let NAME=store.get('mawasu-name')||store.get('kimochi-name')||'';
function netSend(m){if(NET.conn&&NET.conn.open){try{NET.conn.send(m);}catch(e){}}}
function netLeave(){try{if(NET.conn)NET.conn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}Object.assign(NET,{role:null,peer:null,conn:null,code:null,status:'',oppName:''});
  try{const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u);}catch(e){}}
function wire(c){NET.conn=c;
  c.on('open',()=>{c.send({t:'hello',name:NAME,ver:VER});});
  c.on('data',m=>{if(!m||typeof m!=='object')return;
    if(m.t==='hello'){if(m.ver!==VER){NET.status='相手のページと版が違います。両方とも再読み込みしてください';showOv(roomHTML());return;}NET.oppName=String(m.name||'あいて').slice(0,10);NET.status='';showOv(roomHTML());}
    else if(m.t==='start'){OPT.n=+m.n||4;beginNet();}
    else if(m.t==='atk'&&VS&&!VS.over){MB.inc.push({n:Math.max(1,Math.min(6,+m.n||1)),at:MB.t+FLY});}
    else if(m.t==='st'&&VS){VS.opp={cols:m.c,mk:m.m,score:m.s};}
    else if(m.t==='lose'&&VS&&!VS.over)endVs('win');});
  c.on('close',()=>{if(NET.conn===c){NET.status='相手との接続が切れました';if(VS&&!VS.over){VS.over=true;}showOv(roomHTML());}});
  c.on('error',()=>{});}
function createRoom(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした';showOv(netHTML());return;}netLeave();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);Object.assign(NET,{role:'host',peer,code,status:'部屋を準備しています…'});
  peer.on('open',()=>{NET.status='';try{const u=new URL(location.href);u.searchParams.set('room',code);history.replaceState(null,'',u);}catch(e){}showOv(roomHTML());});
  peer.on('connection',c=>{if(NET.conn&&NET.conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300);});return;}wire(c);});
  peer.on('error',e=>{NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）';showOv(netHTML());});
  showOv(roomHTML());}
function joinRoom(code){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';showOv(netHTML());return;}
  if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした';showOv(netHTML());return;}netLeave();
  const peer=new Peer();Object.assign(NET,{role:'guest',peer,code,status:'接続しています…'});showOv(netHTML());
  peer.on('open',()=>{const c=peer.connect(PREFIX+code,{reliable:true});wire(c);c.on('data',m=>{if(m&&m.t==='full'){NET.status='その部屋はもう2人そろっています';showOv(netHTML());}});});
  peer.on('error',e=>{NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした':'つながりませんでした（'+((e&&e.type)||'error')+'）';showOv(netHTML());});}
function beginNet(){VS={mode:'net',over:false,started:true,opp:null};MB=G=makeBoard(OPT.n);G.limit=0;CB=null;layout();$('#ov').hidden=true;ui();}
function netHTML(){const qs=new URLSearchParams(location.search).get('room')||'';
  return `<h2>友だちと対戦</h2><label class="sub" for="pname">あなたの名前</label><input type="text" id="pname" maxlength="10" value="${esc(NAME)}" placeholder="例：たろう">
  <button class="go" data-act="create">部屋を作る</button>
  <div class="sub" style="margin-top:14px">部屋のコードで参加</div><div class="row"><input type="text" id="code" maxlength="4" value="${esc(qs)}" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn" data-act="join" style="min-height:44px">参加</button></div>
  ${NET.status?`<div class="${/でき|ません|切れ|見つかり|違い|そろって|入れて/.test(NET.status)?'err':'sub'}">${esc(NET.status)}</div>`:''}
  <button class="ghost" data-act="menu">もどる</button>`;}
function roomHTML(){if(!NET.role)return netHTML();
  return `<h2>${NET.role==='host'?'部屋を作りました':'部屋に入りました'}</h2>${NET.role==='host'?`<div class="sub">部屋のコード</div><div class="code">${esc(NET.code||'…')}</div><div class="row" style="justify-content:center"><button class="btn" data-act="copylink">参加リンクをコピー</button></div>`:''}
  <p style="text-align:center">${NET.conn&&NET.conn.open&&NET.oppName?`相手：<b>${esc(NET.oppName)}</b>`:'相手を待っています…'}</p>
  ${NET.status?`<div class="err" style="text-align:center">${esc(NET.status)}</div>`:''}
  ${NET.role==='host'?`<div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div>
    <button class="go" data-act="netstart" ${NET.conn&&NET.conn.open&&NET.oppName?'':'disabled'}>対戦を始める</button>`:'<p style="text-align:center;color:var(--muted)">部屋主が始めるのを待っています</p>'}
  <button class="ghost" data-act="menu">部屋を出る</button>`;}

/* ---------- 画面 ---------- */
const cv=$('#cv');let cx=cv.getContext('2d'),CW=0,CH=0,DPR=1,S=20,OX=0,OY=0,MS=6,MX=0,MY=0,TOPH=0;
const SQ3=Math.sqrt(3);
const raw=(q,r)=>[SQ3*(q+r/2),1.5*r];
const EXT=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let q=-RAD-1;q<=RAD+1;q++)for(let r=-RAD-1;r<=RAD+1;r++){if(dist(q,r)>RAD+1)continue;const [x,y]=raw(q,r);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}return {w:x1-x0+SQ3,h:y1-y0+2};})();
function layout(){const r=$('#stage').getBoundingClientRect();DPR=window.devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=CW*DPR;cv.height=CH*DPR;
  // 対戦では上の帯に相手の盤面（小さく）と、飛んでくるマークを出す
  TOPH=VS?Math.min(170,Math.max(110,CH*.22)):0;
  S=Math.min((CW-16)/(EXT.w+1.4),(CH-TOPH-16)/(EXT.h+1.4));/* 外側の光る枠の分だけ余白をとる */OX=CW/2;OY=TOPH+(CH-TOPH)/2;
  MS=Math.min((CW*.45)/EXT.w,(TOPH-14)/EXT.h);MX=CW-10-EXT.w*MS/2;MY=TOPH/2;}
new ResizeObserver(layout).observe($('#stage'));
const px=(q,r)=>{const [x,y]=raw(q,r);return [OX+x*S,OY+y*S];};
function drawTile(col,x,y,s,look){look=look||LOOK;
  if(look==='line'){hexPath(x,y,s*.8);cx.fillStyle='#1b2133';cx.fill();cx.strokeStyle=COLORS[col];cx.lineWidth=Math.max(1.5,s*.2);cx.lineJoin='round';cx.stroke();return;}
  hexPath(x,y,s*.92);cx.fillStyle=COLORS[col];cx.fill();if(look==='mark'&&s>10)mark(col,x,y,s*.22);}
function drawMk(x,y,s,fresh){hexPath(x,y,s*.92);cx.fillStyle='rgba(8,10,18,.32)';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=Math.max(1.2,s*.11);cx.lineCap='round';
  const k=s*.3*(fresh?1+fresh:1);cx.beginPath();cx.moveTo(x-k,y-k);cx.lineTo(x+k,y+k);cx.moveTo(x+k,y-k);cx.lineTo(x-k,y+k);cx.stroke();}
function hexPath(x,y,r){cx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;cx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r);}cx.closePath();}
function mark(col,x,y,r){cx.fillStyle='rgba(20,22,32,.55)';cx.beginPath();
  if(col===0)cx.arc(x,y,r,0,Math.PI*2);
  else if(col===1){cx.moveTo(x,y-r*1.15);cx.lineTo(x+r,y+r*.7);cx.lineTo(x-r,y+r*.7);cx.closePath();}
  else if(col===2)cx.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);
  else if(col===3){cx.moveTo(x,y-r*1.2);cx.lineTo(x+r,y);cx.lineTo(x,y+r*1.2);cx.lineTo(x-r,y);cx.closePath();}
  else{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r*1.2;cx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
  cx.fill();}
const FONT=()=>getComputedStyle(document.body).fontFamily;
let HOV=null;
function draw(now){
  requestAnimationFrame(draw);
  const dt=Math.min(.05,(now-(draw.last||now))/1000);draw.last=now;step(dt);
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#10131c';cx.fillRect(0,0,CW,CH);if(!G)return;
  for(let q=-RAD-1;q<=RAD+1;q++)for(let r=-RAD-1;r<=RAD+1;r++){if(dist(q,r)>RAD+1)continue;const [x,y]=px(q,r);hexPath(x,y,S*.95);cx.fillStyle='#171b28';cx.fill();}
  // そろえたとき：盤面を囲む大きな六角形が、消えた色で光る
  if(G.glow&&G.glow.t<1.2){const g=G.glow,a=1-g.t/1.2,N=RAD+1,k=(N+.72)/N,cs=[[N,0],[0,N],[-N,N],[-N,0],[0,-N],[N,-N]].map(([q,r])=>{const [x,y]=raw(q,r);return [OX+x*S*k,OY+y*S*k];});
    cx.save();cx.shadowColor=COLORS[g.col];cx.shadowBlur=24*a;cx.strokeStyle=COLORS[g.col];cx.globalAlpha=a;cx.lineWidth=3+5*a;cx.lineJoin='round';
    cx.beginPath();cs.forEach(([x,y],i)=>cx[i?'lineTo':'moveTo'](x,y));cx.closePath();cx.stroke();cx.restore();}
  if(HOV){const [x,y]=px(...HOV);cx.beginPath();cx.arc(x,y,S*2.05,0,Math.PI*2);cx.fillStyle='rgba(255,209,102,.07)';cx.fill();}
  HANDLES.forEach(([q,r])=>{const [x,y]=px(q,r);hexPath(x,y,S*.95);cx.fillStyle='#262c42';cx.fill();
    // ハンドルは丸いつまみだけ。左回りのあいだは色が変わる
    const hov=HOV&&HOV[0]===q&&HOV[1]===r,rev=REV||SHIFT;cx.beginPath();cx.arc(x,y,S*.36,0,Math.PI*2);cx.fillStyle=rev?(hov?'#ffc59e':'#ff9f6e'):(hov?'#ffffff':'#aeb8d6');cx.fill();});
  TILES.forEach(([q,r])=>{const c=cell(q,r);let [x,y]=px(q,r);
    if(c.rot){const [hx,hy]=px(c.rot.q,c.rot.r),a=Math.atan2(y-hy,x-hx),d=Math.hypot(x-hx,y-hy),e=1-(1-Math.min(1,c.rot.k))**2,a0=a-c.rot.dir*Math.PI/3*(1-e);x=hx+Math.cos(a0)*d;y=hy+Math.sin(a0)*d;}
    const grow=c.born>=0&&G.t-c.born<.25?(G.t-c.born)/.25:1,sc=c.clr?Math.max(.1,c.clr/.5):grow;
    drawTile(c.col,x,y,S*sc);
    if(c.mk)drawMk(x,y,S*sc,c.mkT!=null&&G.t-c.mkT<.4?(.4-(G.t-c.mkT))*2:0);
    if(c.clr){hexPath(x,y,S*.92*sc);cx.fillStyle=`rgba(255,255,255,${.7*Math.sin(c.clr*25)**2})`;cx.fill();}});
  G.pops.forEach(p=>{const [x,y]=px(p.q,p.r);cx.globalAlpha=1-p.t;cx.strokeStyle=p.col!=null?COLORS[p.col]:'#fff';cx.lineWidth=4;cx.beginPath();cx.arc(x,y,S*(2+p.t*2),0,Math.PI*2);cx.stroke();cx.globalAlpha=1;
    if(!VS){cx.fillStyle=`rgba(255,255,255,${1-p.t})`;cx.font=`800 ${Math.max(14,S*.7)}px ${FONT()}`;cx.textAlign='center';cx.fillText('+1',x,y-S*2.4-p.t*20);}});
  if(VS)drawVs(now);
  $('#sc').textContent=G.score;$('#mv').textContent=G.moves;
  const left=G.limit?Math.max(0,G.limit-G.t):0;$('#tmw').hidden=!G.limit||!!VS;$('#tm').textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`;$('#tm').classList.toggle('low',left<15);
}
// 対戦の上の帯：左に自分の残り・飛んでくるマーク、右に相手の盤面
function drawVs(now){
  const opp=VS.mode==='com'&&CB?{cols:boardCols(CB),mk:boardMk(CB),score:CB.score}:VS.opp;
  cx.fillStyle='#141826';cx.fillRect(0,0,CW,TOPH);cx.strokeStyle='#2c3550';cx.beginPath();cx.moveTo(0,TOPH);cx.lineTo(CW,TOPH);cx.stroke();
  const myM=markCount(MB),opM=opp?opp.mk.reduce((a,b)=>a+b,0):0;$('#mym').textContent=myM;$('#opm').textContent=opM;$('#mym').classList.toggle('low',myM>=7);$('#opm').classList.toggle('low',opM>=7);
  // 相手の盤面
  if(opp){TILES.forEach(([q,r],i)=>{const [x,y]=raw(q,r),X=MX+x*MS,Y=MY+y*MS;drawTile(opp.cols[i],X,Y,MS,'plain');if(opp.mk[i])drawMk(X,Y,MS,0);});}
  cx.fillStyle='#9aa3c0';cx.font=`700 12px ${FONT()}`;cx.textAlign='right';cx.fillText(VS.mode==='com'?`COM（${LV[VS.lv].name}）`:(NET.oppName||'相手'),CW-10,14);
  // 自分の残り：マーク10枚で負け
  const L=10,bw=Math.min(18,(CW*.45-24)/MARK_LOSE);cx.textAlign='left';cx.fillStyle='#9aa3c0';cx.fillText('自分のマーク',L,18);
  for(let i=0;i<MARK_LOSE;i++){cx.fillStyle=i<myM?'#ff7b6b':'#2a3048';cx.fillRect(L+i*(bw+3),26,bw,12);}
  cx.fillStyle='#9aa3c0';cx.fillText('相手のマーク',L,58);for(let i=0;i<MARK_LOSE;i++){cx.fillStyle=i<opM?'#ffd166':'#2a3048';cx.fillRect(L+i*(bw+3),66,bw,12);}
  // 飛んでくる途中のマーク
  const inc=MB.inc;if(inc.length){const tot=inc.reduce((a,x)=>a+x.n,0),left=Math.max(0,inc[0].at-MB.t);
    cx.fillStyle=`rgba(255,123,107,${.7+.3*Math.sin(now/120)})`;cx.font=`800 15px ${FONT()}`;cx.fillText(`✕${tot} 飛んでくる！ ${left.toFixed(1)}秒`,L,100);
    cx.fillStyle='#9aa3c0';cx.font=`500 11px ${FONT()}`;cx.fillText('いまそろえると打ち消せる',L,116);}
}

/* ---------- 操作 ---------- */
let REV=false,SHIFT=false;
function hitHandle(x,y){let best=null,bd=S*1.05;HANDLES.forEach(([q,r])=>{const [hx,hy]=px(q,r),d=Math.hypot(hx-x,hy-y);if(d<bd){bd=d;best=[q,r];}});return best;}
cv.addEventListener('pointerdown',e=>{if(!G||G.over)return;e.preventDefault();const b=cv.getBoundingClientRect(),h=hitHandle(e.clientX-b.left,e.clientY-b.top);if(!h)return;
  rotate(h[0],h[1],(REV||SHIFT||e.shiftKey||e.button===2)?-1:1);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!G)return;const b=cv.getBoundingClientRect();HOV=e.pointerType==='mouse'?hitHandle(e.clientX-b.left,e.clientY-b.top):null;});
cv.addEventListener('pointerleave',()=>HOV=null);
const hold=(el,fn)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true);el.classList.add('on');});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{fn(false);el.classList.remove('on');}));};
hold($('#brev'),v=>REV=v);
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='code'){saveName();joinRoom(e.target.value);}return;}
  if(e.key==='Shift'){SHIFT=true;$('#brev').classList.add('on');}if((e.key==='p'||e.key==='Escape')&&G&&!G.over&&!VS){G.paused=!G.paused;ui();}});
document.addEventListener('keyup',e=>{if(e.key==='Shift'){SHIFT=false;$('#brev').classList.remove('on');}});
window.addEventListener('blur',()=>{SHIFT=false;REV=false;$('#brev').classList.remove('on');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!VS){G.paused=true;ui();}});
function ui(){const nar=innerWidth<=480;$('#bp').textContent=G&&G.paused?(nar?'▶':'再開'):(nar?'❚❚':'一時停止');$('#bp').hidden=!!VS;
  ['#st1','#st2'].forEach(s=>$(s).hidden=!!VS);$('#vsinfo').hidden=!VS;}
window.addEventListener('resize',ui);
function showOv(h){$('#ovbox').innerHTML=h;$('#ov').hidden=false;}
function saveName(){const n=$('#pname');if(n){NAME=n.value.trim().slice(0,10);store.set('mawasu-name',NAME);}}
let PICK=0;
function lookHTML(){return `<h2>見た目</h2><div class="sub">タイル</div><div class="seg">${[['mark','印つき'],['plain','色だけ'],['line','縁取り']].map(([v,l])=>`<button class="${LOOK===v?'on':''}" data-act="lk" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="sub">色（押して選んでから、下の色相環で色を決める）</div>
  <div style="display:flex;gap:8px;justify-content:center;margin:6px 0">${COLORS.map((c,i)=>`<button data-act="pk" data-i="${i}" aria-label="${i+1}色目" style="width:52px;height:52px;border-radius:12px;border:3px solid ${PICK===i?'#fff':'transparent'};background:#10131c;cursor:pointer;padding:0"><canvas class="sw" data-i="${i}" width="96" height="96" style="width:46px;height:46px"></canvas></button>`).join('')}</div>
  <div class="sub" style="text-align:center">${OPT.n}色で遊ぶときは、左から${OPT.n}つを使います</div>
  <div id="wheel" style="width:220px;height:220px;margin:8px auto;border-radius:50%;background:conic-gradient(from 0deg,${Array.from({length:13},(_,i)=>hsl2hex(i*30,LIGHT.s,LIGHT.l)).join(',')});position:relative;cursor:crosshair;touch-action:none"><div style="position:absolute;inset:46px;border-radius:50%;background:var(--panel)"></div></div>
  <div class="sub">明るさ</div><div class="seg">${[['soft','やわらか'],['vivid','くっきり'],['deep','こい']].map(([v,l])=>`<button class="${LIGHT.k===v?'on':''}" data-act="lt" data-v="${v}">${l}</button>`).join('')}</div>
  <button class="btn" style="width:100%;margin-top:12px;min-height:40px" data-act="resetc">色を元に戻す</button><button class="go" data-act="close">閉じる</button>`;}
const LIGHTS={soft:{s:80,l:72},vivid:{s:85,l:62},deep:{s:70,l:50}};
let LIGHT=Object.assign({k:'soft'},LIGHTS.soft);
function paintSwatches(){document.querySelectorAll('canvas.sw').forEach(el=>{const i=+el.dataset.i,c2=el.getContext('2d');const sv=[cx];cx=c2;c2.setTransform(1,0,0,1,0,0);c2.clearRect(0,0,96,96);drawTile(i,48,48,44);cx=sv[0];});}
function saveColors(){try{localStorage.setItem('mawasu-colors',JSON.stringify(COLORS));localStorage.setItem('mawasu-look',LOOK);}catch(e){}}
function openLook(){showOv(lookHTML());paintSwatches();const w=$('#wheel');
  const pick=e=>{const r=w.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<r.width/2-46||Math.hypot(dx,dy)>r.width/2+4)return;
    const hue=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;COLORS[PICK]=hsl2hex(hue,LIGHT.s,LIGHT.l);saveColors();paintSwatches();};
  let down=false;w.addEventListener('pointerdown',e=>{down=true;w.setPointerCapture(e.pointerId);pick(e);});w.addEventListener('pointermove',e=>{if(down)pick(e);});w.addEventListener('pointerup',()=>down=false);}
function optsHTML(){return `<div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div>
  <div class="sub">時間</div><div class="seg">${[['120','2分'],['0','なし（練習）']].map(([v,l])=>`<button class="${OPT.time===v?'on':''}" data-act="optt" data-v="${v}">${l}</button>`).join('')}</div>`;}
function menuHTML(){return `<h1>六角形パズル</h1><p style="margin-top:0;color:var(--muted)">ハンドルを回して、まわり6枚の色をそろえるパズルの試作です</p>
  <div class="mode"><button data-act="practice"><b>ひとりで練習</b><span>制限時間の中で、いくつそろえられるか</span></button>
  <button data-act="commenu"><b>COMと対戦</b><span>そろえるたびに相手へマークを送る。マーク10枚で負け</span></button>
  <button data-act="net"><b>友だちと対戦</b><span>部屋のコードで2人対戦</span></button></div>
  <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">あそびかた</summary>${rulesHTML()}</details>`;}
function rulesHTML(){return `<ol>
  <li>丸いつまみが<b>ハンドル</b>です。押すと、まわりの6枚が<b>右回りに1つ</b>ずれます。<b>↺ボタンを押している間</b>（PCはShiftを押しながら、または右クリック）は左回りで、つまみが橙色になります。</li>
  <li>ハンドルの<b>まわり6枚がぜんぶ同じ色</b>になると消えて、その場に新しい6枚が現れます。</li>
  <li>1つのハンドルを回しても、その輪の中の色の数は変わりません。<b>となりのハンドルを回して、外から同じ色を運び込みましょう</b>。</li>
  <li><b>対戦</b>：1つそろえるたびに、相手の盤面のタイルに<b>マーク（✕）</b>を送ります。マークは${FLY}秒かけて飛んでいき、その間に自分がそろえると<b>打ち消せます</b>。マークつきのタイルが<b>${MARK_LOSE}枚</b>になったら負け。マークつきのタイルを含む輪をそろえるとマークも消え、マークを2枚以上含む輪なら2枚送り返します。</li></ol>`;}
function helpHTML(){return `<h1>六角形パズル</h1>${rulesHTML()}<button class="go" data-act="close">閉じる</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='new'){newGame();$('#ov').hidden=true;ui();}
  else if(a==='menu'){netLeave();VS=null;G=null;layout();showOv(menuHTML());ui();}
  else if(a==='practice'){showOv(`<h2>ひとりで練習</h2>${optsHTML()}<button class="go" data-act="new">はじめる</button><button class="ghost" data-act="menu">もどる</button>`);}
  else if(a==='commenu'){showOv(`<h2>COMと対戦</h2><div class="sub">COMの強さ</div><div class="mode">${Object.entries(LV).map(([k,v])=>`<button data-act="com" data-lv="${k}"><b>${v.name}</b></button>`).join('')}</div><div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div><button class="ghost" data-act="menu">もどる</button>`);}
  else if(a==='com'){OPT.lv=b.dataset.lv;store.set('mawasu-lv',OPT.lv);startCom(OPT.lv);}
  else if(a==='net'){showOv(netHTML());}
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'){saveName();joinRoom(($('#code')||{}).value);}
  else if(a==='netstart'){if(NET.role==='host'&&NET.conn&&NET.conn.open){netSend({t:'start',n:OPT.n});beginNet();}}
  else if(a==='copylink'){const u=location.href;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>{b.textContent='コピーしました';},()=>prompt('コピーしてください',u));else prompt('コピーしてください',u);}
  else if(a==='close'){$('#ov').hidden=true;}
  else if(a==='help'){showOv(helpHTML());}
  else if(a==='optn'){OPT.n=+b.dataset.v;store.set('mawasu-n',OPT.n);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='optt'){OPT.time=b.dataset.v;store.set('mawasu-time',OPT.time);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='pause'&&G&&!G.over&&!VS){G.paused=!G.paused;ui();}
  else if(a==='look'){openLook();}
  else if(a==='lk'){LOOK=b.dataset.v;saveColors();openLook();}
  else if(a==='pk'){PICK=+b.dataset.i;openLook();}
  else if(a==='lt'){LIGHT=Object.assign({k:b.dataset.v},LIGHTS[b.dataset.v]);openLook();}
  else if(a==='resetc'){COLORS=DEF_COLORS.slice();saveColors();openLook();}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pname')saveName();});
layout();ui();
(function(){const room=new URLSearchParams(location.search).get('room');if(room){showOv(netHTML());}else showOv(menuHTML());})();
requestAnimationFrame(draw);
</script>
</body>
</html>
