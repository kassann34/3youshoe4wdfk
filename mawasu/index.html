<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>六角形パズル</title>
<meta name="description" content="ハンドルを回して、まわり6枚の色をそろえるパズル（試作）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
/* デジタルな雰囲気：黒に近い紺、シアンの細い線と光、等幅寄りの文字。タイルは色に加えて中の印でも見分けられるようにする */
:root{--bg:#060a12;--panel:#0a1220;--ink:#e3f4ff;--muted:#7d98b3;--rule:#1c3450;--accent:#39e6ff;--warn:#ff5f7a;--btn:#0d1a2b;--on:rgba(57,230,255,.13);
  --font:"M PLUS 1 Code","Hiragino Sans","Yu Gothic",ui-monospace,system-ui,sans-serif;--num:"Orbitron","M PLUS 1 Code",ui-monospace,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#0c1626,#08101c);border-bottom:1px solid rgba(57,230,255,.28);box-shadow:0 1px 14px rgba(57,230,255,.08)}
.ttl{font-weight:700;letter-spacing:.14em;margin-right:auto;white-space:nowrap}
.ttl small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--accent);font-family:var(--num);font-size:17px;margin-left:3px;font-variant-numeric:tabular-nums}
.stat b.low{color:var(--warn)}
.btn{border:1.5px solid var(--rule);background:var(--btn);border-radius:5px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:36px;font-size:13px}
@media (max-width:480px){.lbl,.mvs{display:none}.ttl small{display:none}.ttl{font-size:15px}.bar{gap:8px;padding:8px 10px}.stat{font-size:11px}.stat b{font-size:16px}.btn{padding:4px 8px}}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas.sw{display:block}
.ctrl{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#0c1626,#08101c);border-top:1px solid rgba(57,230,255,.28);justify-content:center}
.big{flex:1;max-width:320px;min-height:56px;border-radius:6px;border:2px solid var(--rule);background:var(--btn);font-size:16px;font-weight:800;cursor:pointer;touch-action:none}
.big.on{border-color:var(--accent);background:var(--on);color:var(--accent)}
.big small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(6,8,14,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov[hidden]{display:none}
.box{background:linear-gradient(180deg,rgba(13,24,40,.97),rgba(8,14,26,.97));border:1px solid rgba(57,230,255,.38);box-shadow:0 0 0 1px rgba(57,230,255,.06),0 0 40px rgba(57,230,255,.12);border-radius:8px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.box h1{margin:0 0 4px;font-size:24px;letter-spacing:.14em;color:var(--accent);text-shadow:0 0 14px rgba(57,230,255,.45)}
.box h2{margin:0 0 10px;letter-spacing:.1em;text-shadow:0 0 12px rgba(57,230,255,.35)}
.box p,.box li{font-size:13.5px;line-height:1.75;color:#c3d6e8}
.box ol{padding-left:20px}
.sub{color:var(--muted);font-size:12px;margin:10px 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:5px;border:1.5px solid var(--rule);background:var(--btn);font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--on)}
.go{width:100%;min-height:50px;border:0;border-radius:6px;background:var(--accent);color:#02212b;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.score{font-size:44px;font-family:var(--num);font-weight:800;text-shadow:0 0 18px rgba(57,230,255,.5);text-align:center;color:var(--accent)}

.vs{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.vs b{font-size:17px;font-family:var(--num);color:var(--accent);font-variant-numeric:tabular-nums}
.vs b.low{color:var(--warn)}
.vs[hidden],.stat[hidden],.btn[hidden],#opw[hidden]{display:none}
.plist{list-style:none;padding:0;margin:4px 0 10px}.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:5px;background:rgba(57,230,255,.05);border-left:2px solid rgba(57,230,255,.5);margin-bottom:6px;font-weight:700}.plist em{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);margin-left:8px}.plist .btn{min-height:30px;padding:2px 10px;font-size:12px}
.rank{list-style:none;padding:0;margin:6px auto 4px;max-width:260px}.rank li{display:flex;gap:12px;padding:6px 12px;border-radius:5px}.rank li.me{background:var(--on)}.rank b{min-width:2.6em}
.box input[type=text]{width:100%;border:1.5px solid var(--rule);background:#050910;color:var(--ink);border-radius:5px;padding:10px 12px;font:inherit;font-size:16px}
.box .row{display:flex;gap:8px;margin-top:8px}
.box .code{font-size:34px;font-family:var(--num);font-weight:800;text-shadow:0 0 18px rgba(57,230,255,.5);letter-spacing:.2em;text-align:center;color:var(--accent)}
.box .err{color:var(--warn);font-size:13px;margin-top:6px}
.mode{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mode button{text-align:left;border:1.5px solid var(--rule);background:var(--btn);border-radius:6px;padding:12px;cursor:pointer}
.mode button b{display:block;font-size:16px}
.mode button span{font-size:12px;color:var(--muted)}
.ghost{width:100%;min-height:42px;margin-top:8px;border-radius:6px;border:1.5px solid var(--rule);background:transparent;font-weight:700;cursor:pointer}
.go{box-shadow:0 0 18px rgba(57,230,255,.35);letter-spacing:.08em}
.btn:hover,.seg button:hover,.mode button:hover,.ghost:hover{border-color:rgba(57,230,255,.6)}
.seg button.on,.big.on{box-shadow:0 0 12px rgba(57,230,255,.25) inset}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><div class="ttl">六角形パズル<small>試作 v13</small></div>
    <span class="stat" id="st1">そろえた<b id="sc">0</b></span><span class="stat mvs" id="st2">手数<b id="mv">0</b></span><span class="stat" id="tmw">残り<b id="tm">2:00</b></span>
    <span class="vs" id="vsinfo" hidden>自分<b id="mym">0</b>/10<span id="opw">　相手<b id="opm">0</b>/10</span></span>
    <button class="btn" data-act="pause" id="bp" aria-label="一時停止">一時停止</button><button class="btn" data-act="look"><span aria-hidden="true">🎨</span><span class="lbl"> 見た目</span></button><button class="btn" data-act="help">？</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="ctrl"><button class="big" id="brev">↺ 左回り<small>押している間（PCはShiftか右クリック）</small></button></div>
</div>
<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 六角形パズル
   ・とがった角が上下に来る六角形の格子。外形も六角形で、盤面は動かない
   ・3マスに1つがハンドル。押すとまわりの6枚が60°ずつ回る。1枚のタイルは3つのハンドルに囲まれている
   ・ハンドルのまわり6枚が同じ色になったときだけ消え、その場に新しい6枚が現れる
   ・対戦：そろえるたびに相手の盤面へ「マーク」を送る。マークは3秒かけて飛んでいき、その間に自分もそろえると打ち消せる。
     マークのついたタイルが10枚になったら負け。マークつきのタイルを含む輪をそろえるとマークも消える */
const RAD=3,MARK_LOSE=10,FLY=3;
const DEF_COLORS=['#ff6b8b','#ffd84a','#3ff0a1','#45a8ff','#c08cff'];
let COLORS=(()=>{try{const a=JSON.parse(localStorage.getItem('mawasu-colors')||'null');if(Array.isArray(a)&&a.length===5&&a.every(c=>/^#[0-9a-f]{6}$/i.test(c)))return a;}catch(e){}return DEF_COLORS.slice();})();
let LOOK=(()=>{try{return localStorage.getItem('mawasu-look')||'mark';}catch(e){return 'mark';}})();
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const ring=(q,r)=>DIRS.map(([a,b])=>[q+a,r+b]);
const dist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(-q-r));
const isH=(q,r)=>(((q-r)%3)+3)%3===0;
const key=(q,r)=>q+','+r;
const HANDLES=[],TILES=[];
(function(){const seen=new Set();for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++){if(dist(q,r)>RAD||!isH(q,r))continue;HANDLES.push([q,r]);
  ring(q,r).forEach(([a,b])=>{const k=key(a,b);if(!seen.has(k)){seen.add(k);TILES.push([a,b]);}});}})();

/* ---------- 盤面：G は「いま操作している盤面」。COM の盤面を動かすときは一時的に差し替える ---------- */
let G=null,MB=null; // MB=自分の盤面
let VS=null; // 対戦のとき {mode:'com'|'net', lv, me, P:[参加者 {id,name,kind,B,view,alive,rank}], over, result}
let OPT={coms:+store.get('mawasu-coms')||1,n:+store.get('mawasu-n')||4,time:store.get('mawasu-time')||'120',lv:store.get('mawasu-lv')||'mid'};
let TID=0;
function makeBoard(n){const B={cells:{},n,t:0,score:0,moves:0,over:false,paused:false,pops:[],inc:[],sent:0,cancel:0};
  TILES.forEach(([q,r])=>B.cells[key(q,r)]={id:++TID,col:0,rot:null,clr:0,born:-1,mk:false});
  for(let k=0;k<50;k++){TILES.forEach(([q,r])=>B.cells[key(q,r)].col=Math.floor(Math.random()*n));if(!onBoard(B,()=>HANDLES.some(([q,r])=>full(q,r))))break;}
  return B;}
function onBoard(B,f){const s=G;G=B;try{return f();}finally{G=s;}}
function newGame(){VS=null;MB=G=makeBoard(OPT.n);G.limit=OPT.time==='0'?0:+OPT.time;layout();}
const cell=(q,r)=>G.cells[key(q,r)];
function full(q,r){const cs=ring(q,r).map(([a,b])=>cell(a,b));return cs.every(c=>c&&!c.clr&&c.col===cs[0].col);}
function rotate(q,r,dir){
  if(!G||G.over||G.paused||G.dead||(VS&&VS.over))return false;const rg=ring(q,r),cs=rg.map(([a,b])=>cell(a,b));if(cs.some(c=>!c||c.clr))return false;
  rg.forEach(([a,b],i)=>{const c=cs[(i-dir+6)%6];G.cells[key(a,b)]=c;c.rot={q,r,dir,k:0};});
  G.moves++;checkRings();return true;
}
function checkRings(){const res=[];
  HANDLES.forEach(([q,r])=>{if(!full(q,r))return;const cs=ring(q,r).map(([a,b])=>cell(a,b));res.push(cs.filter(c=>c.mk).length);
    const col=cs[0].col;cs.forEach(c=>c.clr=.5);G.score++;G.pops.push({q,r,t:0,col});G.glow={col,t:0};});
  if(res.length&&VS)attack(G,res);
}
function refill(c){c.col=Math.floor(Math.random()*G.n);c.clr=0;c.born=G.t;c.id=++TID;c.mk=false;}
const markCount=B=>Object.values(B.cells).filter(c=>c.mk).length;
/* ---------- マーク：1つそろえると1枚。マークを含む輪をそろえると、消したマークの数だけ送る。飛んでくる途中のものと打ち消し合う ---------- */
const SEND=[1,1,2,3,4,5,6]; // 輪の中のマークの数 → 送る枚数（消したマークの数だけ。マークなしでも1枚）
const pl=id=>VS&&VS.P.find(p=>p.id===id);
const AUTH=()=>!!VS&&(VS.mode==='com'||NET.role==='host'); // 脱落と順位を決める側（COM戦は自分、通信は部屋主）
// 打ち消したあとの残りを、生き残っている相手全員に分けて送る。割り切れない分はランダムな相手に1枚ずつ
function attack(B,res){
  let n=res.reduce((s,m)=>s+SEND[Math.min(6,m)],0);B.big=res.some(m=>m>=2)?{n,t:B.t}:B.big;
  while(n>0&&B.inc.length){const x=B.inc[0],k=Math.min(x.n,n);x.n-=k;n-=k;B.cancel+=k;if(!x.n)B.inc.shift();}
  if(n<=0)return;B.sent+=n;
  const tg=VS.P.filter(p=>p.alive&&p.id!==B.pid).sort(()=>Math.random()-.5);if(!tg.length)return;
  const base=Math.floor(n/tg.length);let rem=n%tg.length;
  tg.forEach(p=>{const m=base+(rem>0?1:0);if(rem>0)rem--;if(m<=0)return;if(B===MB)p.hit={n:m,t:MB.t};sendAtk(p.id,m,B.pid);});
}
function sendAtk(to,n,from){const p=pl(to);if(!p||!p.alive)return;addShot(from,to,n);
  // 部屋主は、誰から誰へ飛んだかを全員に知らせる（送った本人には不要）
  if(NET.role==='host'&&VS.mode==='net')NET.slots.forEach(s=>{if(s.kind==='net'&&s.ok&&s.id!==from)netTo(s.id,{t:'shot',f:from,to,n});});
  if(p.B){if(!p.B.dead)p.B.inc.push({n,at:p.B.t+FLY});}
  else if(NET.role==='host')netTo(to,{t:'atk',n});
  else netSend({t:'atk',to,n});}
function landMarks(B,n){const free=Object.values(B.cells).filter(c=>!c.mk&&!c.clr);for(let i=0;i<n&&free.length;i++){const c=free.splice(Math.floor(Math.random()*free.length),1)[0];c.mk=true;c.mkT=B.t;}}
// 盤面1つ分の時間を進める（アニメーション・消えたあとの補充・届いたマーク）
function tick(B,dt){
  B.t+=dt;
  onBoard(B,()=>{let born=false;
    for(const k in G.cells){const c=G.cells[k];if(c.rot){c.rot.k+=dt/.15;if(c.rot.k>=1)c.rot=null;}if(c.clr){c.clr-=dt;if(c.clr<=0){refill(c);born=true;}}}
    if(born)checkRings();});
  B.pops.forEach(p=>p.t+=dt);B.pops=B.pops.filter(p=>p.t<1);if(B.glow)B.glow.t+=dt;
  if(VS&&!B.dead){while(B.inc.length&&B.inc[0].at<=B.t){landMarks(B,B.inc.shift().n);}
    if(!VS.over&&markCount(B)>=MARK_LOSE){B.dead=true;B.inc=[];if(AUTH())eliminate(B.pid);else netSend({t:'dead'});}}
}
// 飛んでいくマークの軌跡（見た目だけ）。着弾までの時間はマークと同じ
function addShot(f,to,n){if(!VS)return;(VS.shots=VS.shots||[]).push({f,to,n,t:performance.now()/1000});}
const viewOf=p=>p.B?{cols:boardCols(p.B),mk:boardMk(p.B),score:p.B.score}:p.view;
function step(dt){
  if(!G||G.over)return;
  if(!VS){if(G.paused||!$('#ov').hidden)return;tick(G,dt);if(G.limit&&G.t>=G.limit)finish();return;}
  if(VS.over||!VS.started)return;
  VS.P.forEach(p=>{if(!p.B)return;tick(p.B,dt);if(p.kind==='com'&&!p.B.dead)cpuThink(p.B,dt);});
  if(VS.mode==='net'){NET.stT=(NET.stT||0)-dt;if(NET.stT<=0){NET.stT=.4;
    if(NET.role==='host')netAll({t:'sts',l:VS.P.filter(p=>viewOf(p)).map(p=>{const v=viewOf(p);return {id:p.id,c:v.cols,m:v.mk,s:v.score};})});
    else netSend({t:'st',c:boardCols(MB),m:boardMk(MB),s:MB.score});}}
}
function finish(){G.over=true;const k=`mawasu-best-${G.n}-${G.limit}`,b=Math.max(+store.get(k)||0,G.score);store.set(k,b);
  showOv(`<h2>時間です</h2><div class="score">${G.score}</div><p style="text-align:center">輪をそろえました（${G.n}色・${G.moves}手）<br>この設定の最高：${b}</p>${optsHTML()}<button class="go" data-act="new">もう一度</button><button class="ghost" data-act="menu">はじめの画面へ</button>`);}
const boardCols=B=>TILES.map(([q,r])=>B.cells[key(q,r)].col),boardMk=B=>TILES.map(([q,r])=>B.cells[key(q,r)].mk?1:0);

/* ---------- COM：2手先まで読んで、輪がそろいそうな形へ寄せる。強さは考える間隔と迷う割合 ---------- */
const LV={easy:{name:'弱め',gap:2.2,miss:.3},mid:{name:'ふつう',gap:1.3,miss:.12},hard:{name:'つよめ',gap:.8,miss:.03}};
const RI=HANDLES.map(([q,r])=>ring(q,r).map(([a,b])=>TILES.findIndex(([x,y])=>x===a&&y===b)));
const WT=[0,0,1,4,16,64,1e5];
function aiScore(b){let s=0;for(const R of RI){const c=[0,0,0,0,0];R.forEach(i=>c[b[i]]++);s+=WT[Math.max(...c)];}return s;}
const aiRot=(b,h,d)=>{const R=RI[h],v=R.map(i=>b[i]);R.forEach((i,j)=>b[i]=v[(j-d+6)%6]);};
const aiFull=b=>RI.some(R=>R.every(i=>b[i]===b[R[0]]));
function aiMove(B){const b=boardCols(B);let best=null,bs=-1;
  for(let h=0;h<RI.length;h++)for(const d of [1,-1]){aiRot(b,h,d);let sc;
    if(aiFull(b))sc=1e12;else{sc=aiScore(b);for(let h2=0;h2<RI.length;h2++)for(const d2 of [1,-1]){if(h2===h&&d2===-d)continue;aiRot(b,h2,d2);const s2=aiFull(b)?1e9:aiScore(b);if(s2>sc)sc=s2*.999;aiRot(b,h2,-d2);}}
    sc+=Math.random();if(sc>bs){bs=sc;best=[h,d];}aiRot(b,h,-d);}
  return best;}
function cpuThink(B,dt){const L=LV[VS.lv]||LV.mid;B.think=(B.think||L.gap*(.5+Math.random()))-dt;if(B.think>0)return;B.think=L.gap*(.75+Math.random()*.5);
  let mv;if(Math.random()<L.miss)mv=[Math.floor(Math.random()*RI.length),Math.random()<.5?1:-1];else mv=aiMove(B);
  if(mv)onBoard(B,()=>rotate(HANDLES[mv[0]][0],HANDLES[mv[0]][1],mv[1]));}
// COM が複数いるときは COM1, COM2… と番号をつける
function nameComs(l){const c=l.filter(s=>s.kind==='com');c.forEach((s,i)=>s.name=c.length>1?'COM'+(i+1):'COM');return l;}
// 対戦を始める。roster は部屋主から見た参加者 [{id,name,kind:'host'|'me'|'net'|'com'}]
function startVs(mode,roster,me,n){OPT.n=n;NET.stT=0;
  VS={mode,lv:OPT.lv,over:false,started:true,me,P:roster.map(r=>{const kind=r.id===me?'me':(mode==='net'&&NET.role!=='host'?'remote':r.kind);
    const B=kind==='me'||kind==='com'?Object.assign(makeBoard(n),{pid:r.id}):null;return {id:r.id,name:r.name,kind,B,view:null,alive:true,rank:0,hit:null};})};
  MB=G=pl(me).B;G.limit=0;layout();$('#ov').hidden=true;ui();}
function startCom(lv){const k=Math.max(1,Math.min(3,OPT.coms||1));
  startVs('com',nameComs([{id:0,name:NAME||'あなた',kind:'me'},...Array.from({length:k},(_,i)=>({id:i+1,name:'COM',kind:'com'}))]),0,OPT.n);}
// 脱落：そのとき残っていた人数がその人の順位。残りが1人になったら終わり

/* ---------- 通信：2〜4人。部屋主が中継役。各自の盤面は自分の端末で動かし、送るのはマークと盤面の様子だけ。COMは部屋主の端末で動かす ---------- */

function hostConn(c){const playing=VS&&VS.mode==='net'&&!VS.over,id=freeId();

// 参加者側：部屋主とのつながり

    if(m.t==='hello'){if(m.ver!==VER){NET.status='部屋主のページと版が違います。両方とも再読み込みしてください';showOv(roomHTML(),'room');return;}NET.status='';}
    else if(m.t==='ver'){NET.status='部屋主のページと版が違います。両方とも再読み込みしてください';showOv(netHTML());}
    else if(m.t==='full'){NET.status=m.playing?'その部屋は対戦中です。終わってから入ってください':'その部屋はもう4人そろっています';showOv(netHTML());}
    else if(m.t==='lobby'){NET.roster=m.l||[];NET.myId=m.you;if(!VS)showOv(roomHTML(),'room');}

function createRoom(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした';showOv(netHTML());return;}netLeave();

    <div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div>

/* ---------- 画面 ---------- */
const cv=$('#cv');let cx=cv.getContext('2d'),CW=0,CH=0,DPR=1,S=20,OX=0,OY=0,MS=6,TOPH=0;

const EXT=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let q=-RAD-1;q<=RAD+1;q++)for(let r=-RAD-1;r<=RAD+1;r++){if(dist(q,r)>RAD+1)continue;const [x,y]=raw(q,r);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}return {w:x1-x0+SQ3,h:y1-y0+2};})();
function layout(){const r=$('#stage').getBoundingClientRect();DPR=window.devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=CW*DPR;cv.height=CH*DPR;buildBg();

  TOPH=0;LAY=null;
  if(!VS){S=Math.min((CW-16)/(EXT.w+1.4),(CH-16)/(EXT.h+1.4));OX=CW/2;OY=CH/2;return;}
  const k=Math.max(1,VS.P.length-1);
  if(CW/CH>1.15){const side=Math.min(280,CW*.24),ox=CW-side/2-8;S=Math.min((CW-2*side-16)/(EXT.w+1.4),(CH-16)/(EXT.h+1.4));OX=CW/2;OY=CH/2;
    if(k===1){MS=Math.min((side-30)/EXT.w,(CH*.45)/EXT.h);LAY={side:true,warn:{x:side/2+8,y:CH*.32,w:side},opp:[{x:ox,y:CH*.32}]};}
    else{const ch=(CH-12)/k;MS=Math.min((side-30)/EXT.w,(ch-34)/EXT.h);LAY={side:true,warn:{x:side/2+8,y:CH*.32,w:side},opp:Array.from({length:k},(_,i)=>({x:ox,y:6+ch*(i+.5)-8}))};}}
  else{const top=k===1?Math.min(170,Math.max(120,CH*.2)):Math.min(180,Math.max(124,CH*.2));S=Math.min((CW-16)/(EXT.w+1.4),(CH-top-16)/(EXT.h+1.4));

    else{const ww=CW*.22,sw=(CW-16-ww)/k;MS=Math.min(sw*.92/EXT.w,(top-34)/EXT.h);LAY={side:false,warn:{x:8+ww/2,y:top/2+off,w:ww},opp:Array.from({length:k},(_,i)=>({x:8+ww+sw*(i+.5),y:my}))};}}}
let LAY=null,BG=null;
// 背景：細い方眼と走査線、中央のほのかな光。描き直しを減らすため、大きさが変わったときだけ作る

new ResizeObserver(layout).observe($('#stage'));
const px=(q,r)=>{const [x,y]=raw(q,r);return [OX+x*S,OY+y*S];};

// 対戦の上の帯：左に自分の残り・飛んでくるマーク、右に相手の盤面

  opps.forEach((p,i)=>{const o=LAY&&LAY.opp[i];if(!o)return;const v=viewOf(p),X0=o.x,Y0=o.y,ocs=bigHex(X0,Y0,MS,N,(N+.7)/N),m=v?v.mk.reduce((a,b)=>a+b,0):0;

// 軌跡：送り主の盤面から相手の盤面へ、ゆるく曲がった線の上を「✕n」の玉が進む。自分あては赤、自分から黄、ほかの人どうしは白
function drawShots(T,opps){if(!VS.shots||!VS.shots.length)return;
  const posOf=id=>{if(id===VS.me)return [OX,OY,true];const i=opps.findIndex(p=>p.id===id),o=LAY&&LAY.opp[i];return o?[o.x,o.y,false]:null;};

  <li><b>3人以上</b>：送るマークは、残っている相手全員に分けて届きます（割り切れない分はランダムな相手へ）。マーク10枚で脱落し、最後まで残った人の勝ちです。</li></ol>`;}
function helpHTML(){return `<h1>六角形パズル</h1>${rulesHTML()}<button class="go" data-act="close">閉じる</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='new'){newGame();$('#ov').hidden=true;ui();}
  else if(a==='menu'){netLeave();VS=null;G=null;layout();showOv(menuHTML());ui();}
  else if(a==='practice'){showOv(`<h2>ひとりで練習</h2>${optsHTML()}<button class="go" data-act="new">はじめる</button><button class="ghost" data-act="menu">もどる</button>`);}
  else if(a==='commenu'){showOv(`<h2>COMと対戦</h2><div class="sub">COMの数</div><div class="seg">${[1,2,3].map(n=>`<button class="${OPT.coms===n?'on':''}" data-act="optc" data-v="${n}">${n}体</button>`).join('')}</div><div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div><div class="sub">COMの強さ（押すと始まります）</div><div class="mode">${Object.entries(LV).map(([k,v])=>`<button data-act="com" data-lv="${k}"><b>${v.name}</b></button>`).join('')}</div><button class="ghost" data-act="menu">もどる</button>`);}
  else if(a==='optc'){OPT.coms=+b.dataset.v;store.set('mawasu-coms',OPT.coms);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='com'){OPT.lv=b.dataset.lv;store.set('mawasu-lv',OPT.lv);startCom(OPT.lv);}
  else if(a==='net'){showOv(netHTML());}
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'){saveName();joinRoom(($('#code')||{}).value);}
  else if(a==='netstart'){if(NET.role==='host')hostStart();}
  else if(a==='addcom'){if(NET.role==='host'&&!VS){const id=freeId();if(id>0){NET.slots.push({id,name:'COM',kind:'com'});lobbyChanged();}}}
  else if(a==='rmcom'){if(NET.role==='host'&&!VS){NET.slots=NET.slots.filter(x=>!(x.kind==='com'&&x.id===+b.dataset.id));lobbyChanged();}}
  else if(a==='roomlv'){OPT.lv=b.dataset.v;store.set('mawasu-lv',OPT.lv);lobbyChanged();}
  else if(a==='toroom'){if(NET.role==='host'){netAll({t:'room'});VS=null;G=null;layout();ui();showOv(roomHTML(),'room');}}
  else if(a==='copylink'){const u=location.href;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>{b.textContent='コピーしました';},()=>prompt('コピーしてください',u));else prompt('コピーしてください',u);}
  else if(a==='close'){$('#ov').hidden=true;}
  else if(a==='help'){showOv(helpHTML());}
  else if(a==='optn'){OPT.n=+b.dataset.v;store.set('mawasu-n',OPT.n);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='optt'){OPT.time=b.dataset.v;store.set('mawasu-time',OPT.time);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='pause'&&G&&!G.over&&!VS){G.paused=!G.paused;ui();}
  else if(a==='look'){openLook();}
  else if(a==='lk'){LOOK=b.dataset.v;saveColors();openLook();}
  else if(a==='pk'){PICK=+b.dataset.i;openLook();}
  else if(a==='lt'){LIGHT=Object.assign({k:b.dataset.v},LIGHTS[b.dataset.v]);openLook();}
  else if(a==='resetc'){COLORS=DEF_COLORS.slice();saveColors();openLook();}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pname')saveName();});
layout();ui();
(function(){const room=new URLSearchParams(location.search).get('room');if(room){showOv(netHTML());}else showOv(menuHTML());})();
requestAnimationFrame(draw);
</script>
</body>
</html>
