<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ヘキサまわし</title>
<meta name="description" content="ハンドルを回して、まわり6枚の色をそろえるパズル（試作）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 盤面は暗めの紺で固定。タイルは色に加えて中の印でも見分けられるようにする */
:root{--bg:#10131c;--panel:#1a1f2e;--ink:#eef1fa;--muted:#9aa3c0;--rule:#2c3550;--accent:#ffd166;--warn:#ff7b6b;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ttl{font-weight:800;letter-spacing:.06em;margin-right:auto;white-space:nowrap}
.ttl small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.stat{font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-size:18px;margin-left:3px;font-variant-numeric:tabular-nums}
.stat b.low{color:var(--warn)}
.btn{border:1.5px solid var(--rule);background:#232a3f;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:36px;font-size:13px}
@media (max-width:480px){.ttl small{display:none}.ttl{font-size:15px}.bar{gap:8px;padding:8px 10px}.stat{font-size:11px}.stat b{font-size:16px}.btn{padding:4px 8px}}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ctrl{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--rule);justify-content:center}
.big{flex:1;max-width:320px;min-height:56px;border-radius:14px;border:2px solid var(--rule);background:#232a3f;font-size:16px;font-weight:800;cursor:pointer;touch-action:none}
.big.on{border-color:var(--accent);background:#3a3420;color:var(--accent)}
.big small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(6,8,14,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.box h1{margin:0 0 4px;font-size:24px;letter-spacing:.06em}
.box h2{margin:0 0 10px}
.box p,.box li{font-size:14px;line-height:1.7;color:#cfd5ea}
.box ol{padding-left:20px}
.sub{color:var(--muted);font-size:12px;margin:10px 0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:#232a3f;font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);background:#3a3420}
.go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#2a2005;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.score{font-size:44px;font-weight:800;text-align:center;color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><div class="ttl">ヘキサまわし<small>試作 v2</small></div><span class="stat">そろえた<b id="sc">0</b></span><span class="stat">手数<b id="mv">0</b></span><span class="stat" id="tmw">残り<b id="tm">2:00</b></span><button class="btn" data-act="pause" id="bp">一時停止</button><button class="btn" data-act="help">？</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="ctrl"><button class="big" id="brev">↺ 左回り<small>押している間（PCはShiftか右クリック）</small></button></div>
</div>
<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<script>
/* ヘキサまわし（1人用の練習モード）
   ・とがった角が上下に来る六角形の格子。外形も六角形で、盤面は動かない
   ・3マスに1つがハンドル。押すとまわりの6枚が60°ずつ回る。1枚のタイルは3つのハンドルに囲まれている
   ・ハンドルのまわり6枚が同じ色になったときだけ消え、その場に新しい6枚が現れる
   ・回すだけでは輪の中の色の数は変わらないので、となりのハンドルで外から同じ色を運び込むのがコツ */
const RAD=3;  // ハンドルを置く範囲（中心からの距離）。タイルはその外側1マスまで
const COLORS=['#ff8a80','#ffd166','#6fd08c','#5fa8ff','#c08cff'];
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
// 軸座標（q,r）。右から時計回りのとなり6つ
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const ring=(q,r)=>DIRS.map(([a,b])=>[q+a,r+b]);
const dist=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(-q-r));
const isH=(q,r)=>(((q-r)%3)+3)%3===0;  // 三色塗り分けの1色がハンドル
const key=(q,r)=>q+','+r;
// 盤面：中心から RAD 以内のハンドルと、そのまわりのタイル
const HANDLES=[],TILES=[];
(function(){const seen=new Set();for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++){if(dist(q,r)>RAD||!isH(q,r))continue;HANDLES.push([q,r]);
  ring(q,r).forEach(([a,b])=>{const k=key(a,b);if(!seen.has(k)){seen.add(k);TILES.push([a,b]);}});}})();

let G=null,OPT={n:+store.get('mawasu-n')||3,time:store.get('mawasu-time')||'120'};
let TID=0;
function newGame(){
  G={cells:{},n:OPT.n,limit:OPT.time==='0'?0:+OPT.time,t:0,score:0,moves:0,over:false,paused:false,pops:[]};
  TILES.forEach(([q,r])=>G.cells[key(q,r)]={id:++TID,col:0,rot:null,clr:0,born:-1});
  // はじめからそろっている輪がないように色を配る
  for(let k=0;k<50;k++){TILES.forEach(([q,r])=>G.cells[key(q,r)].col=Math.floor(Math.random()*G.n));if(!HANDLES.some(([q,r])=>full(q,r)))break;}
}
const cell=(q,r)=>G.cells[key(q,r)];
function full(q,r){const cs=ring(q,r).map(([a,b])=>cell(a,b));return cs.every(c=>c&&!c.clr&&c.col===cs[0].col);}
function rotate(q,r,dir){
  if(!G||G.over||G.paused)return false;const rg=ring(q,r),cs=rg.map(([a,b])=>cell(a,b));if(cs.some(c=>!c||c.clr))return false;
  rg.forEach(([a,b],i)=>{const c=cs[(i-dir+6)%6];G.cells[key(a,b)]=c;c.rot={q,r,dir,k:0};});
  G.moves++;checkRings();return true;
}
function checkRings(){
  HANDLES.forEach(([q,r])=>{if(!full(q,r))return;ring(q,r).forEach(([a,b])=>cell(a,b).clr=.5);G.score++;G.pops.push({q,r,t:0,col:cell(...ring(q,r)[0]).col});});
}
// 消えたあとに、その場で新しいタイルが現れる
function refill(c){c.col=Math.floor(Math.random()*G.n);c.clr=0;c.born=G.t;c.id=++TID;}
function step(dt){
  if(!G||G.over||G.paused||!$('#ov').hidden)return;
  G.t+=dt;
  for(const k in G.cells){const c=G.cells[k];if(c.rot){c.rot.k+=dt/.15;if(c.rot.k>=1)c.rot=null;}
    if(c.clr){c.clr-=dt;if(c.clr<=0)refill(c);}}
  if(Object.values(G.cells).some(c=>c.born===G.t))checkRings(); // 新しく現れた色で偶然そろうこともある
  G.pops.forEach(p=>p.t+=dt);G.pops=G.pops.filter(p=>p.t<1);
  if(G.limit&&G.t>=G.limit)finish();
}
function finish(){G.over=true;const k=`mawasu-best-${G.n}-${G.limit}`,b=Math.max(+store.get(k)||0,G.score);store.set(k,b);
  showOv(`<h2>時間です</h2><div class="score">${G.score}</div><p style="text-align:center">輪をそろえました（${G.n}色・${G.moves}手）<br>この設定の最高：${b}</p>${optsHTML()}<button class="go" data-act="new">もう一度</button>`);}

/* ---------- 画面 ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=20,OX=0,OY=0;
const SQ3=Math.sqrt(3);
const raw=(q,r)=>[SQ3*(q+r/2),1.5*r];
const EXT=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;const all=[];for(let q=-RAD-1;q<=RAD+1;q++)for(let r=-RAD-1;r<=RAD+1;r++)if(dist(q,r)<=RAD+1)all.push([q,r]);all.forEach(([q,r])=>{const [x,y]=raw(q,r);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});return {w:x1-x0+SQ3,h:y1-y0+2};})();
function resize(){const r=$('#stage').getBoundingClientRect();DPR=window.devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=CW*DPR;cv.height=CH*DPR;
  S=Math.min((CW-20)/EXT.w,(CH-20)/EXT.h);OX=CW/2;OY=CH/2;}
new ResizeObserver(resize).observe($('#stage'));
const px=(q,r)=>{const [x,y]=raw(q,r);return [OX+x*S,OY+y*S];};
function hexPath(x,y,r){cx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;cx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r);}cx.closePath();}
function mark(col,x,y,r){cx.fillStyle='rgba(20,22,32,.55)';cx.beginPath();
  if(col===0)cx.arc(x,y,r,0,Math.PI*2);
  else if(col===1){cx.moveTo(x,y-r*1.15);cx.lineTo(x+r,y+r*.7);cx.lineTo(x-r,y+r*.7);cx.closePath();}
  else if(col===2)cx.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);
  else if(col===3){cx.moveTo(x,y-r*1.2);cx.lineTo(x+r,y);cx.lineTo(x,y+r*1.2);cx.lineTo(x-r,y);cx.closePath();}
  else{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r*1.2;cx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
  cx.fill();}
let HOV=null;
function draw(now){
  requestAnimationFrame(draw);
  const dt=Math.min(.05,(now-(draw.last||now))/1000);draw.last=now;step(dt);
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#10131c';cx.fillRect(0,0,CW,CH);if(!G)return;
  // 外形の六角形：盤面の外側1マスまでを、暗い台として敷く
  for(let q=-RAD-1;q<=RAD+1;q++)for(let r=-RAD-1;r<=RAD+1;r++){if(dist(q,r)>RAD+1)continue;const [x,y]=px(q,r);hexPath(x,y,S*.95);cx.fillStyle='#171b28';cx.fill();}
  // 選んでいるハンドルの輪をうっすら
  if(HOV){const [x,y]=px(...HOV);cx.beginPath();cx.arc(x,y,S*2.05,0,Math.PI*2);cx.fillStyle='rgba(255,209,102,.07)';cx.fill();}
  // ハンドル
  HANDLES.forEach(([q,r])=>{const [x,y]=px(q,r);hexPath(x,y,S*.95);cx.fillStyle='#262c42';cx.fill();
    const hov=HOV&&HOV[0]===q&&HOV[1]===r;cx.beginPath();cx.arc(x,y,S*.45,0,Math.PI*2);cx.fillStyle=hov?'#ffd166':'#c9d2ee';cx.fill();
    cx.strokeStyle='#10131c';cx.lineWidth=Math.max(1.5,S*.07);cx.beginPath();cx.arc(x,y,S*.25,-.6,Math.PI*1.2);cx.stroke();
    const a=Math.PI*1.2,ax=x+Math.cos(a)*S*.25,ay=y+Math.sin(a)*S*.25;cx.beginPath();cx.moveTo(ax+S*.11,ay-S*.02);cx.lineTo(ax-S*.02,ay+S*.13);cx.lineTo(ax-S*.13,ay-S*.04);cx.fillStyle='#10131c';cx.fill();});
  // タイル（回転中は弧を描いて動く）
  TILES.forEach(([q,r])=>{const c=cell(q,r);let [x,y]=px(q,r);
    if(c.rot){const [hx,hy]=px(c.rot.q,c.rot.r),a=Math.atan2(y-hy,x-hx),d=Math.hypot(x-hx,y-hy),e=1-(1-Math.min(1,c.rot.k))**2,a0=a-c.rot.dir*Math.PI/3*(1-e);x=hx+Math.cos(a0)*d;y=hy+Math.sin(a0)*d;}
    const grow=c.born>=0&&G.t-c.born<.25?(G.t-c.born)/.25:1,sc=c.clr?Math.max(.1,c.clr/.5):grow;
    hexPath(x,y,S*.92*sc);cx.fillStyle=COLORS[c.col];cx.fill();
    if(c.clr){cx.fillStyle=`rgba(255,255,255,${.7*Math.sin(c.clr*25)**2})`;cx.fill();}
    mark(c.col,x,y,S*.22*sc);});
  // そろった輪の光
  G.pops.forEach(p=>{const [x,y]=px(p.q,p.r);cx.strokeStyle=`rgba(255,255,255,${1-p.t})`;cx.lineWidth=4;cx.beginPath();cx.arc(x,y,S*(2+p.t*2),0,Math.PI*2);cx.stroke();
    cx.fillStyle=`rgba(255,255,255,${1-p.t})`;cx.font=`800 ${Math.max(14,S*.7)}px ${getComputedStyle(document.body).fontFamily}`;cx.textAlign='center';cx.fillText('+1',x,y-S*2.4-p.t*20);});
  $('#sc').textContent=G.score;$('#mv').textContent=G.moves;
  const left=G.limit?Math.max(0,G.limit-G.t):0;$('#tmw').hidden=!G.limit;$('#tm').textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`;$('#tm').classList.toggle('low',left<15);
}

/* ---------- 操作：ハンドルを押すと右回り。↺を押している間・Shift・右クリックは左回り ---------- */
let REV=false,SHIFT=false;
function hitHandle(x,y){let best=null,bd=S*1.05;HANDLES.forEach(([q,r])=>{const [hx,hy]=px(q,r),d=Math.hypot(hx-x,hy-y);if(d<bd){bd=d;best=[q,r];}});return best;}
cv.addEventListener('pointerdown',e=>{if(!G||G.over)return;e.preventDefault();const b=cv.getBoundingClientRect(),h=hitHandle(e.clientX-b.left,e.clientY-b.top);if(!h)return;
  rotate(h[0],h[1],(REV||SHIFT||e.shiftKey||e.button===2)?-1:1);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!G)return;const b=cv.getBoundingClientRect();HOV=e.pointerType==='mouse'?hitHandle(e.clientX-b.left,e.clientY-b.top):null;});
cv.addEventListener('pointerleave',()=>HOV=null);
const hold=(el,fn)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true);el.classList.add('on');});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{fn(false);el.classList.remove('on');}));};
hold($('#brev'),v=>REV=v);
document.addEventListener('keydown',e=>{if(e.key==='Shift'){SHIFT=true;$('#brev').classList.add('on');}if((e.key==='p'||e.key==='Escape')&&G&&!G.over){G.paused=!G.paused;ui();}});
document.addEventListener('keyup',e=>{if(e.key==='Shift'){SHIFT=false;$('#brev').classList.remove('on');}});
window.addEventListener('blur',()=>{SHIFT=false;REV=false;$('#brev').classList.remove('on');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over){G.paused=true;ui();}});
function ui(){$('#bp').textContent=G&&G.paused?'再開':'一時停止';}
function showOv(h){$('#ovbox').innerHTML=h;$('#ov').hidden=false;}
function optsHTML(){return `<div class="sub">色の数</div><div class="seg">${[3,4,5].map(n=>`<button class="${OPT.n===n?'on':''}" data-act="optn" data-v="${n}">${n}色</button>`).join('')}</div>
  <div class="sub">時間</div><div class="seg">${[['120','2分'],['0','なし（練習）']].map(([v,l])=>`<button class="${OPT.time===v?'on':''}" data-act="optt" data-v="${v}">${l}</button>`).join('')}</div>`;}
function helpHTML(first){return `<h1>ヘキサまわし</h1><p style="margin-top:0;color:var(--muted)">ハンドルを回して、まわり6枚の色をそろえるパズルの試作です</p><ol>
  <li>丸いつまみが<b>ハンドル</b>です。押すと、まわりの6枚が<b>右回りに1つ</b>ずれます。<b>↺ボタンを押している間</b>（PCはShiftを押しながら、または右クリック）は左回りです。</li>
  <li>ハンドルの<b>まわり6枚がぜんぶ同じ色</b>になると消えて、その場に新しい6枚が現れます。</li>
  <li>1つのハンドルを回しても、その輪の中の色の数は変わりません。<b>となりのハンドルを回して、外から同じ色を運び込みましょう</b>。1枚のタイルは3つのハンドルに囲まれています。</li>
  <li>制限時間の中で、いくつ輪をそろえられるかを競います。</li></ol>
  ${first?optsHTML()+'<button class="go" data-act="new">はじめる</button>':'<button class="go" data-act="close">閉じる</button>'}`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='new'){newGame();$('#ov').hidden=true;ui();}
  else if(a==='close'){$('#ov').hidden=true;}
  else if(a==='help'){showOv(helpHTML(!G||G.over));}
  else if(a==='optn'){OPT.n=+b.dataset.v;store.set('mawasu-n',OPT.n);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='optt'){OPT.time=b.dataset.v;store.set('mawasu-time',OPT.time);b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}
  else if(a==='pause'&&G&&!G.over){G.paused=!G.paused;ui();}});
resize();showOv(helpHTML(true));requestAnimationFrame(draw);
</script>
</body>
</html>
