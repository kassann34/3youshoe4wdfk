<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>スライド漢字</title>
<meta name="description" content="漢字を4×4に切った15枚のスライドパズル。みんなで同じ並びをそろえる">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: 一列レイアウト。遊ぶ画面は盤を大きく、その下に答えの欄とみんなの盤 */
:root{
  --felt:#2c4a3e; --felt-hi:#3b6152; --on-felt:#eef2e6; --on-felt-muted:#b9c8b6;
  --bg:#fffaf0; --surface:#f5e8cd; --ink:#2e1f14; --muted:#7a6650; --rule:#dcc6a2;
  --walnut:#6b4226; --walnut-dk:#3e2414; --birch:#e9cf9e;
  --p:#2f5d8a; --accent:#6b4226; --accent-ink:#fbf3e3; --ok:#3f7d3a; --warn:#b0352a;
  --shadow:0 3px 0 rgba(62,36,20,.25),0 8px 20px rgba(0,0,0,.18);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --disp:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--t0)}.logo h1 .pb{color:var(--t1)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.team{border:2px solid var(--c);background:var(--cs);border-radius:14px;padding:10px}
.team h3{margin:0 0 6px;font-size:15px;color:var(--c)}
.team ul{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.team li{padding:2px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.team li.off{opacity:.5}
.team li.me{font-weight:800}
.t0{--c:var(--t0);--cs:var(--t0s)}.t1{--c:var(--t1);--cs:var(--t1s)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
table.t th:first-child{text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--c)}
.win{font-size:24px;font-weight:800;text-align:center}
/* ゲーム画面 */
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:var(--bg)}
.plist li.off{opacity:.5}
.pbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.clock{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bwrap{position:relative}
.board{position:relative;width:min(100%,440px);aspect-ratio:1/1;margin:0 auto;background:#3d3631;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;--img:none}
.tile{position:absolute;left:0;top:0;width:25%;height:25%;background-color:#fbf6ea;background-image:var(--img);background-size:400% 400%;box-shadow:inset 0 0 0 1.5px rgba(80,66,50,.45);border-radius:5px;transition:transform .09s ease-out,border-radius .3s,box-shadow .3s;cursor:pointer}
.tile .no{position:absolute;left:5px;top:1px;font-size:11px;font-weight:700;color:#a3967f;pointer-events:none}
.tile.blank{opacity:0;transition:opacity .5s}
.board.done .tile.blank{opacity:1}
.board.done .tile{box-shadow:none;border-radius:0;cursor:default}
.board.done{box-shadow:0 0 0 3px var(--ok)}
.board.wait .tile{filter:blur(6px)}
.board.drag .tile{transition:transform .06s linear}
.board:not(.done) .tile.blank{opacity:1;background:repeating-linear-gradient(45deg,#4a423b 0 7px,#3d3631 7px 14px);box-shadow:inset 0 3px 8px rgba(0,0,0,.55);border-radius:5px;cursor:grab}
.board.drag .tile.blank{box-shadow:inset 0 0 0 3px var(--p),inset 0 3px 8px rgba(0,0,0,.55)}
.cdov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;color:#25222a;text-shadow:0 2px 0 #fff;pointer-events:none}
.cdov[hidden]{display:none}
.cdov2:empty{display:none}
.cdov2{font-size:40px;font-weight:800;text-align:center}
.hint{position:absolute;right:0;top:0;width:64px;height:64px;background:#fbf6ea;border:1px solid var(--rule);border-radius:8px}
@media (max-width:560px){.hint{position:static;display:block;margin:8px auto 0}}
.ansrow{margin-top:12px}
.msg{min-height:1.6em;margin-top:6px;font-weight:700;text-align:center}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--warn)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.mini canvas{width:100%;aspect-ratio:1/1;border-radius:8px;display:block}
.mini.done canvas{box-shadow:0 0 0 3px var(--ok)}
.mini.gave canvas{opacity:.5}
.mini.peek{cursor:pointer}
.mini.sel canvas{box-shadow:0 0 0 3px var(--p)}
.watchbox canvas{display:block;width:min(100%,440px);aspect-ratio:1/1;margin:0 auto;border-radius:12px}
.watchbox[hidden],.bwrap[hidden]{display:none}
.mini .nm{font-size:13px;font-weight:700;text-align:center;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .stt{text-align:center;font-size:12px}
.rev{width:160px;height:160px;background:#fbf6ea;border-radius:12px;border:1px solid var(--rule);display:block;margin:6px auto}
.bigch{font-size:22px;font-weight:800}

/* ---------- 木のパズルの見た目 ---------- */
body{background:radial-gradient(ellipse 120% 70% at 50% 0%,var(--felt-hi),var(--felt) 70%) fixed var(--felt);color:var(--ink)}
/* 名前：タイトルそのものを、1マス空いた木の札の列にする */
header.top{margin-bottom:18px}
.logo{flex-direction:column;align-items:flex-start;gap:6px}
.logo h1{display:flex;gap:3px;padding:5px;background:var(--walnut);border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.3);letter-spacing:0}
.lt{--tb:#ead2a3;width:38px;height:38px;display:grid;place-items:center;font-family:var(--disp);font-weight:400;font-size:23px;line-height:1;color:var(--ink);border-radius:5px;
  background:repeating-linear-gradient(var(--ga,4deg),rgba(140,95,50,.10) 0 1.5px,transparent 1.5px 6px,rgba(140,95,50,.06) 6px 7px,transparent 7px 12px),var(--tb);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.5),inset -2px -3px 0 rgba(110,70,35,.35),0 1px 2px rgba(0,0,0,.4)}
.lt.gap{background:var(--walnut-dk);box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.lt:nth-child(2n){--tb:#e5c993;--ga:-3deg}.lt:nth-child(3n){--tb:#efd8ab;--ga:9deg}
.logo small{color:var(--on-felt-muted);font-size:12px}
@media (max-width:380px){.lt{width:33px;height:33px;font-size:20px}}
.chip{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.18);color:var(--on-felt)}
header .btn.small{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.25);color:var(--on-felt);box-shadow:none}
/* 板（カード）：白木の板 */
.card{background:linear-gradient(180deg,#f8edd6,#f1e2c3);border:0;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),var(--shadow)}
.card h2{font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:.02em}
input[type=text],select{background:var(--bg);border-color:#d3b98f}
.btn{background:#fbf3e3;border-color:#c9ad84;color:var(--ink);box-shadow:0 2px 0 #c9ad84;transition:transform .05s}
.btn:hover{border-color:var(--walnut)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.primary{background:linear-gradient(180deg,#80502d,#62391f);color:var(--accent-ink);border-color:var(--walnut-dk);box-shadow:0 3px 0 var(--walnut-dk)}
.btn.primary:hover{border-color:var(--walnut-dk);filter:brightness(1.08)}
.code{display:flex;justify-content:center;gap:4px;margin-top:4px}
.code .lt{width:46px;height:46px;font-size:28px}
.plist li{background:var(--bg);border-color:var(--rule)}
details.rules summary{font-family:var(--disp);font-weight:400}
/* 遊ぶ画面：盤はフェルトの上にじかに置く */
.card.play{background:none;box-shadow:none;padding:0}
.pbar{color:var(--on-felt);padding:0 4px}
.pbar .sub{color:var(--on-felt-muted);font-size:14px}
.clock{font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.02em}
.frame{width:min(100%,472px);margin:0 auto;padding:clamp(8px,3vw,14px);border-radius:16px;
  background:repeating-linear-gradient(87deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px,rgba(255,255,255,.04) 9px 10px,transparent 10px 17px),linear-gradient(160deg,#7d4d2b,#5b361d);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3),0 14px 28px rgba(0,0,0,.4)}
.board{width:100%;background:var(--walnut-dk);border-radius:6px;box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.tile{background-color:var(--tb,#e9cf9e);
  background-image:var(--img),repeating-linear-gradient(var(--ga,3deg),rgba(140,95,50,.10) 0 1.5px,transparent 1.5px 6px,rgba(140,95,50,.06) 6px 7px,transparent 7px 13px);
  background-blend-mode:multiply,normal;background-size:400% 400%,100% 100%;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.5),inset -2px -3px 0 rgba(110,70,35,.38),0 2px 3px rgba(0,0,0,.35);border-radius:6px}
.tile .no{color:rgba(90,55,25,.55)}
.board:not(.done) .tile.blank{background:none;box-shadow:none}
.board.drag .tile.blank{box-shadow:inset 0 0 0 3px #8fb8e0}
.board.done{box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.board.done .tile{box-shadow:none;border-radius:0}
.frame:has(.board.done){box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3),0 0 0 3px #e8c766,0 14px 28px rgba(0,0,0,.4)}
.cdov{font-family:var(--disp);font-weight:400;color:var(--walnut-dk);text-shadow:0 2px 0 rgba(255,255,255,.6)}
.ctrl{margin-top:16px}
.ctrl .ansrow{margin-top:0}
.hint{background:var(--birch);border:3px solid var(--walnut);border-radius:8px}
.note{color:var(--on-felt-muted)}
.card .note{color:var(--muted)}
.watchbox b{color:var(--on-felt)}
.watchbox .btn.small{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.25);color:var(--on-felt);box-shadow:none}
.watchbox canvas{width:min(100%,472px);border-radius:16px;box-shadow:0 14px 28px rgba(0,0,0,.4)}
.mini canvas{border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.mini.done canvas{box-shadow:0 0 0 3px #d9b44a,0 3px 6px rgba(0,0,0,.25)}
.mini.sel canvas{box-shadow:0 0 0 3px var(--p),0 3px 6px rgba(0,0,0,.25)}
.msg.ok{color:var(--ok)}
.rev{background:var(--birch);border:6px solid var(--walnut);border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.bigch{font-family:var(--disp);font-weight:400;font-size:26px}
.win{font-family:var(--disp);font-weight:400}
.cdov2{color:var(--on-felt);font-family:var(--disp);font-weight:400}
.wait{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1 aria-label="スライド漢字"><span class="lt">ス</span><span class="lt">ラ</span><span class="lt">イ</span><span class="lt">ド</span><span class="lt gap"></span><span class="lt">漢</span><span class="lt">字</span></h1><small>15枚のパズルで漢字をそろえる ・ <span id="ver">試作 v9</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* スライド漢字：1文字の漢字を4×4に切った15枚のスライドパズル。
   ・並びはいつも完全ランダム（解ける並びだけ）。右下の1枚が空き
   ・みんなで：全員に同じ漢字・同じ並びが配られ、各自の盤でそろえる。ほかの人の盤も小さく見える
   ・分かったら漢字を入力できる（いまは記録だけ。何をゴールにするかは、遊んでみてから決める）
   部屋主が並びと記録を持つ。各自は自分の盤の並びと手数を送る */
const PREFIX='suraido-room-';
const VER=9;
const MAXP=10;

const BL=15; // 空きマス（右下の1枚）
// そろったか：見た目が同じタイル（真っ白など）は、入れかわっていてもよい。grp[t] は見た目のなかま番号
// 空きマスは「右下の1枚」がはまる場所とみなす。なので空きが白いところにあっても、右下の1枚も白ければ完成
const solved=(b,g)=>b.every((t,i)=>t===i||(g&&g[t]===g[i]));
// タイルの見た目くらべ：30×30 にして墨のあるなしを比べ、ほぼ同じならなかま
function groupsOf(cv){const S=cv.width,q=S/4,N=30,g=cv.getContext('2d'),bits=[];
  for(let t=0;t<16;t++){const d=g.getImageData((t&3)*q,(t>>2)*q,q,q).data,a=new Uint8Array(N*N);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=Math.floor((x+.5)*q/N),py=Math.floor((y+.5)*q/N);a[y*N+x]=d[(py*q+px)*4+3]>128?1:0;}bits.push(a);}
  const p=[...Array(16).keys()],f=i=>p[i]===i?i:(p[i]=f(p[i]));
  for(let i=0;i<16;i++)for(let j=i+1;j<16;j++){let df=0;for(let k=0;k<N*N;k++)df+=bits[i][k]!==bits[j][k];if(df/(N*N)<.015)p[f(j)]=f(i);}
  return p.map((_,i)=>f(i));}

// 完全ランダムな並び（解けるものだけ）：入れかえの偶奇と、空きマスの右下からの距離の偶奇がそろえば解ける
function scramble(){for(;;){const b=shuffle([...Array(16).keys()]);
  let par=0;const v=b.slice();for(let i=0;i<16;i++)while(v[i]!==i){const j=v[i];[v[i],v[j]]=[v[j],v[i]];par^=1;}
  const e=b.indexOf(BL),dist=(3-e%4)+(3-Math.floor(e/4));
  if(par!==(dist&1)){const a=[0,1,2,3].map(k=>b.indexOf(k)).filter(i=>i>=0);// 空きでない2枚を入れかえて偶奇を直す
    const i=b.findIndex(t=>t!==BL),j=b.findIndex((t,k)=>k>i&&t!==BL);[b[i],b[j]]=[b[j],b[i]];}
  if(b.filter((t,i)=>t===i).length<=3)return b;}}

function hostInit(){H={phase:'lobby',players:[],hostId:null,lvSel:'2',qSel:'3',timeSel:'300',hintSel:'0',numSel:'0',inGame:[],q:[],qi:0,ch:null,start:null,st:{},qStart:null,endAt:null,cdEnd:null,hist:[],games:0,result:null};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true});return id;}
const onlineId=id=>{const P=H.players.find(p=>p.id===id);return P&&P.online;};
function pubFor(pid){
  const inQ=['count','play','reveal'].includes(H.phase),now=Date.now();
  return {phase:H.phase,ver:VER,code:NET.code,solo:NET.solo,players:H.players.map(p=>({id:p.id,name:p.name,online:p.online})),hostId:H.hostId,

    qi:H.qi,qn:H.q.length,games:H.games,ch:inQ?H.ch:null,grp:inQ?H.grp:null,start:inQ?H.start:null,st:inQ?H.st:null,
    cdRemain:H.cdEnd&&H.phase==='count'?Math.max(0,H.cdEnd-now):null,elapsed:H.qStart?now-H.qStart:0,remain:H.endAt?Math.max(0,H.endAt-now):null,
    hist:H.phase==='end'||H.phase==='reveal'?H.hist:null,result:H.result};
}
function push(){NET.conns.forEach(c=>sendTo(c,{t:'view',v:pubFor(c._pid),you:c._pid||null}));setView(pubFor(H.hostId),H.hostId);}
function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function startGame(){
  absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);H.q=shuffle(pool(H.lvSel)).slice(0,+H.qSel);H.qi=0;H.hist=[];H.result=null;startQ();
}
function startQ(){H.ch=H.q[H.qi];H.start=scramble();H.st={};H.grp=null;if(KIMG.ch===H.ch&&KIMG.ready)H.grp=groupsOf(KIMG.cv);
  H.inGame.forEach(id=>H.st[id]={b:H.start.slice(),n:0,done:false,t:null,gave:false,gt:null,gn:null,miss:0});
  H.phase='count';H.cdEnd=Date.now()+3000;H.qStart=null;H.endAt=null;}
// 終わり：全員が「そろえて、当てた」かギブアップ（完成してからでも答えられる）
const allDone=()=>H.inGame.every(id=>{const s=H.st[id];return !s||(s.done&&s.gt!=null)||s.gave||!onlineId(id);});
function endQ(){if(H.phase!=='play')return;H.phase='reveal';H.endAt=null;
  const rows=H.inGame.map(id=>{const s=H.st[id];return {id,done:s.done,t:s.t,n:s.n,gave:s.gave,gt:s.gt,gn:s.gn,miss:s.miss,gp:0,dp:0};});
  // 順位点：当てた順・そろえた順のそれぞれで、N人なら 1位 N−1点、2位 N−2点…（ひとりのときは、できたら1点）
  const N=rows.length,pt=r=>N===1?1:Math.max(0,N-r);
  rows.filter(r=>r.gt!=null).sort((a,b)=>a.gt-b.gt).forEach((r,k,arr)=>{const rk=arr.findIndex(x=>x.gt===r.gt)+1;r.gp=pt(rk);r.gr=rk;});
  rows.filter(r=>r.done).sort((a,b)=>a.t-b.t).forEach((r,k,arr)=>{const rk=arr.findIndex(x=>x.t===r.t)+1;r.dp=pt(rk);r.dr=rk;});
  H.hist.push({ch:H.ch,rows});}
const totals=hist=>{const o={};(hist||[]).forEach(h=>h.rows.forEach(r=>{o[r.id]=(o[r.id]||0)+r.gp+r.dp;}));return o;};
function endGame(){H.phase='end';H.games++;
  H.result={rows:H.inGame.map(id=>{const P=H.players.find(p=>p.id===id),rs=H.hist.map(h=>h.rows.find(r=>r.id===id)).filter(Boolean),dn=rs.filter(r=>r.done),gs=rs.filter(r=>r.gt!=null);
    return {id,name:P?P.name:'?',pts:rs.reduce((a,r)=>a+r.gp+r.dp,0),done:dn.length,tsum:dn.reduce((a,r)=>a+r.t,0),nsum:dn.reduce((a,r)=>a+r.n,0),got:gs.length,gsum:gs.reduce((a,r)=>a+r.gt,0)};})};}
function act(pid,m){
  if(!H||!m)return;
  const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end',s=H.st&&H.st[pid];
  switch(m.t){
    case 'b':{if(H.phase!=='play'||!s||s.done||s.gave)return;const b=m.b;
      if(!Array.isArray(b)||b.length!==16||new Set(b).size!==16||!b.every(t=>Number.isInteger(t)&&t>=0&&t<16))return;
      s.b=b.slice();s.n=Math.max(0,Math.min(99999,+m.n|0));
      if(solved(s.b,H.grp)){s.done=true;s.t=Date.now()-H.qStart;if(allDone())endQ();}break;}
    case 'ans':{if(H.phase!=='play'||!s||s.gt!=null||typeof m.c!=='string')return;
      if(m.c===H.ch){s.gt=Date.now()-H.qStart;s.gn=Math.max(0,+m.n|0);if(allDone())endQ();}else s.miss++;break;}
    case 'give':{if(H.phase!=='play'||!s||s.done)return;s.gave=true;if(allDone())endQ();break;}
    case 'next':if(isHost&&H.phase==='reveal'){if(H.qi+1>=H.q.length)endGame();else{H.qi++;startQ();}}break;
    case 'lvSel':if(isHost&&setup&&LEVELS.some(l=>l[0]===m.v))H.lvSel=m.v;break;
    case 'qSel':if(isHost&&setup&&['1','3','5','10'].includes(m.v))H.qSel=m.v;break;
    case 'timeSel':if(isHost&&setup&&['0','180','300','600'].includes(m.v))H.timeSel=m.v;break;
    case 'hintSel':if(isHost&&setup&&['0','1'].includes(m.v))H.hintSel=m.v;break;
    case 'numSel':if(isHost&&setup&&['0','1'].includes(m.v))H.numSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);}break;
    default:return;
  }
  push();
}
function hostWire(c){
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(m.ver!==VER){sendTo(c,{t:'reload',ver:VER});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
      if(!NET.conns.includes(c))NET.conns.push(c);
      c._tok=typeof m.tok==='string'?m.tok.slice(0,40):null;c._want=m.want==='watch'?'watch':'play';c._name=clean(m.name,12);
      let P=c._tok?H.players.find(p=>p.tok===c._tok&&p.id!==H.hostId):null;
      if(P){NET.conns.forEach(o=>{if(o!==c&&o._pid===P.id)o._pid=null;});c._pid=P.id;P.online=true;if(c._name)P.name=c._name;}
      else if(c._want==='play'&&(H.phase==='lobby'||H.phase==='end')&&H.players.length<MAXP)c._pid=addPlayer(c._tok,c._name);
      else c._pid=null;
      push();sendTo(c,{t:'chathist',list:CHAT.list});return;
    }
    if(m.t==='chat'){if(NET.conns.includes(c))hostChat(c._pid,c._name,m.tx);return;}
    if(c._pid)act(c._pid,m);
  });
  c.on('close',()=>{
    NET.conns=NET.conns.filter(o=>o!==c);
    if(c._pid&&!NET.conns.some(o=>o._pid===c._pid)){const P=H.players.find(p=>p.id===c._pid);if(P){P.online=false;if(H.phase==='lobby')H.players=H.players.filter(p=>p!==P);}}
    if(H.phase==='play'&&allDone())endQ();
    push();
  });
  c.on('error',()=>{});
}

const CHAT={list:[],open:false,unread:0};
function sendTo(c,m){if(c&&c.open){try{c.send(m);}catch(e){}}}
function hostChat(pid,specName,tx){

function cleanMsg(m){if(!m||typeof m.tx!=='string')return null;const tx=m.tx.trim().slice(0,200);if(!tx)return null;return {n:clean(m.n,20),pid:typeof m.pid==='string'?m.pid:null,tx,ts:+m.ts||Date.now()};}
function addChat(c){CHAT.list.push(c);if(CHAT.list.length>100)CHAT.list.shift();if(!CHAT.open&&c.pid!==MYID)CHAT.unread++;renderChat();}

function sendChat(tx){tx=String(tx||'').trim().slice(0,200);if(!tx)return false;if(NET.role==='host')hostChat(H.hostId,null,tx);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,{t:'chat',tx});else return false;return true;}

/* ---------- 通信 ---------- */
function resetNet(){
  CHAT.list=[];CHAT.unread=0;
  try{if(NET.conn)NET.conn.close();}catch(e){}
  NET.conns.forEach(c=>{try{c.close();}catch(e){}});
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:null,peer:null,conn:null,conns:[],code:null,status:'',solo:false});H=null;V=null;MYID=null;LOC.key=null;
}
function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください（ひとりで遊ぶことはできます）';render();return true;}return false;}
function soloRoom(){resetNet();NET.role='host';NET.solo=true;NET.code=null;hostInit();H.hostId=addPlayer(TOK,NAME);push();}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });
  push();
}
function joinRoom(code,want){
  code=clean(code,8).toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';render();return;}
  if(noPeer())return;
  resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m.t==='chathist'&&Array.isArray(m.list)){CHAT.list=m.list.map(cleanMsg).filter(Boolean).slice(-100);renderChat();return;}
      if(m.t==='view'&&m.v&&m.v.ver!==VER){V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('suraido-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}
function send(m){if(NET.role==='host')act(H.hostId,m);else if(NET.conn&&NET.conn.open)sendTo(NET.conn,m);}
function leave(){resetNet();setRoomURL(null);try{sessionStorage.removeItem('suraido-joined');}catch(e){}render();}
function setRoomURL(code){try{const u=new URL(location.href);if(code)u.searchParams.set('room',code);else u.searchParams.delete('room');u.searchParams.delete('v');history.replaceState(null,'',u);}catch(e){}}
const roomLink=()=>{try{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('room',NET.code);return u.toString();}catch(e){return '';}};

const KIMG={ch:null,cv:null,url:null,ready:false};
const INK='#3a2214',PAPER='#e9cf9e';
function makeImg(ch){if(KIMG.ch===ch)return;KIMG.ch=ch;KIMG.ready=false;KIMG.url=null;
  const draw=()=>{if(KIMG.ch!==ch)return;const S=480,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d',{willReadFrequently:true});
    g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.font=`700 ${S*.8}px ${KFONT}`;g.fillText(ch,S/2,S/2);
    // 墨のあるところを調べて、盤いっぱいに広げる（形はそのまま）
    const a=g.getImageData(0,0,S,S).data;let x0=S,y0=S,x1=-1,y1=-1;for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(a[(y*S+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    const o=document.createElement('canvas');o.width=o.height=S;const h=o.getContext('2d');
    if(x1>=0){const w=x1-x0+1,hh=y1-y0+1,k=S*.9/Math.max(w,hh),dw=w*k,dh=hh*k;h.drawImage(c,x0,y0,w,hh,(S-dw)/2,(S-dh)/2,dw,dh);}
    h.globalCompositeOperation='source-in';h.fillStyle=INK;h.fillRect(0,0,S,S);
    KIMG.cv=o;KIMG.url=o.toDataURL();KIMG.ready=true;applyImg();
    if(NET.role==='host'&&H&&H.ch===ch&&!H.grp){H.grp=groupsOf(o);push();}};
  if(document.fonts&&document.fonts.load){let done=false;const go=()=>{if(!done){done=true;draw();}};document.fonts.load(`700 100px "Noto Sans JP"`,ch).then(go,go);setTimeout(go,2500);}else draw();
}
function applyImg(){const b=$('#board');if(b&&KIMG.url)b.style.setProperty('--img',`url(${KIMG.url})`);const h=$('#hintimg');if(h&&KIMG.url)h.src=KIMG.url;const r=$('#revimg');if(r&&KIMG.url)r.src=KIMG.url;drawMinis();}

// pos のタイルを空きマスの方へ（同じ行・列なら、間のタイルもまとめて）
function slideFrom(pos){if(!canMove())return false;const b=LOC.b;let e=b.indexOf(BL);
  const er=e>>2,ec=e&3,pr=pos>>2,pc=pos&3;let step;if(er===pr&&ec!==pc)step=pc>ec?1:-1;else if(ec===pc&&er!==pr)step=pr>er?4:-4;else return false;
  while(e!==pos){const nx=e+step;b[e]=b[nx];b[nx]=BL;e=nx;LOC.n++;}
  afterMove();return true;}
// 向き（タイルが動く向き）で1枚
function slideDir(dx,dy){const e=LOC.b.indexOf(BL),r=e>>2,c=e&3;let p=-1;
  if(dx<0&&c<3)p=e+1;else if(dx>0&&c>0)p=e-1;else if(dy<0&&r<3)p=e+4;else if(dy>0&&r>0)p=e-4;if(p>=0)slideFrom(p);}
function afterMove(){placeTiles();send({t:'b',b:LOC.b,n:LOC.n});
  if(solved(LOC.b,V.grp)){LOC.msg='完成！';LOC.mcls='ok';}updatePlay();}

    <div class="row" style="justify-content:flex-end"><button class="btn small" data-act="give" id="givebtn">ギブアップ</button></div></div>`:'<div class="note">観戦中です。下の盤を押すと大きく見られます。</div><div class="cdov2" id="cdov"></div><div class="watchbox" id="watchbox" hidden><div class="row" style="margin-bottom:6px"><b id="watchnm"></b></div><canvas id="watchcv" width="880" height="880"></canvas></div>'}
  </div>
  ${multi||!me?`<div class="card"><h2>みんなの盤</h2><div class="sub" id="peekhint" style="margin:-6px 0 8px"></div><div class="minis" id="minis">${V.inGame.filter(id=>id!==MYID).map(id=>`<div class="mini" data-id="${id}"><canvas width="160" height="160"></canvas><div class="nm">${esc(pname(id))}</div><div class="stt sub"></div></div>`).join('')}</div></div>`:''}`;
}
function placeTiles(){const bd=$('#board');if(!bd||!LOC.b)return;LOC.b.forEach((t,p)=>{const el=bd.querySelector(`[data-t="${t}"]`);if(el)el.style.transform=`translate(${(p&3)*100}%,${(p>>2)*100}%)`;});
  bd.classList.toggle('done',solved(LOC.b,V&&V.grp));}
// ほかの人の盤：自分がそろえる（かギブアップ）までは、ふせて見せない（答えが見えてしまうので）
const canPeek=()=>{if(!V)return false;if(!inGameMe())return true;const s=myS();return !!(s&&(s.done||s.gave));};
function drawBoardCv(cv,s,hide){const g=cv.getContext('2d'),W0=cv.width,fr=W0*.035,W=W0-2*fr,q=W/4,pad=Math.max(1,W/200);
  g.fillStyle='#62391f';g.fillRect(0,0,W0,W0);g.fillStyle='#3e2414';g.fillRect(fr,fr,W,W);g.save();g.translate(fr,fr);
  s.b.forEach((t,p)=>{if(t===BL&&!s.done)return;const x=(p&3)*q,y=(p>>2)*q;g.fillStyle=hide?'#a27a4c':PAPER;g.fillRect(x+pad,y+pad,q-2*pad,q-2*pad);
    if(!hide&&KIMG.cv){const S=KIMG.cv.width/4;g.globalCompositeOperation='multiply';g.drawImage(KIMG.cv,(t&3)*S,(t>>2)*S,S,S,x+pad,y+pad,q-2*pad,q-2*pad);g.globalCompositeOperation='source-over';}
    if(!s.done){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+pad,y+pad,q-2*pad,Math.max(1,q*.03));g.fillStyle='rgba(110,70,35,.35)';g.fillRect(x+pad,y+q-pad-Math.max(1,q*.04),q-2*pad,Math.max(1,q*.04));}});
  g.restore();
  if(hide){g.fillStyle='rgba(62,36,20,.75)';g.font=`800 ${W*.32}px ${KFONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('？',W0/2,W0/2);}}
function drawMinis(){if(!V||!V.st)return;const peek=canPeek();
  document.querySelectorAll('.mini').forEach(el=>{const s=V.st[el.dataset.id];if(!s)return;drawBoardCv(el.querySelector('canvas'),s,!peek);
    el.classList.toggle('done',s.done);el.classList.toggle('gave',s.gave);el.classList.toggle('peek',peek);el.classList.toggle('sel',peek&&LOC.watch===el.dataset.id);
    el.querySelector('.stt').textContent=s.done?`完成 ${fmtT(s.t)} ・ ${s.n}手${s.gt!=null?'':' ・ 答え待ち'}`:s.gave?'ギブアップ':`${s.n}手${s.gt!=null?' ・ 当てた！':''}`;});
  const hn=$('#peekhint');if(hn)hn.textContent=peek?'盤を押すと、大きく見に行けます':'自分がそろえると、みんなの盤が見られます';
  // 見に行っている人の盤を大きく
  const wb=$('#watchbox'),bw=$('#mybw'),ws=peek&&LOC.watch&&V.st[LOC.watch];
  if(wb){wb.hidden=!ws;if(bw)bw.hidden=!!ws;if(ws){drawBoardCv($('#watchcv'),ws,false);$('#watchnm').textContent=`${pname(LOC.watch)} の盤 ・ ${ws.done?`完成 ${fmtT(ws.t)}`:ws.gave?'ギブアップ':`${ws.n}手`}`;}}}
function clockText(){if(!V)return '';if(V.phase==='count')return '';const el=V.elapsed+(V.phase==='play'?performance.now()-VIEWAT:0);
  if(V.remain!=null){const r=V.remain-(V.phase==='play'?performance.now()-VIEWAT:0);return `のこり ${fmtT(r+999)}`;}return `経過 ${fmtT(el)}`;}
function updatePlay(){if(!V||!(V.phase==='count'||V.phase==='play'))return;
  const s=myS(),c=$('#clock');if(c)c.textContent=clockText();
  const mv=$('#moves');if(mv&&inGameMe())mv.textContent=`${LOC.n}手`;
  const ov=$('#cdov');if(ov){if(V.phase==='count'){const left=(V.cdRemain||0)-(performance.now()-VIEWAT);ov.hidden=false;ov.textContent=String(Math.max(1,Math.ceil(left/1000)));}else ov.hidden=true;}
  const bd=$('#board');if(bd)bd.classList.toggle('wait',V.phase!=='play');
  const m=$('#msg');if(m&&s){let t=LOC.msg,cl=LOC.mcls;if(s.done&&s.gt==null){t=`完成！ ${fmtT(s.t)} ・ ${s.n}手　漢字を答えてください`;cl='ok';}else if(s.done){t=`完成！ ${fmtT(s.t)} ・ ${s.n}手　ほかの人を待っています`;cl='ok';}else if(s.gave){t='ギブアップしました。ほかの人を待っています';cl='';}
    else if(s.gt!=null&&!LOC.msg)t=`「${V.ch}」正解！（${fmtT(s.gt)} ・ ${s.gn}手で当てた）`;m.textContent=t;m.className='msg '+cl;}
  const a=$('#ans'),ab=document.querySelector('[data-act="ans"]');if(a&&s){const off=!!(s.gt!=null||s.gave||V.phase!=='play');a.disabled=off;if(ab)ab.disabled=off;}
  const gb=$('#givebtn');if(gb&&s)gb.disabled=!!(s.done||s.gave||V.phase!=='play');
  if(s&&s.gave&&bd)bd.classList.add('done');
  drawMinis();}
setInterval(()=>{if(V&&(V.phase==='count'||V.phase==='play'))updatePlay();},200);
function answer(){const i=$('#ans');if(!i)return;const s=myS();if(!s||s.gt!=null||V.phase!=='play')return;const c=[...i.value.trim()].find(ch=>/\p{Script=Han}/u.test(ch));
  if(!c){LOC.msg='漢字を1文字入れてください';LOC.mcls='ng';updatePlay();return;}
  send({t:'ans',c,n:LOC.n});
  if(c===V.ch){LOC.msg=`「${c}」正解！`;LOC.mcls='ok';}else{LOC.msg=`「${c}」ではありません`;LOC.mcls='ng';}
  i.value='';updatePlay();}
function rowsTable(rows,tot){const srt=rows.slice().sort((a,b)=>(b.gp+b.dp)-(a.gp+a.dp)||(b.done-a.done)||((a.t||0)-(b.t||0))||((a.gt||9e9)-(b.gt||9e9)));const multi=rows.length>1;
  const rk=r=>r?`<span class="sub">${r}位 </span>`:'';
  return `<table class="t"><tr><th>名前</th><th>当てた</th><th>そろえた</th><th>点</th>${multi&&V.qn>1?'<th>合計</th>':''}</tr>${srt.map(r=>`<tr class="${r.id===MYID?'me':''}"><td>${esc(pname(r.id))}</td>
    <td class="num">${r.gt!=null?`${multi?rk(r.gr):''}${fmtT(r.gt)}<div class="sub">${r.gn}手 ・ +${r.gp}点</div>`:'—'}${r.miss?`<div class="sub">まちがい ${r.miss}</div>`:''}</td>
    <td class="num">${r.done?`${multi?rk(r.dr):''}${fmtT(r.t)}<div class="sub">${r.n}手 ・ +${r.dp}点</div>`:r.gave?'<span class="sub">ギブアップ</span>':`<span class="sub">未完成（${r.n}手）</span>`}</td>
    <td class="num">${r.gp+r.dp}</td>${multi&&V.qn>1?`<td class="num">${tot[r.id]||0}</td>`:''}</tr>`).join('')}</table>`;}
function vReveal(){const h=V.hist&&V.hist[V.hist.length-1];if(!h)return '';
  return `<div class="card center"><div class="sub">${V.qn>1?`${V.qi+1} / ${V.qn} 問目の`:''}答え</div><img id="revimg" class="rev" alt="${esc(h.ch)}"><div class="bigch">${esc(h.ch)}</div></div>
  <div class="card">${rowsTable(h.rows,totals(V.hist))}</div>
  <div class="card">${amHost()?`<button class="btn primary wide" data-act="next">${V.qi+1>=V.qn?'結果へ':'次の問題へ'}</button>`:'<div class="wait"><span class="dots">部屋主が次へ進めるのを待っています</span></div>'}</div>`;}
function vEnd(){const R=V.result;if(!R)return '';
  const rows=R.rows.slice().sort((a,b)=>(b.pts-a.pts)||(b.done-a.done)||(a.tsum-b.tsum));const best=rows.length>1&&rows[0].pts>0?rows[0].pts:null;
  return `<div class="card">${best!=null?`<div class="win">${rows.filter(r=>r.pts===best).map(r=>esc(r.name)).join('・')} の勝ち！</div>`:''}<h2>結果</h2><table class="t"><tr><th>名前</th><th>点</th><th>完成</th><th>平均時間</th><th>平均手数</th><th>当てた</th></tr>${rows.map(r=>`<tr class="${r.id===MYID?'me':''}"><td>${esc(r.name)}</td><td class="num">${r.pts}</td><td class="num">${r.done}/${V.qn}</td>
    <td class="num">${r.done?fmtT(r.tsum/r.done):'—'}</td><td class="num">${r.done?Math.round(r.nsum/r.done):'—'}</td><td class="num">${r.got}${r.got?`<div class="sub">平均 ${fmtT(r.gsum/r.got)}</div>`:''}</td></tr>`).join('')}</table>
    <div class="sub" style="margin-top:8px">出た漢字：${(V.hist||[]).map(h=>esc(h.ch)).join('・')}</div></div>
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次を始めるのを待っています</span></div>'}</div>`;}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else{const playing=V.phase==='count'||V.phase==='play';
    key=playing?JSON.stringify(['play',LOC.key,MYID,V.inGame,NET.status]):JSON.stringify([V.phase,V.players,V.lvSel,V.qSel,V.timeSel,V.hintSel,V.numSel,V.specs,V.games,V.qi,MYID,NET.status]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():playing?vPlay():V.phase==='reveal'?vReveal():vEnd());}
  if(key!==LASTKEY){const ae=document.activeElement,aid=ae&&ae.id,val=aid==='ans'?ae.value:null;
    $('#app').innerHTML=html;LASTKEY=key;applyImg();placeTiles();bindBoard();
    if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT'){if(val!=null)n.value=val;n.focus();}}}
  updatePlay();
}
// 盤の操作：押したタイルを空きの方へ。なぞったら、その向きに1枚。
// 空きマスを押してなぞると、空きが指を追いかける（通ったところのタイルが入れかわる）
function cellAt(bd,e){const r=bd.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*4),w=Math.floor((e.clientY-r.top)/r.height*4);return c<0||c>3||w<0||w>3?-1:w*4+c;}
function bindBoard(){const bd=$('#board');if(!bd)return;let st=null;
  bd.addEventListener('pointerdown',e=>{e.preventDefault();const t=e.target.closest('.tile'),tt=t?+t.dataset.t:-1;
    const blank=canMove()&&cellAt(bd,e)===LOC.b.indexOf(BL);st={x:e.clientX,y:e.clientY,t:tt,blank};
    if(blank){bd.classList.add('drag');try{bd.setPointerCapture(e.pointerId);}catch(_){}}});
  bd.addEventListener('pointermove',e=>{if(!st||!st.blank)return;const c=cellAt(bd,e);if(c<0)return;
    // 空きを1マスずつ指の方へ（ずれの大きい向きから）
    for(let k=0;k<8&&canMove();k++){const e0=LOC.b.indexOf(BL);if(e0===c)break;const dr=(c>>2)-(e0>>2),dc=(c&3)-(e0&3);
      const nx=Math.abs(dc)>=Math.abs(dr)?e0+Math.sign(dc):e0+4*Math.sign(dr);if(!slideFrom(nx))break;st.moved=true;}});
  const end=e=>{if(!st)return;bd.classList.remove('drag');
    if(!st.blank&&e.type==='pointerup'){const dx=e.clientX-st.x,dy=e.clientY-st.y,d=Math.hypot(dx,dy);
      if(d>18){if(Math.abs(dx)>Math.abs(dy))slideDir(Math.sign(dx),0);else slideDir(0,Math.sign(dy));}
      else if(st.t>=0){slideFrom(LOC.b.indexOf(st.t));}}
    st=null;};
  bd.addEventListener('pointerup',end);bd.addEventListener('pointercancel',end);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('suraido-name',NAME);}}
document.addEventListener('click',e=>{
  const mi=e.target.closest('.mini');if(mi&&canPeek()){LOC.watch=LOC.watch===mi.dataset.id&&inGameMe()?null:mi.dataset.id;drawMinis();if(LOC.watch){const w=$('#watchbox');if(w&&w.getBoundingClientRect().top<0)w.scrollIntoView({block:'start',behavior:'smooth'});}return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='ans')answer();
  else if(a==='mine'){LOC.watch=null;drawMinis();}
  else if(a==='give'){if(confirm('ギブアップしますか？'))send({t:'give'});}
  else if(['start','lobby','next'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(!amHost())return;if(['lvSel','qSel','timeSel','hintSel','numSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}else if(e.target.id==='ans'){e.preventDefault();answer();}return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];
  if(k&&$('#board')){e.preventDefault();slideDir(k[0],k[1]);}});
(function(){let j=null;try{j=sessionStorage.getItem('suraido-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
