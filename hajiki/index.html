<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>さいころはじき</title>
<meta name="description" content="机の上のさいころをはじいて、ほかの人のさいころを落とす。出目が大きいほど重くて強い">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列レイアウト。ゲーム中は画面いっぱい（いつも暗い色） */
:root{
  --bg:#f3f1ee; --surface:#fffdfb; --ink:#25222a; --muted:#6f6a75; --rule:#e2ddd8;
  --p:#c9502e; --p-soft:#f8e1d6; --accent:#25222a; --accent-ink:#fffdfb; --ok:#2f8f4e; --warn:#b3412f;
  --t0:#e0702e; --t1:#2f8ad8; --t0s:#fbe4d6; --t1s:#dbeafa;
  --shadow:0 2px 0 rgba(37,34,42,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#141317; --surface:#1e1c22; --ink:#f0edf3; --muted:#a8a2ad; --rule:#34303a;
  --p:#ff9a5c; --p-soft:#43291b; --accent:#f0edf3; --accent-ink:#141317; --ok:#5ccf80; --warn:#ff8a73;
  --t0:#ff9a5c; --t1:#66b3ff; --t0s:#43291b; --t1s:#1b3048; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--t0)}.logo h1 .pb{color:var(--t1)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.team{border:2px solid var(--c);background:var(--cs);border-radius:14px;padding:10px}
.team h3{margin:0 0 6px;font-size:15px;color:var(--c)}
.team ul{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.team li{padding:2px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.team li.off{opacity:.5}
.team li.me{font-weight:800}
.t0{--c:var(--t0);--cs:var(--t0s)}.t1{--c:var(--t1);--cs:var(--t1s)}.t2{--c:#3f9a4a;--cs:#dff0d9}.t3{--c:#8a55c9;--cs:#ece0f8}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
table.t th:first-child{text-align:left}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;background:var(--c)}
.win{font-size:24px;font-weight:800;text-align:center}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#08080b;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lv{position:absolute;left:10px;top:10px;background:rgba(20,20,26,.8);color:#eee;border:1px solid #36343e;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--font)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#f0edf3;font-size:96px;font-weight:800;font-family:var(--font);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.cd[hidden]{display:none}
.cd small{display:block;font-size:18px;font-weight:800;text-align:center}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
#game{background:#3a3530}
.cd{color:#fff3df;text-shadow:0 3px 12px rgba(0,0,0,.5)}.cd>div{text-align:center}.cd small{color:#fff3df}
.lv{background:rgba(255,255,255,.85);color:#3a2a1a;border-color:#c9a77a;top:auto;bottom:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:var(--bg)}
.plist li.off{opacity:.5}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.logo h1 .pa{color:#c9502e}.logo h1 .pb{color:#2f7fd8}

.colbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--rule);border-radius:14px;background:var(--bg)}
#colpv{width:100px;height:100px;border-radius:12px;background:#e6c38c;flex:none}
.colctl{flex:1;min-width:190px;display:flex;flex-direction:column;gap:6px}
.colctl .f{margin:0}
.bld{padding:10px;border:1px solid var(--rule);border-radius:14px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.bld .f{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bld .left{font-weight:800;color:var(--warn)}.bld .left.ok{color:var(--ok)}
.faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.fc{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:4px 0}
.fc b{font-size:22px;font-variant-numeric:tabular-nums}
.fc button{border:0;background:none;font-size:14px;line-height:1;padding:6px 10px;cursor:pointer;color:var(--ink);border-radius:8px}
.fc button:disabled{opacity:.25;cursor:default}
.pre{display:flex;gap:6px;flex-wrap:wrap}
.isw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.isw button{display:flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px 2px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;opacity:.55}
.isw button.on{opacity:1;color:var(--ink);border-color:var(--ink)}
.isw button:disabled{cursor:default}
.isw .ic{width:22px;height:22px}
.fsw{display:flex;flex-wrap:wrap;gap:6px}
.fsw button{border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.fsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lobcv{display:block;width:100%;aspect-ratio:760/500;border-radius:12px;touch-action:none;cursor:grab;background:#3a3530}
.csw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.csw button{width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.csw button.on{outline:3px solid var(--ink);outline-offset:2px}
.swc{position:relative;width:30px;height:30px;border-radius:8px;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:2px solid rgba(0,0,0,.18);overflow:hidden;cursor:pointer}
.swc input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer}
/* ガチャ */
.tk{font-size:15px}.tk b{font-size:26px;font-variant-numeric:tabular-nums;margin:0 2px}
.rb{display:inline-block;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;border-radius:6px;color:#fff;background:#8f8a84;letter-spacing:.04em}
.rb.r1{background:#3f8fd8}.rb.r2{background:#9a5ad0}.rb.r3{background:linear-gradient(135deg,#f5c84a,#c98a10);color:#3a2604}
.rb.r4{background:linear-gradient(90deg,#e5533d,#e3a21a,#2f9a52,#2f7fd8,#8a55c9);}
.ub{display:inline-block;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;border-radius:6px;margin-left:3px;background:#1d1a22;color:#ff7ad9;border:1px solid #ff7ad9}
.gres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}
.gres.one{grid-template-columns:minmax(0,200px);justify-content:center}
@media (max-width:520px){.gres{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--rule);border-radius:14px;background:var(--surface);padding:6px 4px 8px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.gcard canvas{width:100%;max-width:96px;aspect-ratio:1}
.gres.one .gcard canvas{max-width:150px}
.gcard .gn{font-size:11px;font-weight:700;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.gcard .gb{line-height:1}
.gcard .gsel{position:absolute;top:4px;left:4px;font-size:10px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 5px}
.gcard.r1{border-color:#3f8fd8}.gcard.r2{border-color:#9a5ad0;box-shadow:0 0 0 1px #9a5ad0 inset}
.gcard.r3{border-color:#e0a020;box-shadow:0 0 14px rgba(240,180,40,.55)}
.gcard.r4{border-color:#e5533d;animation:urg 1.6s linear infinite}
.gcard.uq{outline:2px dashed #ff7ad9;outline-offset:2px}
.gcard.sel{background:var(--p-soft)}
@keyframes urg{0%{box-shadow:0 0 16px #e5533d}25%{box-shadow:0 0 16px #e3a21a}50%{box-shadow:0 0 16px #2f9a52}75%{box-shadow:0 0 16px #2f7fd8}100%{box-shadow:0 0 16px #e5533d}}
.gres .gcard{animation:gin .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 150ms)}
.gres .gcard.r4{animation:gin .5s cubic-bezier(.2,1.5,.4,1) both,urg 1.6s linear infinite;animation-delay:calc(var(--i) * 150ms),0s}
@keyframes gin{0%{transform:translateY(-30px) scale(.4) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.gflash{position:fixed;inset:0;pointer-events:none;z-index:50;animation:gfl 1.4s ease-out both}
.gflash.ssr{background:radial-gradient(circle,rgba(255,215,90,.75),rgba(255,180,40,0) 70%)}
.gflash.ur{background:conic-gradient(from 0deg,rgba(229,83,61,.6),rgba(227,162,26,.6),rgba(47,154,82,.6),rgba(47,127,216,.6),rgba(138,85,201,.6),rgba(229,83,61,.6))}
@keyframes gfl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.gdet{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
#gdpv,#mygd{width:120px;height:120px;border-radius:14px;background:#e6c38c;flex:none}
#mygd{width:100px;height:100px}
.gdi{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.gnm{font-size:20px;font-weight:800;line-height:1.3}
.gst{border-collapse:collapse;font-size:13px}.gst th{text-align:left;font-weight:700;color:var(--muted);padding:1px 12px 1px 0}
.pp{display:inline-flex;gap:3px;vertical-align:middle}.pp i{width:14px;height:8px;border-radius:3px;background:var(--rule)}.pp i.on{background:var(--ink)}
.gsk{padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--rule)}
.gsk.uqd{border-color:#ff7ad9}
.ok{color:var(--ok);font-weight:800}
.skb{position:fixed;right:12px;bottom:44px;z-index:20;border:2px solid #fff3df;background:rgba(40,110,170,.92);color:#fff;border-radius:16px;padding:8px 16px;font:inherit;font-weight:800;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;min-width:96px;min-height:52px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.skb small{font-size:11px;font-weight:700;opacity:.85}
.skb:disabled{opacity:.4;cursor:default}
.skb[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.gres .gcard,.gres .gcard.r4,.gcard.r4,.gflash{animation:none}.gflash{display:none}}
/* 入り口 */
.doors{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
@media (min-width:560px){.doors{grid-template-columns:1fr 1fr}}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:20px;padding:18px 18px 20px;cursor:pointer;font:inherit;min-height:44px;position:relative;overflow:hidden}
.door canvas{width:96px;height:96px;align-self:center;margin:4px 0 6px}
.door b{font-size:24px;font-weight:800;line-height:1.2}
.door span{font-size:14px;line-height:1.6}
.door em{font-style:normal;font-size:13px;font-weight:800;margin-top:4px;padding:3px 10px;border-radius:999px}
.door.dn{background:linear-gradient(160deg,#f3d9ad,#e3b878);color:#3a2410;border:2px solid #9a6a3a;box-shadow:0 4px 0 #9a6a3a}
.door.dn em{background:rgba(255,255,255,.55)}
.door.dg{background:radial-gradient(circle at 80% 10%,#5a3aa0,#1d1430 70%);color:#f4ecff;border:2px solid #b48cff;box-shadow:0 4px 0 #6a4ab0,0 0 22px rgba(180,140,255,.35)}
.door.dg em{background:rgba(255,255,255,.14);color:#ffe27a}
.door.dg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#ffe27a,transparent),radial-gradient(1px 1px at 85% 25%,#fff,transparent),radial-gradient(1px 1px at 12% 70%,#cfe,transparent);pointer-events:none}
.door:active{transform:translateY(3px)}
.door:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.logo h1 .ga{background:linear-gradient(90deg,#e5533d,#e3a21a,#2f9a52,#2f7fd8,#8a55c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.mbar{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--p-soft);border:1px solid var(--p)}
.gcard.pk{outline:3px solid var(--p);outline-offset:1px}
.gcard.nopk{opacity:.4;cursor:default}
.gchk{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.gpanel{margin-top:10px;padding:14px;border-radius:16px;color:#f2ecff;border:1px solid var(--rc);
  background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),#16121e;
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset,0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.gpg{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.radar{width:min(100%,280px);flex:none;overflow:visible;margin:0 auto}
.radar .rl{fill:#cfc6e0;font-size:11px;font-weight:700}.radar .rv{fill:#fff;font-size:12px;font-weight:800}
.rpoly{animation:rpop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rpop{0%{transform:scale(.1);opacity:0}100%{transform:none;opacity:1}}
.gfw{flex:1;min-width:200px}
.gph{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:4px;margin-bottom:8px}
.gph span{font-size:12px;color:#cfc6e0;font-weight:700}.gph b{font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}.gph small{color:#cfc6e0;margin-left:auto}
.gfaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px}
.gfc{width:100%;aspect-ratio:1;max-width:76px;justify-self:center}
.gpx{border-left:3px solid var(--rc);padding:2px 0 2px 10px;font-size:13px;color:#e6def2}
.gpx b{font-size:16px;color:#fff;margin:0 8px}.gpx small{color:#cfc6e0}

    <div class="gfw"><div class="gph"><span>目</span><b>合計 ${+tot.toFixed(2)}</b><small>${g.faces.length}面</small></div>
      <div class="gfaces" ${g.faces.length<=6?`style="grid-template-columns:repeat(${g.faces.length},minmax(0,1fr))"`:''}>${g.faces.map((v,i)=>`<canvas class="gfc" data-id="${esc(g.id)}" data-i="${i}" width="120" height="120" aria-label="${esc(g.fl?g.fl[i]:String(v))}"></canvas>`).join('')}</div></div></div>
    ${sk?`<div class="gpx"><span class="gpt">特技</span><b>${esc(sk[0])}</b><small>${sk[2]?`1試合 ${sk[2]}回`:'いつも'}</small><div>${esc(sk[1])}</div></div>`:''}
    ${g.u?`<div class="gpx uqx"><span class="gpt">ユニーク</span><b>${esc(UNIQ[g.u][0])}</b><div>${esc(UNIQ[g.u][1])}</div></div>`:''}</div>`;}
function gdetHTML(g,btns){const sk=g.sk&&SKILLS[g.sk],tot=g.faces.reduce((a,b)=>a+b,0);
  return `<div class="gdet"><canvas id="gdpv" width="200" height="200" aria-hidden="true"></canvas><div class="gdi"><div>${rbadge(g)}</div><div class="gnm">${esc(g.nm)}</div>
    <div class="sub">見た目：${esc((PATS.find(x=>x[0]===g.lk.pat)||[,''])[1])}・${esc((GFACES.find(x=>x[0]===g.lk.face)||[,''])[1])}${g.lk.glow?'・'+esc(GLOWS.find(x=>x[0]===g.lk.glow)[1]):''}${g.lk.tr?'・動くと'+esc(TRAILS.find(x=>x[0]===g.lk.tr)[1]):''}</div>
    ${btns||''}</div></div>${statPanel(g)}`;}
function vGacha(){const sel=myGD(),det=GV.det&&GS.dice.find(d=>d.id===GV.det),list=sortDice(GS.dice);
  const top=GV.res?Math.max(...GV.res.map(d=>d.r)):-1,anyU=GV.res&&GV.res.some(d=>d.u);
  return `<div class="row" style="margin-bottom:10px"><button class="btn" data-act="gclose">もどる</button></div>
  <div class="card stack gacha"><h2>ガチャ</h2>
    <div class="tk">ガチャ券 <b>${GS.t}</b> 枚（ガチャぶんどりと共通）<span class="sub"> ・ かけら ${GS.k||0}/${G_PER}（${G_PER}こで券1枚）</span></div>
    <div class="row"><button class="btn primary" data-act="pull1" ${GS.t<1?'disabled':''}>1回引く（1枚）</button><button class="btn primary" data-act="pull10" ${GS.t<10?'disabled':''}>10連（10枚・SR以上1つ確定）</button></div>
    <div class="sub">試合に参加すると ${G_PLAY}枚、勝つともう${G_WIN}枚。出る割合：${RAR.map((r,k)=>`${r[0]} ${RRATE[k]}%`).join('、')}。まれにユニーク（ユニークはSSR以上が確定）</div>
    ${GV.res?`${top>=3||anyU?`<div class="gflash ${top>=4||anyU?'ur':'ssr'}" aria-hidden="true"></div>`:''}<div class="gres ${GV.res.length===1?'one':''}">${GV.res.map((g,k)=>gcard(g,k,true)).join('')}</div>`:''}
  </div>
  ${det?`<div class="card">${gdetHTML(det,`<div class="row">${det.id===GS.sel?'<span class="ok">このさいころを使っています</span>':`<button class="btn primary" data-act="guse" data-id="${esc(det.id)}">これを使う</button>`}<button class="btn small" data-act="gdrop" data-id="${esc(det.id)}" ${det.id===GS.sel?'disabled':''}>分解する</button><button class="btn small" data-act="gdetx">閉じる</button></div>`)}</div>`:''}
  <div class="card stack"><h2>もちもの（${GS.dice.length}個）</h2>${list.length?`${mtool()}<div class="gbox">${list.map((g,k)=>gcard(g,k)).join('')}</div><div class="sub">${GV.multi?'押して選ぶ。「使用中」のさいころは分解できません':'押すとくわしく見られます。ガチャはじきの試合では「使用中」のさいころで出ます'}</div>`:'<div class="sub">まだありません。ガチャを引いてみましょう</div>'}</div>`;}
// もちものの並べ替えと、まとめて分解
function mtool(){if(!GV.multi)return `<div class="row"><label class="sub" for="gsort">並べ方</label><select id="gsort" style="flex:1;min-width:150px">${GSORT.map(([v,l])=>`<option value="${v}" ${(GS.sort||'rar')===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn" data-act="gmulti">まとめて分解</button></div>`;
  const pk=GS.dice.filter(d=>GV.pick.has(d.id)),k=pk.reduce((a,d)=>a+kakeOf(d),0),t=Math.floor(((GS.k||0)+k)/G_PER);
  return `<div class="mbar"><div class="row"><span class="sub">まとめて選ぶ</span>${RAR.map((r,i)=>`<button class="btn small" data-act="gpickr" data-r="${i}">${r[0]}ぜんぶ</button>`).join('')}<button class="btn small" data-act="gpickc">選ぶのをやめる</button></div>
    <div class="row"><b>${pk.length}個 → かけら ${k}${t?`（券 +${t}枚）`:''}</b><button class="btn primary" data-act="gscrap" ${pk.length?'':'disabled'}>分解する</button><button class="btn" data-act="gmultix">やめる</button></div>
    <div class="sub">かけら：${RAR.map((r,i)=>`${r[0]} ${G_KAKE[i]}`).join('・')}・ユニークは +${G_KUQ}</div></div>`;}
// 小さい絵：いま見えているカードに一度だけかく
function paintGD(){const find=id=>GS.dice.find(d=>d.id===id)||(GV.res||[]).find(d=>d.id===id)||(V&&V.pl||[]).map(p=>p.g).find(g=>g&&g.id===id);
  document.querySelectorAll('canvas.gdc').forEach(c=>{const g=find(c.dataset.id);if(!g)return;paintOne(c,g,performance.now(),0,Math.max(...g.faces));});
  document.querySelectorAll('canvas.gfc').forEach(c=>{const g=find(c.dataset.id);if(!g)return;const i=+c.dataset.i;paintOne(c,g,performance.now(),(i%3-1)*.06,g.faces[i]);});}
function paintOne(c,g,now,ang,f){const keep=cx;cx=c.getContext('2d');cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,c.width,c.height);const sz=c.width/(R*3.3);cx.translate(c.width/2,c.height/2);cx.scale(sz,sz);
  drawDie(0,0,f==null?g.faces[0]:f,ang,g.lk.c[0],1,false,false,now,-1,g.lk.face,0,g);cx=keep;}
// 大きい絵：ゆっくり回りながら目が変わる
function gdAnim(t){requestAnimationFrame(gdAnim);
  {const c=document.getElementById('dpg');if(c)paintOne(c,myGD()||DEMO,t,Math.sin(t/900)*.35,(g=>g.faces[Math.floor(t/1100)%g.faces.length])(myGD()||DEMO));}
  {const c=document.getElementById('dpn');if(c){const keep=cx;cx=c.getContext('2d');cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,200,200);const sz=200/(R*3.3);cx.translate(100,100);cx.scale(sz,sz);drawDie(0,0,MYBUILD[Math.floor(t/1100)%6],Math.sin(t/900)*.35,MYCOL,1,false,false,t,-1,MYFACE,0);cx=keep;}}[['gdpv',GV.det&&GS.dice.find(d=>d.id===GV.det)],['mygd',myGD()]].forEach(([id,g])=>{const c=document.getElementById(id);if(!c||!g)return;
  paintOne(c,g,t,Math.sin(t/900)*.35,g.faces[Math.floor(t/1100)%g.faces.length]);});}
requestAnimationFrame(gdAnim);
// 待合室・結果に出す「あなたのさいころ」
function myGdHTML(){const g=myGD(),cap=+V.capSel,uq=V.uniqSel==='on',ok=gdOK(g,cap,uq);
  return `<div class="colbox"><canvas id="mygd" width="200" height="200" aria-label="あなたのさいころ" ${g?'':'hidden'}></canvas><div class="colctl"><div class="f">あなたのさいころ</div>
    ${g?`<div>${rbadge(g)} <b>${esc(g.nm)}</b></div><div class="sub">${g.sk?`特技：${esc(SKILLS[g.sk][0])}${SKILLS[g.sk][2]?`（${SKILLS[g.sk][2]}回）`:''}`:'特技なし'}${g.u?` ・ ${esc(UNIQ[g.u][0])}`:''}</div>`:'<div class="sub">まださいころを持っていません</div>'}
    ${g&&!ok?`<div class="err">この部屋は${RAR[cap][0]}まで${uq?'':'・ユニークなし'}なので使えません。ほかを選ばないと、レンタルのさいころで出ます</div>`:''}${!g?'<div class="sub">このままだと、レンタルのさいころで出ます</div>':''}
    <button class="btn" data-act="gopen">ガチャ・さいころを選ぶ（券 ${GS.t}枚）</button></div></div>${g?statPanel(g):''}`;}
function updDots(){document.querySelectorAll('.plist li[data-pid]').forEach(li=>{const p=V&&V.players.find(x=>x.id===li.dataset.pid),d=li.querySelector('.dot');if(p&&d)d.style.background=p.col||'#ccc';});}
function vLobby(){
  const host=amHost(),n=V.players.length;
  return `${NET.solo?'':`<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code)}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>`}
  <div class="card"><h2>みんなのさいころ</h2><canvas id="lobcv" class="lobcv" aria-label="みんなのさいころが置かれた机。引っぱってはなすと自分のさいころをはじけます"></canvas>
    <div class="sub" style="margin-top:6px">${NET.solo?'始めるまで、自分のさいころをはじいて試せます。':'人が集まるまで、ここでさいころをはじいて遊べます。'}${V.modeSel==='gacha'?'選んださいころが、ここにもすぐ出ます':'色・目のデザイン・目の割り振りを変えると、ここにもすぐ出ます'}</div></div>
  <div class="card stack"><h2>${NET.solo?'ひとりで遊ぶ':`参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}`}</h2>
    ${NET.solo?'':`<ul class="plist">${V.players.map(p=>`<li data-pid="${p.id}" class="${p.online?'':'off'}"><span class="dot" style="background:${p.col||'#ccc'}"></span>${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}${V.wins[p.id]?`<span class="sub"> ${V.wins[p.id]}勝</span>`:''}</li>`).join('')}</ul>`}
    ${!isPlayer()&&!NET.solo?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${isPlayer()||NET.solo?(V.modeSel==='gacha'?myGdHTML():colPickerHTML()+buildHTML()):''}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">${NET.solo?'はじめる':'スタート'}</button>${!NET.solo?'<div class="note">部屋主の画面で計算しています。部屋主はゲーム中、このタブを開いたままにしてください。</div>':''}`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>${rulesHTML(false)}`;
}
function vEnd(){
  const R0=V.result;if(!R0)return '';const me=V.myIdx;
  const rows=R0.rows.slice().sort((a,b)=>b.score-a.score);const head=R0.win.length>1?`${R0.win.map(i=>esc(R0.rows[i].name)).join('・')} の引き分け`:`${esc(R0.rows[R0.win[0]].name)} の勝ち！${R0.sd?'<div class="sub">サドンデスで決着</div>':''}`;
  return `<div class="card"><div class="win">${head}</div>${me>=0?`<div class="center sub">${R0.win.includes(me)?'あなたの勝ちです':'あなたの負けです'}</div>`:''}
    <table class="t" style="margin-top:10px"><tr><th>名前</th><th>点</th><th>落ちた</th></tr>${rows.map(r=>`<tr class="${r.i===me?'me':''}"><td><span class="dot" style="background:${r.col}"></span>${esc(r.name)}${r.cpu?'<span class="sub">（CPU）</span>':''}<div class="sub">${r.g?`${rbadge(r.g)} ${esc(r.g.nm)}`:`目：${(r.build||[]).join(' ')}`}</div></td><td class="num">${r.score}</td><td class="num">${r.falls}</td></tr>`).join('')}</table></div>
  ${rows.some(r=>V.pl[r.i]&&V.pl[r.i].g)?`<div class="card stack"><h2>みんなのさいころ</h2>${rows.map(r=>{const g=V.pl[r.i]&&V.pl[r.i].g;if(!g)return '';
    return `<details class="gdd"><summary><canvas class="gdc" data-id="${esc(g.id)}" width="80" height="80" aria-hidden="true"></canvas><span class="gdn"><span><span class="dot" style="background:${r.col}"></span>${esc(r.name)}${r.cpu?'<span class="sub">（CPU）</span>':''}</span><span>${rbadge(g)} ${esc(g.nm)}</span></span></summary>${statPanel(g)}</details>`;}).join('')}<div class="sub">押すと能力が見られます</div></div>`:''}
  ${isPlayer()?`<div class="card stack"><h2>次の試合のさいころ</h2>${V.modeSel==='gacha'?myGdHTML():colPickerHTML()+buildHTML()}</div>`:''}
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次の試合を始めるのを待っています</span></div>'}</div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  {const gm=GV.open||(V?V.modeSel==='gacha':HM==='gacha'),lg=gm?'<span class="ga">ガチャ</span><span class="pb">はじき</span>':'<span class="pa">さいころ</span><span class="pb">はじき</span>',h=document.querySelector('.logo h1');if(h.innerHTML!==lg)h.innerHTML=lg;document.title=gm?'ガチャはじき':'さいころはじき';}
  const playing=!!(V&&(V.phase==='count'||V.phase==='play'));
  $('#game').hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);
  if(V&&V.phase==='play'&&!PLAYAT)PLAYAT=performance.now();if(!playing)PLAYAT=0;
  if(playing){LASTKEY='';return;}
  let html,key;
  if(GV.open){html=vGacha();key='gv:'+GV.k;}
  else if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'')+GS.t+HM;}
  else{key=JSON.stringify([V.phase,V.players.map(p=>[p.id,p.name,p.online]),V.timeSel,V.cpuSel,V.sumSel,V.mapSel,V.obsSel,V.itemAmt,V.evSel,V.items,V.specs,V.games,MYID,NET.status,V.modeSel,V.capSel,V.uniqSel,GV.k]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vEnd());}
  if(key===LASTKEY){updDots();return;}
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;updBuild();drawIcons();paintGD();
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('hajiki-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='colc'){setMyCol(b.dataset.v,true);return;}
  if(a==='facec'){setMyFace(b.dataset.v);return;}
  if(a==='bup'||a==='bdn'){const k=+b.dataset.k,nb=MYBUILD.slice();nb[k]+=a==='bup'?1:-1;if(nb[k]<0||nb[k]>9)return;setMyBuild(nb,true);return;}
  if(a==='bpre'){setMyBuild(PRESETS[+b.dataset.k][1](+V.sumSel),true);return;}
  if(a==='item'){send({t:'item',v:b.dataset.v});return;}
  if(a==='skill'){send({t:'skill'});return;}
  if(a==='hm'){HM=b.dataset.v;NET.status='';render();scrollTo(0,0);return;}
  if(a==='hmback'){HM=null;D.code='';NET.status='';try{const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u.toString());}catch(e){}render();return;}
  if(a==='gopen'){saveName();loadTK();GV.open=true;GV.res=null;GV.det=null;gvBump();scrollTo(0,0);return;}
  if(a==='gclose'){GV.open=false;GV.res=null;GV.det=null;gvBump();scrollTo(0,0);return;}
  if(a==='pull1'||a==='pull10'){doPull(a==='pull1'?1:10);return;}
  if(a==='gdet'){GV.det=b.dataset.id;gvBump();const d=$('.gdet');if(d)d.scrollIntoView({block:'center',behavior:'smooth'});return;}
  if(a==='gmulti'){GV.multi=true;GV.pick=new Set();GV.det=null;gvBump();return;}
  if(a==='gmultix'){GV.multi=false;GV.pick=new Set();gvBump();return;}
  if(a==='gpick'){const id=b.dataset.id;if(id===GS.sel)return;GV.pick.has(id)?GV.pick.delete(id):GV.pick.add(id);gvBump();return;}
  if(a==='gpickr'){const r=+b.dataset.r,L=GS.dice.filter(d=>d.r===r&&d.id!==GS.sel),all=L.every(d=>GV.pick.has(d.id));L.forEach(d=>all?GV.pick.delete(d.id):GV.pick.add(d.id));gvBump();return;}
  if(a==='gpickc'){GV.pick=new Set();gvBump();return;}
  if(a==='gscrap'){const ids=[...GV.pick];if(!ids.length)return;const hi=GS.dice.filter(d=>GV.pick.has(d.id)&&(d.r>=3||d.u)).length;if(!confirm(`${ids.length}個を分解しますか？${hi?`（SSR以上・ユニークが ${hi}個 ふくまれています）`:''}もどせません`))return;scrap(ids);return;}
  if(a==='gdetx'){GV.det=null;gvBump();return;}
  if(a==='guse'){setSel(b.dataset.id);return;}
  if(a==='gdrop'){const id=b.dataset.id;if(id===GS.sel)return;const g=GS.dice.find(d=>d.id===id);if(!g||!confirm(`このさいころを分解しますか？（かけら ${kakeOf(g)}。もどせません）`))return;scrap([id]);return;}
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(['start','lobby'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;if(e.target.id==='colpick')setMyCol(e.target.value,false);});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(t.id==='gsort'){GS.sort=t.value;saveGS();gvBump();return;}if(t.id==='colpick'){setMyCol(t.value,true);return;}if(!amHost())return;if(['timeSel','cpuSel','sumSel','mapSel','obsSel','itemAmt','evSel','modeSel','capSel','uniqSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{if(e.key===' '&&V&&V.phase==='play'&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||'')){e.preventDefault();send({t:'skill'});}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}});
(function(){let j=null;try{j=sessionStorage.getItem('hajiki-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
