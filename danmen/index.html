<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>だんめん漢字</title>
<meta name="description" content="見えない漢字に線を引いて、断面の形からどの漢字かを当てるゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: 一列。ゲーム中は、まんなかに漢字のマス、その下に断面と答えの欄 */
:root{
  --bg:#f3f1ec; --surface:#fffefb; --ink:#23211d; --muted:#736c63; --rule:#e2ddd4;
  --p:#2c6ebf; --p-soft:#dde9f8; --accent:#23211d; --accent-ink:#fffefb; --ok:#2f8f4e; --ng:#b3412f; --warn:#b3412f;
  --box:#ffffff; --cut:#c9c3b8; --inkc:#23211d;
  --shadow:0 2px 0 rgba(35,33,29,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151513; --surface:#201f1c; --ink:#efece6; --muted:#a59f95; --rule:#36332e;
  --p:#6aa8f0; --p-soft:#1d2d42; --accent:#efece6; --accent-ink:#151513; --ok:#5ccf80; --ng:#ff8a73; --warn:#ff8a73;
  --box:#2a2925; --cut:#55514a; --inkc:#f4f1ea; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#151513; --surface:#201f1c; --ink:#efece6; --muted:#a59f95; --rule:#36332e;
  --p:#6aa8f0; --p-soft:#1d2d42; --accent:#efece6; --accent-ink:#151513; --ok:#5ccf80; --ng:#ff8a73; --warn:#ff8a73;
  --box:#2a2925; --cut:#55514a; --inkc:#f4f1ea; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--p)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:14px;background:var(--bg)}
.plist li.off{opacity:.55}.plist li.me{border-color:var(--ink)}
.plist li.ok{border-color:var(--ok);color:var(--ok);font-weight:800}
.plist li.gave{opacity:.55}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
table.t tr.me td{font-weight:800}
.rk{font-weight:800;width:3em}
/* 漢字のマス */
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.boxwrap{position:relative;width:min(84vw,340px);aspect-ratio:1}
.sidegrid{display:grid;grid-template-columns:38px min(68vw,290px) 38px;grid-template-rows:38px auto 38px;gap:4px;align-items:center;justify-items:center}
.sidegrid .boxwrap{width:100%}
.dir{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--rule);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer;padding:0}
.dir:hover:not(:disabled){border-color:var(--ink)}.dir:disabled{opacity:.3;cursor:not-allowed}.dir.used{background:var(--p-soft);border-color:var(--p);opacity:1}
#box{width:100%;height:100%;display:block;border-radius:14px;border:2px solid var(--rule);background:var(--box);touch-action:none;cursor:crosshair}
#box3d{width:100%;height:100%;display:block;border-radius:14px;border:2px solid var(--rule);background:#e9eef2;touch-action:none;cursor:grab}
.solidwrap{position:relative;width:min(92vw,560px);aspect-ratio:4/3}
.overnote{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(255,255,255,.85);color:#333;border-radius:8px;padding:2px 8px;pointer-events:none}.overnote[hidden]{display:none}
.inwall{position:absolute;inset:2px;border-radius:12px;background:rgba(40,36,30,.55);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none}.inwall[hidden]{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;width:min(84vw,340px);font-size:14px}
.hud b{font-size:18px}
.ansrow{display:flex;gap:8px;width:min(84vw,340px)}
.ansrow input{flex:1;min-width:0;font-size:22px;text-align:center;padding:6px}
.msg{min-height:1.6em;font-weight:800;text-align:center}
.msg.ng{color:var(--ng)}.msg.ok{color:var(--ok)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.big{font-size:96px;line-height:1.1;font-family:"Noto Sans JP",sans-serif;font-weight:700;text-align:center}
.reveal{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.reveal canvas{width:150px;height:150px;border-radius:12px;border:1px solid var(--rule);background:var(--box)}
.gain{font-weight:800;color:var(--ok)}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat-tab{opacity:.85}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">だんめん</span>漢字</h1><small>線を引いて、断面から漢字を当てる ・ <span id="ver">試作 v13</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* だんめん漢字：見えない漢字のマスに直線を引くと、その線が字にかかった部分（断面）だけが見える。
   何本か引いて、どの漢字かを当てる。少ない本数で当てるほど高得点。
   かんたん・むずかしいは太い・細い帯で切って、字にかかったところを形のまま見せる。とてもむずかしいは線で、かかった区間だけ見せる
   みんなで遊ぶときは、同じ字を各自が切って、早く・少ない本数で当てた人ほど高得点 */
const PREFIX='danmen-room-';
const VER=9;
const MAXP=10;
// 遊び方は2つ：断面（線で切る）／立体（厚みのある漢字を机に寝かせて、真横から見る。だんだん視点が高くなる）
const kindOf=()=>NET.role==='host'&&H?H.kind:(V&&V.kind)||'cut';
const MAXN=()=>kindOf()==='solid'?6:kindOf()==='side'?8:12;   // 線は12本まで・高さは6段まで（ひとりのときは、まちがえた答えも1つと数える）
const UN=()=>kindOf()==='solid'?'×10秒':kindOf()==='side'?'方向':'本';
const STEP_T=10;                 // 立体：この秒数ごとに当てたときの点が1点へる（6回まで。その後は最後の解答時間）
const TURN_T=20,FINAL_T=15,AFTER=3; // AFTER：だれかが正解してから、この本数の線が引かれたら締め切り // みんなで：1本を引く持ち時間、線を引き終えたあとの最後の解答時間（秒）
// 学年別の漢字（小1〜小6、残りの常用漢字）

/* ---------- 漢字の形（見えないところで描いて、インクのあるマスを調べる） ---------- */
const R=240; // 形を調べる細かさ
const MASK={ch:null,a:null};
const mcv=document.createElement('canvas');mcv.width=mcv.height=R;const mctx=mcv.getContext('2d',{willReadFrequently:true});
async function loadMask(ch){
  try{await document.fonts.load(`700 ${R}px "Noto Sans JP"`,ch);}catch(e){}
  mctx.clearRect(0,0,R,R);mctx.fillStyle='#000';mctx.font=`700 ${Math.round(R*.86)}px ${KFONT}`;mctx.textAlign='center';mctx.textBaseline='middle';
  const m=mctx.measureText(ch),asc=m.actualBoundingBoxAscent||R*.43,des=m.actualBoundingBoxDescent||R*.43;
  mctx.fillText(ch,R/2,R/2+(asc-des)/2);
  const d=mctx.getImageData(0,0,R,R).data,a=new Uint8Array(R*R);for(let i=0;i<R*R;i++)a[i]=d[i*4+3]>110?1:0;
  MASK.ch=ch;MASK.a=a;}
const inkAt=(x,y)=>{const i=Math.floor(x),j=Math.floor(y);return i>=0&&j>=0&&i<R&&j<R&&MASK.a[j*R+i]===1;};
// 2点を通る直線を、マスの端から端までのばす（座標は 0〜R）
function fullLine(a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const ts=[];
  if(Math.abs(dx)>1e-6){ts.push((0-a[0])/dx,(R-a[0])/dx);}if(Math.abs(dy)>1e-6){ts.push((0-a[1])/dy,(R-a[1])/dy);}
  const P=ts.map(t=>[a[0]+dx*t,a[1]+dy*t]).filter(p=>p[0]>=-.01&&p[0]<=R+.01&&p[1]>=-.01&&p[1]<=R+.01);
  if(P.length<2)return null;
  // 引いた向きにそろえる
  P.sort((p,q)=>((p[0]-a[0])*dx+(p[1]-a[1])*dy)-((q[0]-a[0])*dx+(q[1]-a[1])*dy));return [P[0],P[P.length-1]];}
// 断面：線にそって、字にかかっている区間 [はじめ, おわり]（0〜1）
function section(p,q){const L=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.ceil(L*2),seg=[];let st=-1;
  for(let i=0;i<=n;i++){const t=i/n,x=p[0]+(q[0]-p[0])*t,y=p[1]+(q[1]-p[1])*t,on=inkAt(x,y);
    if(on&&st<0)st=t;if((!on||i===n)&&st>=0){seg.push([st,on?1:t]);st=-1;}}
  return seg;}

function hostInit(){H={phase:'lobby',players:[],hostId:null,lvSel:'2',modeSel:'easy',kind:'cut',pos:{},nSel:'3',ansSel:'each',cuts:[],ti:0,turnEnd:null,inGame:[],q:[],qi:0,ch:null,st:{},endAt:null,order:0,tot:{},hist:[],result:null,wins:{},games:0};}

}

function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function startGame(){
  absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);H.q=shuffle(pool(H.lvSel)).slice(0,+H.nSel);H.qi=0;H.tot={};H.inGame.forEach(id=>H.tot[id]=0);H.hist=[];H.result=null;
  startQ();
}
// みんなで：線は1本ずつ順番に引く（全員が同じマスを見る）。問題ごとに最初に引く人をずらす
function startQ(){H.ch=H.q[H.qi];H.st={};H.inGame.forEach(id=>H.st[id]={n:0,ok:false,gave:false,out:false,pt:0,rank:-1,last:-1,left:H.ansSel==='each'?null:+H.ansSel,miss:[]});
  H.order=0;H.phase='play';H.endAt=null;H.cuts=[];H.pos={};H.firstAt=null;H.ti=(H.qi-1+H.inGame.length)%H.inGame.length;H.turnEnd=null;H.stepAt=H.kind==='solid'?Date.now()+STEP_T*1000:null;if(multi()&&H.kind!=='solid')nextTurn();}
const onlineId=id=>{const P=H.players.find(p=>p.id===id);return P&&P.online;};

// 次に引く人：正解した人は引かない
function nextTurn(){const n=H.inGame.length;for(let k=1;k<=n;k++){const j=(H.ti+k)%n,id=H.inGame[j];if(onlineId(id)&&!H.st[id].ok){H.ti=j;H.turnEnd=Date.now()+TURN_T*1000;return;}}H.turnEnd=null;endQ();}
const allDone=()=>H.inGame.every(id=>{const s=H.st[id];return s.ok||s.gave||s.out||!onlineId(id);});
function endQ(){if(H.phase!=='play')return;H.phase='reveal';H.endAt=null;H.turnEnd=null;H.hist.push({ch:H.ch,st:JSON.parse(JSON.stringify(H.st)),cuts:H.cuts.slice()});}
function nextQ(){if(H.qi+1>=H.q.length){endGame();return;}H.qi++;startQ();}
function endGame(){
  const rows=H.inGame.map(id=>{const P=H.players.find(p=>p.id===id);return {id,name:P?P.name:'?',score:H.tot[id]||0,ok:H.hist.filter(h=>h.st[id]&&h.st[id].ok).length};}).sort((a,b)=>b.score-a.score);
  rows.forEach((r,j)=>{r.rank=j&&rows[j-1].score===r.score?rows[j-1].rank:j+1;});
  if(multi())rows.filter(r=>r.rank===1).forEach(r=>{H.wins[r.id]=(H.wins[r.id]||0)+1;});
  H.games++;H.result=rows;H.phase='end';
}
function act(pid,m){

    case 'nSel':if(isHost&&setup&&['1','2','3','5','10'].includes(m.v))H.nSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;

    case 'cut':{if(H.phase!=='play'||!s||s.ok||s.gave||multi())return;s.n=Math.max(s.n,Math.min(MAXN(),+m.n|0));break;}

          if(!allDone()&&turnId()===pid)nextTurn();}

  }

}

function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください（ひとりで遊ぶことはできます）';render();return true;}return false;}

function createRoom(tries){
  tries=tries||0;if(noPeer())return;

  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);

  peer.on('connection',c=>hostWire(c));

    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();

function joinRoom(code,want){

  if(noPeer())return;

  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}

      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('danmen-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}

    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>${rulesHTML(true)}`;
}
function settingsHTML(host){
  const dis=host?'':'disabled';const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="grid2">
    <div><label class="f" for="kind">遊び方</label><select id="kind" ${dis}>${opt([['cut','断面（線で切る）'],['solid','立体（真横から見る）']],V.kind)}</select></div>
    <div><label class="f" for="lvSel">出る漢字</label><select id="lvSel" ${dis}>${opt(LEVELS.map(l=>[l[0],l[1]]),V.lvSel)}</select></div>
    <div><label class="f" for="modeSel">断面のむずかしさ</label><select id="modeSel" ${dis}>${opt([['easy','かんたん（太い帯で切る）'],['hard','むずかしい（細い帯で切る）'],['vhard','とてもむずかしい（線で切る）']],V.modeSel)}</select></div>
    <div><label class="f" for="ansSel">答えられる回数（みんなで）</label><select id="ansSel" ${dis}>${opt([['each','線が1本ふえるごとに1回'],['1','1問で1回まで'],['2','1問で2回まで'],['3','1問で3回まで']],V.ansSel)}</select></div>
    <div><label class="f" for="nSel">問題の数</label><select id="nSel" ${dis}>${opt([['1','1問'],['2','2問'],['3','3問'],['5','5問'],['10','10問']],V.nSel)}</select></div></div>`;
}
function vLobby(){
  const host=amHost(),n=V.players.length;
  return `${NET.solo?'':`<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code)}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>`}
  <div class="card stack"><h2>${NET.solo?'ひとりで遊ぶ':`参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}`}</h2>
    ${!isPlayer()&&!NET.solo?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${NET.solo?'':`<ul class="plist">${V.players.map(p=>`<li class="${p.id===MYID?'me':''} ${p.online?'':'off'}">${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}${p.id===V.hostId?'<span class="sub">部屋主</span>':''}${V.wins[p.id]?`<span class="sub">${V.wins[p.id]}勝</span>`:''}</li>`).join('')}</ul>`}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">はじめる</button>`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>${rulesHTML(false)}`;
}
function statusHTML(){if(V.inGame.length<2)return '';
  return `<ul class="plist">${V.inGame.map(id=>{const s=V.st[id]||{},miss=(s.miss||[]).slice(-2).map(c=>`<s>${esc(c)}</s>`).join('');
    return `<li class="${id===MYID?'me':''} ${s.ok?'ok':''} ${s.gave||s.out?'gave':''}">${V.turn===id?'✏️':''}${esc(nameOf(id))} ${s.ok?`✓ ${s.n}${UN()}目`:s.gave?'パス':s.out?'×':''}${miss?` <span class="sub">${miss}</span>`:''}<span class="sub">${V.tot[id]||0}点</span></li>`;}).join('')}</ul>`;}
const remainS=()=>V.remain==null?null:Math.max(0,Math.ceil((V.remain-(performance.now()-VIEWAT))/1000));
function vPlay(){
  const s=myState(),done=s&&(s.ok||s.gave||s.out),watch=V.watch;
  return `<div class="card stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">第${V.qi+1}問 / ${V.qn}問</h2><span class="sub" id="timer"></span></div>
    <div id="status">${statusHTML()}</div>
    <div class="stage">
      ${watch?`<div class="big">${esc(V.ch)}</div><div class="sub">観戦中（答えが見えています）</div>`:`
      <div class="hud"><span>${kindOf()==='solid'?'経過':kindOf()==='side'?'見た方向':isMulti()?'引いた線':'使った線'} <b id="used">${used()}</b> / ${MAXN()}${UN()}</span><span class="sub">当てたら <b id="ptnow">${Math.max(1,MAXN()+1-used())}</b>点</span></div>
      ${kindOf()==='solid'?`<div class="solidwrap"><canvas id="box3d" aria-label="立体の漢字のまわりを歩いて見る"></canvas><div class="inwall" id="inwall" hidden>壁の中</div><div class="overnote" id="overnote" hidden>上からながめています（ドラッグで回せます）</div></div>
        <div class="sub center">${matchMedia('(pointer:coarse)').matches?'左半分をドラッグで歩く・右半分をドラッグで向きを変える':'WASDで歩く・ドラッグか←→で向きを変える'}</div>`:
      kindOf()==='side'?`<div class="sidegrid">${[7,0,1,6,-1,2,5,4,3].map(k=>k<0?'<div class="boxwrap"><canvas id="box" aria-label="漢字のマス"></canvas></div>':`<button class="dir" data-act="dir" data-v="${k}" aria-label="${ARW[k]}の向きに見る">${ARW[k]}</button>`).join('')}</div>`:
      '<div class="boxwrap"><canvas id="box" aria-label="漢字のマス。なぞって線を引く"></canvas></div>'}
      ${done?`<div class="msg ${s.ok?'ok':''}">${s.ok?`正解！ ${esc(V.ch)}（+${s.pt}点）`:s.out?'答えられる回数を使い切りました':'パスしました'}</div>${isMulti()||kindOf()==='solid'?'<div class="sub center" id="turn"></div>':''}<div class="wait"><span class="dots">${V.inGame.length>1?'ほかの人を待っています':''}</span></div>`:`
      ${isMulti()||kindOf()==='solid'?'<div class="sub center" id="turn"></div>':''}
      <div class="ansrow"><input type="text" id="ans" maxlength="4" placeholder="漢字1文字" autocomplete="off" aria-label="答え"><button class="btn primary" data-act="ans" id="ansbtn">答える</button></div>
      ${isMulti()?'<div class="sub center" id="ansnote"></div>':''}
      <div class="msg ${LOC.mcls}" id="msg">${esc(LOC.msg)}</div>
      <button class="btn small" data-act="give">わからない（パス）</button>`}`}
    </div>${amHost()&&V.inGame.length>1?'<button class="btn small" data-act="endq">この問題を締め切る</button>':''}</div>`;
}
function vReveal(){
  const h=V.hist[V.hist.length-1];if(!h)return '';const me=h.st[MYID];
  return `<div class="card stack"><h2>第${V.qi+1}問の答え</h2>
    <div class="reveal"><div class="big">${esc(h.ch)}</div>${V.watch?'':'<canvas id="mini"></canvas>'}</div>
    ${me?`<div class="center">${me.ok?`<span class="gain">正解 +${me.pt}点</span>（${me.n}${UN()}${isMulti()?'目':''}）`:'<span class="sub">当てられませんでした</span>'}</div>`:''}
    ${V.inGame.length>1?`<table class="t"><tbody>${V.inGame.map(id=>{const s=h.st[id]||{};return `<tr class="${id===MYID?'me':''}"><td>${esc(nameOf(id))}</td><td>${s.ok?`${s.rank+1}番目・${s.n}${UN()}目`:s.gave?'パス':'—'}</td><td class="num">${s.ok?'+'+s.pt:''}</td><td class="num">${V.tot[id]||0}点</td></tr>`;}).join('')}</tbody></table>`:''}
    ${amHost()?`<button class="btn primary wide" data-act="next">${V.qi+1>=V.qn?'結果を見る':'次の問題へ'}</button>`:'<div class="wait"><span class="dots">部屋主が次へ進めるのを待っています</span></div>'}</div>`;
}
function vEnd(){
  const r=V.result||[],me=r.find(x=>x.id===MYID),solo=V.inGame.length<2;
  return `<div class="card"><div class="center" style="font-size:22px;font-weight:800">${solo?`${me?me.score:0}点`:`${r.filter(x=>x.rank===1).map(x=>esc(x.name)).join('・')} の勝ち！`}</div>
    ${me?`<div class="center sub">${solo?`${V.hist.length}問中 ${me.ok}問 正解`:`あなたは ${me.rank}位（${me.score}点）`}</div>`:''}
    ${solo?'':`<table class="t" style="margin-top:8px"><tbody>${r.map(x=>`<tr class="${x.id===MYID?'me':''}"><td class="rk">${x.rank}位</td><td>${esc(x.name)}</td><td class="num">${x.score}点</td></tr>`).join('')}</tbody></table>`}</div>
  <div class="card"><h2>出た漢字</h2><table class="t"><tbody>${V.hist.map(h=>{const s=h.st[MYID];return `<tr><td style="font-family:'Noto Sans JP',sans-serif;font-size:22px;font-weight:700;width:2em">${esc(h.ch)}</td><td>${s?s.ok?`${s.n}${UN()}で正解`:'×':''}</td><td class="num">${s&&s.ok?'+'+s.pt:''}</td></tr>`;}).join('')}</tbody></table></div>
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次のゲームを始めるのを待っています</span></div>'}</div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();document.body.classList.toggle('playing',!!(V&&V.phase==='play'));
  let html,key;
  if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'');}
  else if(V.phase==='play'){const s=myState();key=JSON.stringify(['play',V.qi,V.games,MYID,s&&s.ok,s&&s.gave,s&&s.out,NET.status]);
    if(key===LASTKEY){const st=$('#status');if(st)st.innerHTML=statusHTML();updateMulti();return;}
    html=vPlay();}
  else{key=JSON.stringify([V.phase,V.players,V.kind,V.lvSel,V.modeSel,V.nSel,V.ansSel,V.specs,V.games,MYID,NET.status,V.qi]);
    html=({lobby:vLobby,reveal:vReveal,end:vEnd}[V.phase]||vLobby)();}
  if(NET.status&&V)html=`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`+html;
  if(key===LASTKEY)return;
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
  if(V&&V.phase==='play'){drawBox();updateMulti();updDirs();}
  if(V&&V.phase==='reveal'){const m=$('#mini');if(m){const sz=150,dpr=Math.min(2,window.devicePixelRatio||1);m.width=m.height=sz*dpr;const g=m.getContext('2d'),k=m.width/R;g.setTransform(k,0,0,k,0,0);
    if(MASK.ch===V.hist[V.hist.length-1].ch){g.globalAlpha=.18;g.drawImage(mcv,0,0,R,R);g.globalAlpha=1;}
    drawCuts(g,false);}}
}
setInterval(()=>{const t=$('#timer');if(t&&V&&V.phase==='play'){const r=remainS();t.textContent=r==null?'':`のこり ${r}秒`;}
  const tr=$('#turn');if(tr&&V&&V.phase==='play'&&(isMulti()||kindOf()==='solid'))tr.innerHTML=turnText();},250);
addEventListener('resize',()=>{if(V&&V.phase==='play'){drawBox();}});
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('danmen-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='ans')answer();
  else if(a==='dir')pickDir(+b.dataset.v);

  else if(['start','lobby','next','give','endq'].includes(a))send({t:a});
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}
  if(!amHost())return;if(['lvSel','modeSel','nSel','ansSel'].includes(t.id))send({t:t.id,v:t.value});if(t.id==='kind')send({t:'kind',v:t.value});});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
  if(e.target.id==='ans'){e.preventDefault();answer();}
});
(function(){let j=null;try{j=sessionStorage.getItem('danmen-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
