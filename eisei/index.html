<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>衛星ぶんどり</title>
<meta name="description" content="惑星を動かして、ほかの惑星の衛星を引力で奪い合うゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列レイアウト。ゲーム中は画面いっぱいの宇宙（いつも暗い色） */
:root{
  --bg:#f1f2f8; --surface:#fdfdff; --ink:#1f2233; --muted:#6b6f86; --rule:#dcdeea;
  --p:#3b5bdb; --p-soft:#e2e8fb; --accent:#1f2233; --accent-ink:#fdfdff; --ok:#2f8f4e; --warn:#b3412f;
  --shadow:0 2px 0 rgba(31,34,51,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1c1e2b; --ink:#eef0fa; --muted:#a2a6bf; --rule:#30334a;
  --p:#7d97ff; --p-soft:#252d52; --accent:#eef0fa; --accent-ink:#12131c; --ok:#5ccf80; --warn:#ff8a73; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1c1e2b; --ink:#eef0fa; --muted:#a2a6bf; --rule:#30334a;
  --p:#7d97ff; --p-soft:#252d52; --accent:#eef0fa; --accent-ink:#12131c; --ok:#5ccf80; --warn:#ff8a73; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--p)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;background:var(--bg)}
.plist li .dot{width:12px;height:12px;border-radius:50%}
.plist li.off{opacity:.55}
.plist li.me{border-color:var(--ink)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t td.sub,table.t td.num{white-space:nowrap}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
table.t tr.me td{font-weight:800}
.rk{font-weight:800;width:3em}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid var(--e,transparent)}
.win{font-size:22px;font-weight:800;text-align:center}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#05060a;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;color:#e8e9f2;font-family:var(--font)}
.hud .tm{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.hud .tm.low{color:#ff8f80}
.hud .mine{font-size:14px;font-weight:700}
.board{background:rgba(20,22,34,.82);border:1px solid #2c2f44;border-radius:12px;padding:6px 10px;font-size:13px;min-width:120px}
.board div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.board div b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:10px}
.board div.me{font-weight:800}
.hud .lv{pointer-events:auto;background:rgba(20,22,34,.82);color:#e8e9f2;border:1px solid #2c2f44;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;margin-top:6px}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#e8e9f2;font-size:96px;font-weight:800;font-family:var(--font)}
.cd[hidden],.hint[hidden]{display:none}
.cd small{display:block;font-size:16px;font-weight:700;text-align:center}
.hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:rgba(232,233,242,.65);font-size:13px;pointer-events:none;font-family:var(--font)}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">衛星</span>ぶんどり</h1><small>引力で衛星を奪い合う ・ <span id="ver">v4</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div class="hud"><div><div class="tm" id="tm">2:00</div><div class="mine" id="mine"></div></div><div style="text-align:right"><div class="board" id="board"></div><button class="lv" data-act="leave">退出</button></div></div>
  <div class="cd" id="cd" hidden></div>
  <div class="hint" id="hint">押している方向へ惑星が進みます</div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 衛星ぶんどり：部屋主が衛星とCPUの動きを計算して配る。自分の惑星は各自の画面で動かし、位置だけを部屋主に送る
   （自分の惑星は待ち時間なしで動く）。衛星は、いちばん強く引っぱる惑星のものになる */
const PREFIX='eisei-room-';
const VER=4;
const MAXP=10,MAXPL=12; // 人は10人まで、CPUを入れて惑星は12個まで
// 淡い色（塗り）と、同じ色みの濃い色（ふち・文字）
const COLORS=['#9cc3f0','#f5ab97','#94d6b2','#f3d47e','#f2b1cd','#c2b3ef','#8fd3d6','#f6c08a','#c3dd93','#cfcac2','#ef9e9e','#a9dbf3'];
const EDGE=['#4a7fbd','#c96a52','#3f9a6b','#b8962a','#bf6a90','#7d69bf','#3d9599','#c07f3e','#7f9c45','#8a847b','#bd5858','#4b98bd'];
const CPUN=['ルナ','ガイア','イオ','タイタン','ベガ','ミラ','シリウス','ポラリス','カノープス','リゲル','アルタイル','デネブ'];
// 惑星：衛星が多いほど大きく重い（引力が強い）けれど、遅くなる
const RAD=k=>18+4.5*Math.sqrt(k);
const MASS=k=>1+0.3*k;
const VMAX=k=>300/(1+0.05*k);
const ACC=950,DRAG=1.4;
const START_SATS=3;
const GOLD_N=3,GOLD_V=3; // 金の衛星：場に3つだけ。1つで3点
const SPEED=0.45; // ゲーム全体の速さ（1で元の速さ）
const HIT_COOL=1.2,HIT_V=30; // ぶつかったときの罰：衛星を1つ落とす。続けて落ちないよう少し間をあける
const STEAL=1.25,STEAL_NEAR=60,CATCH_NEAR=70,COOL=1.2;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=(s,n)=>String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,n);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let TOK=null;try{TOK=sessionStorage.getItem('eisei-tok');}catch(e){}
if(!TOK){TOK='t'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{sessionStorage.setItem('eisei-tok',TOK);}catch(e){}}
let NAME=store.get('eisei-name')||'';
const NET={role:null,peer:null,conn:null,conns:[],code:null,status:'',want:'play',solo:false};
let H=null,V=null,MYID=null;
const D={code:''};
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- 部屋主の進行 ---------- */
function hostInit(){H={ev:[],phase:'lobby',players:[],hostId:null,timeSel:'60',cpuSel:'auto',inGame:[],pl:[],sats:[],W:1600,endAt:null,cdEnd:null,result:null,wins:{},games:0,spawnT:0,lastSnap:0};}
function addPlayer(tok,name){const id='p'+Math.random().toString(36).slice(2,8);H.players.push({id,tok,name:clean(name,12)||('プレイヤー'+(H.players.length+1)),online:true});return id;}
const gameP=()=>H.players.filter(p=>H.inGame.includes(p.id));
function pubFor(pid){
  return {phase:H.phase,ver:VER,code:NET.code,solo:NET.solo,players:H.players.map(p=>({id:p.id,name:p.name,online:p.online})),hostId:H.hostId,
    specs:NET.conns.filter(c=>c.open&&!c._pid).length,timeSel:H.timeSel,cpuSel:H.cpuSel,inGame:H.inGame,W:H.W,
    pl:H.pl.map(p=>({id:p.id,name:p.name,col:p.col,cpu:!!p.cpu})),myIdx:H.pl.findIndex(p=>p.id===pid),
    result:H.result,wins:H.wins,games:H.games,
    cdRemain:H.cdEnd?Math.max(0,H.cdEnd-Date.now()):null,remain:H.endAt?Math.max(0,H.endAt-Date.now()):null};
}
function push(){NET.conns.forEach(c=>sendTo(c,{t:'view',v:pubFor(c._pid),you:c._pid||null}));setView(pubFor(H.hostId),H.hostId);}
function absorb(){NET.conns.forEach(c=>{if(c.open&&!c._pid&&c._want==='play'&&H.players.length<MAXP){const P=H.players.find(p=>p.tok===c._tok);c._pid=P?P.id:addPlayer(c._tok,c._name);if(P)P.online=true;}});}
function cpuCount(n){if(H.cpuSel==='auto')return Math.max(0,4-n)+(n<=1?1:0);return Math.min(+H.cpuSel,MAXPL-n);}
function startGame(){
  absorb();H.players=H.players.filter(p=>p.online);if(!H.players.length)return;
  H.inGame=H.players.map(p=>p.id);
  const hum=gameP(),nc=cpuCount(hum.length),n=hum.length+nc;
  H.W=Math.round(1300+170*Math.max(0,n-3));
  const cn=shuffle(CPUN.slice());
  H.pl=hum.map((p,i)=>({id:p.id,name:p.name,col:i})).concat(Array.from({length:nc},(_,i)=>({id:'cpu'+i,name:cn[i]+'（CPU）',col:hum.length+i,cpu:true})));
  // 円の上に等間隔で並べる
  const W=H.W,off=Math.random()*Math.PI*2;
  H.pl.forEach((p,i)=>{const a=off+i/n*Math.PI*2;Object.assign(p,{x:W/2+Math.cos(a)*W*.33,y:W/2+Math.sin(a)*W*.33,vx:0,vy:0,k:0,tx:null,ty:null,ai:0,aiT:0});});
  H.sats=[];
  H.pl.forEach((p,i)=>{for(let j=0;j<START_SATS;j++)addSat(i,p.x,p.y);});
  for(let j=0;j<6+2*n;j++)addNeutral();
  // 金の衛星は真ん中あたりに置く
  for(let j=0;j<GOLD_N;j++){const s=addNeutral(),a=j/GOLD_N*Math.PI*2+off;s.x=W/2+Math.cos(a)*W*.12;s.y=W/2+Math.sin(a)*W*.12;s.v=GOLD_V;s.vx=s.vy=0;}
  H.ev=[];H.result=null;H.phase='count';H.cdEnd=Date.now()+3000;H.endAt=null;H.spawnT=0;countSats();
}
function addSat(o,x,y){const a=Math.random()*Math.PI*2,lane=H.sats.filter(s=>s.o===o).length%3;H.sats.push({x:x+Math.cos(a)*40,y:y+Math.sin(a)*40,vx:0,vy:0,o,lane,dir:Math.random()<.5?1:-1,cool:0,v:1});}
function addNeutral(){const W=H.W;let x,y,t=0;do{x=rnd(80,W-80);y=rnd(80,W-80);t++;}while(t<20&&H.pl.some(p=>Math.hypot(p.x-x,p.y-y)<220));H.sats.push({x,y,vx:rnd(-30,30),vy:rnd(-30,30),o:-1,lane:0,dir:1,cool:0,v:1});return H.sats[H.sats.length-1];}
function countSats(){H.pl.forEach(p=>{p.k=0;p.pts=0;});H.sats.forEach(s=>{if(s.o>=0){H.pl[s.o].k++;H.pl[s.o].pts+=s.v||1;}});}
// 惑星1つぶんの動き（自分の惑星・CPU・部屋主の惑星で同じ式を使う）
// 重いほど慣性が大きい：加速しにくく、止まりにくい
function stepPlanet(p,dt,thrust,tx,ty,W,others,mult){
  const M=MASS(p.k||0);let hit=null;
  if(thrust){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d>4){const f=ACC*1.6/(0.6+M)*(mult||1)*Math.min(1,d/70);p.vx+=dx/d*f*dt;p.vy+=dy/d*f*dt;}}
  const dr=Math.exp(-DRAG/Math.sqrt(M)*dt);p.vx*=dr;p.vy*=dr;
  const vm=VMAX(p.k||0)*(mult||1),sp=Math.hypot(p.vx,p.vy);if(sp>vm){p.vx*=vm/sp;p.vy*=vm/sp;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  const r=RAD(p.k||0);
  if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*.5;}if(p.x>W-r){p.x=W-r;p.vx=-Math.abs(p.vx)*.5;}
  if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*.5;}if(p.y>W-r){p.y=W-r;p.vy=-Math.abs(p.vy)*.5;}
  // ほかの惑星とはぶつかって跳ね返る（自分のほうだけ動かす）
  for(const q of others){if(q===p)continue;const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||0.01,m=r+RAD(q.k||0);
    if(d<m){const nx=dx/d,ny=dy/d;p.x=q.x+nx*m;p.y=q.y+ny*m;const vn=(p.vx-(q.vx||0))*nx+(p.vy-(q.vy||0))*ny;
      // ぶつかったときも、重いほうはあまり跳ね返されない
      if(vn<0){const mq=MASS(q.k||0),j=1.8*mq/(M+mq);p.vx-=j*vn*nx;p.vy-=j*vn*ny;if(vn<-HIT_V)hit=q;}}}
  return hit;
}
// CPUの考え：近くの野良衛星や、自分より軽い惑星の衛星をねらう。重い惑星からは逃げる
function cpuThink(i){
  const p=H.pl[i],m=MASS(p.k);let best=null,bv=0;
  for(const s of H.sats){if(s.o===i)continue;const d=Math.hypot(s.x-p.x,s.y-p.y);
    if(s.o<0){const v=1.2*(s.v||1)/(d+120);if(v>bv){bv=v;best=[s.x,s.y];}}}
  H.pl.forEach((q,j)=>{if(j===i||!q.k)return;const d=Math.hypot(q.x-p.x,q.y-p.y),mq=MASS(q.k);
    if(mq<=m*1.4){const v=q.k*0.5/(d+150);if(v>bv){bv=v;best=[q.x+(p.x-q.x)*RAD(q.k)/Math.max(d,1)*0.2,q.y+(p.y-q.y)*RAD(q.k)/Math.max(d,1)*0.2];}}});
  // 重い相手がすぐ近くにいたら離れる（ただし衛星を持っていない間はかまわず突っこむ）
  const thr=H.pl.find((q,j)=>j!==i&&MASS(q.k)>m*1.6&&Math.hypot(q.x-p.x,q.y-p.y)<RAD(q.k)+120&&p.k>2);
  if(thr&&Math.random()<.7){best=[p.x+(p.x-thr.x)*2,p.y+(p.y-thr.y)*2];}
  if(!best)best=[rnd(100,H.W-100),rnd(100,H.W-100)];
  p.tx=best[0]+rnd(-30,30);p.ty=best[1]+rnd(-30,30);
}
// 衝突の罰：ぶつかった両方が衛星を1つずつ落とす（落ちた衛星は野良になって飛んでいく）
function bump(i,j){
  const a=H.pl[i],b=H.pl[j];if(!a||!b||i===j)return;if((a.hc||0)>0&&(b.hc||0)>0)return;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let lost=false;
  for(const p of [a,b]){if((p.hc||0)>0)continue;p.hc=HIT_COOL;const pi=H.pl.indexOf(p);
    let best=null,bd=1e9;for(const s of H.sats){if(s.o!==pi)continue;const d=Math.hypot(s.x-mx,s.y-my);if(d<bd){bd=d;best=s;}}
    if(best){const dx=best.x-p.x,dy=best.y-p.y,d=Math.hypot(dx,dy)||1;best.o=-1;best.cool=1.6;best.vx=dx/d*240+p.vx*.5;best.vy=dy/d*240+p.vy*.5;lost=true;}}
  H.ev.push([Math.round(mx),Math.round(my),lost?1:0]);H.bumps=(H.bumps||0)+1;if(lost)countSats();
}
function hostTick(dt){
  if(!H)return;const now=Date.now();
  if(H.phase==='count'&&now>=H.cdEnd){H.phase='play';H.cdEnd=null;H.endAt=now+(+H.timeSel)*1000;push();}
  if(H.phase!=='play')return;
  if(now>=H.endAt){endGame();return;}
  const W=H.W;
  // CPUと、通信が切れた人の惑星は部屋主が動かす。ほかの人の惑星は、届いた位置から少し先を予想して進める
  H.pl.forEach((p,i)=>{
    const P=!p.cpu&&H.players.find(x=>x.id===p.id);const auto=p.cpu||(P&&!P.online&&p.id!==H.hostId);
    if((p.hc||0)>0)p.hc-=dt;
    if(auto){p.aiT-=dt;if(p.aiT<=0||p.tx==null){cpuThink(i);p.aiT=rnd(.3,.6);}
      // ぶつかりそうな惑星からはよける
      let ax=p.tx,ay=p.ty;H.pl.forEach(q=>{if(q===p)return;const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1,m=RAD(p.k)+RAD(q.k)+45;if(d<m){ax+=dx/d*220*(m-d)/45;ay+=dy/d*220*(m-d)/45;}});
      const q=stepPlanet(p,dt,true,ax,ay,W,H.pl,p.cpu?.85:.7);if(q)bump(i,H.pl.indexOf(q));}
    else if(p.id!==H.hostId){p.x+=p.vx*dt;p.y+=p.vy*dt;}
  });
  // 衛星
  const G=60000;
  for(const s of H.sats){
    let ax=0,ay=0;
    H.pl.forEach((q,j)=>{if(j===s.o)return;const dx=q.x-s.x,dy=q.y-s.y,d=Math.max(Math.hypot(dx,dy),RAD(q.k));if(d>400)return;const f=G*MASS(q.k)/(d*d*d);ax+=dx*f;ay+=dy*f;});
    if(s.o>=0){const p=H.pl[s.o];let dx=s.x-p.x,dy=s.y-p.y;const r=Math.hypot(dx,dy)||0.01,ux=dx/r,uy=dy/r,tx=-uy*s.dir,ty=ux*s.dir;
      const Rt=RAD(p.k)+16+s.lane*9,om=2.4,vt=om*Rt;
      const dvx=p.vx+tx*vt-ux*(r-Rt)*3,dvy=p.vy+ty*vt-uy*(r-Rt)*3;
      ax+=(dvx-s.vx)*5;ay+=(dvy-s.vy)*5;}
    else{const dr=Math.exp(-0.3*dt);s.vx*=dr;s.vy*=dr;ax+=rnd(-20,20);ay+=rnd(-20,20);}
    s.vx+=ax*dt;s.vy+=ay*dt;const sp=Math.hypot(s.vx,s.vy);if(sp>750){s.vx*=750/sp;s.vy*=750/sp;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x<5){s.x=5;s.vx=Math.abs(s.vx);}if(s.x>W-5){s.x=W-5;s.vx=-Math.abs(s.vx);}
    if(s.y<5){s.y=5;s.vy=Math.abs(s.vy);}if(s.y>W-5){s.y=W-5;s.vy=-Math.abs(s.vy);}
    if(s.cool>0)s.cool-=dt;
  }
  // 持ち主の決め直し：いちばん強く引っぱる惑星が、今の持ち主より十分強くて十分近ければ乗り換える
  let moved=false;
  for(const s of H.sats){if(s.cool>0)continue;
    let bj=-1,bg=0;H.pl.forEach((q,j)=>{const d=Math.max(Math.hypot(q.x-s.x,q.y-s.y),1),g=MASS(q.k)/(d*d);if(g>bg&&d<RAD(q.k)+(s.o<0?CATCH_NEAR:STEAL_NEAR)){bg=g;bj=j;}});
    if(bj<0||bj===s.o)continue;
    if(s.o>=0){const o=H.pl[s.o],d=Math.max(Math.hypot(o.x-s.x,o.y-s.y),1);if(bg<MASS(o.k)/(d*d)*STEAL)continue;}
    s.o=bj;s.lane=H.sats.filter(x=>x.o===bj).length%3;s.dir=Math.random()<.5?1:-1;s.cool=COOL;moved=true;
  }
  if(moved)countSats();
  // 野良の衛星をときどき足す
  H.spawnT+=dt;const nn=H.sats.filter(s=>s.o<0&&s.v===1).length;
  if(H.spawnT>4&&nn<3+H.pl.length){H.spawnT=0;addNeutral();}
}
function endGame(){
  countSats();H.phase='end';H.endAt=null;H.games++;
  const rows=H.pl.map((p,i)=>({i,id:p.id,name:p.name,col:p.col,cpu:!!p.cpu,k:p.k,pts:p.pts,g:H.sats.filter(s=>s.o===i&&s.v>1).length})).sort((a,b)=>b.pts-a.pts||b.k-a.k);
  rows.forEach((r,j)=>{r.rank=j&&rows[j-1].pts===r.pts?rows[j-1].rank:j+1;});
  rows.filter(r=>r.rank===1&&!r.cpu).forEach(r=>{H.wins[r.id]=(H.wins[r.id]||0)+1;});
  H.result=rows;absorb();push();snapAll();
}
// 位置の配信：[x,y,vx,vy,衛星数] と、衛星の [x,y,持ち主]
function snap(){const E=H.ev;H.ev=[];return {t:'s',E,r:H.endAt?Math.max(0,H.endAt-Date.now()):0,P:H.pl.map(p=>[Math.round(p.x),Math.round(p.y),Math.round(p.vx),Math.round(p.vy),p.k,p.pts]),S:H.sats.flatMap(s=>[Math.round(s.x),Math.round(s.y),s.o,s.v])};}
function snapAll(){if(!H||!H.pl.length)return;const m=snap();NET.conns.forEach(c=>sendTo(c,m));onSnap(m);}
function act(pid,m){
  if(!H||!m)return;
  const isHost=pid===H.hostId,setup=H.phase==='lobby'||H.phase==='end';
  switch(m.t){
    case 'timeSel':if(isHost&&setup&&['60','90','120','180','300'].includes(m.v))H.timeSel=m.v;break;
    case 'cpuSel':if(isHost&&setup&&['auto','0','1','2','3','4','6','8'].includes(m.v))H.cpuSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);H.pl=[];H.sats=[];}break;
    case 'hit':{ // ぶつかった、という報告（ぶつかった本人の画面で判定する）
      if(H.phase!=='play')return;const i=H.pl.findIndex(x=>x.id===pid),j=+m.j;const a=H.pl[i],b=H.pl[j];
      if(a&&b&&Math.hypot(a.x-b.x,a.y-b.y)<RAD(a.k)+RAD(b.k)+90)bump(i,j);return;}
    case 'p':{ // 自分の惑星の位置
      if(H.phase!=='play')return;const p=H.pl.find(x=>x.id===pid);if(!p)return;
      const n=[m.x,m.y,m.vx,m.vy].map(Number);if(n.some(v=>!isFinite(v)))return;
      p.x=Math.max(0,Math.min(H.W,n[0]));p.y=Math.max(0,Math.min(H.W,n[1]));
      const sp=Math.hypot(n[2],n[3]),vm=VMAX(p.k)*1.2;p.vx=sp>vm?n[2]*vm/sp:n[2];p.vy=sp>vm?n[3]*vm/sp:n[3];return;}
  }
  push();
}
function hostWire(c){
  c.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(m.ver!==VER){sendTo(c,{t:'reload',ver:VER});setTimeout(()=>{try{c.close();}catch(e){}},400);return;}
      if(!NET.conns.includes(c))NET.conns.push(c);
      c._tok=typeof m.tok==='string'?m.tok.slice(0,40):null;c._want=m.want==='watch'?'watch':'play';c._name=clean(m.name,12);
      let P=c._tok?H.players.find(p=>p.tok===c._tok&&p.id!==H.hostId):null;
      if(P){NET.conns.forEach(o=>{if(o!==c&&o._pid===P.id)o._pid=null;});c._pid=P.id;P.online=true;if(c._name)P.name=c._name;}
      else if(c._want==='play'&&(H.phase==='lobby'||H.phase==='end')&&H.players.length<MAXP)c._pid=addPlayer(c._tok,c._name);
      else c._pid=null;
      push();sendTo(c,{t:'chathist',list:CHAT.list});if(H.pl.length)sendTo(c,snap());return;
    }

    NET.conns=NET.conns.filter(o=>o!==c);
    if(c._pid&&!NET.conns.some(o=>o._pid===c._pid)){const P=H.players.find(p=>p.id===c._pid);if(P){P.online=false;if(H.phase==='lobby')H.players=H.players.filter(p=>p!==P);}}
    push();
  });

}
// 部屋主の計算は一定間隔で回す（このタブを裏に回すと遅くなるので注意）
let HT=Date.now();
setInterval(()=>{if(NET.role!=='host'||!H)return;const now=Date.now();let dt=Math.min(.1,(now-HT)/1000)*SPEED;HT=now;

/* ---------- 通信 ---------- */
function resetNet(){
  CHAT.list=[];CHAT.unread=0;
  try{if(NET.conn)NET.conn.close();}catch(e){}
  NET.conns.forEach(c=>{try{c.close();}catch(e){}});
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:null,peer:null,conn:null,conns:[],code:null,status:'',solo:false});H=null;V=null;MYID=null;SN.length=0;ME.p=null;
}
function noPeer(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした。インターネット接続を確かめて、ページを開き直してください（ひとりで遊ぶことはできます）';render();return true;}return false;}
function soloRoom(){resetNet();NET.role='host';NET.solo=true;NET.code=null;hostInit();H.hostId=addPlayer(TOK,NAME);push();}
function createRoom(tries){
  tries=tries||0;if(noPeer())return;
  resetNet();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);NET.peer=peer;NET.role='host';NET.code=code;NET.status='部屋を準備しています…';
  hostInit();H.hostId=addPlayer(TOK,NAME);
  peer.on('open',()=>{NET.status='';setRoomURL(code);push();});
  peer.on('connection',c=>hostWire(c));
  peer.on('error',e=>{
    if(e&&e.type==='unavailable-id'&&tries<5){createRoom(tries+1);return;}
    if(NET.role==='host'&&NET.peer===peer&&V){NET.status='通信でエラーが起きました（'+((e&&e.type)||'error')+'）';render();return;}
    resetNet();NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）。少し待ってからもう一度試してください';render();
  });

}
function joinRoom(code,want){
  code=clean(code,8).toUpperCase();if(!/^[A-Z0-9]{4,8}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';render();return;}
  if(noPeer())return;
  resetNet();
  const peer=new Peer();NET.peer=peer;NET.role='guest';NET.code=code;NET.want=want;NET.status='接続しています…';
  peer.on('open',()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});NET.conn=c;
    c.on('open',()=>{c.send({t:'hello',tok:TOK,name:NAME,want,ver:VER});});
    c.on('data',m=>{
      if(!m)return;
      if(m.t==='s'){onSnap(m);return;}
      if(m.t==='reload'){NET.needReload=true;NET.conn=null;V=null;NET.status=+m.ver>VER?'このページは古い版です。再読み込みしてから入り直してください':'部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='chat'){const x=cleanMsg(m.c);if(x)addChat(x);return;}
      if(m.t==='chathist'&&Array.isArray(m.list)){CHAT.list=m.list.map(cleanMsg).filter(Boolean).slice(-100);renderChat();return;}
      if(m.t==='view'&&m.v&&m.v.ver!==VER){V=null;NET.status='部屋主のページが古い版です。部屋主に再読み込みしてから部屋を作り直してもらってください';render();return;}
      if(m.t==='view'&&m.v){NET.status='';NET.lost=false;setRoomURL(code);try{sessionStorage.setItem('eisei-joined',code+':'+want);}catch(e){}setView(m.v,m.you||null);}});
    c.on('close',()=>{if(NET.conn===c){NET.status='部屋との接続が切れました。もう一度参加すると続きから遊べます';NET.lost=true;render();}});
    c.on('error',()=>{});
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした。コードを確かめてください':'つながりませんでした（'+((e&&e.type)||'error')+'）';
    if(!V){NET.role=null;}render();
  });
  render();
}

const SN=[],FX=[]; // FX：ぶつかったところに出す輪 // 届いた位置（受け取った時刻つき）。少し前の時刻を補間して描く

    if(!ME.p||!ME.sync){ME.p={x:q[0],y:q[1],vx:0,vy:0,k:q[4]};ME.sync=true;}

function setView(v,you){

// 入力：押している間、その方向へ進む（キーボードでも動かせる）
const IN={down:false,sx:0,sy:0,keys:{}};
function myInput(p){
  const k=IN.keys;let kx=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0),ky=(k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0);
  if(kx||ky)return {on:true,x:p.x+kx*200,y:p.y+ky*200};
  if(IN.down){const w=CAM.toWorld(IN.sx,IN.sy);return {on:true,x:w[0],y:w[1]};}

}
// 補間した今の位置
function interp(){
  if(NET.role==='host'&&H)return {P:H.pl.map(p=>[p.x,p.y,p.vx,p.vy,p.k,p.pts]),S:H.sats.flatMap(s=>[s.x,s.y,s.o,s.v])};
  if(!SN.length)return null;
  const rt=performance.now()-110;let a=SN[0],b=SN[SN.length-1];
  for(let i=0;i<SN.length-1;i++){if(SN[i].t<=rt&&SN[i+1].t>=rt){a=SN[i];b=SN[i+1];break;}}
  if(rt>=b.t)a=b;
  const f=b.t>a.t?Math.min(1,Math.max(0,(rt-a.t)/(b.t-a.t))):1,L=(u,v)=>u+(v-u)*f;
  const P=b.P.map((q,i)=>{const o=a.P[i]||q;return [L(o[0],q[0]),L(o[1],q[1]),q[2],q[3],q[4],q[5]];});
  const S=[];for(let i=0;i<b.S.length;i+=4){const ox=a.S.length>i?a.S[i]:b.S[i],oy=a.S.length>i?a.S[i+1]:b.S[i+1];S.push(L(ox,b.S[i]),L(oy,b.S[i+1]),b.S[i+2],b.S[i+3]);}
  return {P,S};
}

const cv=$('#cv'),cx=cv.getContext('2d');
const FONTF='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif';
const CAM={x:0,y:0,s:1,w:0,h:0,toWorld(sx,sy){return [(sx-this.w/2)/this.s+this.x,(sy-this.h/2)/this.s+this.y];}};
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);CAM.w=innerWidth;CAM.h=innerHeight;cv.width=CAM.w*dpr;cv.height=CAM.h*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}

let LAST=performance.now(),SENDT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-LAST)/1000)*SPEED;LAST=now;
  const playing=V&&(V.phase==='count'||V.phase==='play');
  if(!playing)return;

const BG='#0c0d14',GRID='rgba(200,205,235,.10)',FRAME='#3a3d55',INK='#e8e9f2';
const colOf=i=>COLORS[V.pl[i].col%COLORS.length],edgeOf=i=>EDGE[V.pl[i].col%EDGE.length];
function draw(st,W,mi,now){
  const w=CAM.w,h=CAM.h;
  // カメラ：自分の惑星を追う。観戦中は全体を映す
  if(mi>=0&&st.P[mi]){const tgt=Math.min(w,h)/Math.min(900,W);CAM.s=tgt;CAM.x=st.P[mi][0];CAM.y=st.P[mi][1];
    const hw=w/2/CAM.s,hh=h/2/CAM.s;CAM.x=W<hw*2?W/2:Math.max(hw-60,Math.min(W-hw+60,CAM.x));CAM.y=W<hh*2?W/2:Math.max(hh-60,Math.min(W-hh+60,CAM.y));}
  else{CAM.s=Math.min(w,h)/(W+80);CAM.x=W/2;CAM.y=W/2;}
  cx.fillStyle='#05060a';cx.fillRect(0,0,w,h);
  cx.save();cx.translate(w/2,h/2);cx.scale(CAM.s,CAM.s);cx.translate(-CAM.x,-CAM.y);
  cx.fillStyle=BG;cx.fillRect(0,0,W,W);

  cx.strokeStyle=FRAME;cx.lineWidth=4/CAM.s;cx.strokeRect(0,0,W,W);
  const P=st.P,S=st.S,pl=V.pl;
  // 衛星から持ち主へのうすい線
  cx.lineWidth=1.5/CAM.s;
  for(let i=0;i<S.length;i+=4){const o=S[i+2];if(o<0||!P[o])continue;cx.strokeStyle=colOf(o);cx.globalAlpha=.35;cx.beginPath();cx.moveTo(S[i],S[i+1]);cx.lineTo(P[o][0],P[o][1]);cx.stroke();}
  cx.globalAlpha=1;
  // 惑星：平らな円＋同じ色みのふち。自分の惑星は外側に輪
  P.forEach((q,i)=>{const m=pl[i];if(!m)return;const r=RAD(q[4]);
    if(i===mi){cx.strokeStyle=colOf(i);cx.globalAlpha=.45;cx.lineWidth=5/CAM.s;cx.beginPath();cx.arc(q[0],q[1],r+9/CAM.s+2,0,Math.PI*2);cx.stroke();cx.globalAlpha=1;}
    cx.fillStyle=colOf(i);cx.beginPath();cx.arc(q[0],q[1],r,0,Math.PI*2);cx.fill();
    cx.strokeStyle=edgeOf(i);cx.lineWidth=2.5/CAM.s;cx.stroke();
    // 惑星の模様（平らな帯）
    cx.save();cx.beginPath();cx.arc(q[0],q[1],r-1.5/CAM.s,0,Math.PI*2);cx.clip();cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(q[0]-r,q[1]-r*.15,r*2,r*.3);cx.restore();
    cx.fillStyle=colOf(i);cx.font=`800 ${13/CAM.s}px ${FONTF}`;cx.textAlign='center';
    cx.fillText(`${m.name}  ${q[5]}点`,q[0],q[1]-r-10/CAM.s);});
  // 衛星
  cx.lineWidth=1.5/CAM.s;const pn0=performance.now();
  for(let i=0;i<S.length;i+=4){const o=S[i+2];
    if(S[i+3]>1){ // 金の衛星：星の形。持ち主がいれば、その色のふち
      const x=S[i],y=S[i+1],R1=Math.max(13,10/CAM.s),R2=R1*.45,rot=pn0/900;cx.beginPath();for(let j=0;j<10;j++){const rr=j%2?R2:R1,a=rot+j*Math.PI/5;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();
      cx.fillStyle='#ffd978';cx.fill();cx.lineWidth=1.5/CAM.s;cx.strokeStyle=o<0?'#b8902a':edgeOf(o);cx.stroke();if(o>=0){cx.fillStyle=colOf(o);cx.beginPath();cx.arc(x,y,R2*.6,0,Math.PI*2);cx.fill();}cx.lineWidth=1.5/CAM.s;continue;}
    cx.fillStyle=o<0?'#e8e9f2':colOf(o);cx.strokeStyle=o<0?'#7c7f99':edgeOf(o);
    cx.beginPath();cx.arc(S[i],S[i+1],o<0?5:6,0,Math.PI*2);cx.fill();cx.stroke();}
  // 押している先のしるし
  if(mi>=0&&IN.down&&V.phase==='play'){const t=CAM.toWorld(IN.sx,IN.sy);cx.strokeStyle='rgba(232,233,242,.35)';cx.lineWidth=2/CAM.s;cx.beginPath();cx.arc(t[0],t[1],10/CAM.s,0,Math.PI*2);cx.stroke();}
  // ぶつかったところの輪（衛星を落としたら赤）
  const pn=performance.now();for(let i=FX.length-1;i>=0;i--){const f=FX[i],a=(pn-f.t)/700;if(a>=1){FX.splice(i,1);continue;}
    cx.strokeStyle=f.lost?'#ff8f80':'#e8e9f2';cx.globalAlpha=1-a;cx.lineWidth=4/CAM.s;cx.beginPath();cx.arc(f.x,f.y,20+a*70,0,Math.PI*2);cx.stroke();
    if(f.lost){cx.fillStyle='#ff8f80';cx.font=`800 ${16/CAM.s}px ${FONTF}`;cx.textAlign='center';cx.fillText('ドン！',f.x,f.y-30-a*30);}}

  cx.restore();
  // 小さな全体図
  if(mi>=0){const ms=Math.min(110,w*.28),mx=10,my=h-ms-10,k=ms/W;cx.fillStyle='rgba(20,22,34,.85)';cx.fillRect(mx,my,ms,ms);cx.strokeStyle=FRAME;cx.lineWidth=1;cx.strokeRect(mx,my,ms,ms);
    for(let i=0;i<S.length;i+=4){const o=S[i+2];if(S[i+3]>1){cx.fillStyle='#ffd978';cx.fillRect(mx+S[i]*k-2.5,my+S[i+1]*k-2.5,5,5);continue;}cx.fillStyle=o<0?'#7c7f99':colOf(o);cx.fillRect(mx+S[i]*k-1,my+S[i+1]*k-1,2,2);}
    P.forEach((q,i)=>{cx.fillStyle=colOf(i);cx.strokeStyle=edgeOf(i);cx.beginPath();cx.arc(mx+q[0]*k,my+q[1]*k,Math.max(2.5,RAD(q[4])*k),0,Math.PI*2);cx.fill();cx.stroke();});
    const hw=w/2/CAM.s,hh=h/2/CAM.s;cx.strokeStyle='rgba(232,233,242,.45)';cx.strokeRect(mx+(CAM.x-hw)*k,my+(CAM.y-hh)*k,hw*2*k,hh*2*k);}
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*(1+f));g=Math.round(g*(1+f));b=Math.round(b*(1+f));return `rgb(${r},${g},${b})`;}
