<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>衛星ぶんどり</title>
<meta name="description" content="惑星を動かして、ほかの惑星の衛星を引力で奪い合うゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 待合室と結果はふつうの一列レイアウト。ゲーム中は画面いっぱいの宇宙（いつも暗い色） */
:root{
  --bg:#f1f2f8; --surface:#fdfdff; --ink:#1f2233; --muted:#6b6f86; --rule:#dcdeea;
  --p:#3b5bdb; --p-soft:#e2e8fb; --accent:#1f2233; --accent-ink:#fdfdff; --ok:#2f8f4e; --warn:#b3412f;
  --shadow:0 2px 0 rgba(31,34,51,.07);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1c1e2b; --ink:#eef0fa; --muted:#a2a6bf; --rule:#30334a;
  --p:#7d97ff; --p-soft:#252d52; --accent:#eef0fa; --accent-ink:#12131c; --ok:#5ccf80; --warn:#ff8a73; --shadow:0 2px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1c1e2b; --ink:#eef0fa; --muted:#a2a6bf; --rule:#30334a;
  --p:#7d97ff; --p-soft:#252d52; --accent:#eef0fa; --accent-ink:#12131c; --ok:#5ccf80; --warn:#ff8a73; --shadow:0 2px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.6;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:auto;flex-wrap:wrap}
.logo h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.04em}
.logo h1 .pa{color:var(--p)}
.logo small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{font-weight:800;letter-spacing:.12em}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
label.f,.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],select{width:100%;border:1.5px solid var(--rule);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:13px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.note{color:var(--muted);font-size:14px;margin-top:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;background:var(--bg)}
.plist li .dot{width:12px;height:12px;border-radius:50%}
.plist li.off{opacity:.55}
.plist li.me{border-color:var(--ink)}
.code{font-size:30px;font-weight:800;letter-spacing:.2em}
.center{text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
details.rules summary{cursor:pointer;font-weight:800}
details.rules ol{margin:8px 0 0;padding-left:20px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule)}
table.t td.sub,table.t td.num{white-space:nowrap}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
table.t tr.me td{font-weight:800}
.rk{font-weight:800;width:3em}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:2px solid var(--e,transparent)}
.win{font-size:22px;font-weight:800;text-align:center}
/* ゲーム画面 */
#game{position:fixed;inset:0;background:#05060a;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none}
#game[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none;color:#e8e9f2;font-family:var(--font)}
.hud .tm{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.hud .tm.low{color:#ff8f80}
.hud .mine{font-size:14px;font-weight:700}
.board{background:rgba(20,22,34,.82);border:1px solid #2c2f44;border-radius:12px;padding:6px 10px;font-size:13px;min-width:120px}
.board div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.board div b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:10px}
.board div.me{font-weight:800}
.hud .lv{pointer-events:auto;background:rgba(20,22,34,.82);color:#e8e9f2;border:1px solid #2c2f44;border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer;margin-top:6px}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#e8e9f2;font-size:96px;font-weight:800;font-family:var(--font)}
.cd[hidden],.hint[hidden]{display:none}
.cd small{display:block;font-size:16px;font-weight:700;text-align:center}
.hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:rgba(232,233,242,.65);font-size:13px;pointer-events:none;font-family:var(--font)}
.chat{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.chat-tab{border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.cbadge{background:var(--p);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
.chat-body{width:340px;max-width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.chat-log{list-style:none;margin:0;padding:10px 12px;height:min(46vh,340px);overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:6px}
.chat-log li{max-width:85%;align-self:flex-start;background:var(--bg);border-radius:12px;padding:5px 10px;word-break:break-word}
.chat-log li.mine{align-self:flex-end;background:var(--p-soft)}
.chat-log li .who{display:block;font-size:11px;color:var(--muted);font-weight:700}
.chat-log li.empty{align-self:center;background:none;color:var(--muted)}
.chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--rule)}
.chat-form input{flex:1;min-width:0;padding:8px 10px}
.chat-form .btn{min-height:40px;padding:6px 12px}
@media (max-width:480px){.chat{right:12px;bottom:12px}.chat-body{width:calc(100vw - 24px)}}
.chat[hidden],.chat-body[hidden]{display:none}
body.playing .chat{display:none}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-size:14px;z-index:40}
/* ガチャ */
.tk{font-size:15px}.tk b{font-size:26px;font-variant-numeric:tabular-nums;margin:0 2px}
.rb{display:inline-block;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;border-radius:6px;color:#fff;background:#8f8a84;letter-spacing:.04em}
.rb.r1{background:#3f8fd8}.rb.r2{background:#9a5ad0}.rb.r3{background:linear-gradient(135deg,#f5c84a,#c98a10);color:#3a2604}
.rb.r4{background:linear-gradient(90deg,#e5533d,#e3a21a,#2f9a52,#2f7fd8,#8a55c9);}
.ub{display:inline-block;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;border-radius:6px;margin-left:3px;background:#1d1a22;color:#ff7ad9;border:1px solid #ff7ad9}
.gres{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}
.gres.one{grid-template-columns:minmax(0,200px);justify-content:center}
@media (max-width:520px){.gres{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--rule);border-radius:14px;background:var(--surface);padding:6px 4px 8px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.gcard canvas{width:100%;max-width:96px;aspect-ratio:1}
.gres.one .gcard canvas{max-width:150px}
.gcard .gn{font-size:11px;font-weight:700;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.gcard .gb{line-height:1}
.gcard .gsel{position:absolute;top:4px;left:4px;font-size:10px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 5px}
.gcard.r1{border-color:#3f8fd8}.gcard.r2{border-color:#9a5ad0;box-shadow:0 0 0 1px #9a5ad0 inset}
.gcard.r3{border-color:#e0a020;box-shadow:0 0 14px rgba(240,180,40,.55)}
.gcard.r4{border-color:#e5533d;animation:urg 1.6s linear infinite}
.gcard.uq{outline:2px dashed #ff7ad9;outline-offset:2px}
.gcard.sel{background:var(--p-soft)}
@keyframes urg{0%{box-shadow:0 0 16px #e5533d}25%{box-shadow:0 0 16px #e3a21a}50%{box-shadow:0 0 16px #2f9a52}75%{box-shadow:0 0 16px #2f7fd8}100%{box-shadow:0 0 16px #e5533d}}
.gres .gcard{animation:gin .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 150ms)}
.gres .gcard.r4{animation:gin .5s cubic-bezier(.2,1.5,.4,1) both,urg 1.6s linear infinite;animation-delay:calc(var(--i) * 150ms),0s}
@keyframes gin{0%{transform:translateY(-30px) scale(.4) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.gflash{position:fixed;inset:0;pointer-events:none;z-index:50;animation:gfl 1.4s ease-out both}
.gflash.ssr{background:radial-gradient(circle,rgba(255,215,90,.75),rgba(255,180,40,0) 70%)}
.gflash.ur{background:conic-gradient(from 0deg,rgba(229,83,61,.6),rgba(227,162,26,.6),rgba(47,154,82,.6),rgba(47,127,216,.6),rgba(138,85,201,.6),rgba(229,83,61,.6))}
@keyframes gfl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.gdet{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.gdi{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.gnm{font-size:20px;font-weight:800;line-height:1.3}
.gst{border-collapse:collapse;font-size:13px}.gst th{text-align:left;font-weight:700;color:var(--muted);padding:1px 12px 1px 0}
.pp{display:inline-flex;gap:3px;vertical-align:middle}.pp i{width:14px;height:8px;border-radius:3px;background:var(--rule)}.pp i.on{background:var(--ink)}
.gsk{padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--rule)}
.gsk.uqd{border-color:#ff7ad9}
.ok{color:var(--ok);font-weight:800}
@media (prefers-reduced-motion:reduce){.gres .gcard,.gres .gcard.r4,.gcard.r4,.gflash{animation:none}.gflash{display:none}}
#gdpv,#mygd{width:120px;height:120px;border-radius:14px;flex:none}
#mygd{width:110px;height:110px}
.colbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.colctl{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.colctl .f{margin:0}
.mbar{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--p-soft);border:1px solid var(--p)}
.gcard.pk{outline:3px solid var(--p);outline-offset:1px}
.gcard.nopk{opacity:.4;cursor:default}
.gchk{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.gpanel{margin-top:10px;padding:14px;border-radius:16px;color:#f2ecff;border:1px solid var(--rc);
  background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),#16121e;
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset,0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.gpg{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.radar{width:min(100%,280px);flex:none;overflow:visible;margin:0 auto}
.radar .rl{fill:#cfc6e0;font-size:11px;font-weight:700}.radar .rv{fill:#fff;font-size:12px;font-weight:800}
.rpoly{animation:rpop .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rpop{0%{transform:scale(.1);opacity:0}100%{transform:none;opacity:1}}
.gfw{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.gtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gtiles div{border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px 8px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;line-height:1.25}
.gtiles span{font-size:11px;color:#cfc6e0;font-weight:700}.gtiles b{font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
.gsub{font-size:12px;color:#cfc6e0}
.gpx{border-left:3px solid var(--rc);padding:2px 0 2px 10px;font-size:13px;color:#e6def2}
.gpx b{font-size:16px;color:#fff;margin:0 8px}.gpx small{color:#cfc6e0}
.gpx .gpt{font-size:11px;font-weight:800;color:var(--rc);border:1px solid var(--rc);border-radius:5px;padding:0 5px}
.gpx.uqx{border-left-color:#ff7ad9}.gpx.uqx .gpt{color:#ff7ad9;border-color:#ff7ad9}
.gdd{border:1px solid var(--rule);border-radius:12px;background:var(--bg);padding:6px 10px}
.gdd+.gdd{margin-top:8px}
.gdd summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:44px}
.gdd summary::-webkit-details-marker{display:none}
.gdd summary::after{content:"▼";margin-left:auto;font-size:11px;color:var(--muted);transition:transform .2s}
.gdd[open] summary::after{transform:rotate(180deg)}
.gdd summary canvas{width:44px;height:44px;flex:none}
.gdn{display:flex;flex-direction:column;line-height:1.35;font-size:14px;font-weight:700;min-width:0}
.gdd .gpanel{margin:6px 0 4px}
/* 入り口 */
.doors{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
@media (min-width:560px){.doors{grid-template-columns:1fr 1fr}}
.door{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:20px;padding:18px 18px 20px;cursor:pointer;font:inherit;min-height:44px;position:relative;overflow:hidden}
.door canvas{width:110px;height:110px;align-self:center;margin:4px 0 6px;border-radius:16px}
.door b{font-size:24px;font-weight:800;line-height:1.2}
.door span{font-size:14px;line-height:1.6}
.door em{font-style:normal;font-size:13px;font-weight:800;margin-top:4px;padding:3px 10px;border-radius:999px}
.door.dn{background:linear-gradient(160deg,#1c2340,#0c0d14);color:#e8ecff;border:2px solid #4a7fbd;box-shadow:0 4px 0 #2c4a78}
.door.dg{background:radial-gradient(circle at 80% 10%,#5a3aa0,#1d1430 70%);color:#f4ecff;border:2px solid #b48cff;box-shadow:0 4px 0 #6a4ab0,0 0 22px rgba(180,140,255,.35)}
.door.dg em{background:rgba(255,255,255,.14);color:#ffe27a}
.door.dg::before,.door.dn::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#ffe27a,transparent),radial-gradient(1px 1px at 85% 25%,#fff,transparent),radial-gradient(1px 1px at 12% 70%,#cfe,transparent);pointer-events:none}
.door:active{transform:translateY(3px)}
.door:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.logo h1 .ga{background:linear-gradient(90deg,#e5533d,#e3a21a,#2f9a52,#2f7fd8,#8a55c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.skb{position:absolute;right:12px;bottom:16px;z-index:5;border:2px solid #e8e9f2;background:rgba(60,70,170,.92);color:#fff;border-radius:16px;padding:8px 16px;font:inherit;font-weight:800;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;min-width:110px;min-height:54px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);font-family:var(--font)}
.skb small{font-size:11px;font-weight:700;opacity:.85}
.skb:disabled{opacity:.4;cursor:default}
.skb[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.rpoly{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="logo"><h1><span class="pa">衛星</span>ぶんどり</h1><small>引力で衛星を奪い合う ・ <span id="ver">v5</span></small></div>
    <div id="topinfo" class="row"></div>
  </header>
  <main id="app"></main>
</div>
<div id="game" hidden>
  <canvas id="cv"></canvas>
  <div class="hud"><div><div class="tm" id="tm">2:00</div><div class="mine" id="mine"></div></div><div style="text-align:right"><div class="board" id="board"></div><button class="lv" data-act="leave">退出</button></div></div>
  <div class="cd" id="cd" hidden></div>
  <div class="hint" id="hint">押している方向へ惑星が進みます</div>
  <button class="skb" id="skb" data-act="skill" hidden></button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="chat" id="chat" hidden>
  <div class="chat-body" id="chatbody" hidden>
    <ul class="chat-log" id="chatlog" aria-live="polite"></ul>
    <form class="chat-form" id="chatform" autocomplete="off"><input type="text" id="chatinput" maxlength="200" placeholder="メッセージ" aria-label="メッセージ"><button class="btn primary" type="submit">送信</button></form>
  </div>
  <button class="chat-tab" type="button" id="chattab" aria-controls="chatbody" aria-expanded="false">チャット<span class="cbadge" id="chatbadge" hidden></span></button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* 衛星ぶんどり：部屋主が衛星とCPUの動きを計算して配る。自分の惑星は各自の画面で動かし、位置だけを部屋主に送る
   （自分の惑星は待ち時間なしで動く）。衛星は、いちばん強く引っぱる惑星のものになる */
const PREFIX='eisei-room-';
const VER=5;
const MAXP=10,MAXPL=12; // 人は10人まで、CPUを入れて惑星は12個まで

function addSat(o,x,y){const a=Math.random()*Math.PI*2,lane=H.sats.filter(s=>s.o===o).length%3;H.sats.push({x:x+Math.cos(a)*40,y:y+Math.sin(a)*40,vx:0,vy:0,o,lane,dir:H.pl[o]&&H.pl[o].u==='retro'?-1:Math.random()<.5?1:-1,cool:0,v:1});}

// 惑星1つぶんの動き（自分の惑星・CPU・部屋主の惑星で同じ式を使う）

function stepPlanet(p,dt,thrust,tx,ty,W,others,mult){

// CPUの考え：近くの野良衛星や、自分より軽い惑星の衛星をねらう。重い惑星からは逃げる
function cpuThink(i){
  const p=H.pl[i],m=MASS(p.k);let best=null,bv=0;
  for(const s of H.sats){if(s.o===i)continue;const d=Math.hypot(s.x-p.x,s.y-p.y);
    if(s.o<0){const v=1.2*(s.v||1)/(d+120);if(v>bv){bv=v;best=[s.x,s.y];}}}
  H.pl.forEach((q,j)=>{if(j===i||!q.k)return;const d=Math.hypot(q.x-p.x,q.y-p.y),mq=MASS(q.k);
    if(mq<=m*1.4){const v=q.k*0.5/(d+150);if(v>bv){bv=v;best=[q.x+(p.x-q.x)*RAD(q.k)/Math.max(d,1)*0.2,q.y+(p.y-q.y)*RAD(q.k)/Math.max(d,1)*0.2];}}});

  if(!best)best=[rnd(100,H.W-100),rnd(100,H.W-100)];

// 衝突の罰：ぶつかった両方が衛星を1つずつ落とす（落ちた衛星は野良になって飛んでいく）

  for(const [p,o] of [[a,b],[b,a]]){if((p.hc||0)>0)continue;p.hc=HIT_COOL;const pi=H.pl.indexOf(p);
    if(p.u==='retro'||Math.random()<guardOf(p))continue;if(dropSats(pi,o.u==='retro'?2:1,mx,my))lost=true;}

function endGame(){

// 位置の配信：[x,y,vx,vy,衛星数] と、衛星の [x,y,持ち主]

    case 'cpuSel':if(isHost&&setup&&['auto','0','1','2','3','4','6','8'].includes(m.v))H.cpuSel=m.v;break;
    case 'start':if(isHost&&setup)startGame();break;
    case 'capSel':if(isHost&&setup&&['0','1','2','3','4'].includes(m.v))H.capSel=m.v;break;
    case 'uniqSel':if(isHost&&setup&&['on','off'].includes(m.v))H.uniqSel=m.v;break;
    case 'gd':{const P=H.players.find(p=>p.id===pid);if(P)P.gd=gpClean(m.v);break;}
    case 'skill':{if(H.phase!=='play')return;const i=H.pl.findIndex(x=>x.id===pid);if(i>=0)useSkill(i,+m.a);return;}
    case 'lobby':if(isHost&&H.phase==='end'){H.phase='lobby';absorb();H.players=H.players.filter(p=>p.online);H.pl=[];H.sats=[];}break;

function trailsG(P,now){

  return `<div class="colbox"><canvas id="mygd" width="240" height="240" aria-label="あなたの惑星" ${g?'':'hidden'}></canvas><div class="colctl"><div class="f">あなたの惑星</div>
    ${g?`<div>${rbadge(g)} <b>${esc(g.nm)}</b></div><div class="sub">${g.sk?`特技：${esc(SKILLS[g.sk][0])}${SKILLS[g.sk][2]?`（${SKILLS[g.sk][2]}回）`:''}`:'特技なし'}${g.u?` ・ ${esc(UNIQ[g.u][0])}`:''}</div>`:'<div class="sub">まだ惑星を持っていません</div>'}
    ${g&&!ok?`<div class="err">この部屋は${RAR[cap][0]}まで${uq?'':'・ユニークなし'}なので使えません。ほかを選ばないと、レンタルの惑星で出ます</div>`:''}${!g?'<div class="sub">このままだと、レンタルの惑星で出ます</div>':''}
    <button class="btn" data-act="gopen">ガチャ・惑星を選ぶ（券 ${GS.t}枚）</button></div></div>${g?statPanel(g):''}`;}

const nameOf=id=>{const p=V&&V.players.find(x=>x.id===id);return p?p.name:'（退出）';};
const isPlayer=()=>!!(V&&MYID&&V.players.some(p=>p.id===MYID));
const amHost=()=>NET.role==='host';
function topinfo(){const el=$('#topinfo');if(!V){el.innerHTML='';return;}
  el.innerHTML=`${NET.code?`<span class="chip">部屋 <b>${esc(NET.code)}</b></span>`:'<span class="chip">ひとりで</span>'}<button class="btn small" data-act="leave">${NET.solo?'もどる':'退出'}</button>`;}
function vHome(){
  const qs=new URLSearchParams(location.search);if(!D.code&&qs.get('room'))D.code=qs.get('room').toUpperCase();
  if(!HM&&!D.code)return `<div class="doors">
    <button type="button" class="door dn" data-act="hm" data-v="normal"><canvas id="dpn" width="220" height="220" aria-hidden="true"></canvas><b>衛星ぶんどり</b><span>みんな同じ惑星で、引力で衛星を奪い合う</span></button>
    <button type="button" class="door dg" data-act="hm" data-v="gacha"><canvas id="dpg" width="220" height="220" aria-hidden="true"></canvas><b>ガチャぶんどり</b><span>ガチャで引いた惑星で戦う。レア度・特技・ユニークで、強さに差があります</span><em>ガチャ券 ${GS.t}枚 ・ もちもの ${GS.dice.length}個</em></button>
  </div>`;
  const g=HM==='gacha';
  return `${D.code&&!HM?'':`<div class="row" style="margin-bottom:10px"><button class="btn small" data-act="hmback">入り口にもどる</button><span class="sub">${g?'ガチャぶんどり':'衛星ぶんどり'}</span></div>`}<div class="card stack">
    <div><label class="f" for="name">あなたの名前</label><input type="text" id="name" maxlength="12" placeholder="例：たろう" value="${esc(NAME)}" autocomplete="nickname"></div>
    <button class="btn primary wide" data-act="create">部屋を作る</button>
    <div><label class="f" for="code">部屋のコードで参加</label>
      <div class="row"><input type="text" id="code" maxlength="8" placeholder="ABCD" value="${esc(D.code)}" autocomplete="off" style="flex:1;min-width:120px;text-transform:uppercase;letter-spacing:.15em">
      <button class="btn primary" data-act="join">参加する</button><button class="btn" data-act="watch">観戦</button></div></div>
    <button class="btn wide" data-act="solo">ひとりで遊ぶ（CPUと対戦）</button>
    ${g?`<button class="btn wide" data-act="gopen">ガチャ・もちもの（ガチャ券 ${GS.t}枚）</button>`:''}
    ${NET.status?`<div class="${/でき|ません|切れ|見つかり|エラー|入れて|古い/.test(NET.status)?'err':'note'}">${esc(NET.status)}</div>`:''}
    ${NET.needReload?'<button class="btn primary wide" data-act="reload">再読み込みする</button>':''}
  </div>
  <div class="card"><details class="rules" open><summary>あそびかた</summary><ol>
    <li>あなたは惑星です。画面を押している（クリックしている）間、その方向へ進みます。PCは矢印キーやWASDでも動けます。</li>
    <li>惑星のまわりを回っているのが衛星。<b>ほかの惑星に近づくと、引力の強いほうへ衛星が乗りかえます。</b>漂っている野良の衛星も、近づけば拾えます。</li>
    <li>衛星が多いほど惑星は大きく重くなって、奪われにくくなります。そのかわり慣性も大きくなり、動き出しも止まるのもゆっくりになります。</li>
    <li><b>惑星どうしがぶつかると、両方とも衛星を1つ落とします。</b>体当たりは損なので気をつけて。</li>
    <li>衛星1つで1点。場に3つだけある<b>金の星の衛星は1つで3点</b>です。</li>
    <li>制限時間が終わったとき、点数がいちばん高い人の勝ち。</li>
    ${g?'<li><b>ガチャぶんどり</b>：ガチャで引いた惑星で戦います。レア度が高いほど引力や速さが高く、<b>特技</b>（画面右下のボタン・右クリック・スペースキーで使う。向きは指している方）がつくことも。部屋主はレア度の上限を決められます。ガチャ券は試合に参加するともらえて、ガチャはじきと共通です。</li>':''}
  </ol></details></div>`;
}
function settingsHTML(host){
  const dis=host?'':'disabled';const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="grid2">
    <div><label class="f" for="timeSel">制限時間</label><select id="timeSel" ${dis}>${opt([['60','1分'],['90','1分30秒'],['120','2分'],['180','3分'],['300','5分']],V.timeSel)}</select></div>
    <div><label class="f" for="cpuSel">CPUの惑星</label><select id="cpuSel" ${dis}>${opt([['auto','おまかせ'],['0','なし'],['1','1つ'],['2','2つ'],['3','3つ'],['4','4つ'],['6','6つ'],['8','8つ']],V.cpuSel)}</select></div>
    ${V.modeSel==='gacha'?`<div><label class="f" for="capSel">出せるレア度</label><select id="capSel" ${dis}>${opt(RAR.map((r,k)=>[String(k),k===4?'ぜんぶ（URまで）':r[0]+'まで']),V.capSel)}</select></div>
    <div><label class="f" for="uniqSel">ユニーク</label><select id="uniqSel" ${dis}>${opt([['on','出してよい'],['off','出せない']],V.uniqSel)}</select></div>`:''}</div>`;
}
const plColor=id=>{const i=V.pl.findIndex(p=>p.id===id);return i>=0?COLORS[V.pl[i].col%COLORS.length]:'var(--ok)';};
function vLobby(){
  const host=amHost(),n=V.players.length;
  return `${NET.solo?'':`<div class="card center"><div class="sub">部屋のコード</div><div class="code">${esc(NET.code)}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" data-act="copycode">コードをコピー</button><button class="btn small" data-act="copylink">参加リンクをコピー</button></div></div>`}
  <div class="card stack"><h2>${NET.solo?'ひとりで遊ぶ':`参加者 ${n}人${V.specs?`<span class="sub"> ・ 観戦 ${V.specs}人</span>`:''}`}</h2>
    ${!isPlayer()&&!NET.solo?`<div class="note">${NET.want!=='play'?'観戦中です。':n>=MAXP?`満員（${MAXP}人）のため観戦しています。`:'ゲーム中に入ったので観戦しています。次のゲームから参加できます。'}</div>`:''}
    ${NET.solo?'':`<ul class="plist">${V.players.map(p=>`<li class="${p.id===MYID?'me':''} ${p.online?'':'off'}"><span class="dot" style="background:var(--ok)"></span>${esc(p.name)}${p.id===MYID?'<span class="sub">（あなた）</span>':''}${p.id===V.hostId?'<span class="sub">部屋主</span>':''}${V.wins[p.id]?`<span class="sub">${V.wins[p.id]}勝</span>`:''}</li>`).join('')}</ul>`}
    ${V.modeSel==='gacha'&&(isPlayer()||NET.solo)?myGdHTML():''}
    ${settingsHTML(host)}
    ${host?`<button class="btn primary wide" data-act="start">${NET.solo?'はじめる':'ゲームを始める'}</button>${!NET.solo?'<div class="note">部屋主の画面で計算しています。部屋主はゲーム中、このタブを開いたままにしてください。</div>':''}`:'<div class="wait"><span class="dots">部屋主が始めるのを待っています</span></div>'}
  </div>`;
}
function vEnd(){
  const r=V.result||[],me=V.myIdx,top=r.filter(x=>x.rank===1);
  const meRow=r.find(x=>x.i===me);
  return `<div class="card"><div class="win">${top.map(x=>`<span class="sw" style="background:${COLORS[x.col%COLORS.length]};--e:${EDGE[x.col%EDGE.length]}"></span>${esc(x.name)}`).join('・')} の勝ち！</div>
    ${meRow?`<div class="center sub" style="margin-top:4px">あなたは ${meRow.rank}位（${meRow.pts}点）</div>`:''}</div>
  <div class="card"><h2>結果</h2><table class="t"><tbody>${r.map(x=>`<tr class="${x.i===me?'me':''}"><td class="rk">${x.rank}位</td><td><span class="sw" style="background:${COLORS[x.col%COLORS.length]};--e:${EDGE[x.col%EDGE.length]}"></span>${esc(x.name)}</td><td class="sub">衛星${x.k}個${x.g?`（金${x.g}）`:''}</td><td class="num">${x.pts}点</td></tr>`).join('')}</tbody></table></div>
  ${NET.solo?'':`<div class="card"><h2>通算の勝ち数（${V.games}ゲーム）</h2><table class="t"><tbody>${V.players.filter(p=>V.wins[p.id]).sort((a,b)=>V.wins[b.id]-V.wins[a.id]).map(p=>`<tr class="${p.id===MYID?'me':''}"><td>${esc(p.name)}</td><td class="num">${V.wins[p.id]}勝</td></tr>`).join('')||'<tr><td class="sub">まだありません</td></tr>'}</tbody></table></div>`}
  ${r.some(x=>V.pl[x.i]&&V.pl[x.i].g)?`<div class="card stack"><h2>みんなの惑星</h2>${r.map(x=>{const g=V.pl[x.i]&&V.pl[x.i].g;if(!g)return '';
    return `<details class="gdd"><summary><canvas class="gdc" data-id="${esc(g.id)}" width="88" height="88" aria-hidden="true"></canvas><span class="gdn"><span>${esc(x.name)}</span><span>${rbadge(g)} ${esc(g.nm)}</span></span></summary>${statPanel(g)}</details>`;}).join('')}<div class="sub">押すと能力が見られます</div></div>`:''}
  ${V.modeSel==='gacha'&&isPlayer()?`<div class="card stack"><h2>次の試合の惑星</h2>${myGdHTML()}</div>`:''}
  <div class="card stack">${amHost()?`${settingsHTML(true)}<button class="btn primary wide" data-act="start">もう一度</button>${NET.solo?'':'<button class="btn wide" data-act="lobby">待合室に戻る</button>'}`:'<div class="wait"><span class="dots">部屋主が次のゲームを始めるのを待っています</span></div>'}</div>`;
}
let LASTKEY='';
function render(){
  topinfo();renderChat();
  {const gm=GV.open||(V?V.modeSel==='gacha':HM==='gacha'),lg=gm?'<span class="ga">ガチャ</span>ぶんどり':'<span class="pa">衛星</span>ぶんどり',h=document.querySelector('.logo h1');if(h.innerHTML!==lg)h.innerHTML=lg;document.title=gm?'ガチャぶんどり':'衛星ぶんどり';}
  const playing=!!(V&&(V.phase==='count'||V.phase==='play'));
  $('#game').hidden=!playing;$('#wrap').hidden=playing;document.body.classList.toggle('playing',playing);
  if(V&&V.phase==='count'){VIEWAT=performance.now();$('#hint').hidden=false;HUDK='';}
  if(playing){LASTKEY='';return;}
  let html,key;
  if(GV.open){html=vGacha();key='gv:'+GV.k;}
  else if(!V){html=vHome();key='home:'+NET.status+(NET.needReload?'r':'')+GS.t+HM;}
  else{key=JSON.stringify([V.phase,V.players,V.timeSel,V.cpuSel,V.specs,V.games,MYID,NET.status,V.modeSel,V.capSel,V.uniqSel,GV.k]);
    const err=NET.status?`<div class="card err">${esc(NET.status)}${NET.lost?' <button class="btn small" data-act="rejoin">もう一度参加する</button>':''}</div>`:'';
    html=err+(V.phase==='lobby'?vLobby():vEnd());}
  if(key===LASTKEY)return;
  const ae=document.activeElement,aid=ae&&ae.id;
  $('#app').innerHTML=html;LASTKEY=key;paintGD();
  if(aid){const n=document.getElementById(aid);if(n&&n.focus&&n.tagName==='INPUT')n.focus();}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},1800);}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('コピーしてください',text));else prompt('コピーしてください',text);}
function saveName(){const n=$('#name');if(n){NAME=clean(n.value,12);store.set('eisei-name',NAME);}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='create'){saveName();createRoom();}
  else if(a==='solo'){saveName();soloRoom();}
  else if(a==='join'||a==='watch'){saveName();D.code=($('#code')||{}).value||'';joinRoom(D.code,a==='watch'?'watch':'play');}
  else if(a==='reload'){try{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString(36));location.replace(u.toString());}catch(e){location.reload();}}
  else if(a==='rejoin'){const c=NET.code,w=NET.want;NET.lost=false;joinRoom(c,w);}
  else if(a==='leave'){if(NET.solo||confirm('部屋を出ますか？'+(amHost()?'（部屋主が出ると、この部屋は終わります）':'')))leave();}
  else if(a==='copycode')copy(NET.code,'コードをコピーしました');
  else if(a==='copylink')copy(roomLink(),'参加リンクをコピーしました');
  else if(a==='start')send({t:'start'});
  else if(a==='lobby')send({t:'lobby'});
  else if(a==='skill')useSk();
  else if(a==='hm'){HM=b.dataset.v;NET.status='';render();scrollTo(0,0);}
  else if(a==='hmback'){HM=null;D.code='';NET.status='';try{const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u.toString());}catch(e){}render();}
  else if(a==='gopen'){saveName();loadTK();GV.open=true;GV.res=null;GV.det=null;gvBump();scrollTo(0,0);}
  else if(a==='gclose'){GV.open=false;GV.res=null;GV.det=null;GV.multi=false;gvBump();scrollTo(0,0);}
  else if(a==='pull1'||a==='pull10')doPull(a==='pull1'?1:10);
  else if(a==='gdet'){GV.det=b.dataset.id;gvBump();const d=$('.gdet');if(d)d.scrollIntoView({block:'center',behavior:'smooth'});}
  else if(a==='gdetx'){GV.det=null;gvBump();}
  else if(a==='guse')setSel(b.dataset.id);
  else if(a==='gdrop'){const id=b.dataset.id;if(id===GS.sel)return;const g=GS.dice.find(d=>d.id===id);if(g&&confirm(`この惑星を分解しますか？（かけら ${kakeOf(g)}。もどせません）`))scrap([id]);}
  else if(a==='gmulti'){GV.multi=true;GV.pick=new Set();GV.det=null;gvBump();}
  else if(a==='gmultix'){GV.multi=false;GV.pick=new Set();gvBump();}
  else if(a==='gpick'){const id=b.dataset.id;if(id===GS.sel)return;GV.pick.has(id)?GV.pick.delete(id):GV.pick.add(id);gvBump();}
  else if(a==='gpickr'){const r=+b.dataset.r,L=GS.dice.filter(d=>d.r===r&&d.id!==GS.sel),all=L.every(d=>GV.pick.has(d.id));L.forEach(d=>all?GV.pick.delete(d.id):GV.pick.add(d.id));gvBump();}
  else if(a==='gpickc'){GV.pick=new Set();gvBump();}
  else if(a==='gscrap'){const ids=[...GV.pick];if(!ids.length)return;const hi=GS.dice.filter(d=>GV.pick.has(d.id)&&(d.r>=3||d.u)).length;if(confirm(`${ids.length}個を分解しますか？${hi?`（SSR以上・ユニークが ${hi}個 ふくまれています）`:''}もどせません`))scrap(ids);}
});
document.getElementById('chattab').addEventListener('click',toggleChat);
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatinput');if(sendChat(i.value))i.value='';});
document.addEventListener('input',e=>{if(e.target.id==='code')D.code=e.target.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='name'){saveName();return;}if(t.id==='gsort'){GS.sort=t.value;saveGS();gvBump();return;}
  if(!amHost())return;if(['timeSel','cpuSel','capSel','uniqSel'].includes(t.id))send({t:t.id,v:t.value});});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='code'){e.preventDefault();saveName();D.code=e.target.value;joinRoom(D.code,'play');}
});
(function(){let j=null;try{j=sessionStorage.getItem('eisei-joined');}catch(e){}
  const room=new URLSearchParams(location.search).get('room');
  if(j&&room&&j.split(':')[0]===room.toUpperCase()){const w=j.split(':')[1]==='watch'?'watch':'play';setTimeout(()=>joinRoom(room,w),0);}})();
window.addEventListener('beforeunload',e=>{if(amHost()&&!NET.solo&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
</html>
