<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>まねっこリズム</title>
<meta name="description" content="1小節のリズムを送り合って、相手のまねをする1対1のゲーム（試作）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 夜のステージ。自分はシアン、相手はピンク */
:root{--bg:#120f1f;--panel:#1c1830;--ink:#f3f0ff;--muted:#a59fc4;--me:#39e6ff;--op:#ff6bb5;--ok:#7cf29a;--ng:#ff6b6b;--rule:rgba(255,255,255,.12);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.ttl{font-weight:800;letter-spacing:.06em;margin-right:auto}
.ttl small{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
.btn{border:1.5px solid var(--rule);background:rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;min-height:34px;font-size:13px}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#pad{--pg:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--bg) 84%,var(--me) 16%),color-mix(in srgb,var(--bg) 90%,var(--padk) 10%));--ph:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--bg) 55%,var(--me) 45%),var(--bg));flex:none;height:min(34vh,240px);margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:22px;border:2px solid var(--padr);background:var(--pg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;font-weight:800;color:var(--padm);touch-action:none;cursor:pointer;transition:background .05s}
#pad small{font-size:12px;font-weight:500;margin-top:4px}
#pad.four{flex-direction:row;gap:6px;padding:6px;background:none;border:0}
#pad .k{flex:1;height:100%;border-radius:16px;border:2px solid var(--padr);background:var(--pg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:var(--padm)}
#pad.four.mine .k{border-color:var(--me);color:var(--padi)}#pad .k.hit{background:var(--ph)}
#pad.hit{background:var(--ph)}
#pad.mine{border-color:var(--me);color:var(--padi)}
.ov{position:fixed;inset:0;background:rgba(5,4,12,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.ov[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
.box h1{margin:0 0 4px;font-size:24px}.box h2{margin:0 0 8px}.box p,.box li{font-size:14px;line-height:1.7;color:#ddd8f5}
.sub{color:var(--muted);font-size:12px;margin:10px 0 4px}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:42px;border-radius:10px;border:1.5px solid var(--rule);background:rgba(255,255,255,.05);font-weight:800;cursor:pointer}
.seg button.on{border-color:var(--me);color:var(--me)}
.go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--me);color:#06222a;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}
.go:disabled{opacity:.4}
.ghost{width:100%;min-height:42px;margin-top:8px;border-radius:12px;border:1.5px solid var(--rule);background:transparent;font-weight:700;cursor:pointer}
.mode{display:flex;flex-direction:column;gap:8px;margin-top:10px}.mode button{text-align:left;border:1.5px solid var(--rule);background:rgba(255,255,255,.05);border-radius:14px;padding:12px;cursor:pointer}
.mode b{display:block;font-size:16px}.mode span{font-size:12px;color:var(--muted)}
.box input[type=text]{width:100%;border:1.5px solid var(--rule);background:#0e0b1a;color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--rule);vertical-align:-2px;margin-right:2px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}.crow input{width:56px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.code{font-size:32px;font-weight:800;letter-spacing:.2em;text-align:center;color:var(--me)}
.err{color:var(--ng);font-size:13px}
.big{font-size:40px;font-weight:800;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="bar"><div class="ttl">まねっこリズム<small>試作 v11</small></div><button class="btn" data-act="calib">タイミング調整</button><button class="btn" data-act="help">？</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="pad">タップ<small>スペースキー・どのキーでも</small></div>
</div>
<div class="ov" id="ov"><div class="box" id="ovbox"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* まねっこリズム
   ・メトロノームに合わせて、1小節ずつ交互に進む。最初は A が「つくる」
   ・次の小節で B がそれを「まねる」。続けて B が「つくる」、A が「まねる」…をくり返す
   ・つくるときは、たたいた位置を 8分（こまかい設定なら16分）の格子にそろえる。まねるときは、同じ位置を ±判定幅 でたたけたら成功
   ・まねに失敗（たりない・よけい・ずれ）したらライフが1減る。つくった小節が空でも1減る。0になった方の負け
   ・4小節（ふたりが1回ずつまねる）ごとにテンポが上がる
   ・通信は各端末が自分の時計で進め、部屋主の時計との差をはかって小節の頭をそろえる。判定は自分の端末で行う */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let NAME=store.get('manekko-name')||store.get('mawasu-name')||'';
const OPT=Object.assign({hold:true,speed:1,blen:'grow',cBg:'#120f1f',cMe:'#39e6ff',cOp:'#ff6bb5',accel:true,keys:1,bpm:90,grid:8,lives:3,win:'mid',hint:true,lv:'mid'},JSON.parse(store.get('manekko-opt')||'{}'));
if(OPT.two===false&&!JSON.parse(store.get('manekko-opt')||'{}').blen)OPT.blen='one';delete OPT.two;
const saveOpt=()=>store.set('manekko-opt',JSON.stringify(OPT));
// 色：背景・自分の音・相手の音（自分で選べる）。背景が明るいときは線や字を暗くする
const DEFC={cBg:'#120f1f',cMe:'#39e6ff',cOp:'#ff6bb5'};
const hexRgb=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||'');const n=m?parseInt(m[1],16):0;return [(n>>16)&255,(n>>8)&255,n&255];};
const C={};function applyColors(){C.bg=OPT.cBg;C.me=OPT.cMe;C.op=OPT.cOp;C.meR=hexRgb(C.me).join(',');C.opR=hexRgb(C.op).join(',');
  const [r,g,b]=hexRgb(C.bg),lum=(.299*r+.587*g+.114*b)/255;C.light=lum>.55;C.fg=C.light?'30,26,50':'255,255,255';C.ink=C.light?'#1e1a32':'#f3f0ff';C.mut=C.light?'#5d577a':'#a59fc4';
  const st=document.documentElement.style;st.setProperty('--bg',C.bg);st.setProperty('--me',C.me);st.setProperty('--op',C.op);st.setProperty('--padi',C.ink);st.setProperty('--padm',C.mut);st.setProperty('--padk',C.light?'#ffffff':'#000000');st.setProperty('--padr',`rgba(${C.fg},.14)`);}
applyColors();
let CALIB=+store.get('manekko-calib')||0; // たたく遅れ（ミリ秒）。たたいた時刻からひく
const WIN={easy:140,mid:100,hard:70},WINN={easy:'ゆるい',mid:'ふつう',hard:'きびしい'};
const LV={easy:{name:'弱め',miss:.18,dens:.3},mid:{name:'ふつう',miss:.09,dens:.45},hard:{name:'つよめ',miss:.03,dens:.6}};

/* ---------- 音（WebAudio で合成） ---------- */
let AC=null,MG=null,A0=0,P0=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.8;MG.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();if(AC){A0=AC.currentTime;P0=performance.now();}return AC;}
const atA=pt=>AC?Math.max(AC.currentTime,A0+(pt-P0)/1000):0; // 画面の時刻 → 音の時刻
function tone(f,d,o={}){if(!AC)return;const {type='sine',vol=.2,at=AC.currentTime,slide=0}=o,os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,at);if(slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),at+d);
  g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);os.connect(g).connect(MG);os.start(at);os.stop(at+d+.02);}
function noise(d,o={}){if(!AC)return;const {vol=.15,at=AC.currentTime,f=3000,type='highpass'}=o,n=Math.ceil(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);s.connect(fl).connect(g).connect(MG);s.start(at);s.stop(at+d+.02);}
const SND={click:(at,acc)=>tone(acc?1760:1180,.05,{vol:acc?.12:.07,at}),
  me:(at,l)=>{tone([220,262,330,415][l|0],.14,{vol:.35,slide:.45,at});noise(.04,{vol:.08,at,f:2500});},           // 自分：ポン
  op:(at,l)=>{noise(.09,{vol:.22,at,f:[1300,1800,2500,3400][l|0],type:'bandpass'});tone([440,520,660,830][l|0],.07,{vol:.12,at,type:'triangle'});}, // 相手：パッ
  ok:()=>[880,1320].forEach((f,i)=>tone(f,.12,{vol:.1,at:AC.currentTime+i*.07,type:'triangle'})),
  ng:()=>tone(160,.35,{vol:.25,type:'sawtooth',slide:.6}),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,{vol:.12,at:AC.currentTime+i*.12,type:'triangle'})),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,.4,{vol:.12,at:AC.currentTime+i*.18,type:'triangle'}))};
const snd=(k,...a)=>{if(AC)try{SND[k](...a);}catch(e){}};

/* ---------- 時間の決まり ---------- */
// 小節 0 は数え（4拍）。そのあとは「区切り」ごとに進む。区切り＝つくる・まねるの1回ぶんで、ふつうは1小節。
// 最初は A がつくる。そこから「B まねる→B つくる→A まねる→A つくる」をくり返す。長引いたら（設定）つくる・まねるが2小節になる
const TWO_AT=24; // 「長引いたら」：この番号の区切り（A がつくる）から2小節。ふたりが6回ずつつくったあと
const bpmOf=k=>G.flat?G.bpm:Math.min(200,G.bpm+8*Math.floor(Math.max(0,k-2)/4)); // 「ずっと同じ」なら上がらない
let G=null; // {S, bpm, grid, starts[], segs[], segOfBar[], me, names, lives[2], pats:{区切り:Set}, mine:{区切り:[...]}, res, done, over, mode:'com'|'net', winner}
function buildTimes(){G.starts=[G.S];for(let k=0;k<600;k++)G.starts.push(G.starts[k]+4*60000/bpmOf(k));
  G.segs=[];G.segOfBar=[null];let bar=1,i=0;
    // つくる（A）→ ふたりでまねる → つくる（B）→ ふたりでまねる…。まねる区切りの p は 2（ふたり）
  while(bar<590){const t=i%2===0?'make':'copy',p=t==='make'?(i/2+(G.firstP||0))%2:2;
    const len=t==='copy'?G.segs[i-1].len:(G.blen==='two'||(G.blen==='grow'&&i>=TWO_AT)?2:1),sg={i,p,t,len,first:bar};G.segs.push(sg);for(let b=0;b<len;b++)G.segOfBar[bar+b]=sg;bar+=len;i++;}}
const barStart=k=>G.starts[k],slotDur=k=>4*60000/bpmOf(k)/G.grid;
const barAt=t=>{let k=0;while(k<599&&G.starts[k+1]<=t)k++;return k;};
const winMs=k=>Math.min(WIN[G.win],slotDur(k)*.45);
const roleOf=k=>G.segOfBar[k]||null;
const isMine=sg=>!!sg&&(sg.p===G.me||sg.p===2); // 自分がたたく区切りか
// ホールドのはなす判定はゆるめ：終わりの少し前（判定幅の2倍か、格子1つの3/4）までに離せばよい
const holdTol=k=>Math.max(winMs(k)*2,slotDur(k)*.75);          // 小節 k が入っている区切り
const segEnd=sg=>barStart(sg.first+sg.len);
const ssBar=(sg,ss)=>sg.first+Math.floor(ss/G.grid); // 区切りの中の位置 ss がある小節
const tAt=(sg,ss)=>{const b=ssBar(sg,ss);return barStart(b)+(ss%G.grid)*slotDur(b);};
// たたいた時刻を、いちばん近い格子の位置へ
function quant(t){let k=barAt(t+slotDur(barAt(t))/2);if(t<barStart(k)-slotDur(k)/2)k=Math.max(0,k-1);let slot=Math.round((t-barStart(k))/slotDur(k));if(slot>=G.grid){k++;slot=0;}if(slot<0)slot=0;return {k,slot,dt:t-(barStart(k)+slot*slotDur(k))};}

/* ---------- 対局 ---------- */
// 音の印：鍵盤 l の ss 番目 → l*64+ss（1鍵盤なら ss そのまま）
const SL=id=>id%64,LN=id=>Math.floor(id/64),NID=(ss,l)=>(l|0)*64+ss;
function startMatch(o){G=Object.assign({holds:{},pats:{},mine:{},res:{},done:{},opTaps:{},live:{},over:false,sched:-1,fx:[],lastNote:{},judges:[],hits:[]},o,{lives:[o.lives,o.lives]});buildTimes();ac();$('#ov').hidden=true;}
// まねる最中のひと打ちごとの判定（表示用。勝ち負けは区切りの終わりにまとめて決める）
const GRADE=[[.35,'GREAT','#ffe066'],[1,'GOOD','#7cf29a']];
// ホールド：つくるときに長く押すと、その長さ（格子の数）が holds に入る。まねるときは離すのが早すぎるとミス
const HOLD_MS=k=>Math.max(260,slotDur(k)*.9);
const holdsOf=i=>G.holds[i]||(G.holds[i]={});
const DOWN={}; // 押している鍵盤 → {q, sg, t, osc}
function humStart(l){if(!AC)return null;const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=[220,262,330,415][l|0]*2;g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(.05,AC.currentTime+.12);o.connect(g).connect(MG);o.start();return {o,g};}
function humStop(h){if(!h||!AC)return;try{h.g.gain.cancelScheduledValues(AC.currentTime);h.g.gain.setTargetAtTime(0,AC.currentTime,.03);h.o.stop(AC.currentTime+.15);}catch(e){}}
function humAt(at,dur,l){if(!AC)return;tone([220,262,330,415][l|0]*2,dur/1000,{type:'triangle',vol:.05,at});}
function release(t,lane){lane=lane|0;const d=DOWN[lane];delete DOWN[lane];if(!d)return;humStop(d.hum);if(!G||G.over)return;t-=CALIB;const q=d.q;q.up=t;const sg=d.sg;if(!sg)return;
  if(sg.t==='make'&&G.hold&&t-d.t>=HOLD_MS(q.k)){const max=G.grid*sg.len-q.ss;let len=Math.min(max,Math.max(1,Math.round((t-d.t)/slotDur(q.k))));
    // 同じ列の次の音とは重ならないように
    const nx=[...(G.pats[sg.i]||[])].filter(x=>LN(x)===lane&&SL(x)>q.ss).map(SL);if(nx.length)len=Math.min(len,Math.min(...nx)-q.ss);
    if(len>=1){const id=NID(q.ss,lane);holdsOf(sg.i)[id]=len;if(G.mode==='net')netSend({t:'hold',i:sg.i,id,len});}}
  if(sg.t==='copy'){const id=NID(q.ss,lane),L=(G.holds[sg.i-1]||{})[id];if(L&&(G.live[sg.i]||{hit:new Set()}).hit.has(id)){const end=tAt(sg,q.ss+L);if(t<end-holdTol(q.k))judgeMark(lane,'はなすのが早い','#ff6b6b');else judgeMark(lane,'HOLD OK','#7cf29a');}}}
const LC={'#7cf29a':'#1f9d4a','#ffe066':'#c98a00'},lc=c=>C.light&&LC[c]||c; // 明るい背景では字を濃く
function judgeMark(l,txt,c){G.judges.push({t:performance.now(),l,txt,c});}
function tap(t,lane){lane=lane|0;if(!G||G.over)return;t-=CALIB;const q=quant(t);q.lane=lane;G.hits.push({t:performance.now(),l:lane,me:1});snd('me',undefined,lane);padFlash(lane);
  const sg=roleOf(q.k);DOWN[lane]={q,sg:isMine(sg)?sg:null,t,hum:G.hold?humStart(lane):null};if(!isMine(sg))return;q.ss=(q.k-sg.first)*G.grid+q.slot;(G.mine[sg.i]=G.mine[sg.i]||[]).push(q);
  if(sg.t==='make'){const id=NID(q.ss,lane);(G.pats[sg.i]=G.pats[sg.i]||new Set()).add(id);if(G.mode==='net')netSend({t:'tap',i:sg.i,id});return;}
  if(G.mode==='net')netSend({t:'ctap',i:sg.i,ss:q.ss,lane});
  const id=NID(q.ss,lane),lv=(G.live[sg.i]=G.live[sg.i]||{hit:new Set(),gone:new Set()}),w=winMs(q.k);
  if((G.pats[sg.i-1]||new Set()).has(id)&&!lv.hit.has(id)&&Math.abs(q.dt)<=w){lv.hit.add(id);const g=GRADE.find(([r])=>Math.abs(q.dt)<=w*r);judgeMark(lane,g[1],g[2]);}
  else judgeMark(lane,'MISS','#ff6b6b');}
// 区切りが終わったら（少し待って）まとめて判定する
function finalize(i){if(G.done[i]||G.over)return;G.done[i]=true;const sg=G.segs[i];
  if(sg.t==='make'){
    if(sg.p===G.me){const pat=[...(G.pats[i]||[])].sort((a,b)=>a-b);if(G.mode==='net')netSend({t:'pat',i,slots:pat,holds:G.holds[i]||{}});const res={k:i,p:G.me,type:'make',miss:pat.length===0};applyRes(res);if(G.mode==='net')netSend({t:'res',r:res});}
    else if(G.mode==='com'){const res={k:i,p:sg.p,type:'make',miss:!(G.pats[i]&&G.pats[i].size)};applyRes(res);}
    return;}
  // まねる：ふたりとも判定する
  const res=judge(i);applyRes(res);if(G.mode==='net')netSend({t:'res',r:res});
  if(G.mode==='com')applyRes(G.comRes[i]||{k:i,p:1-G.me,type:'copy',miss:false});
  if(G.tut){G.over=true;setTimeout(tutDone,700);}}
// まね：お手本の位置ごとに、判定幅の中でたたけたか。よけいなタップもミス
function judge(i){const want=[...(G.pats[i-1]||[])],taps=G.mine[i]||[],used=new Set(),hit=[],missed=[],extra=[];
  const H=G.holds[i-1]||{},sg=G.segs[i];
  want.forEach(s=>{const j=taps.findIndex((q,x)=>!used.has(x)&&q.ss===SL(s)&&(q.lane|0)===LN(s)&&Math.abs(q.dt)<=winMs(q.k));if(j<0){missed.push(s);return;}used.add(j);const q=taps[j];
    if(H[s]&&q.up!=null&&q.up<tAt(sg,SL(s)+H[s])-holdTol(q.k)){missed.push(s);return;}hit.push(s);}); // ホールドは、はなすのが早すぎたらミス
  taps.forEach((q,x)=>{if(!used.has(x))extra.push(NID(q.ss,q.lane));});
  return {k:i,p:G.me,type:'copy',miss:missed.length+extra.length>0,hit,missed,extra};}
// 結果は「区切り:だれ」ごと。まねる区切りは、ふたりの結果がそろってから勝ち負けを見る（同時に0なら引き分け）
function applyRes(r){const key=r.k+':'+r.p;if(G.res[key])return;G.res[key]=r;
  G.fx.push({k:r.k,t:performance.now(),ok:!r.miss,p:r.p,type:r.type});

    <div style="text-align:center"><div class="sub" style="margin:0">画面のずれ</div><div style="display:flex;gap:6px;align-items:center"><button class="btn" data-act="vadj" data-v="-10">−10</button><b id="visv" style="min-width:5.5em">${VIS()}ミリ秒</b><button class="btn" data-act="vadj" data-v="10">+10</button></div>
    <div class="sub" id="visd" style="margin:2px 0 0;font-size:11px">自動 ${visAuto()} ＋ 手動 ${VADJ>0?'+':''}${VADJ}</div></div></div>
  <div class="sub">たたくずれ（左は早い・右は遅い。緑の中なら成功）</div>
  <canvas id="calmeter" style="width:100%;height:56px;display:block;border-radius:10px;background:#0e0b1a"></canvas>
  <p id="calinfo" style="text-align:center;margin:6px 0">カチッに合わせてたたいてください</p>
  <button id="caltap" style="width:100%;height:110px;border-radius:16px;border:2px solid var(--me);background:radial-gradient(circle,#2a2450,#1a1630);color:var(--ink);font-size:20px;font-weight:800;touch-action:none;cursor:pointer">たたく</button>
  <button class="go" data-act="calsave" id="calsave" disabled>この平均で保存</button><button class="ghost" data-act="calend">${FIRST?'終わって始める':'終わる'}</button>`;}
function startCal(){ac();CAL={t0:performance.now()+500,iv:600,taps:[],sched:-1};showOv(calHTML(),'cal');
  $('#caltap').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();calTap(e.timeStamp);});setTimeout(drawMeter,50);}
function stopCal(){CAL=null;}
function calTap(t){if(!CAL)return;const i=Math.round((t-CAL.t0)/CAL.iv);const d=t-(CAL.t0+i*CAL.iv);snd('me');if(i<0||Math.abs(d)>250)return;CAL.taps.push(d);if(CAL.taps.length>12)CAL.taps.shift();calShow();}
function calAvg(){const d=CAL.taps.slice(-8).sort((a,b)=>a-b);if(d.length<4)return null;const cut=d.slice(1,-1);return Math.round(cut.reduce((a,b)=>a+b,0)/cut.length);}
function calShow(){const last=CAL.taps[CAL.taps.length-1],avg=calAvg(),el=$('#calinfo');if(!el)return;const adj=last-CALIB;
  el.innerHTML=`いま <b style="color:${Math.abs(adj)<=WIN.mid?'var(--ok)':'var(--ng)'}">${adj<0?'早い':'遅い'} ${Math.abs(Math.round(adj))}ミリ秒</b>　${avg!=null?`平均 ${avg-CALIB>0?'+':''}${avg-CALIB}ミリ秒`:`あと${4-Math.min(4,CAL.taps.length)}回`}<br><span style="font-size:12px;color:var(--muted)">いまの補正 ${CALIB>0?'+':''}${CALIB}ミリ秒（これを差し引いたずれを出しています）</span>`;
  $('#calsave').disabled=avg==null;drawMeter();}
function drawMeter(){const c=$('#calmeter');if(!c||!CAL)return;const w=c.clientWidth,h=c.clientHeight,d=window.devicePixelRatio||1;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);
  const R=200,X=v=>w/2+v/R*(w/2-10);x.fillStyle='rgba(124,242,154,.14)';x.fillRect(X(-WIN.mid),0,X(WIN.mid)-X(-WIN.mid),h);x.strokeStyle='#fff';x.globalAlpha=.5;x.beginPath();x.moveTo(w/2,4);x.lineTo(w/2,h-4);x.stroke();x.globalAlpha=1;
  x.fillStyle='#a59fc4';x.font='10px sans-serif';x.textAlign='center';x.fillText('早い',18,h-6);x.fillText('遅い',w-18,h-6);
  CAL.taps.forEach((v,i)=>{const a=(i+1)/CAL.taps.length;x.globalAlpha=a;x.fillStyle='#39e6ff';x.beginPath();x.arc(X(Math.max(-R,Math.min(R,v-CALIB))),h/2,i===CAL.taps.length-1?7:4,0,Math.PI*2);x.fill();});x.globalAlpha=1;}
// 調整中のカチッと光（frame から毎回呼ぶ）
function calFrame(now){if(!CAL)return;const ahead=now+150;for(let i=CAL.sched+1;;i++){const t=CAL.t0+i*CAL.iv;if(t>ahead)break;if(t>=now-30)snd('click',atA(t),i%4===0);CAL.sched=i;}
  const f=$('#calflash');if(f){const ph=(((now-VIS()-CAL.t0)%CAL.iv)+CAL.iv)%CAL.iv;f.style.opacity=String(Math.max(.15,1-ph/150));}}
function calSave(){const a=calAvg();if(a==null)return;CALIB=a;store.set('manekko-calib',CALIB);CAL.taps=[];const el=$('#calinfo');if(el)el.innerHTML=`保存しました（補正 ${CALIB>0?'+':''}${CALIB}ミリ秒）。もう一度たたくと、補正後のずれが出ます`;$('#calsave').disabled=true;drawMeter();}


/* ---------- 通信（1対1。部屋主が A、参加者が B） ---------- */
const PREFIX='manekko-room-',VER=4;
const NET={role:null,peer:null,conn:null,code:null,status:'',opp:'',off:0,rtt:1e9};
function netSend(m){if(NET.conn&&NET.conn.open){try{NET.conn.send(m);}catch(e){}}}
function netLeave(){clearInterval(NET.pingT);try{if(NET.conn)NET.conn.close();}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}Object.assign(NET,{role:null,peer:null,conn:null,code:null,status:'',opp:'',off:0,rtt:1e9});
  try{const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u);}catch(e){}}
function wire(c){NET.conn=c;
  c.on('open',()=>{c.send({t:'hello',name:NAME,ver:VER});if(NET.role==='guest'){const ping=()=>netSend({t:'ping',a:performance.now()});ping();NET.pingT=setInterval(ping,700);}});
  c.on('data',m=>{if(!m||typeof m!=='object')return;
    if(m.t==='hello'){if(m.ver!==VER){NET.status='相手のページと版が違います。両方とも再読み込みしてください';showOv(roomHTML(),'room');return;}NET.opp=String(m.name||'あいて').slice(0,10);showOv(roomHTML(),'room');}
    else if(m.t==='full'){NET.status='その部屋はもう2人そろっています';showOv(netHTML());}
    // 時計あわせ：往復がいちばん短かったときの差を使う
    else if(m.t==='ping')netSend({t:'pong',a:m.a,h:performance.now()});
    else if(m.t==='pong'){const now=performance.now(),rtt=now-m.a;if(rtt<NET.rtt){NET.rtt=rtt;NET.off=m.h-(m.a+now)/2;}}
    else if(m.t==='start'){{const v=OPT.speed;Object.assign(OPT,m.o);OPT.speed=v;OPT.accel=!m.o.flat;}startMatch({mode:'net',S:m.S-NET.off,bpm:m.o.bpm,grid:m.o.grid,win:m.o.win,hint:m.o.hint,lives:m.o.lives,lv0:m.o.lives,keys:m.o.keys||1,flat:!!m.o.flat,blen:m.o.blen||'grow',hold:m.o.hold!==false,me:1,names:[NET.opp,NAME||'あなた']});}
    else if(!G)return;
    else if(m.t==='tap'){const sg=G.segs[+m.i],s2=+m.id;if(!sg)return;(G.pats[sg.i]=G.pats[sg.i]||new Set()).add(s2);const t=tAt(sg,SL(s2));if(G.lastNote[sg.i+'_'+s2]==null){G.lastNote[sg.i+'_'+s2]=1;const at=Math.max(performance.now(),t);G.hits.push({t:at,l:LN(s2),me:0});snd('op',atA(at),LN(s2));}}
    else if(m.t==='pat'){G.pats[+m.i]=new Set(m.slots);if(m.holds)G.holds[+m.i]=m.holds;}
    else if(m.t==='hold'){holdsOf(+m.i)[+m.id]=+m.len;}
    else if(m.t==='res'){applyRes(m.r);}
    else if(m.t==='ctap'){const i=+m.i;(G.opTaps[i]=G.opTaps[i]||[]).push({ss:+m.ss,lane:+m.lane|0,t:performance.now()});}});
  c.on('close',()=>{if(NET.conn===c){NET.status='相手との接続が切れました';if(G)G.over=true;showOv(roomHTML(),'room');}});c.on('error',()=>{});}
// （まねるときの自分のタップは tap の中で相手へ送る）
function createRoom(){if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした';showOv(netHTML());return;}netLeave();
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const peer=new Peer(PREFIX+code);Object.assign(NET,{role:'host',peer,code,status:'部屋を準備しています…'});
  peer.on('open',()=>{NET.status='';try{const u=new URL(location.href);u.searchParams.set('room',code);history.replaceState(null,'',u);}catch(e){}showOv(roomHTML(),'room');});
  peer.on('connection',c=>{if(NET.conn&&NET.conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300);});return;}wire(c);});
  peer.on('error',e=>{NET.status='部屋を作れませんでした（'+((e&&e.type)||'error')+'）';showOv(netHTML());});showOv(roomHTML(),'room');}
function joinRoom(code){code=String(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(code)){NET.status='部屋のコード（4文字）を入れてください';showOv(netHTML());return;}
  if(typeof Peer==='undefined'){NET.status='通信の仕組みを読み込めませんでした';showOv(netHTML());return;}netLeave();
  const peer=new Peer();Object.assign(NET,{role:'guest',peer,code,status:'接続しています…'});showOv(netHTML());
  peer.on('open',()=>wire(peer.connect(PREFIX+code,{reliable:true})));
  peer.on('error',e=>{NET.status=e&&e.type==='peer-unavailable'?'その部屋が見つかりませんでした':'つながりませんでした（'+((e&&e.type)||'error')+'）';showOv(netHTML());});}
function hostStart(){const S=performance.now()+2500,o={bpm:OPT.bpm,grid:OPT.grid,win:OPT.win,hint:OPT.hint,lives:OPT.lives,keys:OPT.keys,flat:!OPT.accel,blen:OPT.blen,hold:OPT.hold};netSend({t:'start',S,o});
  startMatch({mode:'net',S,bpm:o.bpm,grid:o.grid,win:o.win,hint:o.hint,lives:o.lives,lv0:o.lives,keys:o.keys,flat:o.flat,blen:o.blen,hold:o.hold,me:0,names:[NAME||'あなた',NET.opp]});}
function startCom(){NET.role=null;startMatch({mode:'com',S:performance.now()+1500,bpm:OPT.bpm,grid:OPT.grid,win:OPT.win,hint:OPT.hint,lives:OPT.lives,lv0:OPT.lives,keys:OPT.keys,flat:!OPT.accel,blen:OPT.blen,hold:OPT.hold,me:0,lv:OPT.lv,names:[NAME||'あなた','COM']});}

/* ---------- メニュー ---------- */
function showOv(h,k){$('#ovbox').innerHTML=h;$('#ovbox').dataset.k=k||'';$('#ov').hidden=false;}
const seg=(o,list)=>`<div class="seg">${list.map(([v,l])=>`<button class="${OPT[o]===v?'on':''}" data-act="opt" data-o="${o}" data-v="${v}">${l}</button>`).join('')}</div>`;
function optsHTML(){return `<div class="sub">鍵盤</div>${seg('keys',[[1,'1つ'],[2,'2つ'],[3,'3つ'],[4,'4つ']])}<div class="sub">ホールド（長押しの音）</div>${seg('hold',[[true,'あり'],[false,'なし']])}<div class="sub">テンポ</div>${seg('accel',[[true,'だんだん速く'],[false,'ずっと同じ']])}<div class="sub">区切りの長さ</div>${seg('blen',[['one','1小節'],['grow','長引いたら2小節'],['two','はじめから2小節']])}<div class="sub">譜面の速さ（自分の画面だけ）</div><div class="seg"><button data-act="spd" data-v="-1">−</button><button disabled style="flex:2;opacity:1">×${OPT.speed}</button><button data-act="spd" data-v="1">＋</button></div><div class="sub">はじめのテンポ</div>${seg('bpm',[[70,'70'],[90,'90'],[110,'110'],[130,'130']])}
  <div class="sub">こまかさ</div>${seg('grid',[[8,'8分'],[16,'16分']])}
  <div class="sub">判定</div>${seg('win',[['easy','ゆるい'],['mid','ふつう'],['hard','きびしい']])}
  <div class="sub">ライフ</div>${seg('lives',[[1,'1'],[3,'3'],[5,'5']])}
  <div class="sub">まねるときにお手本を表示</div>${seg('hint',[[true,'表示する'],[false,'音だけ']])}`;}
function menuHTML(){return `<h1>まねっこリズム</h1><p style="margin-top:0;color:var(--muted)">1小節のリズムを送り合って、相手のまねをする1対1のゲーム（試作）</p>
  <div class="mode"><button data-act="tut"><b>チュートリアル</b><span>実際に1回ずつあそびながら覚える</span></button><button data-act="net"><b>友だちと対戦</b><span>部屋のコードで1対1</span></button><button data-act="commenu"><b>COMと対戦</b><span>ひとりで練習</span></button><button data-act="calib"><b>タイミング調整</b><span>たたくずれ ${CALIB>0?'+':''}${CALIB}ミリ秒・画面のずれ ${VIS()}ミリ秒</span></button><button data-act="colors"><b>色の設定</b><span><i class="sw" style="background:${OPT.cBg}"></i><i class="sw" style="background:${OPT.cMe}"></i><i class="sw" style="background:${OPT.cOp}"></i></span></button><button data-act="help"><b>あそびかた</b><span></span></button></div>
  <p style="font-size:12px;color:var(--muted)">音を使います。音が出るようにしておいてください。</p>`;}
/* ---------- チュートリアル：実際に1回ずつ回しながら ---------- */
const TUT=[
  {t:'まねる',keys:1,first:1,pat:[0,2,4,6],hc:'まずは聞いて、見ておこう',hp:'線に重なったらたたく！',
   d:`メトロノーム（カチッ）に合わせて、1小節ずつ進みます。<br>まず<b>COMがリズムをつくり</b>ます。聞いて、見ておいてください。<br>次の小節で、<b>ふたりともそのリズムをまねます</b>。上から落ちてくる音が、下の線に重なったときにパッドをたたきます（PCはスペースキーでも）。`},
  {t:'つくる',keys:1,first:0,hm:'すきなリズムでたたこう',hp:'自分のリズムをもう一度！',
   d:`今度は<b>あなたがつくる</b>番です。好きなリズムで何回かたたいてください。<br>次の小節で、<b>あなたも相手もそのリズムをまねます</b>。自分でたたけないリズムを出すと、自分もミスになります。<br>何もたたかずに終えるのもミスです。`},
  {t:'鍵盤が2つ',keys:2,first:1,pat:[NID(0,0),NID(2,1),NID(4,0),NID(6,1)],hc:'左右どちらの鍵盤か、見ておこう',hp:'同じ鍵盤をたたく！',
   d:`設定で鍵盤を2〜4つにできます。鍵盤ごとに音の高さがちがい、まねるときは<b>どの鍵盤をたたいたか</b>も合わせます。<br>PCなら F と J です。`},
  {t:'ホールド',keys:1,first:1,pat:[0,4],holds:{0:3},hc:'長い帯の音に注目',hp:'帯の終わりまで押したまま！',
   d:`<b>ホールド</b>（長押しの音）は、帯のように長くのびて落ちてきます。<br>頭でたたいて、<b>帯の終わりまで押したまま</b>にします。少しくらい早く離しても大丈夫です。<br>つくるときに長く押すと、自分でもホールドを出せます。`}];
function tutHTML(n){const s=TUT[n];return `<div class="sub">チュートリアル ${n+1}/${TUT.length}</div><h2>${s.t}</h2><p>${s.d}</p>
  <button class="go" data-act="tutgo" data-v="${n}">やってみる（音が鳴ります）</button><button class="ghost" data-act="menu">やめる</button>`;}
function tutStart(n){const s=TUT[n];NET.role=null;startMatch({mode:'com',S:performance.now()+1200,bpm:80,grid:8,win:'easy',hint:true,lives:3,lv0:3,keys:s.keys,flat:true,blen:'one',hold:!!s.holds,me:0,lv:'easy',firstP:s.first,
  names:[NAME||'あなた','COM'],tut:Object.assign({n},s)});}
function tutDone(){if(!G||!G.tut)return;const n=G.tut.n,s=TUT[n],r=G.res['1:'+G.me]||{miss:true,missed:[],extra:[]},mk=G.res['0:'+G.me];
  const why=[];if(mk&&mk.miss)why.push('「つくる」で何もたたきませんでした');if(r.missed&&r.missed.length)why.push(`たたけなかった音（または早く離したホールド）が ${r.missed.length} つ`);if(r.extra&&r.extra.length)why.push(`よけいにたたいた音が ${r.extra.length} つ`);
  const ok=!why.length,last=n===TUT.length-1;snd(ok?'ok':'ng');
  showOv(`<div class="sub">チュートリアル ${n+1}/${TUT.length}</div><h2 class="big" style="color:${ok?'var(--ok)':'var(--ng)'}">${ok?'できた！':'おしい！'}</h2>
  ${ok?(n===1?'<p style="text-align:center">あなたも相手も、あなたのリズムをまねました。</p>':''):`<p>${why.join('<br>')}</p><p style="font-size:13px">対戦では、ミスするとライフが1つ減ります。</p>`}
  ${ok?'':`<button class="go" data-act="tutgo" data-v="${n}">もう一度</button>`}<button class="${ok?'go':'ghost'}" data-act="${last?'tutend':'tutnext'}" data-v="${n+1}">${last?'おわり':'次へ'}</button>`);}
function tutEndHTML(){store.set('manekko-tut','1');return `<h2>これで準備OK！</h2><p>本番の対戦は、この「つくる → ふたりでまねる」を、COMや友だちと交代でくり返します。</p><ul>
  <li>ミスするとライフが1つ減り、なくなった方の負け。</li><li>4小節ごとに、少しずつテンポが上がります（設定で「ずっと同じ」にもできます）。</li><li>鍵盤の数、ホールド、2小節モード、判定のきびしさなどは設定で選べます。</li></ul>
  <button class="go" data-act="tutcom">COM（弱め）と対戦してみる</button><button class="ghost" data-act="menu">はじめの画面へ</button>`;}
const PRESETS=[['夜',{cBg:'#120f1f',cMe:'#39e6ff',cOp:'#ff6bb5'}],['森',{cBg:'#0f1d16',cMe:'#9cff6b',cOp:'#ffb84d'}],['海',{cBg:'#08192b',cMe:'#5cf0d4',cOp:'#ff8a5c'}],['紙',{cBg:'#f4efe4',cMe:'#1f6fd6',cOp:'#d23b5a'}],['白黒',{cBg:'#111111',cMe:'#ffffff',cOp:'#9a9a9a'}]];

function netHTML(){const qs=new URLSearchParams(location.search).get('room')||'';
  return `<h2>友だちと対戦</h2><label class="sub" for="pname">あなたの名前</label><input type="text" id="pname" maxlength="10" value="${esc(NAME)}" placeholder="例：たろう"><button class="go" data-act="create">部屋を作る</button>
  <div class="sub" style="margin-top:14px">部屋のコードで参加</div><div style="display:flex;gap:8px"><input type="text" id="code" maxlength="4" value="${esc(qs)}" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.2em"><button class="btn" data-act="join">参加</button></div>
  ${NET.status?`<div class="err">${esc(NET.status)}</div>`:''}<button class="ghost" data-act="menu">もどる</button>`;}
function roomHTML(){if(!NET.role)return netHTML();const host=NET.role==='host',ok=NET.conn&&NET.conn.open&&NET.opp;
  return `<h2>${host?'部屋を作りました':'部屋に入りました'}</h2>${host?`<div class="sub">部屋のコード</div><div class="code">${esc(NET.code||'…')}</div><div style="text-align:center"><button class="btn" data-act="copylink">参加リンクをコピー</button></div>`:''}
  <p style="text-align:center">${ok?`相手：<b>${esc(NET.opp)}</b>`:'相手を待っています…'}</p>${NET.status?`<div class="err">${esc(NET.status)}</div>`:''}
  ${host?optsHTML()+`<button class="go" data-act="netstart" ${ok?'':'disabled'}>対戦を始める（あなたが先につくります）</button>`:'<p style="text-align:center;color:var(--muted)">部屋主が始めるのを待っています</p>'}
  <button class="ghost" data-act="menu">部屋を出る</button>`;}
function endHTML(){const w=G.winner===G.me,d=G.winner===-1;return `<h2 class="big" style="color:${d?'var(--ink)':w?'var(--ok)':'var(--ng)'}">${d?'引き分け':w?'勝ち！':'負け…'}</h2><p style="text-align:center">${Math.max(1,Math.floor((barAt(performance.now())-1)/4)+1)}周・最後のテンポ ♩=${bpmOf(barAt(performance.now()))}</p>
  ${G.mode==='com'?'<button class="go" data-act="com">もう一度</button>':NET.role==='host'?'<button class="go" data-act="netstart">もう一度</button>':'<p style="text-align:center;color:var(--muted)">部屋主がもう一度を押すのを待っています</p>'}<button class="ghost" data-act="menu">はじめの画面へ</button>`;}
function helpHTML(){return `<h1>あそびかた</h1><ol>
  <li>カチッ・カチッというメトロノームに合わせて、1小節（4拍）ずつ進みます。</li>
  <li>ひとりが<b>「つくる」</b>：好きなリズムで下のパッドをたたきます（スペースキーやほかのキーでも）。たたいた位置は${OPT.grid}分の格子にそろえられます。</li>
  <li>次の小節で、<b>ふたりとも「まねる」</b>：つくった人も、自分のリズムをもう一度たたきます。たりない・よけい・ずれたら<b>ミス</b>で、ライフが1つ減ります。自分でたたけないリズムを出すと、自分もミスします。</li>
  <li>次は相手が「つくる」番。これをくり返します。何もたたかずに「つくる」を終えてもミスです。</li>
  <li>4小節ごとに少しずつテンポが上がります。ライフがなくなった方の負け。</li>
  <li>まねるときは、ひと打ちごとに <b>GREAT</b>（ぴったり）・<b>GOOD</b>（入っている）・<b>MISS</b> が出ます。</li>
  <li>区切りの長さ（設定）：「長引いたら2小節」なら、ふたりが6回ずつつくったところから、つくる・まねるが<b>2小節</b>になります。「はじめから2小節」もあります。</li>
  <li>音がつまって見づらいときは、設定の「譜面の速さ」を上げると、音の間が広がります（自分の画面だけ）。</li>
  <li><b>鍵盤</b>は1〜4つから選べます。鍵盤ごとに音の高さがちがい、まねるときは、どの鍵盤をたたいたかも合わせます。PCは 2つ：F J、3つ：F スペース J、4つ：D F J K（数字キーでも）。</li>
  <li><b>ホールド</b>（設定）：つくるときに長く押すと、のびる音になります。まねるときは、同じだけ押したままにします。はなすのが早すぎるとミス（終わりの少し前なら大丈夫）。</li>
  <li>はじめての人は、メニューの<b>チュートリアル</b>で、実際にたたきながら覚えられます。</li>
  <li>メニューの<b>色の設定</b>で、背景と音の色を変えられます。</li></ol>
  <p style="font-size:13px">判定がずれると感じたら、上の「タイミング調整」で、カチッに合わせて8回たたいてください。画面や音の遅れを差し引きます。</p>
  <button class="go" data-act="${G&&!G.over?'close':'menu'}">${G&&!G.over?'閉じる':'もどる'}</button>`;}
function saveName(){const n=$('#pname');if(n){NAME=n.value.trim().slice(0,10);store.set('manekko-name',NAME);}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='menu'){stopCal();netLeave();G=null;showOv(menuHTML());}
  else if(a==='commenu')showOv(comHTML());
  else if(a==='com'){startCom();}
  else if(a==='net')showOv(netHTML());
  else if(a==='create'){saveName();createRoom();}
  else if(a==='join'){saveName();joinRoom(($('#code')||{}).value);}
  else if(a==='netstart'){if(NET.role==='host'&&NET.conn&&NET.conn.open)hostStart();}
  else if(a==='spd'){const L=[.5,.75,1,1.25,1.5,1.75,2,2.25,2.5,3,3.5,4,5],i=Math.max(0,L.indexOf(OPT.speed));OPT.speed=L[Math.max(0,Math.min(L.length-1,(i<0?2:i)+(+b.dataset.v)))];saveOpt();const k=$('#ovbox').dataset.k;showOv(k==='room'?roomHTML():comHTML(),k);}
  else if(a==='opt'){let v=b.dataset.v;v=v==='true'?true:v==='false'?false:isNaN(+v)?v:+v;OPT[b.dataset.o]=v;saveOpt();const k=$('#ovbox').dataset.k;showOv(k==='room'?roomHTML():comHTML(),k);}
  else if(a==='help')showOv(helpHTML());
  else if(a==='tut')showOv(tutHTML(0));
  else if(a==='tutgo')tutStart(+b.dataset.v);
  else if(a==='tutnext'){G=null;showOv(tutHTML(+b.dataset.v));}
  else if(a==='tutend'){G=null;showOv(tutEndHTML());}
  else if(a==='tutcom'){OPT.lv='easy';saveOpt();startCom();}
  else if(a==='colors')showOv(colorsHTML(),'colors');
  else if(a==='preset'){Object.assign(OPT,PRESETS[+b.dataset.v][1]);saveOpt();applyColors();showOv(colorsHTML(),'colors');}
  else if(a==='creset'){Object.assign(OPT,DEFC);saveOpt();applyColors();showOv(colorsHTML(),'colors');}
  else if(a==='calib'){if(G&&!G.over)return;showOv(calIntroHTML(),'calintro');}
  else if(a==='calgo')startCal();
  else if(a==='calsave')calSave();
  else if(a==='vadj'){VADJ+=+b.dataset.v;store.set('manekko-vadj',VADJ);const v=$('#visv'),d=$('#visd');if(v)v.textContent=VIS()+'ミリ秒';if(d)d.textContent=`自動 ${visAuto()} ＋ 手動 ${VADJ>0?'+':''}${VADJ}`;}
  else if(a==='calend')afterCal();
  else if(a==='close')$('#ov').hidden=true;
  else if(a==='copylink'){const u=location.href;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>{b.textContent='コピーしました';},()=>prompt('コピーしてください',u));else prompt('コピーしてください',u);}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='pname')saveName();});
document.addEventListener('input',e=>{const o=e.target&&e.target.dataset&&e.target.dataset.c;if(!o)return;OPT[o]=e.target.value;saveOpt();applyColors();});
layout();requestAnimationFrame(frame);
(function(){const room=new URLSearchParams(location.search).get('room');if(!store.get('manekko-calibrated')){FIRST=true;showOv(calIntroHTML(),'calintro');return;}showOv(room?netHTML():menuHTML());})();
</script>
</body>
</html>
